<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
:root {
    --bg: #070707;
    --panel: #111111;
    --panel2: #181818;
    --border: #292929;
    --text: #f5f5f5;
    --muted: #858585;
    --gold: #d7ad55;
    --gold2: #f1d38a;
    --danger: #b94b4b;
    --success: #54a66a;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

#app {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    margin: 0 auto;
    padding:
        env(safe-area-inset-top)
        14px
        calc(85px + env(safe-area-inset-bottom))
        14px;
}

/* =========================================================
   COMMON
========================================================= */

.hidden {
    display: none !important;
}

.screen {
    width: 100%;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 2px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
}

.balance {
    color: var(--gold2);
    font-weight: 800;
    white-space: nowrap;
}

.card {
    background:
        linear-gradient(
            145deg,
            #171717,
            #0e0e0e
        );
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
}

.section-title {
    margin: 4px 0 12px;
    font-size: 17px;
    font-weight: 900;
}

.muted {
    color: var(--muted);
}

.gold {
    color: var(--gold2);
}

button.primary,
button.secondary,
button.danger,
button.buy {
    width: 100%;
    min-height: 48px;
    border-radius: 13px;
    font-weight: 900;
    margin-top: 10px;
}

button.primary,
button.buy {
    background:
        linear-gradient(
            135deg,
            var(--gold2),
            var(--gold)
        );
    color: #080808;
}

button.secondary {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
}

button.danger {
    background: #2b1111;
    color: #ff9b9b;
    border: 1px solid #4d1d1d;
}

button:disabled {
    opacity: .45;
    cursor: default;
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--panel2);
    color: white;
    border: 1px solid var(--border);
    font-size: 20px;
}

.top-title {
    flex: 1;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
}

.top-spacer {
    width: 42px;
}

/* =========================================================
   HOME
========================================================= */

.hero {
    padding: 22px 18px;
    border-radius: 22px;
    background:
        radial-gradient(
            circle at top right,
            rgba(215,173,85,.15),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #191919,
            #0c0c0c
        );
    border: 1px solid var(--border);
    margin-bottom: 14px;
}

.hero-name {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 4px;
}

.hero-title {
    color: var(--gold2);
    font-weight: 700;
}

.hero-balance {
    margin-top: 18px;
    font-size: 27px;
    font-weight: 900;
}

.hero-level {
    margin-top: 5px;
    color: var(--muted);
}

.progress {
    height: 7px;
    background: #252525;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width .3s ease;
}

.menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.menu-button {
    min-height: 105px;
    padding: 15px;
    border-radius: 17px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: white;
    text-align: left;
}

.menu-icon {
    font-size: 28px;
    margin-bottom: 10px;
}

.menu-name {
    font-size: 15px;
    font-weight: 900;
}

.menu-sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
}

/* =========================================================
   SHOP
========================================================= */

.shop-tabs {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
}

.shop-tabs::-webkit-scrollbar {
    display: none;
}

.shop-tab {
    flex: 0 0 auto;
    padding: 11px 14px;
    border-radius: 12px;
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    font-weight: 800;
}

.shop-tab.active {
    color: #111;
    background: var(--gold2);
}

.product-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}

.product {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 15px;
}

.product-image {
    height: 125px;
    border-radius: 13px;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.1),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            #242424,
            #0d0d0d
        );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    margin-bottom: 13px;
}

.product-name {
    font-size: 17px;
    font-weight: 900;
}

.product-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

.product-price {
    margin-top: 12px;
    color: var(--gold2);
    font-size: 18px;
    font-weight: 900;
}

.color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.color {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid transparent;
    box-shadow: 0 0 0 1px #444;
}

.color.selected {
    border-color: var(--gold2);
}

.plate-preview {
    font-family:
        Arial,
        sans-serif;
    font-weight: 900;
    letter-spacing: 2px;
    background: #eeeeee;
    color: #111;
    border-radius: 7px;
    padding: 10px 13px;
    display: inline-block;
    border: 2px solid #777;
    margin-bottom: 12px;
}

/* =========================================================
   GARAGE
========================================================= */

.car-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.car-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.car-name {
    font-size: 18px;
    font-weight: 900;
}

.car-color {
    color: var(--muted);
    font-size: 13px;
}

.car-plate {
    display: inline-block;
    width: fit-content;
    padding: 6px 10px;
    background: #eeeeee;
    color: #111;
    border-radius: 5px;
    font-weight: 900;
    letter-spacing: 1px;
}

/* =========================================================
   ROOM
========================================================= */

.room-code {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold2);
    padding: 12px 0;
}

.players-list {
    display: grid;
    gap: 8px;
}

.player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel2);
    padding: 12px;
    border-radius: 12px;
}

.online {
    color: var(--success);
}

.offline {
    color: var(--danger);
}

/* =========================================================
   GAME
========================================================= */

.game-info {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px;
    margin-bottom: 12px;
}

.game-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 10px 5px;
    text-align: center;
}

.game-stat-label {
    color: var(--muted);
    font-size: 10px;
}

.game-stat-value {
    margin-top: 4px;
    font-weight: 900;
}

.table {
    min-height: 250px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background:
        radial-gradient(
            circle,
            #1d2b1f,
            #0d130e
        );
    padding: 18px;
    margin-bottom: 13px;
}

.table-title {
    text-align: center;
    color: #b8c5b9;
    font-size: 12px;
    margin-bottom: 14px;
}

.table-pairs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.pair {
    position: relative;
    width: 72px;
    height: 110px;
}

.play-card {
    width: 72px;
    height: 100px;
    border-radius: 9px;
    background: #f7f7f7;
    color: #111;
    border: 2px solid #ddd;
    padding: 8px;
    text-align: left;
    position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,.35);
}

.play-card.red {
    color: #b11d1d;
}

.play-card .value {
    font-size: 20px;
    font-weight: 900;
}

.play-card .suit {
    font-size: 22px;
}

.defense-card {
    position: absolute;
    top: 25px;
    left: 25px;
    z-index: 2;
}

.hand {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 2px 15px;
    scrollbar-width: none;
}

.hand::-webkit-scrollbar {
    display: none;
}

.hand-card {
    flex: 0 0 64px;
    height: 92px;
    border-radius: 9px;
    background: #f7f7f7;
    color: #111;
    border: 2px solid #ddd;
    padding: 7px;
    text-align: left;
    box-shadow: 0 5px 14px rgba(0,0,0,.3);
}

.hand-card.red {
    color: #b11d1d;
}

.hand-card .value {
    font-size: 18px;
    font-weight: 900;
}

.hand-card .suit {
    font-size: 20px;
}

.hand-card.active {
    transform: translateY(-7px);
    border-color: var(--gold2);
}

.game-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.game-actions button {
    margin: 0;
}

.message {
    padding: 12px;
    border-radius: 12px;
    background: var(--panel2);
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
    padding: 12px;
}

.modal-box {
    width: 100%;
    max-width: 700px;
    max-height: 85vh;
    overflow-y: auto;
    background: #101010;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 18px;
}

.modal-title {
    font-size: 20px;
    font-weight: 900;
}

.modal-text {
    margin-top: 8px;
    color: var(--muted);
    line-height: 1.45;
}

.close-modal {
    width: 100%;
    margin-top: 12px;
}

/* =========================================================
   NAV
========================================================= */

.bottom-nav {
    position: fixed;
    z-index: 500;
    left: 0;
    right: 0;
    bottom: 0;
    padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom));
    background: rgba(8,8,8,.94);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(14px);
}

.bottom-nav-inner {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
}

.nav-button {
    min-height: 52px;
    background: transparent;
    color: var(--muted);
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
}

.nav-button.active {
    background: var(--panel2);
    color: var(--gold2);
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.loader {
    width: 38px;
    height: 38px;
    border: 3px solid #333;
    border-top-color: var(--gold2);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 14px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="loading" class="loading">
        <div>
            <div class="loader"></div>
            <div class="muted">
                Загрузка Heavy Lux...
            </div>
        </div>
    </div>

    <div id="main" class="hidden">

        <!-- HOME -->
        <section
            id="screen-home"
            class="screen"
        >
            <div class="header">
                <div class="logo">
                    HEAVY LUX
                </div>

                <div
                    id="topBalance"
                    class="balance"
                >
                    0 HC
                </div>
            </div>

            <div class="hero">

                <div
                    id="playerName"
                    class="hero-name"
                >
                    Игрок
                </div>

                <div
                    id="playerTitle"
                    class="hero-title"
                >
                    Новичок
                </div>

                <div
                    id="heroBalance"
                    class="hero-balance"
                >
                    0 HC
                </div>

                <div
                    id="heroLevel"
                    class="hero-level"
                >
                    Уровень 1
                </div>

                <div class="progress">
                    <div
                        id="xpProgress"
                        class="progress-fill"
                    ></div>
                </div>

            </div>

            <div class="menu-grid">

                <button
                    class="menu-button"
                    onclick="openScreen('rooms')"
                >
                    <div class="menu-icon">
                        🎴
                    </div>

                    <div class="menu-name">
                        ONLINE ИГРА
                    </div>

                    <div class="menu-sub">
                        Дурак 1 × 1
                    </div>
                </button>

                <button
                    class="menu-button"
                    onclick="openShop()"
                >
                    <div class="menu-icon">
                        🛒
                    </div>

                    <div class="menu-name">
                        МАГАЗИН
                    </div>

                    <div class="menu-sub">
                        Авто и имущество
                    </div>
                </button>

                <button
                    class="menu-button"
                    onclick="openScreen('garage')"
                >
                    <div class="menu-icon">
                        🚗
                    </div>

                    <div class="menu-name">
                        ГАРАЖ
                    </div>

                    <div class="menu-sub">
                        Мои автомобили
                    </div>
                </button>

                <button
                    class="menu-button"
                    onclick="openScreen('estate')"
                >
                    <div class="menu-icon">
                        🏠
                    </div>

                    <div class="menu-name">
                        НЕДВИЖИМОСТЬ
                    </div>

                    <div class="menu-sub">
                        Моя недвижимость
                    </div>
                </button>

                <button
                    class="menu-button"
                    onclick="openScreen('business')"
                >
                    <div class="menu-icon">
                        💼
                    </div>

                    <div class="menu-name">
                        БИЗНЕСЫ
                    </div>

                    <div class="menu-sub">
                        Доход и управление
                    </div>
                </button>

                <button
                    class="menu-button"
                    onclick="openScreen('profile')"
                >
                    <div class="menu-icon">
                        👤
                    </div>

                    <div class="menu-name">
                        ПРОФИЛЬ
                    </div>

                    <div class="menu-sub">
                        Статистика
                    </div>
                </button>

            </div>
        </section>

        <!-- SHOP -->
        <section
            id="screen-shop"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="openScreen('home')"
                >
                    ‹
                </button>

                <div class="top-title">
                    МАГАЗИН
                </div>

                <div
                    id="shopBalance"
                    class="balance"
                >
                    0 HC
                </div>
            </div>

            <div
                id="shopTabs"
                class="shop-tabs"
            >

                <button
                    class="shop-tab active"
                    onclick="shopTab('cars',this)"
                >
                    Авто
                </button>

                <button
                    class="shop-tab"
                    onclick="shopTab('exclusive',this)"
                >
                    Exclusive
                </button>

                <button
                    class="shop-tab"
                    onclick="shopTab('plates',this)"
                >
                    Номера
                </button>

                <button
                    class="shop-tab"
                    onclick="shopTab('realEstate',this)"
                >
                    Недвижимость
                </button>

                <button
                    class="shop-tab"
                    onclick="shopTab('businesses',this)"
                >
                    Бизнесы
                </button>

            </div>

            <div
                id="shopContent"
                class="product-grid"
            ></div>

        </section>

        <!-- GARAGE -->
        <section
            id="screen-garage"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="openScreen('home')"
                >
                    ‹
                </button>

                <div class="top-title">
                    ГАРАЖ
                </div>

                <div class="top-spacer"></div>
            </div>

            <div id="garageContent"></div>

        </section>

        <!-- ESTATE -->
        <section
            id="screen-estate"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="openScreen('home')"
                >
                    ‹
                </button>

                <div class="top-title">
                    НЕДВИЖИМОСТЬ
                </div>

                <div class="top-spacer"></div>
            </div>

            <div id="estateContent"></div>

        </section>

        <!-- BUSINESS -->
        <section
            id="screen-business"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="openScreen('home')"
                >
                    ‹
                </button>

                <div class="top-title">
                    БИЗНЕСЫ
                </div>

                <div class="top-spacer"></div>
            </div>

            <div id="businessContent"></div>

        </section>

        <!-- PROFILE -->
        <section
            id="screen-profile"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="openScreen('home')"
                >
                    ‹
                </button>

                <div class="top-title">
                    ПРОФИЛЬ
                </div>

                <div class="top-spacer"></div>
            </div>

            <div id="profileContent"></div>

        </section>

        <!-- ROOMS -->
        <section
            id="screen-rooms"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="openScreen('home')"
                >
                    ‹
                </button>

                <div class="top-title">
                    ONLINE ИГРА
                </div>

                <div class="top-spacer"></div>
            </div>

            <div class="card">

                <div class="section-title">
                    Дурак 1 × 1
                </div>

                <button
                    class="primary"
                    onclick="createRoom()"
                >
                    СОЗДАТЬ КОМНАТУ
                </button>

                <div
                    style="
                        text-align:center;
                        margin:14px 0;
                        color:#777;
                    "
                >
                    или
                </div>

                <input
                    id="roomCodeInput"
                    maxlength="6"
                    placeholder="КОД КОМНАТЫ"
                    autocomplete="off"
                    style="
                        width:100%;
                        height:48px;
                        border-radius:12px;
                        border:1px solid #292929;
                        background:#181818;
                        color:white;
                        text-align:center;
                        font-size:20px;
                        font-weight:900;
                        letter-spacing:4px;
                        outline:none;
                    "
                >

                <button
                    class="secondary"
                    onclick="joinRoom()"
                >
                    ВОЙТИ В КОМНАТУ
                </button>

            </div>

            <div class="card">

                <div class="section-title">
                    Открытые комнаты
                </div>

                <div id="roomsList">
                    <div class="muted">
                        Загрузка...
                    </div>
                </div>

            </div>

        </section>

        <!-- ROOM -->
        <section
            id="screen-room"
            class="screen hidden"
        >

            <div class="header">
                <button
                    class="back"
                    onclick="leaveRoom()"
                >
                    ‹
                </button>

                <div class="top-title">
                    КОМНАТА
                </div>

                <div class="top-spacer"></div>
            </div>

            <div class="card">

                <div
                    id="roomCode"
                    class="room-code"
                >
                    ------
                </div>

                <div
                    id="roomPlayers"
                    class="players-list"
                ></div>

                <button
                    id="readyButton"
                    class="primary"
                    onclick="toggleReady()"
                >
                    ГОТОВ
                </button>

            </div>

            <div
                id="roomMessage"
                class="message"
            >
                Ожидание второго игрока...
            </div>

        </section>

        <!-- GAME -->
        <section
            id="screen-game"
            class="screen hidden"
        >

            <div class="header">

                <div class="logo">
                    HEAVY LUX
                </div>

                <div
                    id="gameRound"
                    class="muted"
                >
                    Раунд 1
                </div>

            </div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

/*
 * Если frontend находится на том же домене,
 * оставь пустую строку.
 *
 * Если frontend размещён отдельно,
 * укажи адрес backend:
 *
 * const API_BASE = "https://YOUR-BACKEND-DOMAIN";
 */
const API_BASE = "";

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram?.WebApp || null;

if (tg) {
    try {
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#070707");
        tg.setBackgroundColor("#070707");
    } catch {}
}

const initData =
    tg?.initData || "";

/* =========================================================
   STATE
========================================================= */

let player = null;

let shopData = {
    cars: [],
    exclusive: [],
    plates: [],
    realEstate: [],
    businesses: [],
    colors: []
};

let selectedShopTab = "cars";

let selectedColors = {};

let socket = null;

let room = null;

let game = null;

let currentScreen = "home";

/* =========================================================
   HELPERS
========================================================= */

function apiUrl(path) {
    return `${API_BASE}${path}`;
}

function money(value) {
    return Number(value || 0)
        .toLocaleString("ru-RU")
        .replace(/\u00A0/g, " ");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getName(p) {
    if (!p) return "Игрок";

    const full =
        `${p.first_name || ""} ${p.last_name || ""}`
            .trim();

    return full ||
        p.username ||
        "Игрок";
}

function showModal(title, text) {
    document.getElementById(
        "modalTitle"
    ).textContent = title;

    document.getElementById(
        "modalText"
    ).innerHTML = escapeHtml(text)
        .replace(/\n/g, "<br>");

    document.getElementById(
        "modal"
    ).classList.remove("hidden");
}

function hideModal() {
    document.getElementById(
        "modal"
    ).classList.add("hidden");
}

function closeModal(event) {
    if (
        event.target.id === "modal"
    ) {
        hideModal();
    }
}

function notify(text) {
    if (tg?.showAlert) {
        tg.showAlert(text);
        return;
    }

    showModal(
        "HEAVY LUX",
        text
    );
}

/* =========================================================
   HTTP
========================================================= */

async function api(
    path,
    options = {}
) {
    const headers = {
        ...(options.headers || {})
    };

    if (initData) {
        headers[
            "x-telegram-init-data"
        ] = initData;
    }

    if (
        options.body &&
        typeof options.body !== "string"
    ) {
        headers[
            "Content-Type"
        ] = "application/json";

        options.body =
            JSON.stringify(
                options.body
            );
    }

    const response =
        await fetch(
            apiUrl(path),
            {
                ...options,
                headers
            }
        );

    let data;

    try {
        data =
            await response.json();
    } catch {
        throw new Error(
            `HTTP ${response.status}`
        );
    }

    if (!response.ok) {
        throw new Error(
            data.error ||
            `Ошибка HTTP ${response.status}`
        );
    }

    return data;
}

/* =========================================================
   AUTH
========================================================= */

async function authenticate() {
    if (!initData) {
        throw new Error(
            "Telegram initData отсутствует. Открой игру через Telegram."
        );
    }

    const result =
        await api(
            "/api/auth",
            {
                method: "POST",
                body: {
                    initData
                }
            }
        );

    if (
        !result.success ||
        !result.player
    ) {
        throw new Error(
            result.error ||
            "Ошибка авторизации"
        );
    }

    player =
        result.player;

    updatePlayerUI();
}

/* =========================================================
   PLAYER
========================================================= */

function updatePlayerUI() {
    if (!player) return;

    const name =
        getName(player);

    document.getElementById(
        "playerName"
    ).textContent = name;

    document.getElementById(
        "playerTitle"
    ).textContent =
        player.title || "Новичок";

    document.getElementById(
        "heroBalance"
    ).textContent =
        `${money(player.balance)} HC`;

    document.getElementById(
        "topBalance"
    ).textContent =
        `${money(player.balance)} HC`;

    document.getElementById(
        "shopBalance"
    ).textContent =
        `${money(player.balance)} HC`;

    document.getElementById(
        "heroLevel"
    ).textContent =
        `Уровень ${player.level || 1}`;

    const level =
        Number(player.level || 1);

    const xp =
        Number(player.xp || 0);

    const required =
        level * 100;

    const percent =
        level >= 100
            ? 100
            : Math.min(
                100,
                (xp / required) * 100
            );

    document.getElementById(
        "xpProgress"
    ).style.width =
        `${percent}%`;
}

async function refreshPlayer() {
    const result =
        await api(
            "/api/player"
        );

    if (
        result.success &&
        result.player
    ) {
        player =
            result.player;

        updatePlayerUI();
    }

    return player;
}

/* =========================================================
   SHOP DATA
========================================================= */

async function loadShop() {

    const [
        dealership,
        exclusive,
        plates,
        estate,
        businesses
    ] = await Promise.all([
        api("/api/dealership"),
        api("/api/exclusive-cars"),
        api("/api/plates"),
        api("/api/real-estate"),
        api("/api/businesses")
    ]);

    shopData.cars =
        dealership.cars || [];

    shopData.colors =
        dealership.colors || [];

    shopData.exclusive =
        exclusive.cars || [];

    shopData.plates =
        plates.plates || [];

    shopData.realEstate =
        estate.realEstate || [];

    shopData.businesses =
        businesses.businesses || [];

    renderShop();
}

/* =========================================================
   SCREEN
========================================================= */

function openScreen(screen) {

    const ids = [
        "home",
        "shop",
        "garage",
        "estate",
        "business",
        "profile",
        "rooms",
        "room",
        "game"
    ];

    ids.forEach(id => {
        const element =
            document.getElementById(
                `screen-${id}`
            );

        if (element) {
            element.classList.toggle(
                "hidden",
                id !== screen
            );
        }
    });

    currentScreen =
        screen;

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.screen ===
                screen
            );
        });

    const showNav =
        [
            "home",
            "shop",
            "garage",
            "profile"
        ].includes(screen);

    document
        .getElementById(
            "bottomNav"
        )
        .classList.toggle(
            "hidden",
            !showNav
        );

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

    if (screen === "garage") {
        renderGarage();
    }

    if (screen === "estate") {
        renderEstate();
    }

    if (screen === "business") {
        renderBusinesses();
    }

    if (screen === "profile") {
        renderProfile();
    }
}

/* =========================================================
   SHOP
========================================================= */

async function openShop() {

    openScreen("shop");

    document.getElementById(
        "shopContent"
    ).innerHTML =
        `
        <div class="card">
            <div class="muted">
                Загрузка магазина...
            </div>
        </div>
        `;

    try {
        await loadShop();
    } catch (error) {
        document.getElementById(
            "shopContent"
        ).innerHTML =
            `
            <div class="card">
                <div style="color:#ff8b8b">
                    ${escapeHtml(error.message)}
                </div>
            </div>
            `;
    }
}

function shopTab(
    tab,
    button
) {
    selectedShopTab =
        tab;

    document
        .querySelectorAll(
            ".shop-tab"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    if (button) {
        button.classList.add(
            "active"
        );
    }

    renderShop();
}

function renderShop() {

    const container =
        document.getElementById(
            "shopContent"
        );

    if (
        selectedShopTab ===
        "cars"
    ) {
        renderCars(
            container,
            shopData.cars,
            false
        );

        return;
    }

    if (
        selectedShopTab ===
        "exclusive"
    ) {
        renderCars(
            container,
            shopData.exclusive,
            true
        );

        return;
    }

    if (
        selectedShopTab ===
        "plates"
    ) {
        renderPlates(
            container
        );

        return;
    }

    if (
        selectedShopTab ===
        "realEstate"
    ) {
        renderRealEstate(
            container
        );

        return;
    }

    if (
        selectedShopTab ===
        "businesses"
    ) {
        renderBusinessShop(
            container
        );
    }
}

/* =========================================================
   CARS
========================================================= */

function renderCars(
    container,
    cars,
    exclusive
) {

    if (!cars.length) {
        container.innerHTML =
            `
            <div class="card">
                <div class="muted">
                    Каталог пуст.
                </div>
            </div>
            `;

        return;
    }

    container.innerHTML =
        cars.map(car => {

            const selected =
                selectedColors[
                    car.id
                ] ||
                shopData.colors[0]?.id ||
                "";

            const colors =
                shopData.colors
                    .map(color => `
                        <button
                            class="color ${
                                selected === color.id
                                    ? "selected"
                                    : ""
                            }"
                            title="${escapeHtml(color.name)}"
                            style="
                                background:${color.hex}
                            "
                            onclick="
                                selectColor(
                                    '${escapeHtml(car.id)}',
                                    '${escapeHtml(color.id)}'
                                )
                            "
                        ></button>
                    `)
                    .join("");

            return `
                <div class="product">

                    <div class="product-image">
                        🚘
                    </div>

                    <div class="product-name">
                        ${escapeHtml(car.name)}
                    </div>

                    <div class="product-meta">
                        ${escapeHtml(
                            car.category ||
                            ""
                        )}

                        ${
                            car.tuning
                                ? ` • ${escapeHtml(car.tuning)}`
                                : ""
                        }
                    </div>

                    <div class="product-price">
                        ${money(car.price)} HC
                    </div>

                    ${
                        !exclusive
                            ? `
                            <div class="product-meta">
                                Цвет автомобиля
                            </div>

                            <div class="color-row">
                                ${colors}
                            </div>
                            `
                            : `
                            <div class="product-meta">
                                Exclusive Tuning Atelier
                            </div>
                            `
                    }

                    <button
                        class="buy"
                        onclick="
                            buyCar(
                                '${escapeHtml(car.id)}',
                                ${exclusive}
                            )
                        "
                    >
                        КУПИТЬ
                    </button>

                </div>
            `;
        })
        .join("");
}

function selectColor(
    carId,
    colorId
) {
    selectedColors[
        carId
    ] = colorId;

    renderShop();
}

/* =========================================================
   BUY CAR
========================================================= */

async function buyCar(
    carId,
    exclusive
) {

    const colorId =
        selectedColors[
            carId
        ] ||
        shopData.colors[0]?.id;

    if (
        !exclusive &&
        !colorId
    ) {
        notify(
            "Сначала выберите цвет автомобиля."
        );

        return;
    }

    const endpoint =
        exclusive
            ? "/api/exclusive-cars/buy"
            : "/api/cars/buy";

    try {

        const result =
            await api(
                endpoint,
                {
                    method: "POST",
                    body: {
                        carId,
                        colorId
                    }
                }
            );

        if (result.player) {
            player =
                result.player;
        }

        updatePlayerUI();

        notify(
            result.message ||
            "Автомобиль приобретён."
        );

        await loadShop();

    } catch (error) {
        notify(
            error.message
        );
    }
}

/* =========================================================
   PLATES
========================================================= */

function renderPlates(
    container
) {

    if (!shopData.plates.length) {
        container.innerHTML =
            `
            <div class="card">
                <div class="muted">
                    Номера отсутствуют.

            </div>
            `;

        return;
    }

    container.innerHTML =

                    <div class="product-name">

                        )}
                    </div>

                    <div class="product-meta">
                        Государственный красивый номер
                    </div>

                    <div class="product-price">
                        ${money(plate.price)} HC
                    </div>

                    <button
                        class="buy"

                            buyPlate(
                                '${escapeHtml(plate.id)}'
                            )
                        "
                    >
                        КУПИТЬ
                    </button>

                </div>
            `)
            .join("");
}

async function buyPlate(

        const result =

        );

                        : ""

        .join("");
}

async function registerCar(
    carId
) {

    try {

            await api(

                        carId

        notify(
            result.message ||

        );

        notify(

        );
    }

function joinRoom() {

    const input =
        document.getElementById(
            "roomCodeInput"
        );

    const code =
        String(
            input.value || ""
        )
            .trim()
            .toUpperCase();

    if (!code) {

function joinRoomByCode(code) {

        connectSocket();
    }

    socket.emit(
        "room:join",
        {
            roomCode: code
        }
    );
}

/* =========================================================
   SOCKET
========================================================= */

function connectSocket() {

    if (socket) {
        return;
    }

    socket =
        io(
            API_BASE || undefined,
            {
                transports: [
                    "websocket",
                    "polling"
                ],

                auth: {
                    initData
                },

                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000
            }
        );

    socket.on(
        "connect",
        () => {

            if (room) {
                socket.emit(
                    "room:state"
                );
            }
        }
    );

    socket.on(
        "auth:error",
        data => {
            notify(
                data?.error ||
                "Ошибка авторизации Socket.IO"
            );
        }
    );

    socket.on(
        "auth:success",
        data => {

            if (
                data?.player
            ) {
                player =
                    data.player;

                updatePlayerUI();
            }
        }
    );

    socket.on(
        "room:created",
        data => {

            room =
                data;

            renderRoom();

            openScreen(
                "room"
            );
        }
    );

    socket.on(
        "room:joined",
        data => {

            room =
                data;

            renderRoom();

            openScreen(
                "room"
            );
        }
    );

    socket.on(
        "room:reconnected",
        data => {

            room =
                data;

            renderRoom();

            if (
                room?.game?.status ===
                "playing"
            ) {
                openScreen(
                    "game"
                );
            } else {
                openScreen(
                    "room"
                );
            }
        }
    );

    socket.on(
        "room:update",
        data => {

            room =
                data;

            renderRoom();

            if (
                room?.game?.status ===
                "playing"
            ) {
                openScreen(
                    "game"
                );
            }
        }
    );

    socket.on(
        "room:error",
        data => {

            notify(
                data?.error ||
                "Ошибка комнаты"
            );
        }
    );

    socket.on(
        "game:started",
        data => {

            game =
                data;

            openScreen(
                "game"
            );

            renderGame();
        }
    );

    socket.on(
        "game:state",
        data => {

            game =
                data;

            if (
                data?.status ===
                "playing"
            ) {
                openScreen(
                    "game"
                );
            }

            renderGame();
        }
    );

    socket.on(
        "game:error",
        data => {

            notify(
                data?.error ||
                "Ошибка игры"
            );
        }
    );

    socket.on(
        "game:finished",
        data => {

            if (game) {
                game.status =
                    "finished";

                game.winnerId =
                    data?.winnerId ||
                    null;

                game.loserId =
                    data?.loserId ||
                    null;
            }

            renderGame();

            refreshPlayer()
                .catch(() => {});

            const myId =
                game?.myId;

            if (
                data?.winnerId ===
                myId
            ) {
                notify(
                    "Победа! Вы выиграли партию."
                );
            } else {
                notify(
                    "Партия завершена."
                );
            }
        }
    );

    socket.on(
        "disconnect",
        () => {
            /*
             * Backend сам оставляет игрока
             * в комнате на время reconnect.
             */
        }
    );
}

function renderRoom() {

    if (!room) {
        return;
    }

    document.getElementById(
        "roomCode"

    const players =
        room.players || [];

                }">
                    ${
                        item.connected
                            ? "●"
                            : "○"
                    }
                </div>

            </div>
        `)
        .join("");

        players.length;

    document.getElementById(
        "roomMessage"
    ).textContent =
        count < 2

            : "Два игрока подключены.";

    const me =
        players.find(
            item =>
                String(

                ) ===
                String(
                    player?.telegram_id
                )
        );

    document.getElementById(
        "readyButton"
    ).textContent =
        me?.ready
            ? "НЕ ГОТОВ"
            : "ГОТОВ";
}

function toggleReady() {

    if (!socket) {
        return;
    }

    const me =
        room?.players?.find(
            item =>
                String(
                    item.telegram_id
                ) ===
                String(
                    player?.telegram_id
                )
        );

    socket.emit(
        "room:ready",
        {
            ready:
                !me?.ready
        }
    );
}

function leaveRoom() {

    if (socket) {
        socket.emit(
            "room:leave"
        );
    }

    room = null;
    game = null;

    openScreen(
        "rooms"
    );

    loadRooms();
}

/* =========================================================
   GAME
========================================================= */

const SUITS = {
    hearts: {
        symbol: "♥",
        red: true
    },

    diamonds: {
        symbol: "♦",
        red: true
    },

    clubs: {
        symbol: "♣",
        red: false
    },

    spades: {
        symbol: "♠",
        red: false
    }
};

function cardHtml(
    card,
    extraClass = ""
) {

    if (!card) {
        return "";
    }

    const suit =
        SUITS[
            card.suit
        ] || {
            symbol: "?",
            red: false
        };

    return `
        <div
            class="
                play-card
                ${suit.red ? "red" : ""}
                ${extraClass}
            "
        >
            <div class="value">
                ${escapeHtml(
                    card.value
                )}
            </div>

            <div class="suit">
                ${suit.symbol}
            </div>
        </div>
    `;
}

function renderGame() {

    if (!game) {
        return;
    }

    document.getElementById(
        "gameRound"
    ).textContent =
        `Раунд ${game.roundNumber || 1}`;

    const trump =
        SUITS[
            game.trump
        ];

    document.getElementById(
        "gameTrump"
    ).textContent =
        trump
            ? trump.symbol
            : "—";

    document.getElementById(
        "gameDeck"
    ).textContent =
        game.deckCount ?? 0;

    const phaseNames = {
        attack: "АТАКА",
        defense: "ЗАЩИТА"
    };

    document.getElementById(
        "gamePhase"
    ).textContent =
        phaseNames[
            game.phase
        ] ||
        String(
            game.phase ||
            "—"
        ).toUpperCase();

    const myId =
        game.myId;

    const myPlayer =
        game.players?.find(
            p =>
                p.id === myId
        );

    const isMyTurn =
        game.turnId ===
        myId;

    const isAttacker =
        game.attackerId ===
        myId;

    const isDefender =
        game.defenderId ===
        myId;

    let message =
        "Ожидание...";

    if (
        game.status ===
        "finished"
    ) {

        if (
            game.winnerId ===
            myId
        ) {
            message =
                "🏆 Ты победил!";
        } else if (
            game.loserId ===
            myId
        ) {
            message =
                "Поражение.";
        } else {
            message =
                "Партия завершена.";
        }

    } else if (
        isMyTurn
    ) {

        if (
            game.phase ===
            "attack"
        ) {
            message =
                isAttacker
                    ? "Твой ход. Атакуй."
                    : "Твой ход.";
        } else {
            message =
                isDefender
                    ? "Твой ход. Защищайся или забирай карты."
                    : "Ожидание защиты.";
        }

    } else {

        message =
            "Ход соперника...";
    }

    document.getElementById(
        "gameMessage"
    ).textContent =
        message;

    renderTable();
    renderHand();

    const take =
        document.getElementById(
            "takeButton"
        );

    const end =
        document.getElementById(
            "endAttackButton"
        );

    take.disabled =
        !(
            game.status ===
            "playing" &&
            game.phase ===
            "defense" &&
            isDefender &&
            isMyTurn
        );

    end.disabled =
        !(
            game.status ===
            "playing" &&
            game.phase ===
            "attack" &&
            isAttacker &&
            isMyTurn &&
            game.table?.length
        );
}

function renderTable() {

    const container =
        document.getElementById(
            "gamePairs"
        );

    const table =
        game?.table || [];

    if (!table.length) {

        container.innerHTML =
            `
            <div class="muted">
                Стол пуст
            </div>
            `;

        return;
    }

    container.innerHTML =
        table.map(pair => `
            <div
                class="pair"
                onclick="
                    selectDefensePair(
                        '${escapeHtml(pair.id)}'
                    )
                "
            >
                ${cardHtml(pair.attack)}

                ${
                    pair.defense
                        ? cardHtml(
                            pair.defense,
                            "defense-card"
                        )
                        : ""
                }
            </div>
        `)
        .join("");
}

let selectedDefensePairId =
    null;

function selectDefensePair(
    pairId
) {
    selectedDefensePairId =
        pairId;

    renderGame();
}

function renderHand() {

    const container =
        document.getElementById(
            "myHand"
        );

    const hand =
        game?.myHand || [];

    if (!hand.length) {

        container.innerHTML =
            `
            <div class="muted">
                В руке нет карт
            </div>
            `;

        return;
    }

    const myTurn =
        game.turnId ===
        game.myId;

    container.innerHTML =
        hand.map(card => {

            const suit =
                SUITS[
                    card.suit
                ] || {
                    red: false
                };

            return `
                <button
                    class="
                        hand-card
                        ${suit.red ? "red" : ""}
                        ${
                            selectedDefensePairId
                                ? "active"
                                : ""
                        }
                    "
                    onclick="
                        playCard(
                            '${escapeHtml(card.id)}'
                        )
                    "
                >

                    <div class="value">
                        ${escapeHtml(
                            card.value
                        )}
                    </div>

                    <div class="suit">
                        ${
                            SUITS[
                                card.suit
                            ]?.symbol ||
                            "?"
                        }
                    </div>

                </button>
            `;
        })
        .join("");
}

/* =========================================================
   GAME ACTIONS
========================================================= */

function playCard(
    cardId
) {

    if (!socket || !game) {
        return;
    }

    if (
        game.turnId !==
        game.myId
    ) {
        notify(
            "Сейчас не твой ход."
        );

        return;
    }

    if (
        game.phase ===
        "attack"
    ) {

        socket.emit(
            "game:attack",
            {
                cardId
            }
        );

        return;
    }

    if (
        game.phase ===
        "defense"
    ) {

        if (
            !selectedDefensePairId
        ) {
            notify(
                "Сначала выбери атакующую карту на столе."
            );

            return;
        }

        socket.emit(
            "game:defend",
            {
                pairId:
                    selectedDefensePairId,

                cardId
            }
        );

        selectedDefensePairId =
            null;
    }
}

function takeCards() {

    if (!socket) {
        return;
    }

    socket.emit(
        "game:take"
    );
}

function endAttack() {

    if (!socket) {
        return;
    }

    socket.emit(
        "game:endAttack"
    );
}

/* =========================================================
   STARTUP
========================================================= */

        await authenticate();

            "loading"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "main"
        ).classList.remove(
            "hidden"
        );

        document.getElementById(
            "bottomNav"
        ).classList.remove(
            "hidden"
        );

        updatePlayerUI();

        openScreen(
            "home"
        );

        /*
         * Подключаем Socket.IO только
         * после успешной Telegram auth.

        connectSocket();

        /*
         * Каталог грузим заранее.
         * Это позволяет открыть магазин

         */

            .catch(error => {
                console.error(

    } catch (error) {

        document.getElementById(
            "loading"
        ).innerHTML =
            `

                <div
                    style="
                        font-size:20px;
                        font-weight:900;
                        margin-bottom:10px;
                    "
                >
                    HEAVY LUX

                    style="

                        line-height:1.5;
                    "
                >
                    ${escapeHtml(

                    )}

                    class="primary"
                    onclick="
                        location.reload()
                    "
                >
                    ПОВТОРИТЬ
                </button>
            </div>
            `;
    }
}

);

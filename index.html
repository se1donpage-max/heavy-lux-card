<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% 35%, #263126 0%, #101610 35%, #070907 75%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    touch-action: none;
}

body {
    min-height: 100vh;
}

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* =========================================
   TOP BAR
========================================= */

.topbar {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: 0;
    right: 0;
    height: 55px;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
}

.logo-small {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    opacity: .9;
}

.game-info {
    display: flex;
    align-items: center;
    gap: 7px;
}

.info-pill {
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 6px 9px;
    font-size: 10px;
    color: #aaa;
}

.info-pill b {
    color: white;
}

/* =========================================
   TABLE
========================================= */

.table {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(96vw, 650px);
    height: min(78vh, 650px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
        radial-gradient(
            ellipse at center,
            #244329 0%,
            #18301c 48%,
            #0e1d11 75%,
            #091009 100%
        );
    border: 9px solid #141414;
    box-shadow:
        inset 0 0 70px rgba(0,0,0,.75),
        0 15px 60px rgba(0,0,0,.65);
}

.table::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.05);
}

/* =========================================
   OPPONENT
========================================= */

.opponent {
    position: absolute;
    top: 4vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
}

.opponent-avatar {
    width: 52px;
    height: 52px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(145deg,#272727,#111);
    border: 2px solid #555;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    box-shadow: 0 7px 20px rgba(0,0,0,.45);
}

.opponent-name {
    margin-top: 5px;
    font-size: 12px;
    font-weight: 700;
}

.opponent-count {
    margin-top: 3px;
    color: #aaa;
    font-size: 11px;
}

/* =========================================
   PLAYER
========================================= */

.player-info {
    position: absolute;
    bottom: 9vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    text-align: center;
}

.player-name {
    font-weight: 800;
    font-size: 13px;
}

.player-count {
    color: #aaa;
    font-size: 11px;
    margin-top: 3px;
}

/* =========================================
   DECK
========================================= */

.deck-area {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 130px;
    height: 125px;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.deck {
    position: absolute;
    width: 62px;
    height: 88px;
    left: 22px;
    top: 18px;
    transform: rotate(-6deg);
    z-index: 4;
}

.deck-card {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    border: 2px solid #b8b8b8;
    background:
        repeating-linear-gradient(
            45deg,
            #202020,
            #202020 4px,
            #343434 4px,
            #343434 8px
        );
    box-shadow: 0 6px 12px rgba(0,0,0,.45);
}

.deck-card:nth-child(1) {
    transform: translate(-5px,-4px);
}

.deck-card:nth-child(2) {
    transform: translate(-2px,-2px);
}

.deck-card:nth-child(3) {
    transform: translate(0,0);
}

.trump-card {
    position: absolute;
    left: 69px;
    top: 30px;
    width: 62px;
    height: 88px;
    z-index: 2;
    transform: rotate(76deg);
}

/* =========================================
   CARDS
========================================= */

.card {
    position: absolute;
    width: 62px;
    height: 88px;
    border-radius: 8px;
    background: #f8f8f8;
    color: #111;
    border: 1px solid #ddd;
    box-shadow:
        0 5px 13px rgba(0,0,0,.4),
        inset 0 0 0 1px rgba(0,0,0,.08);
    overflow: hidden;
    font-weight: 800;
    cursor: pointer;
    transition:
        transform .22s ease,
        box-shadow .22s ease,
        left .25s ease,
        top .25s ease;
}

.card.red {
    color: #d71919;
}

.card.back {
    background:
        repeating-linear-gradient(
            45deg,
            #181818,
            #181818 4px,
            #303030 4px,
            #303030 8px
        );
    border: 2px solid #aaa;
}

.card.back::after {
    content: "HLC";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgba(255,255,255,.65);
    font-size: 11px;
    letter-spacing: 1px;
}

.card-value {
    position: absolute;
    left: 6px;
    top: 4px;
    font-size: 15px;
}

.card-suit {
    position: absolute;
    left: 7px;
    top: 22px;
    font-size: 15px;
}

.card-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    font-size: 28px;
}

.card-corner {
    position: absolute;
    right: 5px;
    bottom: 3px;
    font-size: 11px;
    transform: rotate(180deg);
}

/* =========================================
   HAND
========================================= */

.hand {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 96%;
    height: 130px;
    transform: translateX(-50%);
    z-index: 100;
    pointer-events: none;
}

.hand .card {
    pointer-events: auto;
    transform-origin: center bottom;
}

.hand .card.selected {
    box-shadow:
        0 0 0 3px #fff,
        0 10px 25px rgba(0,0,0,.7);
}

/* =========================================
   OPPONENT HAND
========================================= */

.opponent-hand {
    position: absolute;
    top: 0;
    left: 50%;
    width: 230px;
    height: 95px;
    transform: translateX(-50%);
    z-index: 12;
}

/* =========================================
   PLAYED CARDS
========================================= */

.attack-zone,
.defense-zone {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 210px;
    height: 160px;
    transform: translate(-50%, -50%);
    z-index: 25;
}

.played-card {
    position: absolute;
    width: 62px;
    height: 88px;
    transition:
        left .35s ease,
        top .35s ease,
        transform .35s ease;
}

/* =========================================
   CONTROLS
========================================= */

.controls {
    position: absolute;
    left: 50%;
    bottom: 17vh;
    transform: translateX(-50%);
    z-index: 150;
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
    pointer-events: none;
}

.control-btn {
    pointer-events: auto;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(10,10,10,.88);
    color: white;
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 6px 15px rgba(0,0,0,.35);
}

.control-btn:active {
    transform: scale(.95);
}

.control-btn.primary {
    background: white;
    color: black;
}

.control-btn.danger {
    background: #3b1515;
    border-color: #612525;
}

/* =========================================
   MESSAGE
========================================= */

.message {
    position: absolute;
    top: 13vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    background: rgba(0,0,0,.72);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 11px;
    color: #ddd;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s ease;
}

.message.show {
    opacity: 1;
}

/* =========================================
   START SCREEN
========================================= */

.start-screen {
    position: absolute;
    inset: 0;
    z-index: 500;
    background: rgba(5,5,5,.94);
    display: flex;
    justify-content: center;
    align-items: center;
}

.start-box {
    width: 85%;
    max-width: 350px;
    text-align: center;
}

.start-logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
}

.start-sub {
    margin-top: 8px;
    color: #888;
    letter-spacing: 3px;
    font-size: 11px;
}

.start-button {
    width: 100%;
    margin-top: 30px;
    border: 0;
    border-radius: 15px;
    background: white;
    color: black;
    padding: 17px;
    font-size: 16px;
    font-weight: 900;
}

/* =========================================
   DRAGGING
========================================= */

.card.dragging {
    position: fixed !important;
    z-index: 1000 !important;
    transition: none !important;
    pointer-events: none;
    transform: scale(1.08) rotate(0deg) !important;
    box-shadow: 0 20px 40px rgba(0,0,0,.7);
}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes deal {
    from {
        opacity: 0;
        transform: translate(-50%, 100px) scale(.65) rotate(0deg);
    }
    to {
        opacity: 1;
    }
}

@keyframes cardPlay {
    from {
        opacity: 0;
        transform: scale(.6) rotate(-15deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

.shake {
    animation: shake .25s ease;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 380px) {
    .card,
    .played-card {
        width: 56px;
        height: 80px;
    }

    .controls {
        bottom: 18vh;
    }

    .hand {
        height: 115px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="topbar">
        <div class="logo-small">
            HEAVY LUX CARD
        </div>

        <div class="game-info">
            <div class="info-pill">
                Козырь:
                <b id="trumpInfo">—</b>
            </div>

            <div class="info-pill">
                Колода:
                <b id="deckCount">24</b>
            </div>
        </div>
    </div>

    <div id="message" class="message">
        Ваш ход
    </div>

    <!-- ОППОНЕНТ -->

    <div class="opponent">

        <div class="opponent-avatar">
            🤖
        </div>

        <div class="opponent-name">
            Heavy AI
        </div>

        <div class="opponent-count">
            Карт: <b id="opponentCount">6</b>
        </div>

    </div>

    <div class="opponent-hand" id="opponentHand"></div>

    <!-- СТОЛ -->

    <div class="table">

        <div class="deck-area">

            <div class="deck" id="deck">
                <div class="deck-card"></div>
                <div class="deck-card"></div>
                <div class="deck-card"></div>
            </div>

            <div id="trumpCard" class="card trump-card"></div>

        </div>

        <div id="attackZone" class="attack-zone"></div>

        <div id="defenseZone" class="defense-zone"></div>

    </div>

    <!-- ИГРОК -->

    <div class="player-info">

        <div class="player-name" id="playerName">
            Игрок
        </div>

        <div class="player-count">
            Карт: <b id="playerCount">6</b>
        </div>

    </div>

    <div id="playerHand" class="hand"></div>

    <!-- КНОПКИ -->

    <div class="controls">

        <button
            id="takeButton"
            class="control-btn danger"
            style="display:none;"
        >
            ВЗЯТЬ
        </button>

        <button
            id="beatButton"
            class="control-btn primary"
            style="display:none;"
        >
            БИТО
        </button>

        <button
            id="endAttackButton"
            class="control-btn"
            style="display:none;"
        >
            ЗАКОНЧИТЬ
        </button>

    </div>

    <!-- СТАРТ -->

    <div id="startScreen" class="start-screen">

        <div class="start-box">

            <div class="start-logo">
                HEAVY LUX
            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

            <button
                id="startButton"
                class="start-button"
            >
                НАЧАТЬ ИГРУ
            </button>

        </div>

    </div>

</div>

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://heavy-lux-card-api.onrender.com";


/* =====================================================
   CARDS
===================================================== */

const SUITS = ["♠", "♥", "♦", "♣"];

const RANKS = [
    {
        name: "6",
        value: 6
    },
    {
        name: "7",
        value: 7
    },
    {
        name: "8",
        value: 8
    },
    {
        name: "9",
        value: 9
    },
    {
        name: "10",
        value: 10
    },
    {
        name: "В",
        value: 11
    },
    {
        name: "Д",
        value: 12
    },
    {
        name: "К",
        value: 13
    },
    {
        name: "Т",
        value: 14
    }
];


/* =====================================================
   GAME STATE
===================================================== */

let deck = [];

let playerHand = [];

let cpuHand = [];

let trumpSuit = null;

let attackCards = [];

let defenseCards = [];

let phase = "waiting";

/*
    waiting
    player_attack
    cpu_attack
    player_defense
    cpu_defense
    finished
*/

let attacker = null;

let defender = null;

let initialDefenderCards = 6;

let dragCard = null;

let dragOffsetX = 0;

let dragOffsetY = 0;

let gameStarted = false;

let playerName = "Игрок";


/* =====================================================
   DOM
===================================================== */

const playerHandEl =
    document.getElementById("playerHand");

const opponentHandEl =
    document.getElementById("opponentHand");

const attackZone =
    document.getElementById("attackZone");

const defenseZone =
    document.getElementById("defenseZone");

const trumpCardEl =
    document.getElementById("trumpCard");

const deckEl =
    document.getElementById("deck");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const takeButton =
    document.getElementById("takeButton");

const beatButton =
    document.getElementById("beatButton");

const endAttackButton =
    document.getElementById("endAttackButton");

const messageEl =
    document.getElementById("message");


/* =====================================================
   UTILITIES
===================================================== */

function sleep(ms) {
    return new Promise(resolve => {
        setTimeout(resolve, ms);
    });
}


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


function cardId(card) {

    return `${card.rank}-${card.suit}`;
}


function isRed(card) {

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


function cardText(card) {

    return `${card.rank}${card.suit}`;
}


/* =====================================================
   DECK
===================================================== */

function createDeck() {

    const newDeck = [];

    for (const suit of SUITS) {

        for (const rank of RANKS) {

            newDeck.push({
                id:
                    crypto.randomUUID
                    ? crypto.randomUUID()
                    : Math.random().toString(36),

                rank: rank.name,

                value: rank.value,

                suit: suit
            });
        }
    }

    return shuffle(newDeck);
}


/* =====================================================
   TRUMP
===================================================== */

function setupTrump() {

    /*
        Берём нижнюю карту колоды
        как козырь.

        Она остаётся визуально
        под колодой.
    */

    const trumpCard =
        deck[deck.length - 1];

    trumpSuit =
        trumpCard.suit;

    renderTrumpCard(trumpCard);

    updateInfo();
}


function renderTrumpCard(card) {

    trumpCardEl.className =
        "card trump-card " +
        (isRed(card) ? "red" : "");

    trumpCardEl.innerHTML = `
        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>
    `;
}


/* =====================================================
   DEAL
===================================================== */

async function dealCards() {

    playerHand = [];

    cpuHand = [];

    attackCards = [];

    defenseCards = [];

    renderHands();

    /*
        Сначала шесть карт игроку
        и шесть компьютеру.

        Быстро, но с небольшой
        анимацией.
    */

    for (let i = 0; i < 6; i++) {

        const pCard =
            deck.shift();

        playerHand.push(pCard);

        renderHands();

        await sleep(70);

        const cCard =
            deck.shift();

        cpuHand.push(cCard);

        renderHands();

        await sleep(70);
    }

    updateInfo();

    await sleep(200);
}


/* =====================================================
   SORT HAND
===================================================== */

function sortHand(hand) {

    return hand.sort((a,b) => {

        const aTrump =
            a.suit === trumpSuit;

        const bTrump =
            b.suit === trumpSuit;

        if (aTrump && !bTrump) return 1;

        if (!aTrump && bTrump) return -1;

        return a.value - b.value;
    });
}


/* =====================================================
   RENDER PLAYER HAND
===================================================== */

function renderHands() {

    sortHand(playerHand);

    playerHandEl.innerHTML = "";

    const width =
        playerHand.length * 48;

    playerHandEl.style.width =
        `${Math.max(width, 100)}px`;

    playerHand.forEach(
        (card, index) => {

            const el =
                createCardElement(card);

            el.dataset.id =
                card.id;

            const offset =
                (index -
                    (playerHand.length - 1) / 2)
                * 48;

            el.style.left =
                `calc(50% + ${offset}px - 31px)`;

            el.style.bottom = "4px";

            el.style.transform =
                `rotate(${(index -
                    (playerHand.length - 1) / 2) * 2.5}deg)`;

            addDragEvents(el, card);

            playerHandEl.appendChild(el);
        }
    );


    /* CPU */

    opponentHandEl.innerHTML = "";

    const cpuCount =
        cpuHand.length;

    const cpuWidth =
        Math.min(
            cpuCount * 28,
            210
        );

    opponentHandEl.style.width =
        `${Math.max(cpuWidth, 80)}px`;

    cpuHand.forEach(
        (card, index) => {

            const el =
                createBackCard();

            const offset =
                (index -
                    (cpuCount - 1) / 2)
                * 28;

            el.style.left =
                `calc(50% + ${offset}px - 27px)`;

            el.style.top =
                `${Math.abs(
                    index -
                    (cpuCount - 1) / 2
                ) * .7}px`;

            el.style.transform =
                `rotate(${(index -
                    (cpuCount - 1) / 2) * 3}deg)`;

            opponentHandEl.appendChild(el);
        }
    );

    document.getElementById(
        "playerCount"
    ).innerText =
        playerHand.length;

    document.getElementById(
        "opponentCount"
    ).innerText =
        cpuHand.length;
}


function createBackCard() {

    const el =
        document.createElement("div");

    el.className =
        "card back";

    return el;
}


/* =====================================================
   CARD ELEMENT
===================================================== */

function createCardElement(card) {

    const el =
        document.createElement("div");

    el.className =
        "card " +
        (isRed(card) ? "red" : "");

    el.innerHTML = `
        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>
    `;

    return el;
}


/* =====================================================
   DRAG AND DROP
===================================================== */

function addDragEvents(el, card) {

    let startX = 0;

    let startY = 0;

    let moved = false;

    el.addEventListener(
        "pointerdown",
        event => {

            if (
                phase !== "player_attack" &&
                phase !== "player_defense"
            ) {
                return;
            }

            el.setPointerCapture(
                event.pointerId
            );

            dragCard = {
                card,
                element: el
            };

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved = false;

            const rect =
                el.getBoundingClientRect();

            dragOffsetX =
                event.clientX -
                rect.left;

            dragOffsetY =
                event.clientY -
                rect.top;

            el.classList.add(
                "dragging"
            );

            el.style.left =
                `${event.clientX -
                    dragOffsetX}px`;

            el.style.top =
                `${event.clientY -
                    dragOffsetY}px`;

            el.style.bottom =
                "auto";
        }
    );


    el.addEventListener(
        "pointermove",
        event => {

            if (
                !dragCard ||
                dragCard.element !== el
            ) {
                return;
            }

            const dx =
                event.clientX - startX;

            const dy =
                event.clientY - startY;

            if (
                Math.abs(dx) > 5 ||
                Math.abs(dy) > 5
            ) {
                moved = true;
            }

            el.style.left =
                `${event.clientX -
                    dragOffsetX}px`;

            el.style.top =
                `${event.clientY -
                    dragOffsetY}px`;
        }
    );


    el.addEventListener(
        "pointerup",
        async event => {

            if (
                !dragCard ||
                dragCard.element !== el
            ) {
                return;
            }

            el.classList.remove(
                "dragging"
            );

            const rect =
                document
                    .querySelector(".table")
                    .getBoundingClientRect();

            const centerX =
                rect.left +
                rect.width / 2;

            const centerY =
                rect.top +
                rect.height / 2;

            const distance =
                Math.hypot(
                    event.clientX - centerX,
                    event.clientY - centerY
                );

            const wasDrag =
                moved && distance < rect.width * .45;

            const selectedCard =
                dragCard.card;

            dragCard = null;

            if (wasDrag) {

                await playPlayerCard(
                    selectedCard
                );

            } else {

                renderHands();
            }
        }
    );


    el.addEventListener(
        "pointercancel",
        () => {

            dragCard = null;

            renderHands();
        }
    );
}


/* =====================================================
   CAN BEAT
===================================================== */

function canBeat(attackCard, defenseCard) {

    if (!attackCard ||
        !defenseCard) {
        return false;
    }

    /*
        Козырь против некозыря
    */

    if (
        defenseCard.suit === trumpSuit &&
        attackCard.suit !== trumpSuit
    ) {
        return true;
    }

    /*
        Некозырь не может побить козырь
    */

    if (
        attackCard.suit === trumpSuit &&
        defenseCard.suit !== trumpSuit
    ) {
        return false;
    }

    /*
        Одна масть
    */

    return (
        attackCard.suit === defenseCard.suit &&
        defenseCard.value > attackCard.value
    );
}


/* =====================================================
   VALID ATTACK CARD
===================================================== */

function canAttackWith(card) {

    if (!card) return false;

    /*
        Первый удар:
        любая карта.
    */

    if (
        attackCards.length === 0
    ) {
        return true;
    }

    /*
        Можно подкидывать только
        ранг карт, которые уже
        лежат на столе.
    */

    const ranks = [
        ...attackCards,
        ...defenseCards
    ].map(
        c => c.rank
    );

    return ranks.includes(
        card.rank
    );
}


/* =====================================================
   PLAYER PLAY
===================================================== */

async function playPlayerCard(card) {

    if (
        phase !== "player_attack" &&
        phase !== "player_defense"
    ) {
        return;
    }


    /* ==========================================
       АТАКА
    ========================================== */

    if (
        phase === "player_attack"
    ) {

        if (
            !canAttackWith(card)
        ) {

            showMessage(
                "Эту карту нельзя подкинуть"
            );

            renderHands();

            return;
        }

        if (
            attackCards.length >=
            initialDefenderCards
        ) {

            showMessage(
                "Больше подкидывать нельзя"
            );

            renderHands();

            return;
        }

        removeFromPlayer(card);

        attackCards.push(card);

        await animateCardToTable(
            card,
            attackZone,
            false
        );

        renderHands();

        /*
            Если это первый удар,
            компьютер становится
            защищающимся.
        */

        phase =
            "cpu_defense";

        defender =
            "cpu";

        showMessage(
            "Компьютер отбивается..."
        );

        await sleep(500);

        await cpuDefense();

        return;
    }


    /* ==========================================
       ЗАЩИТА
    ========================================== */

    if (
        phase === "player_defense"
    ) {

        /*
            Находим первую ещё
            не побитую карту.
        */

        const targetIndex =
            getNextUnbeatenAttack();

        if (
            targetIndex === -1
        ) {
            return;
        }

        const attackCard =
            attackCards[targetIndex];

        if (
            !canBeat(
                attackCard,
                card
            )
        ) {

            showMessage(
                "Этой картой побить нельзя"
            );

            renderHands();

            return;
        }

        removeFromPlayer(card);

        defenseCards[targetIndex] =
            card;

        await animateCardToTable(
            card,
            defenseZone,
            true,
            targetIndex
        );

        renderHands();

        /*
            После каждой защиты
            НЕ переходим сразу к
            следующему ходу.

            Компьютер получает возможность
            подкинуть следующую карту.
        */

        await sleep(350);

        await cpuContinueAttack();

        return;
    }
}


/* =====================================================
   REMOVE PLAYER CARD
===================================================== */

function removeFromPlayer(card) {

    playerHand =
        playerHand.filter(
            c => c.id !== card.id
        );
}


/* =====================================================
   GET UNBEATEN
===================================================== */

function getNextUnbeatenAttack() {

    for (
        let i = 0;
        i < attackCards.length;
        i++
    ) {

        if (
            !defenseCards[i]
        ) {
            return i;
        }
    }

    return -1;
}


/* =====================================================
   ANIMATE CARD TO TABLE
===================================================== */

async function animateCardToTable(
    card,
    zone,
    isDefense = false,
    index = 0
) {

    const el =
        createCardElement(card);

    el.classList.add(
        "played-card"
    );

    const existing =
        zone.children.length;

    const position =
        isDefense
            ? getDefensePosition(index)
            : getAttackPosition(existing);

    el.style.left =
        `${position.x}px`;

    el.style.top =
        `${position.y}px`;

    el.style.opacity = "0";

    el.style.transform =
        "scale(.65) rotate(-15deg)";

    zone.appendChild(el);

    await sleep(20);

    el.style.opacity = "1";

    el.style.transform =
        `scale(1) rotate(${isDefense ? 6 : -5}deg)`;

    await sleep(300);
}


function getAttackPosition(index) {

    const row =
        Math.floor(index / 3);

    const col =
        index % 3;

    return {
        x: 20 + col * 67,
        y: 15 + row * 25
    };
}


function getDefensePosition(index) {

    const col =
        index % 3;

    return {
        x: 34 + col * 67,
        y: 5 + Math.floor(index / 3) * 25
    };
}


/* =====================================================
   CPU DEFENSE
===================================================== */

async function cpuDefense() {

    if (
        phase !== "cpu_defense"
    ) {
        return;
    }

    const targetIndex =
        getNextUnbeatenAttack();

    /*
        Все карты побиты.
    */

    if (
        targetIndex === -1
    ) {

        await cpuContinueAttack();

        return;
    }

    const target =
        attackCards[targetIndex];

    /*
        Ищем минимальную подходящую
        карту.
    */

    const options =
        cpuHand
            .filter(card =>
                canBeat(
                    target,
                    card
                )
            )
            .sort(
                (a,b) =>
                    a.value - b.value
            );

    /*
        Не может побить.
    */

    if (
        options.length === 0
    ) {

        await sleep(600);

        await cpuTakeCards();

        return;
    }

    /*
        Небольшая пауза,
        чтобы ход был визуальным.
    */

    await sleep(550);

    const card =
        options[0];

    cpuHand =
        cpuHand.filter(
            c => c.id !== card.id
        );

    defenseCards[targetIndex] =
        card;

    await animateCardToTable(
        card,
        defenseZone,
        true,
        targetIndex
    );

    renderHands();

    /*
        Очень важно:
        после защиты компьютер
        проверяет, есть ли ещё
        незакрытая карта.

        Если нет —
        проверяет подкидывание.
    */

    await sleep(350);

    await cpuContinueAttack();
}


/* =====================================================
   CPU CONTINUE ATTACK
===================================================== */

async function cpuContinueAttack() {

    /*
        Если компьютер атакующий,
        он должен решить:
        подкинуть или закончить.
    */

    if (
        phase === "cpu_defense"
    ) {

        /*
            Все карты должны быть
            побиты.
        */

        const unfinished =
            getNextUnbeatenAttack();

        if (
            unfinished !== -1
        ) {

            await cpuDefense();

            return;
        }

        /*
            Теперь компьютер атакующий
            продолжает подкидывать.
        */

        const candidates =
            getCpuAttackCandidates();

        if (
            candidates.length > 0 &&
            attackCards.length <
                initialDefenderCards
        ) {

            /*
                Компьютер действительно
                может подкинуть карту.
            */

            await sleep(450);

            const card =
                chooseCpuAttackCard(
                    candidates
                );

            cpuHand =
                cpuHand.filter(
                    c => c.id !== card.id
                );

            attackCards.push(card);

            await animateCardToTable(
                card,
                attackZone,
                false
            );

            renderHands();

            /*
                Теперь снова очередь
                защищающегося игрока.
            */

            phase =
                "player_defense";

            showMessage(
                "Твоя защита"
            );

            updateButtons();

            return;
        }

        /*
            Компьютер больше
            не подкидывает.

            Ход успешно закончен.
        */

        await finishSuccessfulDefense();

        return;
    }


    /*
        Если компьютер атакует
        с самого начала.
    */

    if (
        phase === "cpu_attack"
    ) {

        const candidates =
            getCpuAttackCandidates();

        if (
            attackCards.length <
                initialDefenderCards &&
            candidates.length > 0
        ) {

            await sleep(450);

            const card =
                chooseCpuAttackCard(
                    candidates
                );

            cpuHand =
                cpuHand.filter(
                    c => c.id !== card.id
                );

            attackCards.push(card);

            await animateCardToTable(
                card,
                attackZone
            );

            renderHands();

            phase =
                "player_defense";

            showMessage(
                "Твоя защита"
            );

            updateButtons();

            return;
        }

        await finishSuccessfulDefense();
    }
}


/* =====================================================
   CPU ATTACK CANDIDATES
===================================================== */

function getCpuAttackCandidates() {

    if (
        attackCards.length === 0
    ) {
        return cpuHand.slice();
    }

    const ranks = [
        ...attackCards,
        ...defenseCards
    ]
        .filter(Boolean)
        .map(
            c => c.rank
        );

    return cpuHand.filter(
        card =>
            ranks.includes(
                card.rank
            )
    );
}


/* =====================================================
   CPU ATTACK CHOICE
===================================================== */

function chooseCpuAttackCard(
    candidates
) {

    /*
        Предпочитаем:
        1. некозырную;
        2. младшую;
        3. карту, которой
           легче избавиться.
    */

    const sorted =
        candidates.slice().sort(
            (a,b) => {

                const aTrump =
                    a.suit === trumpSuit;

                const bTrump =
                    b.suit === trumpSuit;

                if (
                    aTrump !== bTrump
                ) {
                    return aTrump ? 1 : -1;
                }

                return (
                    a.value - b.value
                );
            }
        );

    return sorted[0];
}


/* =====================================================
   CPU TAKE
===================================================== */

async function cpuTakeCards() {

    showMessage(
        "Компьютер не смог отбиться — берёт"
    );

    await sleep(700);

    /*
        Компьютер забирает
        все карты со стола.
    */

    const allCards = [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ];

    cpuHand.push(
        ...allCards
    );

    attackCards = [];

    defenseCards = [];

    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";

    /*
        После взятия атакующий
        добирает первым.
    */

    await refillHands();

    renderHands();

    /*
        После взятия следующий
        атакующий — тот же атакующий.

        В нашем случае:
        атаковал компьютер,
        значит он продолжает.
    */

    if (
        cpuHand.length === 0
    ) {

        endGame();

        return;
    }

    phase =
        "cpu_attack";

    attacker =
        "cpu";

    defender =
        "player";

    initialDefenderCards =
        playerHand.length;

    updateButtons();

    showMessage(
        "Компьютер атакует"
    );

    await sleep(600);

    await cpuStartAttack();
}


/* =====================================================
   PLAYER TAKE
===================================================== */

async function playerTakeCards() {

    if (
        phase !== "player_defense"
    ) {
        return;
    }

    takeButton.style.display =
        "none";

    beatButton.style.display =
        "none";

    const allCards = [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ];

    playerHand.push(
        ...allCards
    );

    attackCards = [];

    defenseCards = [];

    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";

    renderHands();

    showMessage(
        "Ты взял карты"
    );

    await sleep(500);

    /*
        После взятия игроком
        атакующий добирает первым.
    */

    await refillHands();

    renderHands();

    /*
        После взятия атакующий
        остаётся атакующим.

        Если компьютер атаковал,
        он продолжает.
    */

    if (
        playerHand.length === 0
    ) {

        endGame();

        return;
    }

    if (
        cpuHand.length === 0
    ) {

        endGame();

        return;
    }

    phase =
        "cpu_attack";

    attacker =
        "cpu";

    defender =
        "player";

    initialDefenderCards =
        playerHand.length;

    updateButtons();

    await sleep(450);

    await cpuStartAttack();
}


/* =====================================================
   FINISH SUCCESSFUL DEFENSE
===================================================== */

async function finishSuccessfulDefense() {

    /*
        Все карты отбиты.

        Они уходят в отбой.
    */

    showMessage(
        "Бито"
    );

    await sleep(650);

    attackCards = [];

    defenseCards = [];

    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";

    await refillHands();

    renderHands();

    /*
        После успешной защиты
        атакующий меняется.

        Если атаковал игрок,
        теперь атакует компьютер.

        Если атаковал компьютер,
        теперь атакует игрок.
    */

    if (
        attacker === "player"
    ) {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "cpu_attack";

        initialDefenderCards =
            playerHand.length;

        updateButtons();

        await sleep(500);

        await cpuStartAttack();

    } else {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "player_attack";

        initialDefenderCards =
            cpuHand.length;

        updateButtons();

        showMessage(
            "Твой ход"
        );
    }
}


/* =====================================================
   CPU START ATTACK
===================================================== */

async function cpuStartAttack() {

    if (
        phase !== "cpu_attack"
    ) {
        return;
    }

    if (
        cpuHand.length === 0
    ) {
        endGame();

        return;
    }

    await sleep(500);

    const candidates =
        getCpuAttackCandidates();

    if (
        candidates.length === 0
    ) {

        /*
            Теоретически первый удар
            всегда возможен.
        */

        if (
            cpuHand.length > 0
        ) {

            const card =
                chooseCpuAttackCard(
                    cpuHand
                );

            cpuHand =
                cpuHand.filter(
                    c => c.id !== card.id
                );

            attackCards.push(card);

            await animateCardToTable(
                card,
                attackZone
            );

            renderHands();

            phase =
                "player_defense";

            showMessage(
                "Твоя защита"
            );

            updateButtons();

            return;
        }
    }

    const card =
        chooseCpuAttackCard(
            candidates
        );

    cpuHand =
        cpuHand.filter(
            c => c.id !== card.id
        );

    attackCards.push(card);

    await animateCardToTable(
        card,
        attackZone
    );

    renderHands();

    phase =
        "player_defense";

    showMessage(
        "Твоя защита"
    );

    updateButtons();
}


/* =====================================================
   REFILL
===================================================== */

async function refillHands() {

    /*
        Сначала атакующий,
        потом защищающийся.
    */

    const order =
        attacker === "player"
            ? [
                playerHand,
                cpuHand
            ]
            : [
                cpuHand,
                playerHand
            ];

    for (
        const hand of order
    ) {

        while (
            hand.length < 6 &&
            deck.length > 0
        ) {

            const card =
                deck.shift();

            hand.push(card);

            renderHands();

            await sleep(90);
        }
    }

    updateInfo();
}

   UPDATE INFO
===================================================== */

function updateInfo() {

    document.getElementById(
        "deckCount"
    ).innerText =
        deck.length;

    document.getElementById(
        "trumpInfo"
    ).innerText =
        trumpSuit || "—";

    document.getElementById(
        "playerCount"
    ).innerText =
        playerHand.length;

    document.getElementById(
        "opponentCount"
    ).innerText =
        cpuHand.length;
}

   BUTTONS

takeButton.addEventListener(

/* =====================================================

   MESSAGE

    );

/* =====================================================
   START
===================================================== */

async function startGame() {

    /*
        Получаем имя из Telegram.
    */

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        const user =
            tg.initDataUnsafe.user;

        playerName =
            user.first_name ||
            user.username ||
            "Игрок";
    }

    document.getElementById(
        "playerName"
    ).innerText =
        playerName;


    /*
        Создаём колоду.
    */

    deck =
        createDeck();

    /*
        Козырь.
    */

    setupTrump();

    /*
        Убираем козырную карту
        из обычного доступного
        пространства колоды.

        Она остаётся последней
        картой колоды.
    */

    await dealCards();


    /*
        Определяем первого игрока.

        Ищем младший козырь.
    */

    const playerTrump =
        playerHand
            .filter(
                c =>
                    c.suit === trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0];

    const cpuTrump =
        cpuHand
            .filter(
                c =>
                    c.suit === trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0];

    let playerStarts = false;

    if (
        playerTrump &&
        cpuTrump
    ) {

        playerStarts =
            playerTrump.value <
            cpuTrump.value;

    } else if (
        playerTrump
    ) {

        playerStarts = true;

    } else if (
        cpuTrump
    ) {

        playerStarts = false;

    } else {

        /*
            Если козырей нет,
            начинает игрок с
            младшей картой.
        */

        const playerMin =
            Math.min(
                ...playerHand.map(
                    c => c.value
                )
            );

        const cpuMin =
            Math.min(
                ...cpuHand.map(
                    c => c.value
                )
            );

        playerStarts =
            playerMin <= cpuMin;
    }


    if (
        playerStarts
    ) {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "player_attack";

        initialDefenderCards =
            cpuHand.length;

        showMessage(
            "У тебя младший козырь — твой ход"
        );

    } else {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "cpu_attack";

        initialDefenderCards =
            playerHand.length;

        showMessage(
            "Компьютер начинает"
        );

        await sleep(900);

        await cpuStartAttack();
    }

    updateButtons();

    updateInfo();
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    phase =
        "finished";

    updateButtons();

    let text = "";

    if (
        playerHand.length === 0 &&
        cpuHand.length === 0
    ) {

        text =
            "Ничья! Оба избавились от карт.";

    } else if (
        playerHand.length === 0
    ) {

        text =
            "Ты победил! 🤝";

    } else {

        text =
            "Ты проиграл. 🤡";
    }

    showMessage(
        text
    );

    setTimeout(
        () => {

            if (tg) {

                tg.showAlert(
                    text
                );

            } else {

                alert(text);
            }

        },
        500
    );
}


/* =====================================================
   INITIAL
===================================================== */

updateInfo();

</script>

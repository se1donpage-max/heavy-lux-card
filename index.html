<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;

    background:
        radial-gradient(
            circle at 50% 48%,
            #181818 0%,
            #0c0c0c 45%,
            #050505 100%
        );

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    min-height: 100vh;
}

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}


/* =========================================================
   TOP
========================================================= */

.topbar {

    position: absolute;

    top:
        calc(
            env(safe-area-inset-top, 0px) + 8px
        );

    left: 0;
    right: 0;

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 14px;

    z-index: 100;
}

.logo-small {

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 2px;

    opacity: .85;
}

.game-info {

    display: flex;

    gap: 6px;
}

.info-pill {

    padding:
        6px 9px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);

    font-size: 9px;

    color: #777;
}

.info-pill b {

    color: #fff;
}


/* =========================================================
   TABLE
========================================================= */

.table {

    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =========================================================
   OPPONENT
========================================================= */

.opponent {

    position: absolute;

    top:
        calc(
            env(safe-area-inset-top, 0px) + 65px
        );

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    text-align: center;
}

.opponent-avatar {

    width: 48px;
    height: 48px;

    margin: auto;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #252525,
            #0c0c0c
        );

    border:
        1px solid #555;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 21px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);
}

.opponent-name {

    margin-top: 5px;

    font-size: 11px;

    font-weight: 800;
}

.opponent-count {

    margin-top: 3px;

    font-size: 10px;

    color: #777;
}


/* =========================================================
   OPPONENT HAND
========================================================= */

.opponent-hand {

    position: absolute;

    top: 125px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 300px;

    height: 105px;

    z-index: 30;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    position: absolute;

    bottom:
        calc(
            env(safe-area-inset-bottom, 0px) + 118px
        );

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 100;

    text-align: center;
}

.player-name {

    font-size: 12px;

    font-weight: 900;
}

.player-count {

    margin-top: 3px;

    font-size: 10px;

    color: #777;
}


/* =========================================================
   DECK
========================================================= */

.deck-area {

    position: absolute;

    left: 25%;

    top: 50%;

    width: 110px;

    height: 145px;

    transform:
        translate(-50%, -50%);

    z-index: 20;
}


/*
    Основная колода.
    Все рубашки одинаковые.
*/

.deck {

    position: absolute;

    left: 0;

    top: 12px;

    width: 72px;

    height: 102px;

    transform:
        rotate(-6deg);

    z-index: 5;
}

.deck-card {

    position: absolute;

    inset: 0;

    border-radius: 9px;

    border: 2px solid #aaa;

    background:
        repeating-linear-gradient(
            45deg,
            #111 0px,
            #111 5px,
            #303030 5px,
            #303030 10px
        );

    box-shadow:
        0 7px 15px rgba(0,0,0,.55);

    overflow: hidden;
}

.deck-card::before {

    content: "";

    position: absolute;

    inset: 8px;

    border:
        1px solid rgba(255,255,255,.35);

    border-radius: 6px;

    background:
        repeating-linear-gradient(
            135deg,
            transparent 0px,
            transparent 6px,
            rgba(255,255,255,.07) 6px,
            rgba(255,255,255,.07) 8px
        );
}

.deck-card::after {

    content: "HL";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 2px;

    color: #fff;
}

.deck-card:nth-child(1) {
    transform:
        translate(-6px,-5px);
}

.deck-card:nth-child(2) {
    transform:
        translate(-3px,-2px);
}

.deck-card:nth-child(3) {
    transform:
        translate(0,0);
}


/* =========================================================
   TRUMP
========================================================= */

.trump-card {

    position: absolute;

    left: 47px;

    top: 37px;

    width: 72px;

    height: 102px;

    z-index: 2;

    transform:
        rotate(76deg);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =========================================================
   CARD
========================================================= */

.card {

    position: absolute;

    width: 72px;

    height: 102px;

    border-radius: 9px;

    background:
        #f4f4f4;

    color: #111;

    border:
        1px solid #ccc;

    box-shadow:
        0 7px 17px rgba(0,0,0,.48);

    overflow: hidden;

    font-weight: 900;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        left .3s ease,
        top .3s ease;
}

.card.red {
    color: #111;
}

.card-value {

    position: absolute;

    left: 7px;

    top: 5px;

    font-size: 16px;
}

.card-suit {

    position: absolute;

    left: 8px;

    top: 25px;

    font-size: 17px;
}

.card-center {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    font-size: 32px;
}

.card-corner {

    position: absolute;

    right: 6px;

    bottom: 4px;

    font-size: 11px;

    transform:
        rotate(180deg);
}


/* =========================================================
   BACK
========================================================= */

.card.back {

    background:
        repeating-linear-gradient(
            45deg,
            #111 0px,
            #111 5px,
            #303030 5px,
            #303030 10px
        );

    border:
        2px solid #aaa;
}

.card.back::before {

    content: "";

    position: absolute;

    inset: 8px;

    border:
        1px solid rgba(255,255,255,.35);

    border-radius: 6px;

    background:
        repeating-linear-gradient(
            135deg,
            transparent 0px,
            transparent 6px,
            rgba(255,255,255,.07) 6px,
            rgba(255,255,255,.07) 8px
        );
}

.card.back::after {

    content: "HL";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    color: #fff;

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 2px;
}


/* =========================================================
   PLAYER HAND
========================================================= */

.hand {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            env(safe-area-inset-bottom, 0px) + 12px
        );

    width: 100%;

    height: 115px;

    transform:
        translateX(-50%);

    z-index: 200;

    pointer-events: none;
}

.hand .card {

    pointer-events: auto;

    transform-origin:
        center bottom;

    cursor: grab;
}


/* =========================================================
   ALLOWED CARD
========================================================= */

.hand .card.allowed {

    box-shadow:
        0 0 0 2px #fff,
        0 0 16px rgba(255,255,255,.35),
        0 9px 22px rgba(0,0,0,.6);

    transform:
        translateY(-7px);
}

.hand .card.not-allowed {

    opacity: .48;

    filter:
        grayscale(100%);
}


/* =========================================================
   SELECTED
========================================================= */

.hand .card.selected {

    box-shadow:
        0 0 0 3px #fff,
        0 0 25px rgba(255,255,255,.5);

    transform:
        translateY(-12px)
        scale(1.04);
}


/* =========================================================
   PLAYED
========================================================= */

.attack-zone,
.defense-zone {

    position: absolute;

    left: 54%;

    top: 50%;

    width: 260px;

    height: 230px;

    transform:
        translate(-50%,-50%);

    z-index: 40;
}

.played-card {

    position: absolute;

    width: 72px;

    height: 102px;

    transition:
        left .35s ease,
        top .35s ease,
        transform .35s ease,
        opacity .35s ease;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            env(safe-area-inset-bottom, 0px) + 140px
        );

    transform:
        translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 400;
}

.control-btn {

    border:
        1px solid rgba(255,255,255,.15);

    background:
        rgba(20,20,20,.95);

    color: #fff;

    border-radius: 11px;

    padding:
        10px 16px;

    font-size: 10px;

    font-weight: 900;
}

.control-btn.primary {

    background: #fff;

    color: #000;
}

.control-btn.danger {

    background: #181818;

    color: #fff;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {

    position: absolute;

    top:
        calc(
            env(safe-area-inset-top, 0px) + 110px
        );

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 500;

    padding:
        8px 13px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.8);

    border:
        1px solid rgba(255,255,255,.1);

    color: #ccc;

    font-size: 10px;

    white-space: nowrap;

    opacity: 0;

    transition:
        opacity .25s ease;
}

.message.show {
    opacity: 1;
}


/* =========================================================
   START
========================================================= */

.start-screen {

    position: absolute;

    inset: 0;

    z-index: 1000;

    background:
        #050505;

    display: flex;

    justify-content: center;

    align-items: center;
}

.start-box {

    width: 84%;

    max-width: 350px;

    text-align: center;
}

.start-logo {

    font-size: 29px;

    font-weight: 900;

    letter-spacing: 5px;
}

.start-sub {

    margin-top: 8px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #666;
}

.start-button {

    width: 100%;

    margin-top: 30px;

    padding: 17px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-size: 14px;

    font-weight: 900;
}


/* =========================================================
   DRAG
========================================================= */

.card.dragging {

    position: fixed !important;

    z-index: 2000 !important;

    pointer-events: none;

    transition: none !important;

    transform:
        scale(1.08)
        rotate(0deg) !important;

    box-shadow:
        0 20px 45px rgba(0,0,0,.8);
}


/* =========================================================
   DEAL ANIMATION
========================================================= */

@keyframes dealCard {

    0% {

        opacity: 0;

        transform:
            translate(
                -50px,
                180px
            )
            scale(.5)
            rotate(-15deg);
    }

    70% {

        opacity: 1;
    }

    100% {

        opacity: 1;
    }
}

.dealing {

    animation:
        dealCard .28s ease-out;
}


/* =========================================================
   PLAY ANIMATION
========================================================= */

@keyframes playCard {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.7)
            rotate(-10deg);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1)
            rotate(0);
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 390px) {

    .card,
    .played-card,
    .trump-card {

        width: 64px;

        height: 92px;
    }

    .deck {

        width: 64px;

        height: 92px;
    }

    .deck-area {

        left: 23%;
    }

    .attack-zone,
    .defense-zone {

        left: 56%;

        width: 225px;
    }
}

</style>
</head>


<body>

        </div>

            </div>

                id="startButton"

            </button>

        </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if (tg) {

    tg.ready();

    tg.expand();
}


/* =========================================================
   CARD CONSTANTS
========================================================= */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [
    { name:"6", value:6 },
    { name:"7", value:7 },
    { name:"8", value:8 },
    { name:"9", value:9 },
    { name:"10", value:10 },
    { name:"В", value:11 },
    { name:"Д", value:12 },
    { name:"К", value:13 },
    { name:"Т", value:14 }
];


/* =========================================================
   GAME STATE
========================================================= */

let deck = [];

let playerHand = [];

let cpuHand = [];

let trumpSuit = null;

let trumpCard = null;

let attackCards = [];

let defenseCards = [];

let attacker = null;

let defender = null;

let phase = "waiting";

let gameStarted = false;

let selectedCardId = null;

let dragState = null;


/*
    Возможные состояния:

    waiting

    player_attack

    cpu_attack

    player_defense

    cpu_defense

    finished
*/


/* =========================================================
   DOM
========================================================= */

const playerHandEl =
    document.getElementById(
        "playerHand"
    );

const opponentHandEl =
    document.getElementById(
        "opponentHand"
    );

const attackZone =
    document.getElementById(
        "attackZone"
    );

const defenseZone =
    document.getElementById(
        "defenseZone"
    );

const trumpCardEl =
    document.getElementById(
        "trumpCard"
    );

const deckEl =
    document.getElementById(
        "deck"
    );

const takeButton =
    document.getElementById(
        "takeButton"
    );

const endAttackButton =
    document.getElementById(
        "endAttackButton"
    );

const messageEl =
    document.getElementById(
        "message"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


/* =========================================================
   UTILITIES
========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


function cardId(card) {

    return `${card.rank}_${card.suit}`;
}


function isRed(card) {

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


function showMessage(text) {

    messageEl.innerText =
        text;

    messageEl.classList.add(
        "show"
    );

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            () => {

                messageEl.classList.remove(
                    "show"
                );

            },
            1600
        );
}


/* =========================================================
   CREATE DECK
========================================================= */

function createDeck() {

    const result = [];

    /*
        Ровно:

        4 масти × 9 рангов = 36.

        ID детерминированный.
        Поэтому одинаковая карта
        не может существовать дважды.
    */

    for (const suit of SUITS) {

        for (const rank of RANKS) {

            result.push({

                id:
                    `${rank.name}_${suit}`,

                rank:
                    rank.name,

                value:
                    rank.value,

                suit:
                    suit
            });
        }
    }

    return shuffle(result);
}


/* =========================================================
   TRUMP
========================================================= */

function setupTrump() {

    /*
        Последняя карта колоды —
        козырь.

        Она НЕ удаляется.

        Она остаётся частью колоды
        и будет взята последней,
        когда колода закончится.
    */

    trumpCard =
        deck[deck.length - 1];

    trumpSuit =
        trumpCard.suit;

    renderTrump();

    updateInfo();
}


function renderTrump() {

    if (!trumpCard) {
        return;
    }

    trumpCardEl.className =
        "card trump-card " +
        (
            isRed(trumpCard)
                ? "red"
                : ""
        );

    trumpCardEl.innerHTML = `

        <div class="card-value">
            ${trumpCard.rank}
        </div>

        <div class="card-suit">
            ${trumpCard.suit}
        </div>

        <div class="card-center">
            ${trumpCard.suit}
        </div>

        <div class="card-corner">
            ${trumpCard.rank}${trumpCard.suit}
        </div>

    `;
}


/* =========================================================
   DEAL
========================================================= */

async function dealInitialCards() {

    playerHand = [];

    cpuHand = [];

    attackCards = [];

    defenseCards = [];

    clearTable();

    renderHands();

    /*
        Раздаём по одной карте
        игроку и компьютеру.

        Визуально карта появляется
        с нижней части стола.
    */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        await dealOne(
            "player"
        );

        await sleep(45);

        await dealOne(
            "cpu"
        );

        await sleep(45);
    }

    renderHands();

    updateInfo();
}


async function dealOne(target) {

    if (
        deck.length === 0
    ) {
        return;
    }

    const card =
        deck.shift();

    if (
        target === "player"
    ) {

        playerHand.push(card);

    } else {

        cpuHand.push(card);
    }

    renderHands();

    const selector =
        target === "player"
            ? playerHandEl
            : opponentHandEl;

    const last =
        selector.lastElementChild;

    if (last) {

        last.classList.add(
            "dealing"
        );
    }

    updateInfo();

    await sleep(100);
}


/* =========================================================
   SORT
========================================================= */

function sortHand(hand) {

    return hand.sort(
        (a,b) => {

            const aTrump =
                a.suit === trumpSuit;

            const bTrump =
                b.suit === trumpSuit;

            if (
                aTrump &&
                !bTrump
            ) {
                return 1;
            }

            if (
                !aTrump &&
                bTrump
            ) {
                return -1;
            }

            if (
                a.value !== b.value
            ) {
                return (
                    a.value -
                    b.value
                );
            }

            return (
                a.suit.localeCompare(
                    b.suit
                )
            );
        }
    );
}


/* =========================================================
   CREATE CARD
========================================================= */

function createCardElement(card) {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "card " +
        (
            isRed(card)
                ? "red"
                : ""
        );

    el.dataset.cardId =
        card.id;

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;
}


function createBackCard() {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "card back";

    return el;
}


/* =========================================================
   RENDER HANDS
========================================================= */

function renderHands() {

    sortHand(playerHand);

    playerHandEl.innerHTML = "";

    const count =
        playerHand.length;

    const spacing =
        Math.min(
            57,
            330 /
            Math.max(count,1)
        );

    playerHand.forEach(
        (card,index) => {

            const el =
                createCardElement(
                    card
                );

            const offset =
                (
                    index -
                    (count - 1) / 2
                ) * spacing;

            el.style.left =
                `calc(50% + ${offset}px - 36px)`;

            el.style.bottom =
                "0px";

            el.style.transform =
                `
                    rotate(
                        ${
                            (
                                index -
                                (count - 1) / 2
                            ) * 2.8
                        }deg
                    )
                `;

            if (
                selectedCardId ===
                card.id
            ) {

                el.classList.add(
                    "selected"
                );
            }

            if (
                phase ===
                "player_attack"
            ) {

                if (
                    canPlayerAttackWith(
                        card
                    )
                ) {

                    el.classList.add(
                        "allowed"
                    );

                } else {

                    el.classList.add(
                        "not-allowed"
                    );
                }
            }

            if (
                phase ===
                "player_defense"
            ) {

                const targetIndex =
                    getNextUnbeatenIndex();

                if (
                    targetIndex !== -1 &&
                    canBeat(
                        attackCards[
                            targetIndex
                        ],
                        card
                    )
                ) {

                    el.classList.add(
                        "allowed"
                    );

                } else {

                    el.classList.add(
                        "not-allowed"
                    );
                }
            }

            addCardInteraction(
                el,
                card
            );

            playerHandEl.appendChild(
                el
            );
        }
    );


    /*
        CPU HAND
    */

    opponentHandEl.innerHTML = "";

    const cpuCount =
        cpuHand.length;

    const cpuSpacing =
        Math.min(
            31,
            270 /
            Math.max(cpuCount,1)
        );

    cpuHand.forEach(
        (card,index) => {

            const el =
                createBackCard();

            const offset =
                (
                    index -
                    (cpuCount - 1) / 2
                ) *
                cpuSpacing;

            el.style.left =
                `calc(50% + ${offset}px - 36px)`;

            el.style.top =
                `${Math.abs(
                    index -
                    (cpuCount - 1) / 2
                ) * .5}px`;

            el.style.transform =
                `
                    rotate(
                        ${
                            (
                                index -
                                (cpuCount - 1) / 2
                            ) * 3
                        }deg
                    )
                `;

            opponentHandEl.appendChild(
                el
            );
        }
    );

    updateInfo();
}


/* =========================================================
   PLAYER CARD INTERACTION
========================================================= */

function addCardInteraction(
    el,
    card
) {

    let startX = 0;

    let startY = 0;

    let moved = false;

    el.addEventListener(
        "pointerdown",
        event => {

            if (
                phase !==
                    "player_attack" &&
                phase !==
                    "player_defense"
            ) {
                return;
            }

            /*
                Простое нажатие =
                только выбор.

                Карта НЕ удаляется.
            */

            selectedCardId =
                card.id;

            renderHands();

            /*
                Для drag используем
                только если палец
                реально начал двигаться.
            */

            const rect =
                el.getBoundingClientRect();

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved = false;

            dragState = {

                card,
                element: el,

                offsetX:
                    event.clientX -
                    rect.left,

                offsetY:
                    event.clientY -
                    rect.top
            };

            el.setPointerCapture(
                event.pointerId
            );
        }
    );


    el.addEventListener(
        "pointermove",
        event => {

            if (
                !dragState ||
                dragState.element !== el
            ) {
                return;
            }

            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;

            if (
                Math.abs(dx) > 8 ||
                Math.abs(dy) > 8
            ) {

                moved = true;

                el.classList.add(
                    "dragging"
                );

                el.style.left =
                    `${
                        event.clientX -
                        dragState.offsetX
                    }px`;

                el.style.top =
                    `${
                        event.clientY -
                        dragState.offsetY
                    }px`;

                el.style.bottom =
                    "auto";
            }
        }
    );


    el.addEventListener(
        "pointerup",
        async event => {

            if (
                !dragState ||
                dragState.element !== el
            ) {
                return;
            }

            const current =
                dragState;

            dragState = null;

            if (!moved) {

                /*
                    Просто выбрали карту.
                    Она остаётся в руке.
                */

                el.classList.remove(
                    "dragging"
                );

                renderHands();

                return;
            }

            el.classList.remove(
                "dragging"
            );

            const tableRect =
                document
                    .querySelector(".table")
                    .getBoundingClientRect();

            const centerX =
                tableRect.left +
                tableRect.width / 2;

            const centerY =
                tableRect.top +
                tableRect.height / 2;

            const distance =
                Math.hypot(
                    event.clientX -
                    centerX,

                    event.clientY -
                    centerY
                );

            /*
                Карта считается
                положенной на стол,
                только если её отпустили
                достаточно близко к столу.
            */

            if (
                distance <
                Math.min(
                    tableRect.width,
                    tableRect.height
                ) * .40
            ) {

                await playPlayerCard(
                    current.card
                );

            } else {

                selectedCardId =
                    null;

                renderHands();
            }
        }
    );


    el.addEventListener(
        "pointercancel",
        () => {

            dragState = null;

            selectedCardId = null;

            renderHands();
        }
    );
}


/* =========================================================
   BEAT LOGIC
========================================================= */

function canBeat(
    attack,
    defense
) {

    if (
        !attack ||
        !defense
    ) {
        return false;
    }

    const attackTrump =
        attack.suit === trumpSuit;

    const defenseTrump =
        defense.suit === trumpSuit;


    /*
        КОЗЫРЬ БЬЁТ
        ЛЮБУЮ НЕКОЗЫРНУЮ КАРТУ.
    */

    if (
        defenseTrump &&
        !attackTrump
    ) {

        return true;
    }


    /*
        НЕКОЗЫРЬ НЕ МОЖЕТ
        ПОБИТЬ КОЗЫРЬ.
    */

    if (
        !defenseTrump &&
        attackTrump
    ) {

        return false;
    }


    /*
        Если обе карты козырные
        или обе некозырные,
        масть должна совпадать.
    */

    return (
        defense.suit === attack.suit &&
        defense.value > attack.value
    );
}


/* =========================================================
   ATTACK LOGIC
========================================================= */

function tableRanks() {

    return [
        ...attackCards,
        ...defenseCards
    ]
        .filter(Boolean)
        .map(
            card =>
                card.rank
        );
}


function canPlayerAttackWith(
    card
) {

    if (!card) {
        return false;
    }

    /*
        Первый удар —
        любая карта.
    */

    if (
        attackCards.length === 0
    ) {

        return true;
    }

    /*
        Подкидывать можно только
        существующий на столе ранг.
    */

    return tableRanks().includes(
        card.rank
    );
}


/* =========================================================
   PLAYER PLAY
========================================================= */

async function playPlayerCard(
    card
) {

    if (
        phase ===
        "player_attack"
    ) {

        if (
            !canPlayerAttackWith(
                card
            )
        ) {

            showMessage(
                "Эту карту нельзя подкинуть"
            );

            renderHands();

            return;
        }


        /*
            Ограничение:
            нельзя подкинуть больше,
            чем карт у защищающегося
            в начале атаки.
        */

        if (
            attackCards.length >=
            getCurrentDefenderLimit()
        ) {

            showMessage(
                "Больше карт подкинуть нельзя"
            );

            renderHands();

            return;
        }

        removeCard(
            playerHand,
            card.id
        );

        attackCards.push(
            card
        );

        selectedCardId = null;

        renderHands();

        await animatePlayedCard(
            card,
            attackZone,
            false,
            attackCards.length - 1
        );


        /*
            Теперь компьютер
            защищается.
        */

        phase =
            "cpu_defense";

        updateButtons();

        showMessage(
            "Компьютер отбивается"
        );

        await sleep(350);

        await cpuDefense();

        return;
    }


    if (
        phase ===
        "player_defense"
    ) {

        const index =
            getNextUnbeatenIndex();

        if (
            index === -1
        ) {
            return;
        }

        const target =
            attackCards[index];

        if (
            !canBeat(
                target,
                card
            )
        ) {

            showMessage(
                "Этой картой побить нельзя"
            );

            renderHands();

            return;
        }


        removeCard(
            playerHand,
            card.id
        );

        defenseCards[index] =
            card;

        selectedCardId = null;

        renderHands();

        await animatePlayedCard(
            card,
            defenseZone,
            true,
            index
        );


        /*
            Если есть ещё
            непобитая карта —
            игрок должен отбить её.

            Если всё побито —
            CPU получает право
            решить, подкидывать ли.
        */

        if (
            getNextUnbeatenIndex()
            !== -1
        ) {

            phase =
                "player_defense";

            updateButtons();

            renderHands();

            return;
        }


        /*
            Всё отбито.
            Теперь именно CPU
            принимает решение:
            подкинуть или закончить.
        */

        await sleep(300);

        await cpuAfterSuccessfulDefense();

        return;
    }
}


/* =========================================================
   REMOVE
========================================================= */

function removeCard(
    hand,
    id
) {

    const index =
        hand.findIndex(
            card =>
                card.id === id
        );

    if (
        index === -1
    ) {
        return null;
    }

    return hand.splice(
        index,
        1
    )[0];
}


/* =========================================================
   NEXT UNBEATEN
========================================================= */

function getNextUnbeatenIndex() {

    for (
        let i = 0;
        i < attackCards.length;
        i++
    ) {

        if (
            !defenseCards[i]
        ) {

            return i;
        }
    }

    return -1;
}


/* =========================================================
   DEFENDER LIMIT
========================================================= */

function getCurrentDefenderLimit() {

    if (
        defender === "player"
    ) {

        return playerHand.length +
            attackCards.length;
    }

    return cpuHand.length +
        attackCards.length;
}


/*
    Более точное ограничение:
    количество карт, которое было
    у защищающегося в момент
    начала атаки.

    Поэтому сохраняем отдельно.
*/

let defenderCardLimit = 6;


/* =========================================================
   ANIMATE PLAYED CARD
========================================================= */

async function animatePlayedCard(
    card,
    zone,
    defense,
    index
) {

    const el =
        createCardElement(
            card
        );

    el.classList.add(
        "played-card"
    );

    const position =
        getTablePosition(
            index,
            defense
        );

    el.style.left =
        `${position.x}px`;

    el.style.top =
        `${position.y}px`;

    el.style.opacity =
        "0";

    el.style.transform =
        `
            scale(.65)
            rotate(-12deg)
        `;

    zone.appendChild(
        el
    );

    await sleep(20);

    el.style.opacity =
        "1";

    el.style.transform =
        `
            scale(1)
            rotate(
                ${
                    defense
                        ? 6
                        : -5
                }deg
            )
        `;

    await sleep(320);
}


/* =========================================================
   TABLE POSITIONS
========================================================= */

function getTablePosition(
    index,
    defense
) {

    /*
        Карты не кучкуются.

        Каждая следующая карта
        получает отдельную позицию.
    */

    const column =
        index % 3;

    const row =
        Math.floor(index / 3);

    if (!defense) {

        return {

            x:
                15 +
                column * 82,

            y:
                15 +
                row * 48
        };
    }

    return {

        x:
            45 +
            column * 82,

        y:
            4 +
            row * 48
    };
}


/* =========================================================
   CPU DEFENSE
========================================================= */

async function cpuDefense() {

    if (
        phase !==
        "cpu_defense"
    ) {
        return;
    }

    const index =
        getNextUnbeatenIndex();


    /*
        Все карты уже побиты.
    */

    if (
        index === -1
    ) {

        await cpuAfterSuccessfulDefense();

        return;
    }


    const target =
        attackCards[index];


    /*
        Ищем ВСЕ возможные
        карты для защиты.

        Потом выбираем слабейшую.
    */

    const options =
        cpuHand
            .filter(
                card =>
                    canBeat(
                        target,
                        card
                    )
            )
            .sort(
                compareDefenseCards
            );


    /*
        Не может отбиться.
    */

    if (
        options.length === 0
    ) {

        await sleep(500);

        await cpuTakeCards();

        return;
    }


    /*
        Компьютер использует
        минимально необходимую
        карту.
    */

    const chosen =
        options[0];


    await sleep(450);

    removeCard(
        cpuHand,
        chosen.id
    );

    defenseCards[index] =
        chosen;

    renderHands();

    await animatePlayedCard(
        chosen,
        defenseZone,
        true,
        index
    );


    /*
        Сразу после побития
        НЕ делаем новый ход.

        Проверяем:
        остались ли карты,
        которые надо отбить.
    */

    if (
        getNextUnbeatenIndex()
        !== -1
    ) {

        await cpuDefense();

        return;
    }


    /*
        Все карты побиты.

        Теперь отдельное решение:
        может ли CPU подкинуть
        и хочет ли он это делать.
    */

    await sleep(300);

    await cpuAfterSuccessfulDefense();
}


/* =========================================================
   DEFENSE SORT
========================================================= */

function compareDefenseCards(
    a,
    b
) {

    const aTrump =
        a.suit === trumpSuit;

    const bTrump =
        b.suit === trumpSuit;


    /*
        Некозырные предпочтительнее.
    */

    if (
        aTrump !== bTrump
    ) {

        return aTrump
            ? 1
            : -1;
    }


    return (
        a.value -
        b.value
    );
}


/* =========================================================
   CPU AFTER DEFENSE
========================================================= */

async function cpuAfterSuccessfulDefense() {

    if (
        phase !==
        "cpu_defense"
    ) {
        return;
    }


    /*
        ВАЖНО.

        CPU НЕ видит карты игрока.

        Он знает только:

        - какие карты лежат
          на столе;
        - какие карты он сам
          держит;
        - сколько карт у игрока;
        - сколько карт осталось
          в колоде.

        Поэтому он может определить
        только потенциальные
        подкидывания.
    */

    const candidates =
        getCpuAddCandidates();


    /*
        Если компьютер может
        легально подкинуть карту,
        он принимает решение
        сделать это.

        Это НЕ жульничество:
        возможность определяется
        исключительно открытыми
        рангами на столе.
    */

    if (
        candidates.length > 0 &&
        attackCards.length <
            defenderCardLimit
    ) {

        const chosen =
            chooseCpuAddCard(
                candidates
            );

        await sleep(400);

        removeCard(
            cpuHand,
            chosen.id
        );

        attackCards.push(
            chosen
        );

        renderHands();

        await animatePlayedCard(
            chosen,
            attackZone,
            false,
            attackCards.length - 1
        );


        /*
            Теперь игрок обязан
            защищаться от новой карты.
        */

        phase =
            "player_defense";

        updateButtons();

        renderHands();

        showMessage(
            "Компьютер подкинул"
        );

        return;
    }


    /*
        Компьютер решил закончить
        атаку.
    */

    await finishSuccessfulDefense();
}


/* =========================================================
   CPU ADD CANDIDATES
========================================================= */

function getCpuAddCandidates() {

    if (
        attackCards.length === 0
    ) {
        return [];
    }


    const ranks =
        tableRanks();


    return cpuHand.filter(
        card =>
            ranks.includes(
                card.rank
            )
    );
}


/* =========================================================
   CPU ADD CHOICE
========================================================= */

function chooseCpuAddCard(
    candidates
) {

    /*
        Сначала избавляемся
        от некозырных карт.

        Среди них — младшая.
    */

    return candidates
        .slice()
        .sort(
            (a,b) => {

                const aTrump =
                    a.suit === trumpSuit;

                const bTrump =
                    b.suit === trumpSuit;

                if (
                    aTrump !== bTrump
                ) {

                    return aTrump
                        ? 1
                        : -1;
                }

                return (
                    a.value -
                    b.value
                );
            }
        )[0];
}


/* =========================================================
   CPU TAKE
========================================================= */

async function cpuTakeCards() {

    showMessage(
        "Компьютер берёт карты"
    );

    await sleep(500);


    /*
        Все карты со стола
        переходят CPU.

        Каждая карта существует
        только в одном месте.
    */

    for (
        const card of attackCards
    ) {

        cpuHand.push(card);
    }

    for (
        const card of defenseCards
    ) {

        if (card) {
            cpuHand.push(card);
        }
    }


    clearTable();

    renderHands();


    /*
        После взятия:

        атакующий НЕ меняется.

        Если CPU атаковал —
        CPU продолжает атаку.

        Если игрок атаковал —
        игрок продолжает атаку.
    */

    await refillHands();

    renderHands();

    if (
        checkGameEnd()
    ) {
        return;
    }


    if (
        attacker === "cpu"
    ) {

        phase =
            "cpu_attack";

        defender =
            "player";

        defenderCardLimit =
            playerHand.length;

        updateButtons();

        await sleep(400);

        await cpuStartAttack();

    } else {

        phase =
            "player_attack";

        defender =
            "cpu";

        defenderCardLimit =
            cpuHand.length;

        updateButtons();

        showMessage(
            "Твой ход"
        );
    }
}

/* =========================================================
   CPU START ATTACK
========================================================= */

async function cpuStartAttack() {

    if (
        phase !==

    ) {

    }


    if (
        cpuHand.length === 0
    ) {

    */

    const chosen =
        chooseCpuAddCard(

        );


    await sleep(450);


    removeCard(
        cpuHand,
        chosen.id
    );

    attackCards.push(
        chosen
    );

    renderHands();

    await animatePlayedCard(
        chosen,
        attackZone,
        false,
        0
    );


    /*
        Теперь игрок защищается.
    */

    phase =
        "player_defense";

    defender =
        "player";

    updateButtons();

    renderHands();

    showMessage(
        "Твоя защита"
    );
}


/* =========================================================
   SUCCESSFUL DEFENSE
========================================================= */

async function finishSuccessfulDefense() {

    /*
        Здесь гарантированно:

        attackCards.length > 0

        и все attackCards имеют
        соответствующую defenseCards.
    */

    if (
        getNextUnbeatenIndex()
        !== -1
    ) {
        return;
    }


    showMessage(
        "Бито"
    );

    await sleep(650);


    clearTable();


    /*
        После успешного отбоя
        добираем карты.

        Атакующий добирает первым.
    */

    await refillHands();

    renderHands();


    if (
        checkGameEnd()
    ) {
        return;
    }


    /*
        Атакующий меняется.
    */

    if (
        attacker === "player"
    ) {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "cpu_attack";

        defenderCardLimit =
            playerHand.length;

        updateButtons();

        await sleep(400);

        await cpuStartAttack();

    } else {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "player_attack";

        defenderCardLimit =
            cpuHand.length;

        updateButtons();

        renderHands();

        showMessage(
            "Твой ход"
        );
    }
}


/* =========================================================
   REFILL
========================================================= */

async function refillHands() {

    /*
        Важный момент:

        Если колода содержит
        последнюю козырную карту,
        она тоже является
        обычной картой для добора.

        Никакой второй копии
        козыря не создаём.
    */

    const order =
        attacker === "player"
            ? [
                {
                    hand:
                        playerHand,
                    name:
                        "player"
                },
                {
                    hand:
                        cpuHand,
                    name:
                        "cpu"
                }
            ]
            : [
                {
                    hand:
                        cpuHand,
                    name:
                        "cpu"
                },
                {
                    hand:
                        playerHand,
                    name:
                        "player"
                }
            ];


    for (
        const entry of order
    ) {

        while (
            entry.hand.length < 6 &&
            deck.length > 0
        ) {

            const card =
                deck.shift();


            /*
                Проверка уникальности.
            */

            if (
                allCardsOnTableOrHands()
                    .some(
                        existing =>
                            existing.id ===
                            card.id
                    )
            ) {

                /*
                    Такая ситуация
                    невозможна при
                    правильной работе.

                    Просто пропускаем,
                    чтобы никогда не создать
                    дубль.
                */

                console.error(
                    "DUPLICATE CARD:",
                    card
                );

                continue;
            }


            entry.hand.push(
                card
            );

            renderHands();

            updateDeckVisual();

            await sleep(95);
        }
    }


    updateDeckVisual();

    updateInfo();
}


/* =========================================================
   DUPLICATE SAFETY
========================================================= */

function allCardsOnTableOrHands() {

    return [
        ...playerHand,
        ...cpuHand,
        ...attackCards,
        ...defenseCards.filter(
            Boolean
        )
    ];
}


/* =========================================================
   TABLE CLEAR
========================================================= */

function clearTable() {

    attackCards = [];

    defenseCards = [];

    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";
}


/* =========================================================
   DECK VISUAL
========================================================= */

function updateDeckVisual() {

    const cardsLeft =
        deck.length;

    deckEl.style.opacity =
        cardsLeft > 0
            ? "1"
            : ".2";


    /*
        Когда осталась последняя
        карта — это козырь.

        Она уже видна снизу.
    */

    if (
        cardsLeft <= 1
    ) {

        deckEl.style.opacity =
            cardsLeft === 1
                ? ".55"
                : ".15";
    }

    if (
        cardsLeft === 0
    ) {

        trumpCardEl.style.opacity =
            ".35";

    } else {

        trumpCardEl.style.opacity =
            "1";
    }
}


/* =========================================================
   INFO
========================================================= */

function updateInfo() {

    document.getElementById(
        "deckCount"
    ).innerText =
        deck.length;

    document.getElementById(
        "trumpInfo"
    ).innerText =
        trumpSuit || "—";

    document.getElementById(
        "playerCount"
    ).innerText =
        playerHand.length;

    document.getElementById(
        "opponentCount"
    ).innerText =
        cpuHand.length;

    updateDeckVisual();
}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons() {

    takeButton.style.display =
        "none";

    endAttackButton.style.display =
        "none";


    if (
        phase ===
        "player_defense"
    ) {

        takeButton.style.display =
            "block";
    }


    if (
        phase ===
        "player_attack" &&
        attackCards.length > 0
    ) {

        endAttackButton.style.display =
            "block";
    }
}


/* =========================================================
   GAME END
========================================================= */

function checkGameEnd() {

    /*
        Важно:

        Победа определяется
        только после завершения
        текущей операции.

        Поэтому не проверяем
        "нулевую руку" посреди
        разыгрывания карты.
    */

    if (
        playerHand.length === 0 &&
        cpuHand.length === 0
    ) {

        endGame(
            "Ничья! Оба избавились от карт."
        );

        return true;
    }


    if (
        playerHand.length === 0 &&
        deck.length === 0
    ) {

        endGame(
            "Ты победил!"
        );

        return true;
    }


    if (
        cpuHand.length === 0 &&
        deck.length === 0
    ) {

        endGame(
            "Ты проиграл."
        );

        return true;
    }


    return false;
}


function endGame(text) {

    phase =
        "finished";

    updateButtons();

    showMessage(text);

    setTimeout(
        () => {

            if (tg) {

                tg.showAlert(text);

            } else {

                alert(text);
            }

        },
        400
    );
}


/* =========================================================
   DETERMINE FIRST PLAYER
========================================================= */

function determineFirstPlayer() {

    const playerTrumps =
        playerHand
            .filter(
                card =>
                    card.suit ===
                    trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value -
                    b.value
            );

    const cpuTrumps =
        cpuHand
            .filter(
                card =>
                    card.suit ===
                    trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value -
                    b.value
            );


    if (
        playerTrumps.length > 0 &&
        cpuTrumps.length > 0
    ) {

        return (
            playerTrumps[0].value <
            cpuTrumps[0].value
        )
            ? "player"
            : "cpu";
    }


    if (
        playerTrumps.length > 0
    ) {

        return "player";
    }


    if (
        cpuTrumps.length > 0
    ) {

        return "cpu";
    }


    /*
        Если козырей нет —
        младшая карта.
    */

    const playerMin =
        Math.min(
            ...playerHand.map(
                card =>
                    card.value
            )
        );

    const cpuMin =
        Math.min(
            ...cpuHand.map(
                card =>
                    card.value
            )
        );

    return (
        playerMin <= cpuMin
    )
        ? "player"
        : "cpu";
}


/* =========================================================
   START GAME
========================================================= */

startButton.addEventListener(
    "click",
    async () => {

        if (
            gameStarted
        ) {
            return;
        }

        gameStarted = true;

        startScreen.style.display =
            "none";

        await startGame();
    }
);


async function startGame() {

    let name =
        "Игрок";

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        name =
            tg.initDataUnsafe.user.first_name ||
            tg.initDataUnsafe.user.username ||
            "Игрок";
    }


    document.getElementById(
        "playerName"
    ).innerText =
        name;


    /*
        Создаём ровно одну
        колоду из 36 карт.
    */

    deck =
        createDeck();


    /*
        Выбираем козырь.
    */

    setupTrump();


    /*
        Раздача.
    */

    await dealInitialCards();


    /*
        Проверка:

        36 - 12 = 24 карты.

        Последняя из них —
        открытый козырь.
    */

    updateInfo();


    /*
        Определяем первого.
    */

    const first =
        determineFirstPlayer();


    if (
        first === "player"
    ) {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "player_attack";

        defenderCardLimit =
            cpuHand.length;

        showMessage(
            "Твой ход"
        );

    } else {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "cpu_attack";

        defenderCardLimit =
            playerHand.length;

        showMessage(
            "Компьютер начинает"
        );

        await sleep(700);

        await cpuStartAttack();
    }


    updateButtons();

    renderHands();

    updateInfo();
}


/* =========================================================
   INITIAL UI
========================================================= */

updateInfo();

</script>

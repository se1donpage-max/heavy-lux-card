<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080809;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    padding: 18px;
}

/* LOGO */

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo h1 {
    font-size: 25px;
    letter-spacing: 4px;
    font-weight: 900;
}

.logo p {
    color: #777;
    font-size: 10px;
    letter-spacing: 5px;
    margin-top: 4px;
}

/* SCREENS */

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* PROFILE */

.player {
    text-align: center;
    margin-bottom: 18px;
}

.player-name {
    font-size: 19px;
    font-weight: 800;
}

.player-title {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

.balance {
    background: #151519;
    border: 1px solid #29292f;
    border-radius: 17px;
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
}

.balance-label {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.balance-value {
    font-size: 30px;
    font-weight: 900;
    margin-top: 5px;
}

.currency {
    font-size: 14px;
    color: #999;
}

/* BUTTONS */

button {
    font-family: Arial, sans-serif;
    cursor: pointer;
}

.main-button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 12px;
}

.secondary-button {
    width: 100%;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 15px;
    background: #151519;
    color: white;
    font-size: 15px;
    font-weight: 700;
}

/* GAME */

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.back {
    background: #151519;
    border: 1px solid #29292f;
    color: white;
    border-radius: 10px;
    padding: 9px 13px;
}

.game-title {
    font-size: 17px;
    font-weight: 900;
}

.trump {
    text-align: center;
    background: #151519;
    border: 1px solid #29292f;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 12px;
}

.trump span {
    font-size: 20px;
    font-weight: 900;
}

/* OPPONENT */

.opponent {
    text-align: center;
    margin-bottom: 12px;
}

.opponent-name {
    color: #aaa;
    font-size: 13px;
}

.opponent-cards {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 7px;
}

.card-back {
    width: 35px;
    height: 48px;
    border-radius: 6px;
    background: #222;
    border: 1px solid #555;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 13px;
}

/* TABLE */

.table {
    min-height: 180px;
    background: #101014;
    border: 1px solid #24242a;
    border-radius: 18px;
    margin: 10px 0 15px;
    padding: 15px;
}

.table-label {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-bottom: 12px;
}

.table-cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

/* CARDS */

.card {
    width: 54px;
    height: 76px;
    background: #fff;
    color: #111;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
    user-select: none;
}

.card.red {
    color: #d40000;
}

.card-rank {
    font-size: 20px;
}

.card-suit {
    font-size: 20px;
}

.card.playable {
    transform: translateY(-8px);
    box-shadow: 0 0 0 2px white;
}

/* DECK */

.deck-info {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 12px;
    margin-bottom: 10px;
}

/* PLAYER */

.player-hand {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding-bottom: 10px;
}

/* MESSAGE */

.message {
    min-height: 42px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    padding: 8px;
}

/* ACTIONS */

.actions {
    display: flex;
    gap: 8px;
    margin-top: 5px;
}

.action {
    flex: 1;
    border: none;
    border-radius: 13px;
    padding: 14px 8px;
    background: white;
    color: black;
    font-weight: 900;
}

.action.dark {
    background: #202025;
    color: white;
    border: 1px solid #333;
}

/* LOADING */

.loading {
    text-align: center;
    color: #777;
    padding: 40px 10px;
}

.error {
    background: #241414;
    border: 1px solid #522222;
    color: #ff9999;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

</style>
</head>

<body>

<div class="app">

<div class="logo">
    <h1>HEAVY LUX</h1>
    <p>CARD</p>
</div>

<!-- PROFILE -->

<div id="profileScreen" class="screen active">

    <div id="loading" class="loading">
        Загрузка профиля...
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="profile" style="display:none;">

        <div class="player">
            <div id="playerName" class="player-name"></div>
            <div id="playerTitle" class="player-title"></div>
        </div>

        <div class="balance">

            <div class="balance-label">
                Баланс
            </div>

            <div class="balance-value">
                <span id="balance">5 000</span>
                <span class="currency">HC</span>
            </div>

        </div>

        <button
            class="main-button"
            onclick="openGame()"
        >
            ИГРАТЬ
        </button>

    </div>

</div>


<!-- GAME -->

<div id="gameScreen" class="screen">

    <div class="game-header">

        <button
            class="back"
            onclick="backToProfile()"
        >
            ← Назад
        </button>

        <div class="game-title">
            ДУРАК
        </div>

        <div style="width:65px;"></div>

    </div>


    <div class="trump">
        Козырь:
        <span id="trump"></span>
    </div>


    <!-- COMPUTER -->

    <div class="opponent">

        <div class="opponent-name">
            Компьютер
        </div>

        <div
            id="computerCards"
            class="opponent-cards"
        ></div>

    </div>


    <!-- TABLE -->

    <div class="table">

        <div class="table-label">
            ИГРОВОЙ СТОЛ
        </div>

        <div
            id="tableCards"
            class="table-cards"
        ></div>

    </div>


    <div class="deck-info">

        <span>
            Колода:
            <b id="deckCount">24</b>
        </span>

        <span>
            Козырь:
            <b id="smallTrump"></b>
        </span>

    </div>


    <!-- PLAYER -->

    <div
        id="playerHand"
        class="player-hand"
    ></div>


    <div
        id="message"
        class="message"
    >
        Ваш ход
    </div>


    <div class="actions">

        <button
            id="takeButton"
            class="action dark"
            onclick="takeCards()"
            style="display:none;"
        >
            ВЗЯТЬ
        </button>

        <button
            id="endButton"
            class="action"
            onclick="endTurn()"
            style="display:none;"
        >
            БИТО
        </button>

    </div>

</div>

</div>


<script>

/* ==========================================
   TELEGRAM
========================================== */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* ==========================================
   BACKEND
========================================== */

const API_URL =
    "https://heavy-lux-card-api.onrender.com";


/* ==========================================
   PLAYER
========================================== */

let player = null;


/* ==========================================
   CARDS
========================================== */

const suits = [
    {
        symbol: "♠",
        color: "black"
    },
    {
        symbol: "♥",
        color: "red"
    },
    {
        symbol: "♦",
        color: "red"
    },
    {
        symbol: "♣",
        color: "black"
    }
];

const ranks = [
    "6",
    "7",
    "8",
    "9",
    "10",
    "J",
    "Q",
    "K",
    "A"
];

let deck = [];

let playerHand = [];

let computerHand = [];

let table = [];

let trumpSuit = null;

let playerTurn = true;

let defending = false;


/* ==========================================
   CREATE DECK
========================================== */

function createDeck() {

    deck = [];

    for (const suit of suits) {

        for (const rank of ranks) {

            deck.push({
                suit: suit.symbol,
                color: suit.color,
                rank: rank
            });

        }

    }

    shuffle(deck);

}


/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* ==========================================
   CARD VALUE
========================================== */

function cardValue(card) {

    const values = {
        "6": 6,
        "7": 7,
        "8": 8,
        "9": 9,
        "10": 10,
        "J": 11,
        "Q": 12,
        "K": 13,
        "A": 14
    };

    return values[card.rank];

}


/* ==========================================
   CAN BEAT
========================================== */

function canBeat(attack, defense) {

    if (
        attack.suit === defense.suit
    ) {

        return (
            cardValue(defense) >
            cardValue(attack)
        );

    }

    if (
        defense.suit === trumpSuit &&
        attack.suit !== trumpSuit
    ) {

        return true;

    }

    return false;

}


/* ==========================================
   OPEN GAME
========================================== */

function openGame() {

    document
        .getElementById("profileScreen")
        .classList.remove("active");

    document
        .getElementById("gameScreen")
        .classList.add("active");

    startGame();

}


/* ==========================================
   START GAME
========================================== */

function startGame() {

    createDeck();

    playerHand = [];

    computerHand = [];

    table = [];

    defending = false;

    playerTurn = true;


    /*
        Определяем козырь
    */

    trumpSuit =
        deck[
            deck.length - 1
        ].suit;


    /*
        Раздаём по 6 карт
    */

    for (let i = 0; i < 6; i++) {

        playerHand.push(
            deck.pop()
        );

        computerHand.push(
            deck.pop()
        );

    }


    sortHand(playerHand);

    sortHand(computerHand);


    renderGame();

    setMessage(
        "Ваш ход. Выберите карту."
    );

}


/* ==========================================
   SORT
========================================== */

function sortHand(hand) {

    hand.sort((a, b) => {

        if (
            a.suit === trumpSuit &&
            b.suit !== trumpSuit
        ) {
            return 1;
        }

        if (
            a.suit !== trumpSuit &&
            b.suit === trumpSuit
        ) {
            return -1;
        }

        return (
            cardValue(a) -
            cardValue(b)
        );

    });

}


/* ==========================================
   RENDER GAME
========================================== */

function renderGame() {

    document
        .getElementById("trump")
        .innerText =
        trumpSuit;

    document
        .getElementById("smallTrump")
        .innerText =
        trumpSuit;

    document
        .getElementById("deckCount")
        .innerText =
        deck.length;


    renderComputer();

    renderTable();

    renderPlayer();

}


/* ==========================================
   COMPUTER CARDS
========================================== */

function renderComputer() {

    const container =
        document.getElementById(
            "computerCards"
        );

    container.innerHTML = "";


    computerHand.forEach(() => {

        const card =
            document.createElement("div");

        card.className =
            "card-back";

        card.innerText =
            "HC";

        container.appendChild(card);

    });

}


/* ==========================================
   TABLE
========================================== */

function renderTable() {

    const container =
        document.getElementById(
            "tableCards"
        );

    container.innerHTML = "";


    table.forEach(item => {

        const card =
            createCardElement(
                item.card
            );

        container.appendChild(card);

    });

}


/* ==========================================
   PLAYER HAND
========================================== */

function renderPlayer() {

    const container =
        document.getElementById(
            "playerHand"
        );

    container.innerHTML = "";


    playerHand.forEach(
        (card, index) => {

            const element =
                createCardElement(
                    card
                );


            if (playerTurn) {

                element.onclick =
                    () => playCard(index);

                element.classList.add(
                    "playable"
                );

            }

            container.appendChild(
                element
            );

        }
    );

}


/* ==========================================
   CREATE CARD
========================================== */

function createCardElement(card) {

    const element =
        document.createElement("div");

    element.className =
        "card";

    if (card.color === "red") {

        element.classList.add("red");

    }

    element.innerHTML = `
        <div class="card-rank">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>
    `;

    return element;

}


/* ==========================================
   PLAYER ATTACK
========================================== */

function playCard(index) {

    if (!playerTurn) {
        return;
    }


    const card =
        playerHand[index];


    /*
        Если игрок защищается
    */

    if (defending) {

        if (
            !canBeat(
                table[table.length - 1].card,
                card
            )
        ) {

            setMessage(
                "Этой картой нельзя отбиться."
            );

            return;

        }

        table[
            table.length - 1
        ].defense = card;


        playerHand.splice(
            index,
            1
        );

        playerTurn = false;

        renderGame();

        setMessage(
            "Вы отбились. Компьютер ходит."
        );


        setTimeout(
            computerTurn,
            700
        );

        return;
    }


    /*
        Обычный ход
    */

    table.push({
        card: card,
        defense: null
    });


    playerHand.splice(
        index,
        1
    );

    playerTurn = false;

    renderGame();

    setMessage(
        "Компьютер отбивается..."
    );


    setTimeout(
        computerDefend,
        700
    );

}


/* ==========================================
   COMPUTER DEFEND
========================================== */

function computerDefend() {

    const attack =
        table[
            table.length - 1
        ].card;


    let possible =
        computerHand.filter(
            card =>
                canBeat(
                    attack,
                    card
                )
        );


    if (possible.length === 0) {

        /*
            Компьютер не смог отбиться
        */

        setMessage(
            "Компьютер забирает карты."
        );


        table.forEach(item => {

            computerHand.push(
                item.card
            );

            if (item.defense) {

                computerHand.push(
                    item.defense
                );

            }

        });


        table = [];

        sortHand(computerHand);

        drawCards();

        playerTurn = true;

        renderGame();

        setMessage(
            "Ваш ход."
        );

        checkGame();

        return;
    }


    /*
        Берём самую дешёвую карту
    */

    possible.sort(
        (a, b) =>
            cardValue(a) -
            cardValue(b)
    );


    const selected =
        possible[0];


    const index =
        computerHand.indexOf(
            selected
        );


    computerHand.splice(
        index,
        1
    );


    table[
        table.length - 1
    ].defense =
        selected;


    drawCards();

    renderGame();


    setMessage(
        "Компьютер отбился."
    );


    setTimeout(() => {

        table = [];

        playerTurn = true;

        drawCards();

        renderGame();

        setMessage(
            "Ваш ход."
        );

        checkGame();

    }, 700);

}


/* ==========================================
   COMPUTER TURN
========================================== */

function computerTurn() {

    if (computerHand.length === 0) {

        checkGame();

        return;

    }


    /*
        Компьютер атакует
    */

    const card =
        computerHand[0];


    computerHand.shift();


    table.push({
        card: card,
        defense: null
    });


    defending = true;

    playerTurn = true;


    renderGame();


    document
        .getElementById(
            "takeButton"
        )
        .style.display =
        "block";


    setMessage(
        "Компьютер ходит. Отбивайтесь."
    );

}


/* ==========================================
   TAKE CARDS
========================================== */

function takeCards() {

    if (!defending) {
        return;
    }


    table.forEach(item => {

        playerHand.push(
            item.card
        );

        if (item.defense) {

            playerHand.push(
                item.defense
            );

        }

    });


    table = [];

    defending = false;

    sortHand(playerHand);

    drawCards();

    document
        .getElementById(
            "takeButton"
        )
        .style.display =
        "none";


    playerTurn = false;

    renderGame();

    setMessage(
        "Вы взяли карты. Ход компьютера."
    );


    setTimeout(
        computerTurn,
        800
    );

}


/* ==========================================
   END TURN
========================================== */

function endTurn() {

    if (
        table.length === 0
    ) {
        return;
    }


    const allDefended =
        table.every(
            item =>
                item.defense
        );


    if (!allDefended) {

        setMessage(
            "Не все карты отбиты."
        );

        return;

    }


    table = [];

    defending = false;

    drawCards();

    playerTurn = false;

    renderGame();


    setTimeout(
        computerTurn,
        700
    );

}


/* ==========================================
   DRAW CARDS
========================================== */

function drawCards() {

    while (
        playerHand.length < 6 &&
        deck.length > 0
    ) {

        playerHand.push(
            deck.pop()
        );

    }


    while (
        computerHand.length < 6 &&
        deck.length > 0
    ) {

        computerHand.push(
            deck.pop()
        );

    }


    sortHand(playerHand);

    sortHand(computerHand);

}


/* ==========================================
   CHECK GAME
========================================== */

function checkGame() {

    if (
        playerHand.length === 0 &&
        deck.length === 0
    ) {

        tg.showAlert(
            "🎉 Вы победили!"
        );

        return;

    }


    if (
        computerHand.length === 0 &&
        deck.length === 0
    ) {

        tg.showAlert(
            "😔 Вы проиграли!"
        );

        return;

    }

}


/* ==========================================
   MESSAGE
========================================== */

function setMessage(text) {

    document
        .getElementById(
            "message"
        )
        .innerText =
        text;

}


/* ==========================================
   BACK PROFILE
========================================== */

function backToProfile() {

    document
        .getElementById("gameScreen")
        .classList.remove("active");

    document
        .getElementById("profileScreen")
        .classList.add("active");

}


/* ==========================================
   AUTH
========================================== */

async function authenticate() {

    try {

        const initData =
            tg.initData;


        if (!initData) {

            throw new Error(
                "Откройте игру через Telegram"
            );

        }


        const response =
            await fetch(
                `${API_URL}/api/auth`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData:
                                initData
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Ошибка авторизации"
            );

        }


        showPlayer(
            data.player
        );


    } catch (error) {

        console.error(
            "AUTH ERROR:",
            error
        );


        document
            .getElementById(
                "loading"
            )
            .style.display =
            "none";


        const errorBox =
            document.getElementById(
                "error"
            );


        errorBox.innerText =
            "Ошибка: " +
            error.message;


        errorBox.style.display =
            "block";

    }

}


/* ==========================================
   SHOW PLAYER
========================================== */

function showPlayer(data) {

    player = data;


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "profile"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "playerName"
        )
        .innerText =
        data.first_name ||
        data.username ||
        "Игрок";


    document
        .getElementById(
            "playerTitle"
        )
        .innerText =
        data.title ||
        "";


    document
        .getElementById(
            "balance"
        )
        .innerText =
        Number(
            data.balance
        ).toLocaleString(
            "ru-RU"
        );

}


/* ==========================================
   START
========================================== */

authenticate();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Heavy Lux Card</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0b0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 18px;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-size: 28px;
            letter-spacing: 4px;
            font-weight: 800;
        }

        .logo p {
            margin-top: 5px;
            font-size: 11px;
            letter-spacing: 5px;
            color: #888;
        }

        .balance {
            background: #151519;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            margin-bottom: 18px;
        }

        .balance-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 800;
        }

        .currency {
            font-size: 16px;
            color: #aaa;
            margin-left: 5px;
        }

        .level {
            background: #151519;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .level-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .level-title {
            font-weight: 700;
        }

        .xp {
            color: #888;
            font-size: 13px;
        }

        .progress {
            width: 100%;
            height: 7px;
            background: #29292f;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.3s ease;
        }

        .player {
            text-align: center;
            margin-bottom: 20px;
        }

        .player-name {
            font-size: 18px;
            font-weight: 700;
        }

        .player-title {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }

        .play {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 18px;
            background: #ffffff;
            color: #000000;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-button {
            background: #151519;
            border: 1px solid #29292f;
            color: #ffffff;
            border-radius: 15px;
            padding: 18px 10px;
            text-align: center;
            font-size: 14px;
        }

        .motors {
            grid-column: span 2;
            border: 1px solid #444;
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 10px;
            margin-top: 30px;
            letter-spacing: 2px;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .error {
            background: #241414;
            border: 1px solid #522222;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            color: #ff9999;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">
        <h1>HEAVY LUX</h1>
        <p>CARD</p>
    </div>

    <div id="loading" class="loading">
        Загрузка профиля...
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="game" style="display:none;">

        <div class="player">
            <div id="playerName" class="player-name"></div>
            <div id="playerTitle" class="player-title"></div>
        </div>

        <div class="balance">
            <div class="balance-label">Баланс</div>

            <div class="balance-value">
                <span id="balance">5 000</span>
                <span class="currency">HC</span>
            </div>
        </div>

        <div class="level">

            <div class="level-top">
                <div id="level" class="level-title">
                    Уровень 1
                </div>

                <div id="xp" class="xp">
                    0 XP
                </div>
            </div>

            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>

        </div>

        <button class="play" onclick="startGame()">
            ИГРАТЬ
        </button>

        <div class="menu">

            <div class="menu-button">
                👤<br>
                Профиль
            </div>

            <div class="menu-button">
                🏆<br>
                Рейтинг
            </div>

            <div class="menu-button">
                🏢<br>
                Бизнес
            </div>

            <div class="menu-button">
                🏠<br>
                Недвижимость
            </div>

            <div class="menu-button motors">
                🚘<br>
                HEAVY MOTORS
            </div>

        </div>

    </div>

    <div class="footer">
        HEAVY LUX CARD
    </div>

</div>

<script>

    // ======================================
    // TELEGRAM
    // ======================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ======================================
    // BACKEND
    // ======================================

 const API_URL = "https://heavy-lux-card-api.onrender.com";


    // ======================================
    // AUTH
    // ======================================

    async function authenticate() {

        try {

            const initData = tg.initData;

            if (!initData) {
                throw new Error(
                    "Откройте Heavy Lux Card через Telegram"
                );
            }

            const response = await fetch(
                `${API_URL}/api/auth`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        initData: initData
                    })
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.error || "Ошибка авторизации"
                );
            }

            showPlayer(data.player);

        } catch (error) {

            console.error(error);

            document.getElementById(
                "loading"
            ).style.display = "none";

            const errorBox =
                document.getElementById("error");

            errorBox.innerText = error.message;

            errorBox.style.display = "block";
        }
    }


    // ======================================
    // PLAYER
    // ======================================

    function showPlayer(player) {

        document.getElementById(
            "loading"
        ).style.display = "none";

        document.getElementById(
            "game"
        ).style.display = "block";

        const name =
            player.first_name ||
            player.username ||
            "Игрок";

        document.getElementById(
            "playerName"
        ).innerText = name;

        document.getElementById(
            "balance"
        ).innerText =
            Number(player.balance).toLocaleString("ru-RU");

        document.getElementById(
            "level"
        ).innerText =
            `Уровень ${player.level}`;

        document.getElementById(
            "xp"
        ).innerText =
            `${player.xp} XP`;

        document.getElementById(
            "playerTitle"
        ).innerText =
            player.title || "";

        const progress =
            Math.min(
                (player.xp % 1000) / 1000 * 100,
                100
            );

        document.getElementById(
            "progressBar"
        ).style.width =
            `${progress}%`;
    }


    // ======================================
    // GAME
    // ======================================

    function startGame() {

        tg.showAlert(
            "Локальная игра против компьютера будет добавлена следующим этапом."
        );
    }


    // ======================================
    // START
    // ======================================

    authenticate();

</script>

</body>
</html>

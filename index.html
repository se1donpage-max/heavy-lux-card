<script>

const tg =
    window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

let initData =
    tg?.initData || "";

let player = null;

let socket = null;

let room = null;

let game = null;

let carColors = [];

/*
=========================================================
API
=========================================================
*/

async function api(
    url,
    options = {}
) {
    options.headers =
        options.headers || {};

    options.headers[
        "Content-Type"
    ] =
        "application/json";

    if (player?.telegram_id) {
        options.headers[
            "x-telegram-id"
        ] =
            String(
                player.telegram_id
            );
    }

    const response =
        await fetch(
            url,
            options
        );

    const data =
        await response.json();

    if (!response.ok) {
        throw new Error(
            data.error ||
            "Ошибка запроса"
        );
    }

    return data;
}

/*
=========================================================
AUTH
=========================================================
*/

async function authenticate() {

    try {

        if (!initData) {
            toast(
                "Telegram initData не найден"
            );

            return;
        }

        const data =
            await api(
                "/api/auth",
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify({
                            initData
                        })
                }
            );

        player =
            data.player;

        renderPlayer();

        connectSocket();

        loadAll();

    } catch (error) {

        console.error(error);

        toast(
            error.message
        );
    }
}

/*
=========================================================
PLAYER
=========================================================
*/

function renderPlayer() {

    if (!player)
        return;

    document.getElementById(
        "playerName"
    ).textContent =
        [
            player.first_name,
            player.last_name
        ]
            .filter(Boolean)
            .join(" ");

    document.getElementById(
        "playerTitle"
    ).textContent =
        player.title;

    document.getElementById(
        "balance"
    ).textContent =
        Number(
            player.balance
        ).toLocaleString(
            "ru-RU"
        );

    document.getElementById(
        "level"
    ).textContent =
        player.level;

    document.getElementById(
        "wins"
    ).textContent =
        player.wins;

    document.getElementById(
        "games"
    ).textContent =
        player.games;
}

/*
=========================================================
SCREENS
=========================================================
*/

function showScreen(
    id
) {

    document.querySelectorAll(
        ".screen"
    ).forEach(
        element => {
            element.classList.remove(
                "active"
            );
        }
    );

    const screen =
        document.getElementById(id);

    if (screen) {
        screen.classList.add(
            "active"
        );
    }

    if (id === "cars")
        loadCars();

    if (id === "exclusive")
        loadExclusive();

    if (id === "garage")
        loadGarage();

    if (id === "gibdd")
        loadGibdd();

    if (id === "plates")
        loadPlates();

    if (id === "estate")
        loadEstate();

    if (id === "business")
        loadBusinesses();
}

/*
=========================================================
CAR COLORS
=========================================================
*/

async function loadColors() {

    const data =
        await api(
            "/api/car-colors"
        );

    carColors =
        data.colors || [];
}

/*
=========================================================
COLOR HTML
=========================================================
*/

function colorPicker(
    carId,
    exclusive = false
) {

    if (!carColors.length)
        return "";

    const group =
        exclusive
            ? "exclusiveColor"
            : "normalColor";

    const first =
        carColors[0];

    return `
        <div class="color-title">
            Цвет автомобиля
        </div>

        <div
            class="colors"
            data-car="${carId}"
            data-exclusive="${exclusive}"
        >

            ${carColors
                .map(
                    (color, index) => `
                        <button
                            class="color ${
                                index === 0
                                    ? "selected"
                                    : ""
                            }"
                            title="${color.name}"
                            data-color="${color.id}"
                            style="
                                background:
                                ${color.hex};
                            "
                            onclick="
                                selectColor(
                                    this,
                                    '${carId}'
                                )
                            "
                        ></button>
                    `
                )
                .join("")}

        </div>

        <input
            type="hidden"
            id="color_${exclusive}_${carId}"
            value="${first.id}"
        >
    `;
}

function selectColor(
    button,
    carId
) {

    const parent =
        button.parentElement;

    parent
        .querySelectorAll(
            ".color"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

    const exclusive =
        parent.dataset.exclusive ===
        "true";

    document.getElementById(
        `color_${exclusive}_${carId}`
    ).value =
        button.dataset.color;
}

/*
=========================================================
CARS
=========================================================
*/

async function loadCars() {

    try {

        await loadColors();

        const data =
            await api(
                "/api/cars"
            );

        const list =
            document.getElementById(
                "carsList"
            );

        list.innerHTML =
            data.cars
                .map(
                    car => `
                        <div class="card">

                            <div class="car-name">
                                ${car.name}
                            </div>

                            <div class="car-meta">
                                ${car.category}
                            </div>

                            <div class="car-preview">
                                ${car.brand}
                                ${car.model}
                            </div>

                            ${colorPicker(
                                car.id,
                                false
                            )}

                            <div class="price">
                                ${money(
                                    car.price
                                )} HC
                            </div>

                            <button
                                class="buy"
                                onclick="
                                    buyCar(
                                        '${car.id}',
                                        false
                                    )
                                "
                            >
                                Купить
                            </button>

                        </div>
                    `
                )
                .join("");

    } catch (error) {

        toast(
            error.message
        );
    }
}

async function buyCar(
    carId,
    exclusive
) {

    try {

        const input =
            document.getElementById(
                `color_${exclusive}_${carId}`
            );

        const colorId =
            input?.value;

        if (!colorId) {
            toast(
                "Выберите цвет"
            );

            return;
        }

        const endpoint =
            exclusive
                ? "/api/exclusive-cars/buy"
                : "/api/cars/buy";

        const data =
            await api(
                endpoint,
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify({
                            carId,
                            colorId
                        })
                }
            );

        player =
            data.player;

        renderPlayer();

        toast(
            "Автомобиль приобретён"
        );

        loadGarage();

    } catch (error) {

        toast(
            error.message
        );
    }
}

/*
=========================================================
EXCLUSIVE
=========================================================
*/

async function loadExclusive() {

    try {

        await loadColors();

        const data =
            await api(
                "/api/exclusive-cars"
            );

        const list =
            document.getElementById(
                "exclusiveList"
            );

        list.innerHTML =
            data.cars
                .map(
                    car => `
                        <div class="card">

                            <div class="car-name">
                                ${car.name}
                            </div>

                            <div class="car-meta">
                                ${car.category}
                                · ${car.tuning}
                            </div>

                            <div class="car-preview">
                                ${car.brand}
                                ${car.model}
                            </div>

                            ${colorPicker(
                                car.id,
                                true
                            )}

                            <div class="price">
                                ${money(
                                    car.price
                                )} HC
                            </div>

                            <button
                                class="buy"
                                onclick="
                                    buyCar(
                                        '${car.id}',
                                        true
                                    )
                                "
                            >
                                Купить
                            </button>

                        </div>
                    `
                )
                .join("");

    } catch (error) {

        toast(
            error.message
        );
    }
}

/*
=========================================================
GARAGE
=========================================================
*/

async function loadGarage() {

    try {

        const data =
            await api(
                "/api/garage"
            );

        player =
            data.player;

        renderPlayer();

        const list =
            document.getElementById(
                "garageList"
            );

        if (!data.cars.length) {

            list.innerHTML =
                `<div class="empty">
                    Гараж пуст
                </div>`;

            return;
        }

        list.innerHTML =
            data.cars

/*
=========================================================
SOCKET
=========================================================
*/

function connectSocket() {

    socket =
        io();

    socket.on(
        "connect",
        () => {

            socket.emit(
                "authenticate",
                {
                    initData
                }
            );

        }
    );

    socket.on(
        "authenticated",
        data => {

            if (data.player) {
                player =
                    data.player;

                renderPlayer();
            }

        }
    );

    socket.on(
        "room_created",
        data => {

            room =
                data.room;

            renderRoom();

        }
    );

    socket.on(
        "room_joined",
        data => {

            room =
                data.room;

            renderRoom();

        }
    );

    socket.on(
        "room_state",
        data => {

            room =
                data;

            renderRoom();

        }
    );

    socket.on(
        "game_state",
        data => {

            game =
                data;

            renderGame();

        }
    );

    socket.on(
        "game_finished",
        data => {

            player =
                data.player;

            renderPlayer();

            toast(
                data.message
            );

        }
    );

    socket.on(
        "action_error",
        data => {

            toast(
                data.message
            );

        }
    );

    socket.on(
        "server_error",
        data => {

            toast(
                data.message
            );

        }
    );
}

/*
=========================================================
ROOM
=========================================================
*/

function createRoom() {

    if (!socket) {
        toast(
            "Соединение отсутствует"
        );

        return;
    }

    socket.emit(
        "create_room"
    );
}

function joinRoom() {

    const code =
        document.getElementById(
            "roomCodeInput"
        ).value
            .trim()
            .toUpperCase();

    if (!code) {
        toast(
            "Введите код комнаты"
        );

        return;
    }

    socket.emit(
        "join_room",
        {
            roomCode:
                code
        }
    );
}

function renderRoom() {

    const view =
        document.getElementById(
            "roomView"
        );

    if (!room) {
        view.innerHTML = "";
        return;
    }

    view.innerHTML = `
        <div class="room">

            <div class="car-meta">
                Код комнаты
            </div>

            <div class="room-code">
                ${room.code}
            </div>

            <div class="car-meta">
                Игроков:
                ${room.playerCount}
                / 2
            </div>

            <div style="margin-top:12px">

                ${
                    room.players
                        .map(
                            p => `
                                <div
                                    class="row"
                                    style="
                                        padding:
                                        10px 0;
                                        border-bottom:
                                        1px solid #222;
                                    "
                                >
                                    <span>
                                        ${
                                            p.first_name
                                        }
                                    </span>

                                    <span>
                                        ${
                                            p.ready
                                                ? "Готов"
                                                : "Ожидание"
                                        }
                                    </span>
                                </div>
                            `
                        )
                        .join("")
                }

            </div>

        </div>
    `;
}

/*
=========================================================
GAME
=========================================================
*/

function renderGame() {

    const view =
        document.getElementById(
            "gameView"
        );

    if (
        !game ||
        game.status !==
            "playing"
    ) {
        return;
    }

    const cards =
        game.playerHand
            .map(
                card => `
                    <div
                        class="
                            playing-card
                            ${
                                card.suit ===
                                    "♥" ||
                                card.suit ===
                                    "♦"
                                    ? "red"
                                    : ""
                            }
                        "
                        onclick="
                            playCard(
                                '${card.id}'
                            )
                        "
                    >
                        <div>
                            ${card.rank}
                        </div>

                        <div
                            style="
                                text-align:center;
                                font-size:25px;
                            "
                        >
                            ${card.suit}
                        </div>
                    </div>
                `
            )
            .join("");

    const table =
        game.table
            .map(
                pair => `
                    <div
                        class="
                            playing-card
                            ${
                                pair.attack.suit ===
                                    "♥" ||
                                pair.attack.suit ===
                                    "♦"
                                    ? "red"
                                    : ""
                            }
                        "
                    >
                        <div>
                            ${pair.attack.rank}
                        </div>

                        <div
                            style="
                                text-align:center;
                                font-size:25px;
                            "
                        >
                            ${pair.attack.suit}
                        </div>

                        ${
                            pair.defense
                                ? `
                                    <div>
                                        ${pair.defense.rank}
                                        ${pair.defense.suit}
                                    </div>
                                `
                                : ""
                        }
                    </div>
                `
            )
            .join("");

    let status = "";

    if (
        game.canAttack
    ) {
        status =
            "Твой ход — атакуй";
    } else if (
        game.canDefend
    ) {
        status =
            "Отбивайся или забирай";
    } else if (
        game.canContinueAttack
    ) {
        status =
            "Можешь подкинуть или закончить атаку";
    } else {
        status =
            "Ход соперника";
    }

    view.innerHTML = `
        <div class="game">

            <div class="trump">
                Козырь:
                ${game.trumpSuit}
            </div>

            <div
                style="
                    text-align:center;
                    color:#888;
                    margin-bottom:10px;
                "
            >
                ${status}
            </div>

            <div class="table">
                ${
                    table ||
                    `<div class="empty">
                        Стол пуст
                    </div>`
                }
            </div>

            <div
                class="game-actions"
            >

                ${
                    game.canTake
                        ? `
                            <button
                                class="danger"
                                onclick="
                                    takeCards()
                                "
                            >
                                Забрать
                            </button>
                        `
                        : ""
                }

                ${
                    game.canContinueAttack
                        ? `
                            <button
                                class="success"
                                onclick="
                                    finishRound()
                                "
                            >
                                Закончить атаку
                            </button>
                        `
                        : ""
                }

            </div>

            <div
                style="
                    color:#777;
                    margin-top:15px;
                "
            >
                Твои карты
            </div>

            <div class="hand">
                ${cards}
            </div>

            <div
                style="
                    color:#777;
                    text-align:center;
                "
            >
                Карт в колоде:
                ${game.deckCount}
            </div>

        </div>
    `;
}

function playCard(
    cardId
) {

    if (!socket)
        return;

    socket.emit(
        "play_card",
        {
            cardId
        }
    );
}

function finishRound() {

    socket.emit(
        "finish_round"
    );
}

function takeCards() {

    socket.emit(
        "take_cards"
    );
}

=========================================================
LOAD ALL

    await loadColors();

    loadCars();

/*
=========================================================
UTILS
=========================================================
*/

function money(
    value
) {
    return Number(
        value || 0
    ).toLocaleString(
        "ru-RU"
    );
}

function toast(
    message
) {

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        message;

    element.style.display =
        "block";

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () => {
                element.style.display =
                    "none";
            },
            2500
        );
}

/*

START

authenticate();

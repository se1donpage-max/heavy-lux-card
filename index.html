<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

body {
    min-height: 100vh;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* =========================
   TOP
========================= */

.topbar {
    position: absolute;
    top: env(safe-area-inset-top, 8px);
    left: 0;
    right: 0;
    height: 48px;
    padding: 7px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 500;
}

.logo {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 3px;
}

.info {
    display: flex;
    gap: 6px;
}

.info-pill {
    background: #f4f4f4;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 6px 8px;
    font-size: 10px;
}

.info-pill b {
    color: #000;
}

/* =========================
   TABLE
========================= */

.table {
    position: absolute;
    inset: 0;
    z-index: 1;
}

/* =========================
   OPPONENT
========================= */

.opponent {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 100;
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #111;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    font-weight: 900;
    margin: auto;
}

.opponent-name {
    margin-top: 5px;
    font-size: 11px;
    font-weight: 800;
}

.opponent-count {
    margin-top: 3px;
    color: #777;
    font-size: 10px;
}

/* =========================
   OPPONENT HAND
========================= */

.opponent-hand {
    position: absolute;
    top: 14vh;
    left: 50%;
    width: 330px;
    height: 100px;
    transform: translateX(-50%);
    z-index: 90;
}

/* =========================
   DECK
========================= */

.deck-area {
    position: absolute;
    left: 7vw;
    top: 50%;
    width: 105px;
    height: 130px;
    transform: translateY(-50%);
    z-index: 80;
}

/*
    КОЗЫРЬ:
    находится ПОД стопкой.
    Он полностью лицевая карта.
*/

.trump-under {
    position: absolute;
    left: 18px;
    top: 27px;
    width: 67px;
    height: 96px;
    z-index: 1;
    transform: rotate(-11deg);
}

/*
    РУБАШКА:
    полностью такая же, как у карт
    оппонента.
*/

.deck-back {
    position: absolute;
    left: 9px;
    top: 9px;
    width: 67px;
    height: 96px;
    z-index: 5;
    transform: rotate(5deg);
}

.deck-back.second {
    left: 5px;
    top: 5px;
    transform: rotate(2deg);
    z-index: 4;
}

.deck-back.third {
    left: 1px;
    top: 1px;
    transform: rotate(-1deg);
    z-index: 3;
}

/* =========================
   CARD
========================= */

.card {
    position: absolute;
    width: 67px;
    height: 96px;
    border-radius: 9px;
    background: #fff;
    border: 1px solid #cfcfcf;
    box-shadow: 0 5px 14px rgba(0,0,0,.18);
    overflow: hidden;
    color: #111;
}

.card.red {
    color: #111;
}

.card-value {
    position: absolute;
    left: 6px;
    top: 5px;
    font-size: 16px;
    font-weight: 900;
}

.card-suit {
    position: absolute;
    left: 7px;
    top: 25px;
    font-size: 16px;
}

.card-center {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    font-size: 30px;
}

.card-corner {
    position: absolute;
    right: 5px;
    bottom: 4px;
    transform: rotate(180deg);
    font-size: 11px;
    font-weight: 800;
}

/* =========================
   CARD BACK
========================= */

.card.back,
.deck-back {
    background:
        linear-gradient(
            135deg,
            transparent 45%,
            #fff 46%,
            #fff 54%,
            transparent 55%
        ),
        linear-gradient(
            45deg,
            transparent 45%,
            #fff 46%,
            #fff 54%,
            transparent 55%
        ),
        #111;

    border: 2px solid #111;
}

.card.back::before,
.deck-back::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid #fff;
}

.card.back::after,
.deck-back::after {
    content: "HL";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
    z-index: 2;
}

/* =========================
   PLAY AREA
========================= */

.play-area {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(75vw, 420px);
    height: 300px;
    transform: translate(-50%, -50%);
    z-index: 150;
}

/*
    Каждый атакующий + защитная карта
    занимает отдельную позицию.
*/

.table-pair {
    position: absolute;
    width: 130px;
    height: 115px;
}

.table-pair .attack {
    left: 0;
    top: 0;
    transform: rotate(-5deg);
    z-index: 2;
}

.table-pair .defense {
    left: 35px;
    top: 18px;
    transform: rotate(7deg);
    z-index: 3;
}

/* =========================
   PLAYER
========================= */

.player-info {
    position: absolute;
    bottom: 16vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 200;
}

.player-name {
    font-size: 12px;
    font-weight: 900;
}

.player-count {
    margin-top: 3px;
    color: #777;
    font-size: 10px;
}

/* =========================
   PLAYER HAND
========================= */

.player-hand {
    position: absolute;
    left: 50%;
    bottom: 1vh;
    width: 96%;
    height: 145px;
    transform: translateX(-50%);
    z-index: 400;
}

.hand-card {
    position: absolute;
    bottom: 4px;
    width: 72px;
    height: 103px;
    transform-origin: center bottom;
    transition:
        left .22s ease,
        bottom .22s ease,
        transform .22s ease,
        box-shadow .22s ease;
}

/*
    Разрешённая карта
*/

.hand-card.allowed {
    box-shadow:
        0 0 0 3px #111,
        0 10px 22px rgba(0,0,0,.22);
    transform: translateY(-8px);
}

/*
    Нажатая карта НЕ исчезает.
*/

.hand-card.selected {
    transform:
        translateY(-15px)
        scale(1.03);
    box-shadow:
        0 0 0 3px #111,
        0 15px 28px rgba(0,0,0,.28);
}

/* =========================
   DRAGGING
========================= */

.dragging {
    position: fixed !important;
    z-index: 2000 !important;
    transition: none !important;
    pointer-events: none;
    transform:
        scale(1.08)
        rotate(0deg) !important;
    box-shadow:
        0 20px 35px rgba(0,0,0,.3) !important;
}

/* =========================
   BUTTONS
========================= */

.controls {
    position: absolute;
    bottom: 16vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 600;
    display: flex;
    gap: 8px;
}

button {
    border: 1px solid #111;
    background: #111;
    color: #fff;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 11px;
    font-weight: 900;
}

button.secondary {
    background: #fff;
    color: #111;
}

button:active {
    transform: scale(.95);
}

/* =========================
   MESSAGE
========================= */

.message {
    position: absolute;
    left: 50%;
    top: 19vh;
    transform: translateX(-50%);
    z-index: 700;
    background: #111;
    color: #fff;
    padding: 8px 13px;
    border-radius: 9px;
    font-size: 10px;
    opacity: 0;
    transition: opacity .2s ease;
    white-space: nowrap;
}

.message.show {
    opacity: 1;
}

/* =========================
   START
========================= */

.start-screen {
    position: absolute;
    inset: 0;
    background: #fff;
    z-index: 5000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.start-box {
    width: 82%;
    max-width: 340px;
    text-align: center;
}

.start-logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
}

.start-sub {
    margin-top: 8px;
    color: #888;
    font-size: 10px;
    letter-spacing: 3px;
}

.start-button {
    width: 100%;
    margin-top: 30px;
    padding: 16px;
    background: #111;
    color: #fff;
    border: 0;
    border-radius: 13px;
    font-size: 14px;
}

/* =========================
   DEAL ANIMATION
========================= */

.dealing {
    animation: dealCard .24s ease-out;
}

@keyframes dealCard {
    from {
        opacity: 0;
        transform:
            translateY(40px)
            scale(.65)
            rotate(-8deg);
    }

    to {
        opacity: 1;
    }
}

.play-animation {
    animation: playCard .28s ease-out;
}

@keyframes playCard {
    from {
        opacity: 0;
        transform:
            scale(.55)
            translateY(35px)
            rotate(-12deg);
    }

    to {
        opacity: 1;
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 380px) {

    .deck-area {
        left: 4vw;
    }

    .hand-card {
        width: 63px;
        height: 91px;
    }

    .player-hand {
        height: 130px;
    }

    .play-area {
        width: 72vw;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="topbar">

        <div class="logo">
            HEAVY LUX CARD
        </div>

        <div class="info">

            <div class="info-pill">
                ♠
                <b id="trumpInfo">—</b>
            </div>

            <div class="info-pill">
                <b id="deckCount">24</b>
            </div>

        </div>

    </div>


    <!-- ОППОНЕНТ -->

    <div class="opponent">

        <div class="avatar">
            HL
        </div>

        <div class="opponent-name">
            Heavy AI
        </div>

        <div class="opponent-count">
            Карт:
            <b id="cpuCount">6</b>
        </div>

    </div>


    <div
        id="opponentHand"
        class="opponent-hand">
    </div>


    <!-- СТОЛ -->

    <div class="table">

        <!-- КОЛОДА -->

        <div class="deck-area">

            <!-- КОЗЫРЬ ПОД КОЛОДОЙ -->
            <div
                id="trumpCard"
                class="card trump-under">
            </div>

            <!-- РУБАШКИ КОЛОДЫ -->
            <div
                class="deck-back third">
            </div>

            <div
                class="deck-back second">
            </div>

            <div
                id="deckTop"
                class="deck-back">
            </div>

        </div>


        <!-- ЦЕНТР -->
        <div
            id="playArea"
            class="play-area">
        </div>

    </div>


    <!-- ИГРОК -->

    <div class="player-info">

        <div
            id="playerName"
            class="player-name">
            Игрок
        </div>

        <div class="player-count">
            Карт:
            <b id="playerCount">6</b>
        </div>

    </div>


    <div
        id="playerHand"
        class="player-hand">
    </div>


    <!-- КНОПКИ -->

    <div class="controls">

        <button
            id="takeBtn"
            style="display:none">
            ВЗЯТЬ
        </button>

        <button
            id="finishBtn"
            class="secondary"
            style="display:none">
            БИТО
        </button>

        <button
            id="endAttackBtn"
            class="secondary"
            style="display:none">
            ЗАКОНЧИТЬ
        </button>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <!-- START -->

    <div
        id="startScreen"
        class="start-screen">

        <div class="start-box">

            <div class="start-logo">
                HEAVY LUX
            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

            <button
                id="startBtn"
                class="start-button">
                НАЧАТЬ ИГРУ
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================================
   CONSTANTS
===================================================== */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [
    ["6", 6],
    ["7", 7],
    ["8", 8],
    ["9", 9],
    ["10", 10],
    ["В", 11],
    ["Д", 12],
    ["К", 13],
    ["Т", 14]
];


/* =====================================================
   GAME STATE
===================================================== */

const game = {

    deck: [],

    player: [],

    cpu: [],

    trump: null,

    table: [],

    phase: "waiting",

    attacker: null,

    defender: null,

    selected: null,

    started: false,

    gameOver: false

};


/*
    Возможные состояния:

    waiting

    player_attack
    cpu_attack

    player_defense
    cpu_defense

    finished
*/


/* =====================================================
   DOM
===================================================== */

const playerHandEl =
    document.getElementById(
        "playerHand"
    );

const opponentHandEl =
    document.getElementById(
        "opponentHand"
    );

const playArea =
    document.getElementById(
        "playArea"
    );

const trumpCardEl =
    document.getElementById(
        "trumpCard"
    );

const deckTop =
    document.getElementById(
        "deckTop"
    );

const playerCountEl =
    document.getElementById(
        "playerCount"
    );

const cpuCountEl =
    document.getElementById(
        "cpuCount"
    );

const deckCountEl =
    document.getElementById(
        "deckCount"
    );

const trumpInfoEl =
    document.getElementById(
        "trumpInfo"
    );

const messageEl =
    document.getElementById(
        "message"
    );

const takeBtn =
    document.getElementById(
        "takeBtn"
    );

const finishBtn =
    document.getElementById(
        "finishBtn"
    );

const endAttackBtn =
    document.getElementById(
        "endAttackBtn"
    );


/* =====================================================
   HELPERS
===================================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


function uid() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random().toString(36)
    );
}


function shuffle(arr) {

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


function isTrump(card) {

    return (
        card.suit ===
        game.trump
    );
}


function isRed(card) {

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


/* =====================================================
   CREATE DECK
===================================================== */

function createDeck() {

    const result = [];

    for (
        const suit of SUITS
    ) {

        for (
            const [rank, value]
            of RANKS
        ) {

            result.push({

                id: uid(),

                rank,

                value,

                suit
            });
        }
    }

    return shuffle(result);
}


/* =====================================================
   UNIQUE CARD CHECK
===================================================== */

/*
    Критически важная функция.

    Она гарантирует, что одна физическая
    карта существует только один раз.
*/

function validateCards() {

    const all = [

        ...game.deck,

        ...game.player,

        ...game.cpu,

        ...game.table.flatMap(
            pair => {

                const arr = [
                    pair.attack
                ];

                if (pair.defense) {
                    arr.push(
                        pair.defense
                    );
                }

                return arr;
            }
        )

    ];

    const ids =
        all.map(card => card.id);

    const unique =
        new Set(ids);

    if (
        ids.length !==
        unique.size
    ) {

        console.error(
            "ОБНАРУЖЕН ДУБЛИКАТ КАРТЫ",
            all
        );

        throw new Error(
            "Duplicate card detected"
        );
    }

    if (
        all.length > 36
    ) {

        throw new Error(
            "More than 36 cards"
        );
    }

    return true;
}


/* =====================================================
   CARD LOCATION
===================================================== */

function removeCardFromHand(
    hand,
    id
) {

    const index =
        hand.findIndex(
            card =>
                card.id === id
        );

    if (
        index === -1
    ) {
        return null;
    }

    return hand.splice(
        index,
        1
    )[0];
}


/* =====================================================
   CAN BEAT
===================================================== */

function canBeat(
    attack,
    defense
) {

    if (
        !attack ||
        !defense
    ) {
        return false;
    }

    if (
        isTrump(defense) &&
        !isTrump(attack)
    ) {
        return true;
    }

    if (
        !isTrump(defense) &&
        isTrump(attack)
    ) {
        return false;
    }

    return (
        attack.suit ===
        defense.suit &&
        defense.value >
        attack.value
    );
}


/* =====================================================
   TABLE RANKS
===================================================== */

function tableRanks() {

    const result = [];

    for (
        const pair of game.table
    ) {

        result.push(
            pair.attack.rank
        );

        if (
            pair.defense
        ) {

            result.push(
                pair.defense.rank
            );
        }
    }

    return result;
}


/* =====================================================
   CAN ADD
===================================================== */

function canAddCard(
    card
) {

    /*
        Первый атакующий ход.
    */

    if (
        game.table.length === 0
    ) {
        return true;
    }

    /*
        Подкидывать можно только
        существующий на столе ранг.
    */

    return tableRanks()
        .includes(card.rank);
}


/* =====================================================
   DEFENDER CARD LIMIT
===================================================== */

function defenderLimit() {

    /*
        Максимальное количество
        атакующих карт:

        сколько карт было у
        защищающегося в начале
        атаки, но не больше 6.
    */

    const defenderCount =
        game.defender === "player"
            ? game.player.length +
              game.table.filter(
                  p => p.defense
              ).length
            : game.cpu.length +
              game.table.filter(
                  p => p.defense
              ).length;

    return Math.min(
        6,
        defenderCount
    );
}


/* =====================================================
   CREATE CARD ELEMENT
===================================================== */

function createCardElement(
    card
) {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "card";

    if (
        isRed(card)
    ) {
        el.classList.add(
            "red"
        );
    }

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>
    `;

    return el;
}


/* =====================================================
   RENDER TRUMP
===================================================== */

function renderTrump() {

    const card =
        game.deck[
            game.deck.length - 1
        ];

    if (!card) {

        trumpCardEl.style.display =
            "none";

        return;
    }

    trumpCardEl.style.display =
        "block";

    trumpCardEl.className =
        "card trump-under";

    if (
        isRed(card)
    ) {
        trumpCardEl.classList.add(
            "red"
        );
    }

    trumpCardEl.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>
    `;
}


/* =====================================================
   RENDER CPU HAND
===================================================== */

function renderCpuHand() {

    opponentHandEl.innerHTML =
        "";

    const count =
        game.cpu.length;

    const spacing =
        Math.min(
            36,
            270 /
            Math.max(count, 1)
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card back";

        const offset =
            (
                i -
                (count - 1) / 2
            ) * spacing;

        card.style.left =
            `calc(50% + ${offset}px - 33px)`;

        card.style.top =
            `${Math.abs(
                i -
                (count - 1) / 2
            ) * .8}px`;

        card.style.transform =
            `rotate(${
                (
                    i -
                    (count - 1) / 2
                ) * 3
            }deg)`;

        opponentHandEl.appendChild(
            card
        );
    }
}


/* =====================================================
   PLAYER CARD ALLOWED
===================================================== */

function playerCanUse(
    card
) {

    if (
        game.phase ===
        "player_attack"
    ) {

        return canAddCard(
            card
        );
    }

    if (
        game.phase ===
        "player_defense"
    ) {

        const target =
            game.table.find(
                pair =>
                    !pair.defense
            );

        if (!target) {
            return false;
        }

        return canBeat(
            target.attack,
            card
        );
    }

    return false;
}

async function deal() {

        i < 6;
        i++
    ) {

        const p =
            game.deck.shift();

        game.player.push(p);

        render();

        render();

        await sleep(65);
    }

    /*
        Козырь всегда последняя
        карта колоды.

        Поэтому её НЕ удаляем.
    */

    render();
}


/* =====================================================
   FIND FIRST ATTACKER
===================================================== */

function findFirstAttacker() {

    const playerTrumps =
        game.player.filter(
            isTrump
        );

    const cpuTrumps =
        game.cpu.filter(
            isTrump
        );

    if (
        playerTrumps.length ||
        cpuTrumps.length
    ) {

        const p =
            playerTrumps.sort(
                (a,b) =>
                    a.value -
                    b.value
            )[0];

        const c =
            cpuTrumps.sort(
                (a,b) =>
                    a.value -
                    b.value
            )[0];

        if (!c) {
            return "player";
        }

        if (!p) {
            return "cpu";
        }

        return (
            p.value <= c.value
                ? "player"
                : "cpu"
        );
    }

    const p =
        Math.min(
            ...game.player.map(
                c => c.value
            )
        );

    const c =
        Math.min(
            ...game.cpu.map(
                c => c.value
            )
        );

    return p <= c
        ? "player"
        : "cpu";
}

/* =====================================================
   PLAYER ATTACK
===================================================== */

async function playerAttack(
    card
) {

    if (
        game.phase !==
        "player_attack"
    ) {
        return;
    }

    if (
        !canAddCard(card)
    ) {

        showMessage(
            "Эту карту нельзя положить"
        );

        return;
    }

    /*
        Защищающийся не может
        получить больше 6 атакующих
        карт.
    */

    if (
        game.table.length >= 6
    ) {

        showMessage(
            "Больше подкидывать нельзя"
        );

        return;
    }

    const index =
        game.player.findIndex(
            c =>
                c.id === card.id
        );

    if (
        index === -1
    ) {
        return;
    }

    /*
        КАРТА ФИЗИЧЕСКИ ПЕРЕМЕЩАЕТСЯ
        из руки на стол.
    */

    const moving =
        game.player.splice(
            index,
            1
        )[0];

    game.table.push({

        attack: moving,

        defense: null

    });

    game.selected =
        null;

    render();

    await sleep(300);

    /*
        После первой/следующей атаки
        компьютер должен отбиваться.
    */

    game.phase =
        "cpu_defense";

    render();

    await cpuDefense();
}


/* =====================================================
   CPU DEFENSE STRATEGY
===================================================== */

function findBestDefense(
    attackCard
) {

    const possible =
        game.cpu
            .filter(
                card =>
                    canBeat(
                        attackCard,
                        card
                    )
            )
            .sort(
                (a,b) => {

                    const at =
                        isTrump(a);

                    const bt =
                        isTrump(b);

                    /*
                        Сначала некозырь.
                    */

                    if (
                        at !== bt
                    ) {
                        return at
                            ? 1
                            : -1;
                    }

                    return (
                        a.value -
                        b.value
                    );
                }
            );

    return possible[0] || null;
}


/* =====================================================
   CPU DEFENSE
===================================================== */

async function cpuDefense() {

    if (
        game.phase !==
        "cpu_defense"
    ) {
        return;
    }

    const target =
        game.table.find(
            pair =>
                !pair.defense
        );

    /*
        Все карты отбиты.

        Теперь компьютер решает,
        подкидывать ли ещё.
    */

    if (!target) {

        await cpuDecideAdd();

        return;
    }

    await sleep(420);

    const defense =
        findBestDefense(
            target.attack
        );

    /*
        Не может отбиться.
    */

    if (!defense) {

        await cpuTake();

        return;
    }

    const index =
        game.cpu.findIndex(
            c =>
                c.id ===
                defense.id
        );

    if (
        index === -1
    ) {
        return;
    }

    const card =
        game.cpu.splice(
            index,
            1
        )[0];

    target.defense =
        card;

    render();

    await sleep(350);

    /*
        Проверяем, осталось ли
        что-то неотбитое.
    */

    await cpuDefense();
}


/* =====================================================
   CPU DECIDE ADD
===================================================== */

async function cpuDecideAdd() {

    /*
        Все карты уже побиты.

        Теперь компьютер смотрит
        только на СВОЮ руку.

        Он НЕ знает скрытые карты
        игрока.
    */

    if (
        game.table.length >= 6
    ) {

        await successfulDefense();

        return;
    }

    const ranks =
        tableRanks();

    const candidates =
        game.cpu.filter(
            card =>
                ranks.includes(
                    card.rank
                )
        );

    /*
        Нет подходящих карт —
        компьютер НЕ может подкинуть.
    */

    if (
        candidates.length === 0
    ) {

        await successfulDefense();

        return;
    }

    /*
        Выбираем минимальную
        некозырную карту.
    */

    candidates.sort(
        (a,b) => {

            const at =
                isTrump(a);

            const bt =
                isTrump(b);

            if (
                at !== bt
            ) {
                return at
                    ? 1
                    : -1;
            }

            return (
                a.value -
                b.value
            );
        }
    );

    await sleep(450);

    const card =
        candidates[0];

    const index =
        game.cpu.findIndex(
            c =>
                c.id ===
                card.id
        );

    if (
        index === -1
    ) {
        return;
    }

    const moving =
        game.cpu.splice(
            index,
            1
        )[0];

    game.table.push({

        attack: moving,

        defense: null

    });

    render();

    /*
        Теперь снова игрок
        должен отбиться.
    */

    game.phase =
        "player_defense";

    showMessage(
        "Компьютер подкинул"
    );

    render();
}

   PLAYER DEFENSE

async function playerDefense(

) {

    if (

        );

    if (

    ) {

    }

    const moving =

        )[0];

    target.defense =

    */

/* =====================================================
   PLAYER TAKE
===================================================== */

async function playerTake() {

    showMessage(
        "Ты берёшь карты"
    );

    await sleep(350);

    /*
        Все карты со стола
        переходят игроку.

        Никаких копий.
    */

    for (
        const pair of game.table
    ) {

        game.player.push(
            pair.attack
        );

        if (
            pair.defense
        ) {

            game.player.push(
                pair.defense
            );
        }
    }

    game.table =
        [];

    render();

    await sleep(450);

    /*
        После взятия атакующий
        НЕ меняется.

        Если атаковал компьютер,
        он продолжает атаковать.
    */

    if (
        game.attacker ===
        "cpu"
    ) {

        await refill();

        game.defender =
            "player";

        game.phase =
            "cpu_attack";

        render();

        await cpuAttack();

    } else {

        await refill();

        game.defender =
            "cpu";

        game.phase =
            "player_attack";

        render();
    }
}

/* =====================================================
   SUCCESSFUL DEFENSE
===================================================== */

async function successfulDefense() {

    /*
        Все пары должны иметь защиту.
    */

    const valid =
        game.table.length > 0 &&
        game.table.every(
            pair =>
                pair.defense
        );

    if (!valid) {
        return;
    }

    showMessage(
        "Бито"
    );

    await sleep(650);

    /*
        Карты уходят из игры.

        Они больше не принадлежат
        ни одному игроку.
    */

    game.table =
        [];

    await refill();

    /*
        После успешной защиты
        атакующий меняется.
    */

    if (
        game.attacker ===
        "player"
    ) {

        game.attacker =
            "cpu";

        game.defender =
            "player";

        game.phase =
            "cpu_attack";

        render();

        await sleep(450);

        await cpuAttack();

    } else {

        game.attacker =
            "player";

        game.defender =
            "cpu";

        game.phase =
            "player_attack";

        render();

        showMessage(
            "Твой ход"
        );
    }
}


/* =====================================================
   CPU ATTACK
===================================================== */

async function cpuAttack() {

    if (
        game.phase !==
        "cpu_attack"
    ) {
        return;
    }

    if (
        game.cpu.length === 0
    ) {

        checkGameOver();

        return;
    }

    await sleep(450);

    let candidates;

    if (
        game.table.length === 0
    ) {

        candidates =
            game.cpu.slice();

    } else {

        const ranks =
            tableRanks();

        candidates =
            game.cpu.filter(
                card =>
                    ranks.includes(
                        card.rank
                    )
            );
    }

    /*
        Если нет подходящей карты
        для подкидывания — атака
        заканчивается.
    */

    if (
        game.table.length > 0 &&
        candidates.length === 0
    ) {

        await successfulDefense();

        return;
    }

    if (
        candidates.length === 0
    ) {

        candidates =
            game.cpu.slice();
    }

    candidates.sort(
        (a,b) => {

            const at =
                isTrump(a);

            const bt =
                isTrump(b);

            if (
                at !== bt
            ) {

                return at
                    ? 1
                    : -1;
            }

            return (
                a.value -
                b.value
            );
        }
    );

    const card =
        candidates[0];

    const index =
        game.cpu.findIndex(
            c =>
                c.id ===
                card.id
        );

    const moving =
        game.cpu.splice(
            index,
            1
        )[0];

    game.table.push({

        attack: moving,

        defense: null

    });

    render();

    showMessage(
        "Компьютер ходит"
    );

    await sleep(400);

    game.phase =
        "player_defense";

    render();
}


/* =====================================================
   REFILL
===================================================== */

async function refill() {

    /*
        Атакующий добирает первым.
    */

    const order =
        game.attacker ===
        "player"
            ? [
                game.player,
                game.cpu
            ]
            : [
                game.cpu,
                game.player
            ];

    for (
        const hand of order
    ) {

        while (
            hand.length < 6 &&
            game.deck.length > 1
        ) {

            const card =
                game.deck.shift();

            hand.push(card);

            render();

            await sleep(65);
        }
    }

    render();

    checkGameOver();
}


/* =====================================================
   CHECK GAME OVER
===================================================== */

function checkGameOver() {

    if (
        game.deck.length > 1
    ) {
        return false;
    }

    const p =
        game.player.length;

    const c =
        game.cpu.length;

    if (
        p === 0 &&
        c === 0
    ) {

        endGame(
            "Ничья"
        );

        return true;
    }

    if (
        p === 0
    ) {

        endGame(
            "Ты победил!"
        );

        return true;
    }

    if (
        c === 0
    ) {

        endGame(
            "Компьютер победил"
        );

        return true;
    }

    return false;
}


/* =====================================================
   END GAME
===================================================== */

function endGame(text) {

    game.phase =
        "finished";

    game.gameOver =
        true;

    render();

    showMessage(
        text
    );

    setTimeout(
        () => {

            if (
                tg &&
                tg.showAlert
            ) {

                tg.showAlert(
                    text
                );

            } else {

                alert(text);
            }

        },
        400
    );
}


/* =====================================================
   CARD INTERACTION
===================================================== */

function setupCardInteraction(
    el,
    card
) {

    let startX = 0;

    let startY = 0;

    let dragging = false;

    let offsetX = 0;

    let offsetY = 0;


    el.addEventListener(
        "pointerdown",
        event => {

            if (
                game.phase !==
                "player_attack" &&
                game.phase !==
                "player_defense"
            ) {
                return;
            }

            startX =
                event.clientX;

            startY =
                event.clientY;

            const rect =
                el.getBoundingClientRect();

            offsetX =
                event.clientX -
                rect.left;

            offsetY =
                event.clientY -
                rect.top;

            game.selected =
                card;

            render();

            /*
                После render старый
                элемент больше не существует.
                Поэтому dragging запускается
                через небольшой собственный
                режим ниже.
            */

            const newEl =
                [...playerHandEl.children]
                    .find(
                        child =>
                            child.dataset.id ===
                            card.id
                    );

            if (
                newEl
            ) {

                newEl.setPointerCapture(
                    event.pointerId
                );

                newEl.classList.add(
                    "selected"
                );
            }
        }
    );


    /*
        Для мобильного drag используем
        pointermove на document.
    */

    el.dataset.id =
        card.id;
}


/* =====================================================
   GLOBAL POINTER DRAG
===================================================== */

let draggingCard = null;

let dragElement = null;

let dragOffsetX = 0;

let dragOffsetY = 0;

document.addEventListener(
    "pointerdown",
    event => {

        const cardEl =
            event.target.closest(
                ".hand-card"
            );

        if (!cardEl) {
            return;
        }

        const id =
            cardEl.dataset.id;

        const card =
            game.player.find(
                c =>
                    c.id === id
            );

        if (!card) {
            return;
        }

        draggingCard =
            card;

        dragElement =
            cardEl;

        const rect =
            cardEl.getBoundingClientRect();

        dragOffsetX =
            event.clientX -
            rect.left;

        dragOffsetY =
            event.clientY -
            rect.top;

        dragElement.setPointerCapture(
            event.pointerId
        );
    }
);


document.addEventListener(
    "pointermove",
    event => {

        if (
            !draggingCard ||
            !dragElement
        ) {
            return;
        }

        const dx =
            Math.abs(
                event.clientX -
                (
                    dragElement
                        .getBoundingClientRect()
                        .left +
                    dragOffsetX
                )
            );

        /*
            При первом движении переводим
            карту в drag-режим.
        */

        dragElement.classList.add(
            "dragging"
        );

        dragElement.style.left =
            `${event.clientX -
                dragOffsetX}px`;

        dragElement.style.top =
            `${event.clientY -
                dragOffsetY}px`;

        dragElement.style.bottom =
            "auto";
    }
);


document.addEventListener(
    "pointerup",
    async event => {

        if (
            !draggingCard ||
            !dragElement
        ) {
            return;
        }

        const card =
            draggingCard;

        const el =
            dragElement;

        const rect =
            playArea.getBoundingClientRect();

        const inside =
            event.clientX >= rect.left &&
            event.clientX <= rect.right &&
            event.clientY >= rect.top &&
            event.clientY <= rect.bottom;

        el.classList.remove(
            "dragging"
        );

        draggingCard =
            null;

        dragElement =
            null;

        if (!inside) {

            game.selected =
                null;

            render();

            return;
        }

        /*
            Карта была перетащена
            в центр стола.
        */

        if (
            game.phase ===
            "player_attack"
        ) {

            await playerAttack(
                card
            );

        } else if (
            game.phase ===
            "player_defense"
        ) {

            await playerDefense(
                card
            );

        }

        game.selected =
            null;

        render();
    }
);


/* =====================================================
   TAP WITHOUT DRAG
===================================================== */

document.addEventListener(
    "click",
    async event => {

        const cardEl =
            event.target.closest(
                ".hand-card"
            );

        if (!cardEl) {
            return;
        }

        const id =
            cardEl.dataset.id;

        const card =
            game.player.find(
                c =>
                    c.id === id
            );

        if (!card) {
            return;
        }

        /*
            Первый тап только выделяет.
            Карта остаётся в руке.

            Второй тап по выделенной карте
            выкладывает её.
        */

        if (
            game.selected &&
            game.selected.id ===
            card.id
        ) {

            if (
                game.phase ===
                "player_attack"
            ) {

                await playerAttack(
                    card
                );

            } else if (
                game.phase ===
                "player_defense"
            ) {

                await playerDefense(
                    card
                );
            }

            game.selected =
                null;

        } else {

            game.selected =
                card;
        }

        render();
    }
);


/* =====================================================
   BUTTONS
===================================================== */

function updateButtons() {

    takeBtn.style.display =
        "none";

    finishBtn.style.display =
        "none";

    endAttackBtn.style.display =
        "none";


    if (
        game.phase ===
        "player_defense"
    ) {

        takeBtn.style.display =
            "block";

        const unfinished =
            game.table.some(
                pair =>
                    !pair.defense
            );

        if (
            !unfinished &&
            game.table.length > 0
        ) {

            finishBtn.style.display =
                "block";
        }
    }


    if (
        game.phase ===
        "player_attack" &&
        game.table.length > 0
    ) {

        endAttackBtn.style.display =
            "block";
    }
}


/* =====================================================
   END PLAYER ATTACK
===================================================== */

endAttackBtn.addEventListener(
    "click",
    async () => {

        if (
            game.phase !==
            "player_attack"
        ) {
            return;
        }

        if (
            game.table.length === 0
        ) {
            return;
        }

        game.phase =
            "cpu_defense";

        render();

        await cpuDefense();
    }
);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function showMessage(text) {

    messageEl.innerText =
        text;

    messageEl.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                messageEl.classList.remove(
                    "show"
                );

            },
            1600
        );
}


/* =====================================================
   START
===================================================== */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        async () => {

            if (
                game.started
            ) {
                return;
            }

            game.started =
                true;

            document
                .getElementById(
                    "startScreen"
                )
                .style.display =
                    "none";

            let name =
                "Игрок";

            if (
                tg &&
                tg.initDataUnsafe &&
                tg.initDataUnsafe.user
            ) {

                name =
                    tg.initDataUnsafe
                        .user
                        .first_name ||
                    tg.initDataUnsafe
                        .user
                        .username ||
                    "Игрок";
            }

            document
                .getElementById(
                    "playerName"
                )
                .innerText =
                    name;

            /*
                Создаём 36 уникальных карт.
            */

            game.deck =
                createDeck();

            /*
                Последняя карта является
                козырем.

                Она НЕ удаляется.

                Поэтому визуально:
                
                [РУБАШКА]
                [РУБАШКА]
                [РУБАШКА]
                   ↓
                [КОЗЫРЬ]

                Козырь остаётся частью
                колоды до момента,
                когда колода закончится.
            */

            game.trump =
                game.deck[
                    game.deck.length - 1
                ].suit;

            render();

            await sleep(250);

            await deal();

            const first =
                findFirstAttacker();

            game.attacker =
                first;

            game.defender =
                first === "player"
                    ? "cpu"
                    : "player";

            if (
                first === "player"
            ) {

                game.phase =
                    "player_attack";

                showMessage(
                    "Твой ход"
                );

            } else {

                game.phase =
                    "cpu_attack";

                showMessage(
                    "Компьютер начинает"
                );

                render();

                await sleep(650);

                await cpuAttack();
            }

            render();
        }
    );


/* =====================================================
   INITIAL RENDER
===================================================== */

render();

</script>

</body>
</html>

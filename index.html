<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Heavy Lux Card</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0b0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 18px;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-size: 28px;
            letter-spacing: 4px;
            font-weight: 800;
        }

        .logo p {
            margin-top: 5px;
            font-size: 11px;
            letter-spacing: 5px;
            color: #888;
        }

        .balance {
            background: #151519;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 22px;
            text-align: center;
            margin-bottom: 18px;
        }

        .balance-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance-value {
            font-size: 32px;
            font-weight: 800;
        }

        .currency {
            font-size: 16px;
            color: #aaa;
            margin-left: 5px;
        }

        .level {
            background: #151519;
            border: 1px solid #29292f;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .level-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .level-title {
            font-weight: 700;
        }

        .xp {
            color: #888;
            font-size: 13px;
        }

        .progress {
            width: 100%;
            height: 7px;
            background: #29292f;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
        }

        .play {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 18px;
            background: #ffffff;
            color: #000000;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-button {
            background: #151519;
            border: 1px solid #29292f;
            color: #ffffff;
            border-radius: 15px;
            padding: 18px 10px;
            text-align: center;
            font-size: 14px;
        }

        .motors {
            grid-column: span 2;
            border: 1px solid #444;
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 10px;
            margin-top: 30px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">
        <h1>HEAVY LUX</h1>
        <p>CARD</p>
    </div>

    <div class="balance">
        <div class="balance-label">Баланс</div>
        <div class="balance-value">
            5 000 <span class="currency">HC</span>
        </div>
    </div>

    <div class="level">

        <div class="level-top">
            <div class="level-title">Уровень 1</div>
            <div class="xp">0 / 1 000 XP</div>
        </div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

    </div>

    <button class="play">
        ИГРАТЬ
    </button>

    <div class="menu">

        <div class="menu-button">
            👤<br>
            Профиль
        </div>

        <div class="menu-button">
            🏆<br>
            Рейтинг
        </div>

        <div class="menu-button">
            🏢<br>
            Бизнес
        </div>

        <div class="menu-button">
            🏠<br>
            Недвижимость
        </div>

        <div class="menu-button motors">
            🚘<br>
            HEAVY MOTORS
        </div>

    </div>

    <div class="footer">
        HEAVY LUX CARD
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

body {
    min-height: 100vh;
}

button {
    font-family: inherit;
}

/* =====================================================
   APP
===================================================== */

#app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            #151515 0%,
            #090909 48%,
            #030303 100%
        );
}

/* =====================================================
   TOP
===================================================== */

.topbar {
    position: absolute;
    top: env(safe-area-inset-top, 0);
    left: 0;
    right: 0;
    height: 62px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 300;
}

.logo {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 3px;
}

.info {
    display: flex;
    gap: 7px;
}

.info-item {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    padding: 6px 9px;
    font-size: 10px;
    color: #8c8c8c;
}

.info-item b {
    color: #fff;
}

/* =====================================================
   TABLE
===================================================== */

.table {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 94vw;
    height: 68vh;
    transform: translate(-50%, -50%);
    overflow: visible;
}

/*
   Никакой границы стола.
   Только лёгкое затемнение центра.
*/

.table::after {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.035),
            rgba(0,0,0,0) 70%
        );
    pointer-events: none;
}

/* =====================================================
   DECK
===================================================== */

.deck-area {
    position: absolute;
    left: 3%;
    top: 50%;
    width: 115px;
    height: 125px;
    transform: translateY(-50%);
    z-index: 40;
}

.deck {
    position: absolute;
    left: 0;
    top: 18px;
    width: 68px;
    height: 96px;
    transform: rotate(-5deg);
    z-index: 5;
}

.deck-layer {
    position: absolute;
    inset: 0;
    border-radius: 9px;
    background:
        repeating-linear-gradient(
            45deg,
            #080808 0,
            #080808 5px,
            #252525 5px,
            #252525 10px
        );
    border: 1px solid #777;
    box-shadow: 0 8px 20px rgba(0,0,0,.55);
}

.deck-layer:nth-child(1) {
    transform: translate(-6px,-5px);
}

.deck-layer:nth-child(2) {
    transform: translate(-3px,-2px);
}

.deck-layer:nth-child(3) {
    transform: translate(0,0);
}

/* =====================================================
   TRUMP UNDER DECK
===================================================== */

.trump-under {
    position: absolute;
    left: 38px;
    top: 26px;
    width: 68px;
    height: 96px;
    transform: rotate(73deg);
    z-index: 1;
}

.trump-under .card-face {
    width: 100%;
    height: 100%;
}

/* =====================================================
   CARD
===================================================== */

.card {
    width: 68px;
    height: 96px;
    border-radius: 9px;
    position: absolute;
    background: #f5f5f5;
    color: #050505;
    border: 1px solid #bcbcbc;
    box-shadow:
        0 8px 18px rgba(0,0,0,.5),
        inset 0 0 0 1px rgba(0,0,0,.08);
    overflow: hidden;
    font-weight: 900;
}

.card.red {
    color: #111;
}

.card-face {
    position: relative;
    width: 100%;
    height: 100%;
}

.rank {
    position: absolute;
    left: 7px;
    top: 5px;
    font-size: 17px;
}

.suit {
    position: absolute;
    left: 8px;
    top: 27px;
    font-size: 15px;
}

.center-suit {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%,-50%);
    font-size: 31px;
}

.corner {
    position: absolute;
    right: 6px;
    bottom: 5px;
    transform: rotate(180deg);
    font-size: 12px;
}

/* =====================================================
   CARD BACK
===================================================== */

.card-back {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 9px;
    overflow: hidden;
    background:
        linear-gradient(
            45deg,
            transparent 45%,
            #777 46%,
            #777 49%,
            transparent 50%
        ),
        linear-gradient(
            -45deg,
            transparent 45%,
            #777 46%,
            #777 49%,
            transparent 50%
        ),
        #080808;
    border: 1px solid #aaa;
}

.card-back::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid #aaa;
    transform: rotate(45deg);
}

.card-back::after {
    content: "HL";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    font-size: 19px;
    letter-spacing: 2px;
    color: #fff;
    background: #080808;
    padding: 4px;
}

/* =====================================================
   OPPONENT
===================================================== */

.opponent {
    position: absolute;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 200;
}

.opponent-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #111;
    border: 1px solid #666;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.opponent-name {
    margin-top: 5px;
    font-size: 12px;
    font-weight: 800;
}

.opponent-count {
    margin-top: 3px;
    font-size: 10px;
    color: #888;
}

/* =====================================================
   OPPONENT HAND
===================================================== */

.opponent-hand {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 350px;
    height: 105px;
    transform: translateX(-50%);
    z-index: 120;
}

/* =====================================================
   CENTER PLAY AREA
===================================================== */

.play-area {
    position: absolute;
    left: 50%;
    top: 51%;
    width: min(75vw, 430px);
    height: 230px;
    transform: translate(-50%,-50%);
    z-index: 100;
}

/* =====================================================
   ATTACK / DEFENSE
===================================================== */

.attack-zone,
.defense-zone {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%,-50%);
}

.played-card {
    position: absolute;
    width: 68px;
    height: 96px;
    transition:
        left .34s cubic-bezier(.2,.8,.2,1),
        top .34s cubic-bezier(.2,.8,.2,1),
        transform .34s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;
}

/* =====================================================
   PLAYER
===================================================== */

.player-info {
    position: absolute;
    bottom: 118px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 300;
}

.player-name {
    font-size: 13px;
    font-weight: 900;
}

.player-count {
    margin-top: 3px;
    font-size: 10px;
    color: #888;
}

/* =====================================================
   PLAYER HAND
===================================================== */

.hand {
    position: absolute;
    left: 50%;
    bottom: 2px;
    width: 100%;
    height: 135px;
    transform: translateX(-50%);
    z-index: 500;
    pointer-events: none;
}

.hand .card {
    pointer-events: auto;
    transform-origin: center bottom;
    transition:
        left .25s ease,
        transform .25s ease,
        bottom .25s ease;
}

/* =====================================================
   DRAGGING
===================================================== */

.card.dragging {
    position: fixed !important;
    z-index: 2000 !important;
    transition: none !important;
    transform:
        translate(-50%,-50%)
        scale(1.08)
        rotate(0deg) !important;
    box-shadow:
        0 25px 45px rgba(0,0,0,.8);
    pointer-events: none;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls {
    position: absolute;
    left: 50%;
    bottom: 73px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 700;
}

.control {
    min-width: 95px;
    border-radius: 12px;
    padding: 11px 15px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
}

.control.primary {
    background: #fff;
    color: #000;
    border-color: #fff;
}

.control.danger {
    background: #191919;
}

.control:active {
    transform: scale(.96);
}

/* =====================================================
   MESSAGE
===================================================== */

.message {
    position: absolute;
    top: 122px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 13px;
    border-radius: 10px;
    background: rgba(0,0,0,.82);
    border: 1px solid #292929;
    color: #ccc;
    font-size: 10px;
    opacity: 0;
    transition: opacity .25s ease;
    z-index: 800;
    white-space: nowrap;
}

.message.show {
    opacity: 1;
}

/* =====================================================
   START
===================================================== */

.start-screen {
    position: absolute;
    inset: 0;
    z-index: 1000;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
}

.start-box {
    width: 82%;
    max-width: 340px;
    text-align: center;
}

.start-logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 6px;
}

.start-sub {
    margin-top: 8px;
    color: #777;
    font-size: 10px;
    letter-spacing: 4px;
}

.start-button {
    width: 100%;
    margin-top: 30px;
    padding: 17px;
    border: 0;
    border-radius: 13px;
    background: #fff;
    color: #000;
    font-weight: 900;
    font-size: 14px;
}

/* =====================================================
   DEAL ANIMATION
===================================================== */

.deal-animation {
    animation:
        dealCard .22s cubic-bezier(.2,.8,.2,1);
}

@keyframes dealCard {
    0% {
        opacity: 0;
        transform:
            translateY(70px)
            scale(.65)
            rotate(-10deg);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1)
            rotate(0);
    }
}

/* =====================================================
   PLAY ANIMATION
===================================================== */

.play-animation {
    animation:
        playCard .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes playCard {
    0% {
        opacity: 0;
        transform:
            scale(.55)
            rotate(-12deg);
    }

    100% {
        opacity: 1;
        transform:
            scale(1)
            rotate(0);
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 390px) {

    .card,
    .played-card {
        width: 62px;
        height: 88px;
    }

    .opponent-hand {
        width: 320px;
    }

    .play-area {
        width: 78vw;
        height: 210px;
    }

    .deck-area {
        left: 1%;
    }

    .player-info {
        bottom: 112px;
    }

    .controls {
        bottom: 66px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- TOP -->

    <div class="topbar">

        <div class="logo">
            HEAVY LUX CARD
        </div>

        <div class="info">

            <div class="info-item">
                Козырь:
                <b id="trumpInfo">—</b>
            </div>

            <div class="info-item">
                Колода:
                <b id="deckCount">0</b>
            </div>

        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message" class="message">
        Подготовка...
    </div>


    <!-- OPPONENT -->

    <div class="opponent">

        <div class="opponent-avatar">
            HL
        </div>

        <div class="opponent-name">
            Heavy AI
        </div>

        <div class="opponent-count">
            Карт:
            <b id="opponentCount">0</b>
        </div>

    </div>

    <div
        id="opponentHand"
        class="opponent-hand">
    </div>


    <!-- TABLE -->

    <div class="table">

        <!-- DECK -->

        <div class="deck-area">

            <div
                id="trumpCard"
                class="trump-under">
            </div>

            <div
                id="deck"
                class="deck">

                <div class="deck-layer"></div>
                <div class="deck-layer"></div>
                <div class="deck-layer"></div>

            </div>

        </div>


        <!-- CENTER -->

        <div class="play-area">

            <div
                id="attackZone"
                class="attack-zone">
            </div>

            <div
                id="defenseZone"
                class="defense-zone">
            </div>

        </div>

    </div>


    <!-- PLAYER -->

    <div class="player-info">

        <div
            id="playerName"
            class="player-name">
            Игрок
        </div>

        <div class="player-count">
            Карт:
            <b id="playerCount">0</b>
        </div>

    </div>

    <div
        id="playerHand"
        class="hand">
    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="takeButton"
            class="control danger"
            style="display:none">
            ВЗЯТЬ
        </button>

        <button
            id="beatButton"
            class="control primary"
            style="display:none">
            БИТО
        </button>

        <button
            id="finishButton"
            class="control"
            style="display:none">
            ЗАКОНЧИТЬ
        </button>

    </div>


    <!-- START -->

    <div
        id="startScreen"
        class="start-screen">

        <div class="start-box">

            <div class="start-logo">
                HEAVY LUX
            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

            <button
                id="startButton"
                class="start-button">
                НАЧАТЬ ИГРУ
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================================
   CONSTANTS
===================================================== */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [
    ["6",6],
    ["7",7],
    ["8",8],
    ["9",9],
    ["10",10],
    ["В",11],
    ["Д",12],
    ["К",13],
    ["Т",14]
];


/* =====================================================
   STATE
===================================================== */

let deck = [];

let trumpSuit = null;
let trumpCard = null;

let playerHand = [];
let cpuHand = [];

let attackCards = [];
let defenseCards = [];

let attacker = null;
let defender = null;

let phase = "waiting";

let defenderInitialCount = 6;

let gameStarted = false;

let draggedCard = null;


/* =====================================================
   DOM
===================================================== */

const playerHandEl =
    document.getElementById("playerHand");

const opponentHandEl =
    document.getElementById("opponentHand");

const attackZone =
    document.getElementById("attackZone");

const defenseZone =
    document.getElementById("defenseZone");

const trumpCardEl =
    document.getElementById("trumpCard");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const takeButton =
    document.getElementById("takeButton");

const beatButton =
    document.getElementById("beatButton");

const finishButton =
    document.getElementById("finishButton");

const messageEl =
    document.getElementById("message");


/* =====================================================
   HELPERS
===================================================== */

function sleep(ms) {
    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


function isRed(card) {

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


function cardKey(card) {

    return `${card.rank}_${card.suit}`;
}


/* =====================================================
   CREATE DECK
===================================================== */

function createDeck() {

    const result = [];

    for (const suit of SUITS) {

        for (const [rank,value] of RANKS) {

            result.push({
                id:
                    `${rank}${suit}_${Math.random()
                        .toString(36)
                        .slice(2)}`,

                rank,
                value,
                suit
            });
        }
    }

    return shuffle(result);
}


/* =====================================================
   CARD HTML
===================================================== */

function createCard(card) {

    const el =
        document.createElement("div");

    el.className =
        "card" +
        (isRed(card) ? " red" : "");

    el.dataset.id =
        card.id;

    el.innerHTML = `

        <div class="card-face">

            <div class="rank">
                ${card.rank}
            </div>

            <div class="suit">
                ${card.suit}
            </div>

            <div class="center-suit">
                ${card.suit}
            </div>

            <div class="corner">
                ${card.rank}${card.suit}
            </div>

        </div>
    `;

    return el;
}


function createBack() {

    const el =
        document.createElement("div");

    el.className =
        "card";

    el.innerHTML = `
        <div class="card-back"></div>
    `;

    return el;
}


/* =====================================================
   TRUMP
===================================================== */

function setupTrump() {

    /*
       Последняя карта остаётся
       частью колоды и физически
       находится под ней.
    */

    trumpCard =
        deck[deck.length - 1];

    trumpSuit =
        trumpCard.suit;

    const el =
        createCard(trumpCard);

    el.classList.add(
        "trump-under"
    );

    trumpCardEl.innerHTML = "";

    trumpCardEl.appendChild(el);

    updateInfo();
}


/* =====================================================
   SORT
===================================================== */

function sortHand(hand) {

    hand.sort((a,b) => {

        const at =
            a.suit === trumpSuit;

        const bt =
            b.suit === trumpSuit;

        if (at && !bt) return 1;
        if (!at && bt) return -1;

        return a.value - b.value;
    });
}


/* =====================================================
   RENDER HANDS
===================================================== */

function renderHands() {

    sortHand(playerHand);

    playerHandEl.innerHTML = "";

    const count =
        playerHand.length;

    const spacing =
        count > 8 ? 42 : 48;

    playerHand.forEach(
        (card,index) => {

            const el =
                createCard(card);

            const center =
                (count - 1) / 2;

            const x =
                (index - center)
                * spacing;

            el.style.left =
                `calc(50% + ${x}px - 34px)`;

            el.style.bottom =
                "0px";

            el.style.transform =
                `rotate(${(index-center)*2.5}deg)`;

            addDragEvents(
                el,
                card
            );

            playerHandEl.appendChild(el);
        }
    );


    /* CPU HAND */

    opponentHandEl.innerHTML = "";

    const cpuCount =
        cpuHand.length;

    const cpuSpacing =
        cpuCount > 8 ? 35 : 40;

    cpuHand.forEach(
        (card,index) => {

            const el =
                createBack();

            const center =
                (cpuCount - 1) / 2;

            const x =
                (index-center)
                * cpuSpacing;

            el.style.left =
                `calc(50% + ${x}px - 34px)`;

            el.style.top =
                `${Math.abs(index-center)*1.2}px`;

            el.style.transform =
                `rotate(${(index-center)*2.2}deg)`;

            opponentHandEl.appendChild(el);
        }
    );

    updateInfo();
}


/* =====================================================
   INFO
===================================================== */

function updateInfo() {

    document.getElementById(
        "deckCount"
    ).textContent =
        Math.max(
            0,
            deck.length - 1
        );

    document.getElementById(
        "trumpInfo"
    ).textContent =
        trumpSuit || "—";

    document.getElementById(
        "playerCount"
    ).textContent =
        playerHand.length;

    document.getElementById(
        "opponentCount"
    ).textContent =
        cpuHand.length;
}


/* =====================================================
   CAN BEAT
===================================================== */

function canBeat(
    attack,
    defense
) {

    if (!attack || !defense)
        return false;

    const attackTrump =
        attack.suit === trumpSuit;

    const defenseTrump =
        defense.suit === trumpSuit;

    if (
        defenseTrump &&
        !attackTrump
    ) {
        return true;
    }

    if (
        attackTrump &&
        !defenseTrump
    ) {
        return false;
    }

    return (
        attack.suit === defense.suit &&
        defense.value > attack.value
    );
}


/* =====================================================
   TABLE RANKS
===================================================== */

function tableRanks() {

    return [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ].map(
        card => card.rank
    );
}


/* =====================================================
   CAN ATTACK
===================================================== */

function canAttack(card) {

    if (!card)
        return false;

    if (
        attackCards.length === 0
    ) {
        return true;
    }

    return tableRanks()
        .includes(card.rank);
}


/* =====================================================
   PLAYER DRAG
===================================================== */

function addDragEvents(
    el,
    card
) {

    let startX = 0;
    let startY = 0;
    let moved = false;

    el.addEventListener(
        "pointerdown",
        event => {

            if (
                phase !== "PLAYER_ATTACK" &&
                phase !== "PLAYER_DEFENSE"
            ) {
                return;
            }

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved = false;

            draggedCard = {
                card,
                el
            };

            const rect =
                el.getBoundingClientRect();

            el.setPointerCapture(
                event.pointerId
            );

            el.classList.add(
                "dragging"
            );

            el.style.left =
                `${event.clientX -
                    rect.width / 2}px`;

            el.style.top =
                `${event.clientY -
                    rect.height / 2}px`;

            el.style.bottom =
                "auto";
        }
    );


    el.addEventListener(
        "pointermove",
        event => {

            if (
                !draggedCard ||
                draggedCard.el !== el
            ) {
                return;
            }

            if (
                Math.abs(
                    event.clientX - startX
                ) > 6 ||
                Math.abs(
                    event.clientY - startY
                ) > 6
            ) {
                moved = true;
            }

            el.style.left =
                `${event.clientX -
                    el.offsetWidth / 2}px`;

            el.style.top =
                `${event.clientY -
                    el.offsetHeight / 2}px`;
        }
    );


    el.addEventListener(
        "pointerup",
        async event => {

            if (
                !draggedCard ||
                draggedCard.el !== el
            ) {
                return;
            }

            const current =
                draggedCard;

            draggedCard = null;

            el.classList.remove(
                "dragging"
            );

            if (!moved) {

                renderHands();

                return;
            }

            const zone =
                document
                    .querySelector(".play-area")
                    .getBoundingClientRect();

            const inside =
                event.clientX >= zone.left &&
                event.clientX <= zone.right &&
                event.clientY >= zone.top &&
                event.clientY <= zone.bottom;

            if (!inside) {

                renderHands();

                return;
            }

            await playerPlayCard(
                current.card
            );
        }
    );


    el.addEventListener(
        "pointercancel",
        () => {

            draggedCard = null;

            renderHands();
        }
    );
}


/* =====================================================
   PLAYER PLAY CARD
===================================================== */

async function playerPlayCard(card) {

    if (
        phase === "PLAYER_ATTACK"
    ) {

        if (
            !canAttack(card)
        ) {

            showMessage(
                "Эту карту нельзя подкинуть"
            );

            renderHands();

            return;
        }

        if (
            attackCards.length >=
            defenderInitialCount
        ) {

            showMessage(
                "Больше подкидывать нельзя"
            );

            renderHands();

            return;
        }

        removePlayer(card);

        attackCards.push(card);

        await animateToTable(
            card,
            attackCards.length - 1,
            false
        );

        renderHands();

        /*
           Важно:

           после первой/следующей
           атаки компьютер защищается.

           После успешной защиты
           управление вернётся игроку.
        */

        phase =
            "CPU_DEFENSE";

        updateButtons();

        showMessage(
            "Компьютер отбивается"
        );

        await sleep(450);

        await cpuDefense();

        return;
    }


    if (
        phase === "PLAYER_DEFENSE"
    ) {

        const index =
            nextUnbeaten();

        if (index === -1) {
            return;
        }

        const target =
            attackCards[index];

        if (
            !canBeat(
                target,
                card
            )
        ) {

            showMessage(
                "Этой картой побить нельзя"
            );

            renderHands();

            return;
        }

        removePlayer(card);

        defenseCards[index] =
            card;

        await animateToTable(
            card,
            index,
            true
        );

        renderHands();

        /*
           После твоей защиты
           компьютер имеет право
           решить, подкидывать ли ему.
        */

        await sleep(400);

        await cpuCanAddAfterDefense();
    }
}


/* =====================================================
   REMOVE PLAYER
===================================================== */

function removePlayer(card) {

    playerHand =
        playerHand.filter(
            c => c.id !== card.id
        );
}


/* =====================================================
   NEXT UNBEATEN
===================================================== */

function nextUnbeaten() {

    for (
        let i = 0;
        i < attackCards.length;
        i++
    ) {

        if (
            !defenseCards[i]
        ) {
            return i;
        }
    }

    return -1;
}


/* =====================================================
   ANIMATE TO TABLE
===================================================== */

async function animateToTable(
    card,
    index,
    defense
) {

    const zone =
        defense
            ? defenseZone
            : attackZone;

    const el =
        createCard(card);

    el.classList.add(
        "played-card",
        "play-animation"
    );

    const pos =
        tablePosition(
            index,
            defense
        );

    el.style.left =
        `${pos.x}px`;

    el.style.top =
        `${pos.y}px`;

    el.style.opacity =
        "0";

    zone.appendChild(el);

    await sleep(30);

    el.style.opacity =
        "1";

    await sleep(320);
}


/* =====================================================
   TABLE POSITION
===================================================== */

function tablePosition(
    index,
    defense
) {

    const columns = 4;

    const cardW = 68;

    const gap = 14;

    const total =
        columns * cardW +
        (columns - 1) * gap;

    const start =
        (430 - total) / 2;

    const col =
        index % columns;

    const row =
        Math.floor(index / columns);

    return {
        x:
            start +
            col *
            (cardW + gap) +
            (defense ? 22 : 0),

        y:
            52 +
            row * 18 +
            (defense ? -25 : 0)
    };
}


/* =====================================================
   CPU DEFENSE
===================================================== */

async function cpuDefense() {

    if (
        phase !== "CPU_DEFENSE"
    ) {
        return;
    }

    const index =
        nextUnbeaten();

    /*
       Все карты отбиты.

       Теперь не надо сразу
       завершать весь раунд.

       Управление возвращается
       игроку.
    */

    if (index === -1) {

        phase =
            "PLAYER_ATTACK";

        updateButtons();

        showMessage(
            "Твой ход — можешь подкинуть или закончить"
        );

        return;
    }

    const target =
        attackCards[index];

    /*
       Ищем минимальную карту,
       способную побить.
    */

    const options =
        cpuHand
            .filter(
                card =>
                    canBeat(
                        target,
                        card
                    )
            )
            .sort(
                (a,b) =>
                    strength(a) -
                    strength(b)
            );

    /*
       Не смог отбиться.
    */

    if (
        options.length === 0
    ) {

        await sleep(600);

        await cpuTake();

        return;
    }

    await sleep(600);

    const card =
        chooseDefense(options);

    cpuHand =
        cpuHand.filter(
            c => c.id !== card.id
        );

    defenseCards[index] =
        card;

    await animateToTable(
        card,
        index,
        true
    );

    renderHands();

    await sleep(400);

    /*
       После успешной защиты
       компьютер НЕ решает,
       закончен ли ход игрока.

       Игрок получает управление.
    */

    if (
        nextUnbeaten() === -1
    ) {

        phase =
            "PLAYER_ATTACK";

        updateButtons();

        showMessage(
            "Твоя атака: подкинь или закончи"
        );

    } else {

        phase =
            "CPU_DEFENSE";

        await cpuDefense();
    }
}


/* =====================================================
   CPU DEFENSE CHOICE
===================================================== */

function chooseDefense(options) {

    /*
       Сначала некозырная,
       затем минимальная по силе.
    */

    return options
        .slice()
        .sort(
            (a,b) => {

                const at =
                    a.suit === trumpSuit;

                const bt =
                    b.suit === trumpSuit;

                if (at !== bt)
                    return at ? 1 : -1;

                return (
                    strength(a) -
                    strength(b)
                );
            }
        )[0];
}


function strength(card) {

    return (
        (card.suit === trumpSuit
            ? 100
            : 0)
        + card.value
    );
}


/* =====================================================
   CPU ADD AFTER PLAYER DEFENSE
===================================================== */

async function cpuCanAddAfterDefense() {

    /*
       Сейчас атака принадлежит
       компьютеру только если
       компьютер изначально атаковал.

       Если компьютер атаковал,
       после твоей защиты он
       может подкинуть.
    */

    if (
        attacker !== "cpu"
    ) {

        /*
           Здесь компьютер не должен
           вмешиваться.

           Игрок сам продолжает
           свою атаку.
        */

        phase =
            "PLAYER_ATTACK";

        updateButtons();

        return;
    }

    const candidates =
        getCpuAddCandidates();

    if (
        candidates.length === 0 ||
        attackCards.length >=
            defenderInitialCount
    ) {

        await finishRound();

        return;
    }

    /*
       AI принимает решение.

       Он видит свою руку,
       но НЕ видит руку игрока.
    */

    const card =
        chooseAttack(candidates);

    await sleep(500);

    cpuHand =
        cpuHand.filter(
            c => c.id !== card.id
        );

    attackCards.push(card);

    await animateToTable(
        card,
        attackCards.length - 1,
        false
    );

    renderHands();

    /*
       Теперь игрок снова защищается.
    */

    phase =
        "PLAYER_DEFENSE";

    updateButtons();

    showMessage(
        "Компьютер подкинул"
    );
}


/* =====================================================
   CPU ADD CANDIDATES
===================================================== */

function getCpuAddCandidates() {

    const ranks =
        tableRanks();

    return cpuHand.filter(
        card =>
            ranks.includes(
                card.rank
            )
    );
}


/* =====================================================
   CPU ATTACK
===================================================== */

async function cpuStartAttack() {

    if (
        phase !== "CPU_ATTACK"
    ) {
        return;
    }

    if (
        cpuHand.length === 0
    ) {

        endGame();

        return;
    }

    await sleep(650);

    const card =
        chooseOpeningAttack();

    cpuHand =
        cpuHand.filter(
            c => c.id !== card.id
        );

    attackCards.push(card);

    await animateToTable(
        card,
        0,
        false
    );

    renderHands();

    phase =
        "PLAYER_DEFENSE";

    updateButtons();

    showMessage(
        "Твоя защита"
    );
}


/* =====================================================
   CPU OPENING ATTACK
===================================================== */

function chooseOpeningAttack() {

    /*
       Избавляемся от слабой
       некозырной карты.

       Козыри бережём.
    */

    return cpuHand
        .slice()
        .sort(
            (a,b) => {

                const at =
                    a.suit === trumpSuit;

                const bt =
                    b.suit === trumpSuit;

                if (at !== bt)
                    return at ? 1 : -1;

                return (
                    a.value -
                    b.value
                );
            }
        )[0];
}


/* =====================================================
   CPU ATTACK CHOICE
===================================================== */

function chooseAttack(
    candidates
) {

    return candidates
        .slice()
        .sort(
            (a,b) => {

                const at =
                    a.suit === trumpSuit;

                const bt =
                    b.suit === trumpSuit;

                if (at !== bt)
                    return at ? 1 : -1;

                return (
                    a.value -
                    b.value
                );
            }
        )[0];
}


/* =====================================================
   CPU TAKE
===================================================== */

async function cpuTake() {

    showMessage(
        "Компьютер берёт карты"
    );

    await sleep(700);

    cpuHand.push(
        ...attackCards,
        ...defenseCards.filter(Boolean)
    );

    clearTable();

    /*
       После взятия атакующий
       остаётся атакующим.
    */

    await refill();

    renderHands();

    if (
        checkGameOver()
    ) {
        return;
    }

    phase =
        "CPU_ATTACK";

    attacker =
        "cpu";

    defender =
        "player";

    defenderInitialCount =
        playerHand.length;

    updateButtons();

    await cpuStartAttack();
}


/* =====================================================
   PLAYER TAKE
===================================================== */

async function playerTake() {

    if (
        phase !== "PLAYER_DEFENSE"
    ) {
        return;
    }

    playerHand.push(
        ...attackCards,
        ...defenseCards.filter(Boolean)
    );

    clearTable();

    showMessage(
        "Ты забрал карты"
    );

    await sleep(450);

    /*
       Атакующий добирает первым.
    */

    await refill();

    renderHands();

    if (
        checkGameOver()
    ) {
        return;
    }

    /*
       Атакующий продолжает.
    */

    if (
        attacker === "cpu"
    ) {

        phase =
            "CPU_ATTACK";

        defender =
            "player";

        defenderInitialCount =
            playerHand.length;

        updateButtons();

        await cpuStartAttack();

    } else {

        phase =
            "PLAYER_ATTACK";

        defender =
            "cpu";

        defenderInitialCount =
            cpuHand.length;

        updateButtons();

        showMessage(
            "Твой ход"
        );
    }
}


/* =====================================================
   FINISH ROUND
===================================================== */

async function finishRound() {

    showMessage(
        "Бито"
    );

    await sleep(600);

    clearTable();

    await refill();

    renderHands();

    if (
        checkGameOver()
    ) {
        return;
    }

    /*
       После успешной защиты
       атакующий меняется.
    */

    if (
        attacker === "player"
    ) {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "CPU_ATTACK";

        defenderInitialCount =
            playerHand.length;

        updateButtons();

        await cpuStartAttack();

    } else {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "PLAYER_ATTACK";

        defenderInitialCount =
            cpuHand.length;

        updateButtons();

        showMessage(
            "Твой ход"
        );
    }
}


/* =====================================================
   CLEAR TABLE
===================================================== */

function clearTable() {

    attackCards = [];
    defenseCards = [];

    attackZone.innerHTML = "";
    defenseZone.innerHTML = "";
}


/* =====================================================
   REFILL
===================================================== */

async function refill() {

    const first =
        attacker === "player"
            ? playerHand
            : cpuHand;

    const second =
        attacker === "player"
            ? cpuHand
            : playerHand;

    for (
        const hand of [
            first,
            second
        ]
    ) {

        while (
            hand.length < 6 &&
            deck.length > 1
        ) {

            const card =
                deck.shift();

            hand.push(card);

            renderHands();

            await sleep(70);
        }
    }

    /*
       Если осталась только
       козырная карта под колодой,
       она больше не раздаётся.
    */

    updateInfo();
}


/* =====================================================
   BUTTONS
===================================================== */

function updateButtons() {

    takeButton.style.display =
        "none";

    beatButton.style.display =
        "none";

    finishButton.style.display =
        "none";

    /*
       Защищаемся.
    */

    if (
        phase === "PLAYER_DEFENSE"
    ) {

        takeButton.style.display =
            "block";

        /*
           БИТО появляется только
           если все карты побиты.
        */

        if (
            nextUnbeaten() === -1
        ) {

            beatButton.style.display =
                "block";
        }
    }

    /*
       Игрок атакует.

       После хотя бы одной карты
       он может завершить атаку.
    */

    if (
        phase === "PLAYER_ATTACK" &&
        attackCards.length > 0
    ) {

        finishButton.style.display =
            "block";
    }
}


/* =====================================================
   FINISH BUTTON
===================================================== */

finishButton.addEventListener(
    "click",
    async () => {

        if (
            phase !== "PLAYER_ATTACK"
        ) {
            return;
        }

        if (
            attackCards.length === 0
        ) {
            return;
        }

        /*
           Игрок сам закончил
           свою атаку.

           Теперь компьютер
           должен завершить защиту.
        */

        phase =
            "CPU_DEFENSE";

        updateButtons();

        showMessage(
            "Компьютер отбивается"
        );

        await cpuDefense();
    }
);


/* =====================================================
   BEAT BUTTON
===================================================== */

beatButton.addEventListener(
    "click",
    async () => {

        if (
            phase !== "PLAYER_DEFENSE"
        ) {
            return;
        }

        if (
            nextUnbeaten() !== -1
        ) {

            showMessage(
                "Есть карта, которую нужно отбить"
            );

            return;
        }

        /*
           Если компьютер атаковал,
           именно здесь игрок говорит:
           "всё, бито".
        */

        await finishRound();
    }
);


/* =====================================================
   TAKE BUTTON
===================================================== */

takeButton.addEventListener(
    "click",
    async () => {

        await playerTake();
    }
);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;

function showMessage(text) {

    messageEl.textContent =
        text;

    messageEl.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                messageEl.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =====================================================
   CHECK GAME OVER
===================================================== */

function checkGameOver() {

    /*
       Игра заканчивается только
       после завершения раунда /
       добора.
    */

    if (
        playerHand.length === 0 &&
        cpuHand.length === 0
    ) {

        endGame(
            "Ничья"
        );

        return true;
    }

    if (
        playerHand.length === 0 &&
        deck.length <= 1
    ) {

        endGame(
            "Ты победил"
        );

        return true;
    }

    if (
        cpuHand.length === 0 &&
        deck.length <= 1
    ) {

        endGame(
            "Ты проиграл"
        );

        return true;
    }

    return false;
}


/* =====================================================
   END GAME
===================================================== */

function endGame(text) {

    phase =
        "GAME_OVER";

    updateButtons();

    showMessage(text);

    setTimeout(
        () => {

            if (tg) {
                tg.showAlert(text);
            } else {
                alert(text);
            }

        },
        500
    );
}


/* =====================================================
   DEAL
===================================================== */

async function dealInitialCards() {

    playerHand = [];
    cpuHand = [];

    renderHands();

    /*
       Карты раздаются по одной:
       игрок → компьютер.
    */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        if (
            deck.length <= 1
        ) {
            break;
        }

        playerHand.push(
            deck.shift()
        );

        renderHands();

        await sleep(90);

        if (
            deck.length <= 1
        ) {
            break;
        }

        cpuHand.push(
            deck.shift()
        );

        renderHands();

        await sleep(90);
    }

    updateInfo();
}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    async () => {

        if (gameStarted)
            return;

        gameStarted = true;

        startScreen.style.display =
            "none";

        let playerName =
            "Игрок";

        if (
            tg &&
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ) {

            playerName =
                tg.initDataUnsafe.user.first_name ||
                tg.initDataUnsafe.user.username ||
                "Игрок";
        }

        document.getElementById(
            "playerName"
        ).textContent =
            playerName;

        deck =
            createDeck();

        setupTrump();

        await dealInitialCards();

        /*
           Определяем младший козырь.
        */

        const pTrump =
            playerHand
                .filter(
                    c =>
                        c.suit === trumpSuit
                )
                .sort(
                    (a,b) =>
                        a.value -
                        b.value
                )[0];

        const cTrump =
            cpuHand
                .filter(
                    c =>
                        c.suit === trumpSuit
                )
                .sort(
                    (a,b) =>
                        a.value -
                        b.value
                )[0];

        let playerStarts;

        if (
            pTrump &&
            cTrump
        ) {

            playerStarts =
                pTrump.value <
                cTrump.value;

        } else if (pTrump) {

            playerStarts = true;

        } else if (cTrump) {

            playerStarts = false;

        } else {

            const pMin =
                Math.min(
                    ...playerHand.map(
                        c => c.value
                    )
                );

            const cMin =
                Math.min(
                    ...cpuHand.map(
                        c => c.value
                    )
                );

            playerStarts =
                pMin <= cMin;
        }

        if (
            playerStarts
        ) {

            attacker =
                "player";

            defender =
                "cpu";

            phase =
                "PLAYER_ATTACK";

            defenderInitialCount =
                cpuHand.length;

            showMessage(
                "Твой ход"
            );

        } else {

            attacker =
                "cpu";

            defender =
                "player";

            phase =
                "CPU_ATTACK";

            defenderInitialCount =
                playerHand.length;

            showMessage(
                "Компьютер начинает"
            );

            await sleep(800);

            await cpuStartAttack();
        }

        updateButtons();
        updateInfo();
    }
);


/* =====================================================
   INITIAL
===================================================== */

updateInfo();

</script>

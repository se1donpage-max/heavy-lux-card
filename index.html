<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 48%,
            #181818 0%,
            #0d0d0d 42%,
            #050505 100%
        );
}

/* ==============================
   TOP
============================== */

.topbar{
    position:absolute;
    top:env(safe-area-inset-top,8px);
    left:0;
    right:0;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    z-index:100;
}

.logo{
    font-size:12px;
    font-weight:900;
    letter-spacing:3px;
}

.info{
    display:flex;
    gap:6px;
}

.pill{
    padding:6px 9px;
    border:1px solid #333;
    border-radius:10px;
    background:#101010;
    font-size:10px;
    color:#999;
}

.pill b{
    color:#fff;
}

/* ==============================
   TABLE
============================== */

.table{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/*
    Никакой границы стола.
*/

.table-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,620px);
    height:min(55vh,430px);
}

/* ==============================
   OPPONENT
============================== */

.opponent{
    position:absolute;
    top:7vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:40;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #555;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.name{
    margin-top:5px;
    font-size:12px;
    font-weight:bold;
}

.count{
    margin-top:3px;
    color:#777;
    font-size:10px;
}

/* ==============================
   OPPONENT HAND
============================== */

.opponent-hand{
    position:absolute;
    top:14vh;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:80px;
    z-index:30;
}

/* ==============================
   PLAYER INFO
============================== */

.player-info{
    position:absolute;
    bottom:14vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:100;
}

.player-name{
    font-size:12px;
    font-weight:bold;
}

.player-count{
    margin-top:3px;
    color:#777;
    font-size:10px;
}

/* ==============================
   DECK
============================== */

.deck-area{
    position:absolute;
    left:13%;
    top:50%;
    width:125px;
    height:130px;
    transform:translate(-50%,-50%);
    z-index:20;
}

.deck{
    position:absolute;
    width:64px;
    height:91px;
    left:10px;
    top:18px;
    z-index:5;
}

.card-back{
    position:absolute;
    inset:0;
    border-radius:8px;
    border:2px solid #ddd;
    background:
        repeating-linear-gradient(
            45deg,
            #111 0px,
            #111 6px,
            #252525 6px,
            #252525 12px
        );
    box-shadow:0 8px 20px rgba(0,0,0,.6);
}

.card-back::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid #777;
    border-radius:5px;
}

.card-back::after{
    content:"HL";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
}

/*
    Видимые слои колоды
*/

.deck .back-1{
    transform:translate(-5px,-4px);
}

.deck .back-2{
    transform:translate(-2px,-2px);
}

.deck .back-3{
    transform:none;
}

/*
    КОЗЫРЬ НЕ РУБАШКА
*/

.trump{
    position:absolute;
    left:48px;
    top:31px;
    width:64px;
    height:91px;
    background:#fff;
    color:#111;
    border:1px solid #ccc;
    border-radius:8px;
    transform:rotate(72deg);
    box-shadow:0 7px 16px rgba(0,0,0,.55);
    z-index:2;
}

.trump .value{
    position:absolute;
    left:6px;
    top:4px;
    font-size:15px;
    font-weight:900;
}

.trump .suit{
    position:absolute;
    left:7px;
    top:23px;
    font-size:15px;
}

.trump .center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:29px;
}

.trump.red{
    color:#111;
}

/* ==============================
   PLAY AREA
============================== */

.play-area{
    position:absolute;
    left:50%;
    top:50%;
    width:330px;
    height:230px;
    transform:translate(-50%,-50%);
    z-index:50;
}

.attack-zone,
.defense-zone{
    position:absolute;
    inset:0;
}

/* ==============================
   CARD
============================== */

.card{
    position:absolute;
    width:68px;
    height:96px;
    border-radius:9px;
    background:#fff;
    color:#111;
    border:1px solid #ccc;
    box-shadow:
        0 7px 18px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(0,0,0,.08);
    overflow:hidden;
}

.card.red{
    color:#111;
}

.card-value{
    position:absolute;
    left:7px;
    top:5px;
    font-size:16px;
    font-weight:900;
}

.card-suit{
    position:absolute;
    left:8px;
    top:25px;
    font-size:16px;
}

.card-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:31px;
}

.card-corner{
    position:absolute;
    right:6px;
    bottom:4px;
    font-size:11px;
    transform:rotate(180deg);
    font-weight:bold;
}

/* ==============================
   OPPONENT CARD
============================== */

.opponent-card{
    position:absolute;
    width:58px;
    height:82px;
    border-radius:8px;
}

/* ==============================
   PLAYER HAND
============================== */

.hand{
    position:absolute;
    left:50%;
    bottom:2vh;
    transform:translateX(-50%);
    width:96%;
    height:125px;
    z-index:150;
}

.hand .card{
    transform-origin:center bottom;
    transition:
        left .2s ease,
        bottom .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
    cursor:pointer;
}

/*
    Выделение разрешённых карт
*/

.hand .card.allowed{
    box-shadow:
        0 0 0 2px #fff,
        0 0 18px rgba(255,255,255,.55),
        0 10px 24px rgba(0,0,0,.8);
    transform:
        translateY(-8px)
        scale(1.03);
}

.hand .card.disabled{
    opacity:.38;
}

/*
    Выбранная карта остаётся
    в руке.
*/

.hand .card.selected{
    transform:
        translateY(-18px)
        scale(1.07);
    box-shadow:
        0 0 0 3px #fff,
        0 12px 30px rgba(0,0,0,.9);
}

/* ==============================
   DRAG
============================== */

.dragging{
    position:fixed!important;
    z-index:1000!important;
    pointer-events:none;
    transition:none!important;
    transform:scale(1.08)!important;
    box-shadow:0 20px 45px rgba(0,0,0,.85)!important;
}

/* ==============================
   CONTROLS
============================== */

.controls{
    position:absolute;
    bottom:16vh;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:300;
}

button{
    border:1px solid #444;
    background:#111;
    color:#fff;
    border-radius:11px;
    padding:11px 18px;
    font-size:11px;
    font-weight:900;
}

button.primary{
    background:#fff;
    color:#000;
}

button.danger{
    background:#171717;
}

button:active{
    transform:scale(.95);
}

/* ==============================
   MESSAGE
============================== */

.message{
    position:absolute;
    top:14vh;
    left:50%;
    transform:translateX(-50%);
    z-index:500;
    padding:8px 13px;
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    color:#ddd;
    font-size:10px;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
}

.message.show{
    opacity:1;
}

/* ==============================
   START
============================== */

.start{
    position:absolute;
    inset:0;
    background:#050505;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
}

.start-box{
    width:84%;
    max-width:340px;
    text-align:center;
}

.start-title{
    font-size:30px;
    font-weight:900;
    letter-spacing:5px;
}

.start-sub{
    margin-top:8px;
    color:#666;
    font-size:10px;
    letter-spacing:3px;
}

.start-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    background:#fff;
    color:#000;
    border:0;
    border-radius:14px;
    font-size:14px;
    font-weight:900;
}

/* ==============================
   ANIMATION
============================== */

@keyframes dealPlayer{
    from{
        opacity:0;
        transform:
            translateY(80px)
            scale(.55)
            rotate(10deg);
    }

    to{
        opacity:1;
    }
}

@keyframes dealOpponent{
    from{
        opacity:0;
        transform:
            translateY(-70px)
            scale(.5);
    }

    to{
        opacity:1;
    }
}

@keyframes playCard{
    from{
        opacity:0;
        transform:
            scale(.55)
            rotate(-12deg);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            rotate(0deg);
    }
}

.deal-player{
    animation:dealPlayer .22s ease-out;
}

.deal-opponent{
    animation:dealOpponent .22s ease-out;
}

.play-animation{
    animation:playCard .25s ease-out;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:390px){

    .card{
        width:61px;
        height:87px;
    }

    .hand{
        height:115px;
    }

    .play-area{
        width:290px;
    }

    .deck-area{
        left:12%;
    }
}

</style>
</head>

<body>

<div id="app">

    <div class="topbar">

        <div class="logo">
            HEAVY LUX CARD
        </div>

        <div class="info">

            <div class="pill">
                Козырь:
                <b id="trumpInfo">—</b>
            </div>

            <div class="pill">
                Колода:
                <b id="deckCount">0</b>
            </div>

        </div>

    </div>


    <div id="message" class="message"></div>


    <!-- OPPONENT -->

    <div class="opponent">

        <div class="avatar">HL</div>

        <div class="name">
            Heavy AI
        </div>

        <div class="count">
            Карт:
            <b id="opponentCount">6</b>
        </div>

    </div>


    <div
        id="opponentHand"
        class="opponent-hand">
    </div>


    <!-- TABLE -->

    <div class="table">

        <div class="deck-area">

            <div
                id="deck"
                class="deck">

                <div class="card-back back-1"></div>
                <div class="card-back back-2"></div>
                <div class="card-back back-3"></div>

            </div>

            <div
                id="trumpCard"
                class="trump">
            </div>

        </div>


        <div class="play-area">

            <div
                id="attackZone"
                class="attack-zone">
            </div>

            <div
                id="defenseZone"
                class="defense-zone">
            </div>

        </div>

    </div>


    <!-- PLAYER -->

    <div class="player-info">

        <div
            id="playerName"
            class="player-name">
            Игрок
        </div>

        <div class="player-count">
            Карт:
            <b id="playerCount">6</b>
        </div>

    </div>


    <div
        id="playerHand"
        class="hand">
    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="takeButton"
            class="danger"
            style="display:none">
            ВЗЯТЬ
        </button>

        <button
            id="endButton"
            class="primary"
            style="display:none">
            ЗАКОНЧИТЬ
        </button>

    </div>


    <!-- START -->

    <div
        id="startScreen"
        class="start">

        <div class="start-box">

            <div class="start-title">
                HEAVY LUX
            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

            <button
                id="startButton"
                class="start-btn">
                НАЧАТЬ ИГРУ
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();
    tg.expand();

}


/* =========================================================
   CONSTANTS
========================================================= */

const SUITS =
    ["♠","♥","♦","♣"];

const RANKS = [
    ["6",6],
    ["7",7],
    ["8",8],
    ["9",9],
    ["10",10],
    ["В",11],
    ["Д",12],
    ["К",13],
    ["Т",14]
];


/* =========================================================
   STATE
========================================================= */

/*
    Важнейший принцип:

    deck
    playerHand
    cpuHand
    attackCards
    defenseCards

    никогда не содержат
    одну и ту же карту одновременно.
*/

let deck = [];

let playerHand = [];

let cpuHand = [];

let attackCards = [];

let defenseCards = [];

let trumpSuit = null;

let attacker = null;

let defender = null;

/*
    playerAttack
    cpuAttack
    playerDefense
    cpuDefense
    finished
*/

let phase = "waiting";

let selectedCard = null;

let dragging = null;

let gameStarted = false;

let playerName = "Игрок";


/* =========================================================
   DOM
========================================================= */

const playerHandEl =
    document.getElementById("playerHand");

const opponentHandEl =
    document.getElementById("opponentHand");

const attackZone =
    document.getElementById("attackZone");

const defenseZone =
    document.getElementById("defenseZone");

const trumpEl =
    document.getElementById("trumpCard");

const takeButton =
    document.getElementById("takeButton");

const endButton =
    document.getElementById("endButton");

const messageEl =
    document.getElementById("message");


/* =========================================================
   UTILITY
========================================================= */

function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


function shuffle(arr){

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [arr[i],arr[j]] =
        [arr[j],arr[i]];

    }

    return arr;

}


function newId(){

    if(
        crypto &&
        crypto.randomUUID
    ){

        return crypto.randomUUID();

    }

    return Math.random()
        .toString(36)
        .slice(2);

}


/* =========================================================
   CREATE DECK
========================================================= */

function createDeck(){

    const result=[];

    for(
        const suit of SUITS
    ){

        for(
            const [rank,value]
            of RANKS
        ){

            result.push({

                id:newId(),

                rank,
                value,
                suit

            });

        }

    }

    return shuffle(result);

}


/* =========================================================
   TRUMP
========================================================= */

function setupTrump(){

    /*
        Последняя карта является
        козырем.

        Она НЕ удаляется из
        массива deck.

        При доборе она становится
        последней доступной картой.
    */

    const card =
        deck[deck.length-1];

    trumpSuit =
        card.suit;

    renderTrump(card);

}


function renderTrump(card){

    trumpEl.innerHTML=`

        <div class="value">
            ${card.rank}
        </div>

        <div class="suit">
            ${card.suit}
        </div>

        <div class="center">
            ${card.suit}
        </div>

    `;

}


/* =========================================================
   CARD STRENGTH
========================================================= */

function isTrump(card){

    return (
        card &&
        card.suit === trumpSuit
    );

}


function canBeat(
    attack,
    defense
){

    if(
        !attack ||
        !defense
    ){

        return false;

    }

    /*
        Козырь бьёт любой
        некозырь.
    */

    if(
        isTrump(defense) &&
        !isTrump(attack)
    ){

        return true;

    }

    /*
        Некозырь не бьёт
        козырь.
    */

    if(
        !isTrump(defense) &&
        isTrump(attack)
    ){

        return false;

    }

    /*
        Оба козыри.

        Или оба некозыри.

        Масть должна совпадать.
    */

    return (
        attack.suit === defense.suit &&
        defense.value > attack.value
    );

}


/* =========================================================
   TABLE RANKS
========================================================= */

function tableRanks(){

    return [

        ...attackCards,
        ...defenseCards.filter(Boolean)

    ].map(
        card => card.rank
    );

}


/* =========================================================
   ATTACK VALIDATION
========================================================= */

function canAddAttack(card){

    /*
        Первый удар.
    */

    if(
        attackCards.length === 0
    ){

        return true;

    }

    /*
        Подкидывать можно только
        существующий на столе ранг.
    */

    return tableRanks()
        .includes(card.rank);

}


/* =========================================================
   GET NEXT UNBEATEN
========================================================= */

function nextUnbeaten(){

    for(
        let i=0;
        i<attackCards.length;
        i++
    ){

        if(
            !defenseCards[i]
        ){

            return i;

        }

    }

    return -1;

}


/* =========================================================
   REMOVE EXACT CARD
========================================================= */

function removeCardFromHand(
    hand,
    card
){

    const index =
        hand.findIndex(
            c => c.id === card.id
        );

    if(index === -1){

        return false;

    }

    hand.splice(index,1);

    return true;

}


/* =========================================================
   SORT
========================================================= */

function sortHand(hand){

    hand.sort(
        (a,b)=>{

            const at =
                isTrump(a);

            const bt =
                isTrump(b);

            if(at !== bt){

                return at ? 1 : -1;

            }

            return a.value-b.value;

        }
    );

}


/* =========================================================
   CARD ELEMENT
========================================================= */

function cardElement(card){

    const el =
        document.createElement("div");

    el.className =
        "card";

    el.innerHTML=`

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;

}


/* =========================================================
   BACK
========================================================= */

function backElement(){

    const el =
        document.createElement("div");

    el.className =
        "card-back opponent-card";

    return el;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderPlayerHand();

    renderOpponent();

    updateInfo();

    updateAllowedCards();

}


/* =========================================================
   PLAYER HAND
========================================================= */

function renderPlayerHand(){

    sortHand(playerHand);

    playerHandEl.innerHTML="";

    const count =
        playerHand.length;

    const spacing =
        count <= 7
            ? 52
            : 43;

    playerHand.forEach(
        (card,index)=>{

            const el =
                cardElement(card);

            const center =
                (count-1)/2;

            const x =
                (index-center)*spacing;

            el.style.left =
                `calc(50% + ${x}px - 34px)`;

            el.style.bottom="0";

            el.dataset.id =
                card.id;

            if(
                selectedCard &&
                selectedCard.id === card.id
            ){

                el.classList.add(
                    "selected"
                );

            }

            attachCardInput(
                el,
                card
            );

            playerHandEl.appendChild(el);

        }
    );

}


/* =========================================================
   OPPONENT
========================================================= */

function renderOpponent(){

    opponentHandEl.innerHTML="";

    const count =
        cpuHand.length;

    const spacing =
        count <= 8
            ? 28
            : 22;

    cpuHand.forEach(
        (card,index)=>{

            const el =
                backElement();

            const center =
                (count-1)/2;

            const x =
                (index-center)*spacing;

            el.style.left =
                `calc(50% + ${x}px - 29px)`;

            el.style.top =
                "0";

            el.style.transform =
                `rotate(${(index-center)*3}deg)`;

            opponentHandEl.appendChild(el);

        }
    );

}


/* =========================================================
   INPUT
========================================================= */

function attachCardInput(
    el,
    card
){

    let startX=0;
    let startY=0;
    let moved=false;

    el.addEventListener(
        "pointerdown",
        event=>{

            if(
                phase !== "playerAttack" &&
                phase !== "playerDefense"
            ){

                return;

            }

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved=false;

            el.setPointerCapture(
                event.pointerId
            );

            dragging={

                card,
                element:el

            };

            selectedCard =
                card;

            renderPlayerHand();

        }
    );


    el.addEventListener(
        "pointermove",
        event=>{

            if(
                !dragging ||
                dragging.element !== el
            ){

                return;

            }

            const dx =
                event.clientX-startX;

            const dy =
                event.clientY-startY;

            if(
                Math.abs(dx)>5 ||
                Math.abs(dy)>5
            ){

                moved=true;

            }

            if(moved){

                el.classList.add(
                    "dragging"
                );

                el.style.left =
                    `${event.clientX-34}px`;

                el.style.top =
                    `${event.clientY-48}px`;

                el.style.bottom="auto";

            }

        }
    );


    el.addEventListener(
        "pointerup",
        async event=>{

            if(
                !dragging ||
                dragging.element !== el
            ){

                return;

            }

            el.classList.remove(
                "dragging"
            );

            const cardToPlay =
                dragging.card;

            dragging=null;

            if(!moved){

                /*
                    Обычный тап.

                    Карта НЕ исчезает.
                    Только выбирается.
                */

                selectedCard =
                    cardToPlay;

                renderPlayerHand();

                return;

            }

            /*
                Проверяем попадание
                в центр стола.
            */

            const playArea =
                document
                    .querySelector(".play-area")
                    .getBoundingClientRect();

            const inside =
                event.clientX >= playArea.left &&
                event.clientX <= playArea.right &&
                event.clientY >= playArea.top &&
                event.clientY <= playArea.bottom;

            if(inside){

                await playSelectedCard(
                    cardToPlay
                );

            }else{

                selectedCard=null;

                renderPlayerHand();

            }

        }
    );

}


/* =========================================================
   PLAY SELECTED
========================================================= */

async function playSelectedCard(card){

    if(
        phase === "playerAttack"
    ){

        await playerAttack(card);

        return;

    }

    if(
        phase === "playerDefense"
    ){

        await playerDefense(card);

        return;

    }

}


/* =========================================================
   PLAYER ATTACK
========================================================= */

async function playerAttack(card){

    if(
        !canAddAttack(card)
    ){

        showMessage(
            "Эту карту нельзя подкинуть"
        );

        return;

    }

    /*
        В атаке карта должна
        реально находиться у игрока.
    */

    const removed =
        removeCardFromHand(
            playerHand,
            card
        );

    if(!removed){

        return;

    }

    selectedCard=null;

    attackCards.push(card);

    await animatePlay(
        card,
        attackZone,
        attackCards.length-1,
        false
    );

    render();

    /*
        После первого хода
        компьютер защищается.

        После подкидывания,
        компьютер также защищается
        от НОВОЙ карты.
    */

    phase =
        "cpuDefense";

    showMessage(
        "Компьютер отбивается..."
    );

    updateButtons();

    await sleep(450);

    await cpuDefense();

}


/* =========================================================
   PLAYER DEFENSE
========================================================= */

async function playerDefense(card){

    const index =
        nextUnbeaten();

    if(index === -1){

        return;

    }

    const attack =
        attackCards[index];

    if(
        !canBeat(
            attack,
            card
        )
    ){

        showMessage(
            "Этой картой побить нельзя"
        );

        return;

    }

    const removed =
        removeCardFromHand(
            playerHand,
            card
        );

    if(!removed){

        return;

    }

    selectedCard=null;

    defenseCards[index]=card;

    await animatePlay(
        card,
        defenseZone,
        index,
        true
    );

    render();

    /*
        Ключевой момент.

        После твоей защиты
        компьютер решает,
        может ли он ПОДКИНУТЬ.

        Он не делает это сразу
        после своего собственного
        отбоя.
    */

    await sleep(300);

    await cpuAddAfterDefense();

}


/* =========================================================
   CPU DEFENSE
========================================================= */

async function cpuDefense(){

    if(
        phase !== "cpuDefense"
    ){

        return;

    }

    const index =
        nextUnbeaten();

    /*
        Все карты побиты.

        Теперь компьютер НЕ подкидывает
        сам себе.

        Он передаёт инициативу
        игроку-атакующему.
    */

    if(index === -1){

        await finishDefenseRound();

        return;

    }

    const attack =
        attackCards[index];

    /*
        Находим минимальную
        подходящую карту.
    */

    const candidates =
        cpuHand
            .filter(
                card =>
                    canBeat(
                        attack,
                        card
                    )
            )
            .sort(
                (a,b)=>
                    defenseStrength(a)
                    -
                    defenseStrength(b)
            );

    /*
        Компьютер не может отбиться.
    */

    if(
        candidates.length === 0
    ){

        await sleep(450);

        await cpuTake();

        return;

    }

    const card =
        candidates[0];

    removeCardFromHand(
        cpuHand,
        card
    );

    defenseCards[index]=card;

    await animatePlay(
        card,
        defenseZone,
        index,
        true
    );

    render();

    await sleep(300);

    /*
        Проверяем, остались ли
        ещё НЕПИТОЙ карты.

        Если да — продолжаем
        защиту.

        Если нет — раунд окончен.
    */

    if(
        nextUnbeaten() !== -1
    ){

        await cpuDefense();

        return;

    }

    /*
        Всё отбито.

        Компьютер НЕ подкидывает.

        Теперь завершается
        текущий раунд.
    */

    await finishDefenseRound();

}


/* =========================================================
   DEFENSE STRENGTH
========================================================= */

function defenseStrength(card){

    /*
        Некозырь всегда дешевле
        козыря.

        Среди козырей младший
        предпочтительнее старшего.
    */

    return (
        (isTrump(card) ? 100 : 0)
        + card.value
    );

}


/* =========================================================
   CPU ADD AFTER PLAYER DEFENSE
========================================================= */

async function cpuAddAfterDefense(){

    /*
        Все карты уже побиты.

        Теперь компьютер является
        атакующим в текущем раунде
        и может подкинуть.
    */

    if(
        nextUnbeaten() !== -1
    ){

        return;

    }

    /*
        Проверяем реальную руку CPU.
    */

    const candidates =
        getCpuAddCandidates();

    /*
        Максимальное количество
        атакующих карт определяется
        количеством карт у
        защищающегося в начале
        раунда.

        Но минимум — не больше
        текущего количества карт
        игрока.
    */

    const maxCards =
        Math.min(
            6,
            playerHand.length
                + attackCards.length
        );

    if(
        candidates.length > 0 &&
        attackCards.length < maxCards
    ){

        /*
            Компьютер действительно
            имеет чем подкинуть.

            Берём младшую
            подходящую карту.
        */

        await sleep(450);

        const card =
            chooseCpuAdd(
                candidates
            );

        removeCardFromHand(
            cpuHand,
            card
        );

        attackCards.push(card);

        await animatePlay(
            card,
            attackZone,
            attackCards.length-1,
            false
        );

        render();

        /*
            Теперь снова защищается
            игрок.
        */

        phase =
            "playerDefense";

        showMessage(
            "Твоя защита"
        );

        updateButtons();

        return;

    }

    /*
        Нечем подкинуть.

        Раунд окончен.
    */

    await finishDefenseRound();

}


/* =========================================================
   CPU ADD CANDIDATES
========================================================= */

function getCpuAddCandidates(){

    if(
        attackCards.length === 0
    ){

        return cpuHand.slice();

    }

    const ranks =
        tableRanks();

    return cpuHand.filter(
        card =>
            ranks.includes(
                card.rank
            )
    );

}


/* =========================================================
   CPU ADD CHOICE
========================================================= */

function chooseCpuAdd(cards){

    return cards
        .slice()
        .sort(
            (a,b)=>{

                const at =
                    isTrump(a);

                const bt =
                    isTrump(b);

                /*
                    Не выбрасываем козырь,
                    если можно избавиться
                    от обычной карты.
                */

                if(at !== bt){

                    return at ? 1 : -1;

                }

                return a.value-b.value;

            }
        )[0];

}


/* =========================================================
   CPU TAKE
========================================================= */

async function cpuTake(){

    showMessage(
        "Компьютер берёт карты"
    );

    await sleep(550);

    /*
        Собираем карты стола.

        Каждая карта переносится
        в руку ровно один раз.
    */

    for(
        const card of attackCards
    ){

        cpuHand.push(card);

    }

    for(
        const card of defenseCards
    ){

        if(card){

            cpuHand.push(card);

        }

    }

    attackCards=[];
    defenseCards=[];

    attackZone.innerHTML="";
    defenseZone.innerHTML="";

    /*
        После взятия атакующий
        остаётся атакующим.

        Если игрок атаковал,
        игрок продолжает.

        Если компьютер атаковал,
        компьютер продолжает.
    */

    await refillHands();

    render();

    if(
        checkGameOver()
    ){

        return;

    }

    if(
        attacker === "player"
    ){

        phase =
            "playerAttack";

        showMessage(
            "Твой ход — продолжаешь атаку"
        );

        updateButtons();

    }else{

        phase =
            "cpuAttack";

        showMessage(
            "Компьютер продолжает атаку"
        );

        updateButtons();

        await sleep(450);

        await cpuStartAttack();

    }

}


/* =========================================================
   PLAYER TAKE
========================================================= */

async function playerTake(){

    if(
        phase !== "playerDefense"
    ){

        return;

    }

    takeButton.style.display="none";

    /*
        Все карты стола
        переходят игроку.
    */

    for(
        const card of attackCards
    ){

        playerHand.push(card);

    }

    for(
        const card of defenseCards
    ){

        if(card){

            playerHand.push(card);

        }

    }

    attackCards=[];
    defenseCards=[];

    attackZone.innerHTML="";
    defenseZone.innerHTML="";

    showMessage(
        "Ты берёшь карты"
    );

    await sleep(400);

    /*
        Атакующий добирает первым.
    */

    await refillHands();

    render();

    if(
        checkGameOver()
    ){

        return;

    }

    /*
        В классическом дураке
        после взятия защищающийся
        не становится атакующим.

        Атакующий продолжает.
    */

    if(
        attacker === "cpu"
    ){

        phase =
            "cpuAttack";

        showMessage(
            "Компьютер продолжает атаку"
        );

        await sleep(450);

        await cpuStartAttack();

    }else{

        phase =
            "playerAttack";

        showMessage(
            "Ты продолжаешь атаку"
        );

        updateButtons();

    }

}


/* =========================================================
   FINISH ROUND
========================================================= */

async function finishDefenseRound(){

    showMessage(
        "Все карты отбиты"
    );

    await sleep(550);

    /*
        Убираем карты в отбой.
    */

    attackCards=[];
    defenseCards=[];

    attackZone.innerHTML="";
    defenseZone.innerHTML="";

    /*
        Добор.

        Сначала атакующий,
        затем защищающийся.
    */

    await refillHands();

    render();

    if(
        checkGameOver()
    ){

        return;

    }

    /*
        Атакующий меняется.
    */

    if(
        attacker === "player"
    ){

        attacker="cpu";
        defender="player";

        phase="cpuAttack";

        showMessage(
            "Компьютер атакует"
        );

        updateButtons();

        await sleep(450);

        await cpuStartAttack();

    }else{

        attacker="player";
        defender="cpu";

        phase="playerAttack";

        showMessage(
            "Твой ход"
        );

        updateButtons();

    }

}


/* =========================================================
   REFILL
========================================================= */

async function refillHands(){

    /*
        Строго:

        1. атакующий
        2. защищающийся
    */

    const order =
        attacker === "player"
            ? [
                playerHand,
                cpuHand
            ]
            : [
                cpuHand,
                playerHand
            ];

    for(
        const hand of order
    ){

        while(
            hand.length < 6 &&
            deck.length > 0
        ){

            const card =
                deck.shift();

            hand.push(card);

            render();

            await sleep(100);

        }

    }

}


/* =========================================================
   CPU START ATTACK
========================================================= */

async function cpuStartAttack(){

    if(
        phase !== "cpuAttack"
    ){

        return;

    }

    if(
        cpuHand.length === 0
    ){

        checkGameOver();

        return;

    }

    /*
        Если это новый раунд,
        можно ходить любой картой.

        Если продолжается атака
        после взятия, можно
        подкидывать только подходящий
        ранг.
    */

    let candidates;

    if(
        attackCards.length === 0
    ){

        candidates =
            cpuHand.slice();

    }else{

        candidates =
            getCpuAddCandidates();

    }

    if(
        candidates.length === 0
    ){

        /*
            Если нечем продолжать,
            раунд заканчивается.
        */

        await finishDefenseRound();

        return;

    }

    await sleep(450);

    const card =
        chooseCpuAttackCard(
            candidates
        );

    removeCardFromHand(
        cpuHand,
        card
    );

    attackCards.push(card);

    await animatePlay(
        card,
        attackZone,
        attackCards.length-1,
        false
    );

    render();

    phase =
        "playerDefense";

    showMessage(
        "Твоя защита"
    );

    updateButtons();

}


/* =========================================================
   CPU ATTACK CHOICE
========================================================= */

function chooseCpuAttackCard(cards){

    return cards
        .slice()
        .sort(
            (a,b)=>{

                const at =
                    isTrump(a);

                const bt =
                    isTrump(b);

                if(at !== bt){

                    return at ? 1 : -1;

                }

                return a.value-b.value;

            }
        )[0];

}


/* =========================================================
   ANIMATE CARD
========================================================= */

async function animatePlay(
    card,
    zone,
    index,
    defense
){

    const el =
        cardElement(card);

    el.classList.add(
        "play-animation"
    );

    const pos =
        defense
            ? defensePosition(index)
            : attackPosition(index);

    el.style.left =
        `${pos.x}px`;

    el.style.top =
        `${pos.y}px`;

    zone.appendChild(el);

    await sleep(270);

}


/* =========================================================
   POSITIONS
========================================================= */

function attackPosition(index){

    const columns=4;

    const col =
        index % columns;

    const row =
        Math.floor(index / columns);

    return {

        x:
            15 + col*75,

        y:
            20 + row*105

    };

}


function defensePosition(index){

    const columns=4;

    const col =
        index % columns;

    const row =
        Math.floor(index / columns);

    return {

        x:
            42 + col*75,

        y:
            0 + row*105

    };

}


/* =========================================================
   ALLOWED CARDS
========================================================= */

function updateAllowedCards(){

    const elements =
        playerHandEl.querySelectorAll(
            ".card"
        );

    elements.forEach(
        el=>{

            const card =
                playerHand.find(
                    c =>
                        c.id ===
                        el.dataset.id
                );

            if(!card){

                return;

            }

            let allowed=false;

            if(
                phase === "playerAttack"
            ){

                allowed =
                    canAddAttack(card);

            }

            if(
                phase === "playerDefense"
            ){

                const index =
                    nextUnbeaten();

                if(index !== -1){

                    allowed =
                        canBeat(
                            attackCards[index],
                            card
                        );

                }

            }

            if(allowed){

                el.classList.add(
                    "allowed"
                );

                el.classList.remove(
                    "disabled"
                );

            }else{

                el.classList.remove(
                    "allowed"
                );

                el.classList.add(
                    "disabled"
                );

            }

        }
    );

}

   BUTTONS
========================================================= */

function updateButtons(){

    takeButton.style.display="none";
    endButton.style.display="none";

    if(
        phase === "playerDefense"
    ){

        takeButton.style.display =

        После того как компьютер

    */

    if(
        phase === "playerAttack" &&
        attackCards.length > 0
    ){

        endButton.style.display =

    }

}

/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver(){

    /*
        Важно:

        Победитель определяется
        только после того, как
        карты раунда обработаны
        и выполнен добор.

        Если колода пуста,
        игрок может закончить
        с нулём карт.
    */

    if(
        deck.length === 0
    ){

        if(
            playerHand.length === 0 &&
            cpuHand.length === 0
        ){

            endGame(
                "Ничья"
            );

            return true;

        }

        if(
            playerHand.length === 0
        ){

            endGame(
                "Ты победил!"
            );

            return true;

        }

        if(
            cpuHand.length === 0
        ){

            endGame(
                "Компьютер победил"
            );

            return true;

        }

    }

    return false;

}


function endGame(text){

    phase="finished";

    updateButtons();

    showMessage(text);

    setTimeout(
        ()=>{

            if(tg){

                tg.showAlert(text);

            }else{

                alert(text);

            }

        },
        300
    );

}

/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    deck =
        createDeck();

    playerHand=[];
    cpuHand=[];
    attackCards=[];
    defenseCards=[];

    selectedCard=null;

    /*
        Козырь определяется
        до раздачи.
    */

    setupTrump();

    /*
        Анимация раздачи.

        Важно:

        мы каждый раз достаём
        карту из deck.

        Поэтому одна и та же
        карта физически не может
        оказаться у двух игроков.
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        const playerCard =
            deck.shift();

        playerHand.push(
            playerCard
        );

        render();

        await sleep(75);

        const cpuCard =
            deck.shift();

        cpuHand.push(
            cpuCard
        );

        render();

        await sleep(75);

    }

    /*
        Определяем первого
        по младшему козырю.
    */

    const playerTrumps =
        playerHand
            .filter(isTrump)
            .sort(
                (a,b)=>
                    a.value-b.value
            );

    const cpuTrumps =
        cpuHand
            .filter(isTrump)
            .sort(
                (a,b)=>
                    a.value-b.value
            );

    let playerStarts;

    if(
        playerTrumps.length &&
        cpuTrumps.length
    ){

        playerStarts =
            playerTrumps[0].value <
            cpuTrumps[0].value;

    }else if(
        playerTrumps.length
    ){

        playerStarts=true;

    }else if(
        cpuTrumps.length
    ){

        playerStarts=false;

    }else{

        const p =
            Math.min(
                ...playerHand.map(
                    c=>c.value
                )
            );

        const c =
            Math.min(
                ...cpuHand.map(
                    c=>c.value
                )
            );

        playerStarts =
            p<=c;

    }


    if(playerStarts){

        attacker="player";
        defender="cpu";
        phase="playerAttack";

        showMessage(
            "Твой ход"
        );

    }else{

        attacker="cpu";
        defender="player";
        phase="cpuAttack";

        showMessage(
            "Компьютер начинает"
        );

        await sleep(700);

        await cpuStartAttack();

    }

    render();
    updateButtons();

}


/* =========================================================
   INITIAL
========================================================= */

updateInfo();

</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    min-height:100vh;
}

#app{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =========================
   TOP
========================= */

.topbar{
    position:absolute;
    top:env(safe-area-inset-top,8px);
    left:0;
    right:0;
    height:52px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:100;
}

.logo{
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
}

.info{
    display:flex;
    gap:6px;
}

.info-item{
    padding:6px 9px;
    border:1px solid #292929;
    border-radius:9px;
    background:#0b0b0b;
    color:#999;
    font-size:10px;
}

.info-item b{
    color:#fff;
}

/* =========================
   TABLE
========================= */

.table{
    position:absolute;
    left:50%;
    top:50%;
    width:min(96vw,700px);
    height:min(76vh,650px);
    transform:translate(-50%,-50%);
}

.table::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:8%;
    bottom:8%;
    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.025),
            rgba(255,255,255,0) 65%
        );
    pointer-events:none;
}

/* =========================
   DECK
========================= */

.deck-area{
    position:absolute;
    left:9%;
    top:50%;
    width:130px;
    height:135px;
    transform:translate(-50%,-50%);
    z-index:20;
}

.deck{
    position:absolute;
    left:0;
    top:17px;
    width:66px;
    height:94px;
    z-index:6;
    transform:rotate(-5deg);
}

.deck-card{
    position:absolute;
    inset:0;
    border-radius:8px;
    border:2px solid #999;
    background:
        repeating-linear-gradient(
            45deg,
            #0b0b0b 0,
            #0b0b0b 5px,
            #242424 5px,
            #242424 10px
        );
    box-shadow:0 5px 14px rgba(0,0,0,.65);
}

.deck-card::after,
.card.back::after{
    content:"HL";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:38px;
    height:38px;
    border:1px solid #777;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    color:#ddd;
}

.deck-card:nth-child(1){
    transform:translate(-6px,-5px);
}

.deck-card:nth-child(2){
    transform:translate(-3px,-2px);
}

.deck-card:nth-child(3){
    transform:translate(0,0);
}

/* =========================
   TRUMP
========================= */

.trump{
    position:absolute;
    left:58px;
    top:31px;
    width:66px;
    height:94px;
    z-index:2;
    transform:rotate(76deg);
}

/* =========================
   CARD
========================= */

.card{
    position:absolute;
    width:66px;
    height:94px;
    border-radius:8px;
    background:#fff;
    color:#080808;
    border:1px solid #ccc;
    box-shadow:0 7px 16px rgba(0,0,0,.55);
    overflow:hidden;
    font-weight:900;
}

.card.red{
    color:#111;
}

.card.back{
    background:
        repeating-linear-gradient(
            45deg,
            #0b0b0b 0,
            #0b0b0b 5px,
            #242424 5px,
            #242424 10px
        );
    border:2px solid #999;
}

.card-value{
    position:absolute;
    top:5px;
    left:6px;
    font-size:15px;
}

.card-suit{
    position:absolute;
    top:23px;
    left:7px;
    font-size:14px;
}

.card-center{
    position:absolute;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    font-size:30px;
}

.card-corner{
    position:absolute;
    right:5px;
    bottom:4px;
    transform:rotate(180deg);
    font-size:11px;
}

/* =========================
   OPPONENT
========================= */

.opponent{
    position:absolute;
    top:7vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:50;
}

.avatar{
    width:48px;
    height:48px;
    margin:auto;
    border:1px solid #444;
    border-radius:50%;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.opponent-name{
    margin-top:5px;
    font-size:12px;
    font-weight:900;
}

.opponent-count{
    margin-top:3px;
    color:#777;
    font-size:10px;
}

/* =========================
   OPPONENT HAND
========================= */

.opponent-hand{
    position:absolute;
    left:50%;
    top:0;
    width:280px;
    height:105px;
    transform:translateX(-50%);
    z-index:35;
}

.opponent-hand .card{
    width:58px;
    height:84px;
}

/* =========================
   PLAYER
========================= */

.player-info{
    position:absolute;
    bottom:7vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:120;
}

.player-name{
    font-size:12px;
    font-weight:900;
}

.player-count{
    margin-top:3px;
    color:#777;
    font-size:10px;
}

/* =========================
   PLAYER HAND
========================= */

.hand{
    position:absolute;
    left:50%;
    bottom:0;
    width:100%;
    height:145px;
    transform:translateX(-50%);
    z-index:200;
    pointer-events:none;
}

.hand .card{
    pointer-events:auto;
    transform-origin:center bottom;
    transition:
        left .22s ease,
        bottom .22s ease,
        transform .22s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

.hand .card.allowed{
    box-shadow:
        0 0 0 2px #fff,
        0 8px 20px rgba(255,255,255,.2);
}

.hand .card.not-allowed{
    opacity:.38;
}

.hand .card.selected{
    bottom:18px!important;
    box-shadow:
        0 0 0 2px #fff,
        0 12px 25px rgba(255,255,255,.28);
}

/* =========================
   TABLE CARDS
========================= */

.attack-zone,
.defense-zone{
    position:absolute;
    left:50%;
    top:50%;
    width:360px;
    height:270px;
    transform:translate(-50%,-50%);
    z-index:60;
}

.played-card{
    position:absolute;
    width:66px;
    height:94px;
    transition:
        left .32s cubic-bezier(.2,.8,.2,1),
        top .32s cubic-bezier(.2,.8,.2,1),
        transform .32s ease,
        opacity .25s ease;
}

.attack-card{
    z-index:61;
}

.defense-card{
    z-index:62;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    left:50%;
    bottom:17vh;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    z-index:400;
}

button{
    border:1px solid #333;
    border-radius:10px;
    background:#0c0c0c;
    color:#fff;
    padding:10px 16px;
    font-size:11px;
    font-weight:900;
}

button.primary{
    background:#fff;
    color:#000;
}

button.danger{
    background:#171717;
}

button:active{
    transform:scale(.95);
}

/* =========================
   MESSAGE
========================= */

.message{
    position:absolute;
    left:50%;
    top:15vh;
    transform:translateX(-50%);
    padding:8px 13px;
    border:1px solid #292929;
    border-radius:10px;
    background:#090909;
    color:#bbb;
    font-size:10px;
    z-index:500;
    opacity:0;
    transition:opacity .2s ease;
}

.message.show{
    opacity:1;
}

/* =========================
   START
========================= */

.start{
    position:absolute;
    inset:0;
    background:#050505;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
}

.start-box{
    width:82%;
    max-width:340px;
    text-align:center;
}

.start-title{
    font-size:29px;
    font-weight:900;
    letter-spacing:5px;
}

.start-sub{
    margin-top:8px;
    color:#666;
    font-size:10px;
    letter-spacing:3px;
}

.start-button{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:0;
    background:#fff;
    color:#000;
    font-size:14px;
}

/* =========================
   DRAG
========================= */

.dragging{
    position:fixed!important;
    z-index:9999!important;
    transition:none!important;
    pointer-events:none!important;
    transform:scale(1.08) rotate(0deg)!important;
    opacity:1!important;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes dealPlayer{
    from{
        opacity:0;
        transform:translateY(100px) scale(.55);
    }
    to{
        opacity:1;
    }
}

@keyframes dealOpponent{
    from{
        opacity:0;
        transform:translateY(-100px) scale(.55);
    }
    to{
        opacity:1;
    }
}

@keyframes playCard{
    from{
        opacity:0;
        transform:scale(.55) rotate(-12deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

.deal-player{
    animation:dealPlayer .22s ease forwards;
}

.deal-opponent{
    animation:dealOpponent .22s ease forwards;
}

.play-animation{
    animation:playCard .28s ease forwards;
}

@media(max-width:390px){

    .card{
        width:59px;
        height:84px;
    }

    .played-card{
        width:59px;
        height:84px;
    }

    .hand{
        height:130px;
    }

    .attack-zone,
    .defense-zone{
        width:310px;
    }
}
</style>
</head>

<body>

            </div>

</div>

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if(tg){
    tg.ready();
    tg.expand();
}


/* =========================================================
   CONSTANTS
========================================================= */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [
    {name:"6",  value:6},
    {name:"7",  value:7},
    {name:"8",  value:8},
    {name:"9",  value:9},
    {name:"10", value:10},
    {name:"В",  value:11},
    {name:"Д",  value:12},
    {name:"К",  value:13},
    {name:"Т",  value:14}
];


/* =========================================================
   GAME STATE
========================================================= */

let deck = [];

let playerHand = [];
let cpuHand = [];

let tableAttacks = [];

let trumpSuit = null;

/*
    attacker = кто сейчас атакует
    defender = кто сейчас защищается
*/

let attacker = null;
let defender = null;

/*
    Фазы:

    waiting
    player_attack
    cpu_attack
    player_defense
    cpu_defense
    finished
*/

let phase = "waiting";

/*
    Лимит фиксируется в начале раунда.
    Он НЕ меняется во время розыгрыша.
*/

let roundLimit = 6;

let selectedCardId = null;

let dragState = null;

let gameStarted = false;

let playerName = "Игрок";

let aiBusy = false;


/* =========================================================
   DOM
========================================================= */

const playerHandEl =
    document.getElementById("playerHand");

const opponentHandEl =
    document.getElementById("opponentHand");

const attackZone =
    document.getElementById("attackZone");

const defenseZone =
    document.getElementById("defenseZone");

const trumpCardEl =
    document.getElementById("trumpCard");

const messageEl =
    document.getElementById("message");

const takeButton =
    document.getElementById("takeButton");


/* =========================================================
   UTILITY
========================================================= */

function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}


function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


/* =========================================================
   CARD CREATION
========================================================= */

function createDeck(){

    const result = [];

    let id = 0;

    for(const suit of SUITS){

        for(const rank of RANKS){

            result.push({

                id:`card_${id++}`,

                suit,

                rank:rank.name,

                value:rank.value

            });
        }
    }

    return shuffle(result);
}


/* =========================================================
   CARD HELPERS
========================================================= */

function isTrump(card){

    return (
        card &&
        card.suit === trumpSuit
    );
}


function isRed(card){

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


/*
    СТРОГАЯ ПРОВЕРКА БОЯ.
*/

function canBeat(attack, defense){

    if(!attack || !defense){
        return false;
    }

    /*
        Козырь бьёт любую
        некозырную карту.
    */

    if(
        isTrump(defense) &&
        !isTrump(attack)
    ){

        return true;
    }

    /*
        Некозырная карта
        не может бить козырь.
    */

    if(
        !isTrump(defense) &&
        isTrump(attack)
    ){

        return false;
    }

    /*
        Обычная карта может
        побить только карту
        той же масти.
    */

    if(
        attack.suit !== defense.suit
    ){

        return false;
    }

    return (
        defense.value >
        attack.value
    );
}


/* =========================================================
   TABLE VALUES
========================================================= */

function getTableRanks(){

    const result = [];

    for(const pair of tableAttacks){

        result.push(
            pair.attack.rank
        );

        if(pair.defense){

            result.push(
                pair.defense.rank
            );
        }
    }

    return result;
}


/*
    Можно ли подкинуть карту
    по классическим правилам.
*/

function canAddCard(card){

    if(!card){
        return false;
    }

    /*
        Нельзя превышать количество
        карт у защищающегося
        на начало раунда.
    */

    if(
        tableAttacks.length >=
        roundLimit
    ){

        return false;
    }

    /*
        Первый удар.
    */

    if(
        tableAttacks.length === 0
    ){

        return true;
    }

    /*
        Любое достоинство,
        уже присутствующее на столе.
    */

    return getTableRanks()
        .includes(card.rank);
}


/* =========================================================
   UNBEATEN
========================================================= */

function getFirstUnbeatenIndex(){

    for(
        let i=0;
        i<tableAttacks.length;
        i++
    ){

        if(
            !tableAttacks[i].defense
        ){

            return i;
        }
    }

    return -1;
}


function allCardsBeaten(){

    return (
        tableAttacks.length > 0 &&
        getFirstUnbeatenIndex() === -1
    );
}


/* =========================================================
   HAND SAFETY
========================================================= */

function removeCardById(hand,id){

    const index =
        hand.findIndex(
            card => card.id === id
        );

    if(index === -1){
        return null;
    }

    return hand.splice(
        index,
        1
    )[0];
}


function hasCard(hand,id){

    return hand.some(
        card => card.id === id
    );
}


/*
    Защита от случайного
    появления одинаковой карты.
*/

function assertNoDuplicates(){

    const all = [
        ...deck,
        ...playerHand,
        ...cpuHand
    ];

    for(const pair of tableAttacks){

        all.push(pair.attack);

        if(pair.defense){
            all.push(pair.defense);
        }
    }

    const ids =
        all.map(card => card.id);

    const unique =
        new Set(ids);

    if(ids.length !== unique.size){

        console.error(
            "ОШИБКА: обнаружено дублирование карты"
        );

        console.error(all);
    }
}


/* =========================================================
   CARD ELEMENT
========================================================= */

function createCardElement(card){

    const el =
        document.createElement("div");

    el.className =
        "card" +
        (isRed(card) ? " red" : "");

    el.dataset.id =
        card.id;

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;
}


function createBackCard(){

    const el =
        document.createElement("div");

    el.className =
        "card back";

    return el;
}


/* =========================================================
   TRUMP
========================================================= */

function setupTrump(){

    if(deck.length === 0){
        return;
    }

    /*
        Последняя карта колоды —
        открытый козырь.

        Она физически остаётся
        частью колоды.
    */

    const trump =
        deck[deck.length-1];

    trumpSuit =
        trump.suit;

    trumpCardEl.className =
        "card trump" +
        (isRed(trump) ? " red" : "");

    trumpCardEl.innerHTML = `

        <div class="card-value">
            ${trump.rank}
        </div>

        <div class="card-suit">
            ${trump.suit}
        </div>

        <div class="card-center">
            ${trump.suit}
        </div>

        <div class="card-corner">
            ${trump.rank}${trump.suit}
        </div>

    `;

    document.getElementById(
        "trumpInfo"
    ).innerText =
        trumpSuit;
}


/* =========================================================
   DEAL
========================================================= */

async function dealInitial(){

    playerHand = [];
    cpuHand = [];

    /*
        Пока не закончились карты
        для шести каждому.

        Последняя карта остаётся
        козырем.
    */

    for(let i=0;i<6;i++){

        /*
            Всегда оставляем последнюю
            карту колоды.
        */

        if(deck.length <= 1){
            break;
        }

        const playerCard =
            deck.shift();

        playerHand.push(
            playerCard
        );

        renderAll();

        animateLastPlayerCard();

        await sleep(120);


        if(deck.length <= 1){
            break;
        }

        const cpuCard =
            deck.shift();

        cpuHand.push(
            cpuCard
        );

        renderAll();

        animateLastOpponentCard();

        await sleep(120);
    }

    assertNoDuplicates();
}


/* =========================================================
   REFILL
========================================================= */

async function refillHands(){

    /*
        Классическое правило:

        сначала добирает атакующий,
        затем второй игрок.

        Козырь внизу колоды
        также может быть добран,
        когда до него дошла очередь.
    */

    const first =
        attacker === "player"
            ? playerHand
            : cpuHand;

    const second =
        attacker === "player"
            ? cpuHand
            : playerHand;

    while(
        first.length < 6 &&
        deck.length > 0
    ){

        first.push(
            deck.shift()
        );

        renderAll();

        await sleep(120);
    }

    while(
        second.length < 6 &&
        deck.length > 0
    ){

        second.push(
            deck.shift()
        );

        renderAll();

        await sleep(120);
    }

    assertNoDuplicates();
}


/* =========================================================
   RENDER
========================================================= */

function renderAll(){

    renderPlayerHand();

    renderOpponentHand();

    renderTable();

    updateInfo();

    updateAllowedCards();

    updateButtons();

    assertNoDuplicates();
}


/* =========================================================
   PLAYER HAND
========================================================= */

function renderPlayerHand(){

    playerHandEl.innerHTML = "";

    const count =
        playerHand.length;

    playerHand.forEach(
        (card,index)=>{

            const el =
                createCardElement(card);

            const spread =
                Math.min(
                    52,
                    300 /
                    Math.max(
                        count,
                        1
                    )
                );

            const offset =
                (
                    index -
                    (count-1)/2
                ) * spread;

            el.style.left =
                `calc(50% + ${offset}px - 33px)`;

            el.style.bottom =
                "2px";

            const rotation =
                (
                    index -
                    (count-1)/2
                ) * 3;

            el.style.transform =
                `rotate(${rotation}deg)`;

            if(
                selectedCardId === card.id
            ){

                el.classList.add(
                    "selected"
                );
            }

            addCardInteraction(
                el,
                card
            );

            playerHandEl.appendChild(el);
        }
    );

    document.getElementById(
        "playerCount"
    ).innerText =
        playerHand.length;
}


/* =========================================================
   OPPONENT HAND
========================================================= */

function renderOpponentHand(){

    opponentHandEl.innerHTML = "";

    const count =
        cpuHand.length;

    cpuHand.forEach(
        (card,index)=>{

            const el =
                createBackCard();

            const offset =
                (
                    index -
                    (count-1)/2
                ) * 30;

            el.style.left =
                `calc(50% + ${offset}px - 29px)`;

            el.style.top =
                `${Math.abs(
                    index -

/* =========================================================
   TABLE
========================================================= */

function renderTable(){

    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";

    tableAttacks.forEach(
        (pair,index)=>{

            const attack =
                createCardElement(
                    pair.attack
                );

            attack.classList.add(
                "played-card",
                "attack-card",
                "play-animation"
            );

            const pos =
                getAttackPosition(index);

            attack.style.left =
                `${pos.x}px`;

            attack.style.top =
                `${pos.y}px`;

            attackZone.appendChild(
                attack
            );


            if(pair.defense){

                const defense =
                    createCardElement(
                        pair.defense
                    );

                defense.classList.add(
                    "played-card",
                    "defense-card",
                    "play-animation"
                );

                const dpos =
                    getDefensePosition(index);

                defense.style.left =
                    `${dpos.x}px`;

                defense.style.top =
                    `${dpos.y}px`;

                defenseZone.appendChild(
                    defense
                );
            }
        }
    );
}


function getAttackPosition(index){

    const cols = 4;

    const col =
        index % cols;

    const row =
        Math.floor(index / cols);

    return {

        x:
            8 +
            col*82,

        y:
            28 +
            row*105
    };
}


function getDefensePosition(index){

    const cols = 4;

    const col =
        index % cols;

    const row =
        Math.floor(index / cols);

    return {

        x:
            31 +
            col*82,

        y:
            7 +
            row*105
    };
}


/* =========================================================
   PLAYER CARD INTERACTION
========================================================= */

function addCardInteraction(el,card){

    let moved = false;

    let startX = 0;
    let startY = 0;

    el.addEventListener(
        "pointerdown",
        event=>{

            if(
                phase !== "player_attack" &&
                phase !== "player_defense"
            ){

                return;
            }

            if(
                !hasCard(
                    playerHand,
                    card.id
                )
            ){

                return;
            }

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved = false;

            selectedCardId =
                card.id;

            renderPlayerHand();

            const fresh =
                playerHandEl.querySelector(
                    `[data-id="${card.id}"]`
                );

            if(!fresh){
                return;
            }

            fresh.setPointerCapture(
                event.pointerId
            );

            const rect =
                fresh.getBoundingClientRect();

            dragState = {

                card,

                element:fresh,

                offsetX:
                    event.clientX -
                    rect.left,

                offsetY:
                    event.clientY -
                    rect.top
            };

            fresh.classList.add(
                "dragging"
            );
        }
    );


    el.addEventListener(
        "pointermove",
        event=>{

            if(
                !dragState ||
                dragState.card.id !== card.id
            ){

                return;
            }

            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;

            if(
                Math.abs(dx)>6 ||
                Math.abs(dy)>6
            ){

                moved = true;
            }

            dragState.element.style.left =
                `${
                    event.clientX -
                    dragState.offsetX
                }px`;

            dragState.element.style.top =
                `${
                    event.clientY -
                    dragState.offsetY
                }px`;

            dragState.element.style.bottom =
                "auto";
        }
    );


    el.addEventListener(
        "pointerup",
        async event=>{

            if(
                !dragState ||
                dragState.card.id !== card.id
            ){

                return;
            }

            const state =
                dragState;

            dragState = null;

            state.element.classList.remove(
                "dragging"
            );

            if(!moved){

                selectedCardId =
                    selectedCardId === card.id
                        ? null
                        : card.id;

                renderAll();

                return;
            }


            const tableRect =
                document
                    .querySelector(".table")
                    .getBoundingClientRect();

            const inside =
                event.clientX >=
                    tableRect.left &&

                event.clientX <=
                    tableRect.right &&

                event.clientY >=
                    tableRect.top &&

                event.clientY <=
                    tableRect.bottom;


            if(!inside){

                selectedCardId = null;

                renderAll();

                return;
            }


            selectedCardId = null;

            await playPlayerCard(card);
        }
    );


    el.addEventListener(
        "pointercancel",
        ()=>{

            dragState = null;

            selectedCardId = null;

            renderAll();
        }
    );
}


/* =========================================================
   PLAYER PLAY
========================================================= */

async function playPlayerCard(card){

    if(
        phase !== "player_attack" &&
        phase !== "player_defense"
    ){

        return;
    }

    if(
        !hasCard(
            playerHand,
            card.id
        )
    ){

        return;
    }


    /* =========================
       PLAYER ATTACK
    ========================= */

    if(
        phase === "player_attack"
    ){

        if(
            !canAddCard(card)
        ){

            showMessage(
                tableAttacks.length === 0
                    ? "Карта недоступна"
                    : "Такую карту нельзя подкинуть"
            );

            renderAll();

            return;
        }

        const moved =
            removeCardById(
                playerHand,
                card.id
            );

        if(!moved){
            return;
        }

        tableAttacks.push({

            attack:moved,

            defense:null
        });

        renderAll();

        showMessage(
            "Ты походил"
        );

        await sleep(450);

        phase =
            "cpu_defense";

        renderAll();

        await cpuDefend();

        return;
    }


    /* =========================
       PLAYER DEFENSE
    ========================= */

    if(
        phase === "player_defense"
    ){

        const index =
            getFirstUnbeatenIndex();

        if(index === -1){

            return;
        }

        const attack =
            tableAttacks[index].attack;

        if(
            !canBeat(
                attack,
                card
            )
        ){

            showMessage(
                "Этой картой побить нельзя"
            );

            renderAll();

            return;
        }

        const moved =
            removeCardById(
                playerHand,
                card.id
            );

        if(!moved){
            return;
        }

        tableAttacks[index].defense =
            moved;

        renderAll();

        showMessage(
            "Карта отбита"
        );

        await sleep(450);

        /*
            Если всё отбито,
            CPU решает — подкидывать
            или закончить атаку.
        */

        if(
            allCardsBeaten()
        ){

            await cpuDecideAttack();

            return;
        }

        phase =
            "player_defense";

        renderAll();
    }
}


/* =========================================================
   CPU DEFENSE
========================================================= */

async function cpuDefend(){

    if(aiBusy){
        return;
    }

    aiBusy = true;

    try{

        if(
            phase !== "cpu_defense"
        ){

            return;
        }

        const index =
            getFirstUnbeatenIndex();

        if(index === -1){

            await cpuDecideAttack();

            return;
        }

        const attack =
            tableAttacks[index].attack;


        const available =
            cpuHand.filter(
                card =>
                    canBeat(
                        attack,
                        card
                    )
            );


        /*
            Ничем побить нельзя.
        */

        if(
            available.length === 0
        ){

            await cpuTake();

            return;
        }


        /*
            AI выбирает минимальную
            достаточную карту.

            Некозырь предпочтительнее
            козыря.

            Среди одинакового типа —
            меньший ранг.
        */

        available.sort(
            (a,b)=>{

                const aTrump =
                    isTrump(a);

                const bTrump =
                    isTrump(b);

                if(
                    aTrump !== bTrump
                ){

                    return aTrump
                        ? 1
                        : -1;
                }

                return (
                    a.value -
                    b.value
                );
            }
        );


        const card =
            available[0];

        await sleep(500);


        const moved =
            removeCardById(
                cpuHand,
                card.id
            );

        if(!moved){
            return;
        }


        tableAttacks[index].defense =
            moved;

        renderAll();

        showMessage(
            "Компьютер отбился"
        );

        await sleep(500);


        /*
            После каждой защиты
            проверяем:

            есть ещё непобитые?
        */

        if(
            !allCardsBeaten()
        ){

            phase =
                "cpu_defense";

            renderAll();

            return;
        }


        /*
            Все карты побиты.
            Теперь AI может решить,
            атаковать ещё или закончить.
        */

        await cpuDecideAttack();

    }finally{

        aiBusy = false;
    }
}


/* =========================================================
   CPU ATTACK DECISION
========================================================= */

async function cpuDecideAttack(){

    if(
        phase !== "cpu_defense"
    ){

        return;
    }

    /*
        Все карты должны быть побиты.
    */

    if(
        !allCardsBeaten()
    ){

        phase =
            "cpu_defense";

        renderAll();

        return;
    }


    /*
        Возможные карты.
    */

    const candidates =
        cpuHand.filter(
            card =>
                canAddCard(card)
        );


    /*
        Если подкинуть нельзя —
        успешный отбой.
    */

    if(
        candidates.length === 0
    ){

        await finishRound();

        return;
    }


    /*
        AI не обязан подкидывать
        любую доступную карту.

        Оцениваем ситуацию.

        Предпочитаем:
        1. некозырную карту;
        2. меньший ранг;
        3. карту, которую выгодно
           сохранить/отдать.
    */

    candidates.sort(
        (a,b)=>{

            const aTrump =
                isTrump(a);

            const bTrump =
                isTrump(b);

            if(
                aTrump !== bTrump
            ){

                return aTrump
                    ? 1
                    : -1;
            }

            return (
                a.value -
                b.value
            );
        }
    );


    /*
        Не подкидываем автоматически
        козырь, если есть обычная карта.
    */

    let card =
        candidates[0];


    /*
        Если у защищающегося
        уже почти нет карт,
        имеет смысл продолжить атаку.

        Если карт много —
        иногда AI завершает раунд.
    */

    const defenderHand =
        defender === "player"
            ? playerHand
            : cpuHand;


    let shouldAttack = true;


    /*
        Если у AI много карт,
        а подкидываемая карта
        не создаёт существенного
        давления — иногда заканчиваем.
    */

    if(
        cpuHand.length <= 2
    ){

        shouldAttack = false;
    }


    /*
        Но если у защищающегося
        осталось мало карт —
        продолжаем давить.
    */

    if(
        defenderHand.length <= 2 &&
        candidates.length > 0
    ){

        shouldAttack = true;
    }


    if(!shouldAttack){

        await finishRound();

        return;
    }


    await sleep(550);


    const moved =
        removeCardById(
            cpuHand,
            card.id
        );

    if(!moved){
        return;
    }


    tableAttacks.push({

        attack:moved,

        defense:null
    });


    renderAll();

    showMessage(
        "Компьютер подкинул"
    );

    await sleep(450);


    /*
        Теперь снова защищается
        игрок.
    */

    phase =
        "player_defense";

    renderAll();
}


/* =========================================================
   CPU TAKE
========================================================= */

async function cpuTake(){

    showMessage(
        "Компьютер забирает карты"
    );

    await sleep(650);


    /*
        Забираются ВСЕ карты,
        включая уже побитые.
    */

    for(
        const pair of tableAttacks
    ){

        cpuHand.push(
            pair.attack
        );

        if(pair.defense){

            cpuHand.push(
                pair.defense
            );
        }
    }


    tableAttacks = [];


    renderAll();

    await sleep(400);


    /*
        Атакующий добирает первым.
    */

    await refillHands();


    if(
        checkGameOver()
    ){

        return;
    }


    /*
        Атакующий сохраняется.
    */

    if(
        attacker === "player"
    ){

        defender =
            "cpu";

        phase =
            "player_attack";

        roundLimit =
            cpuHand.length;

        showMessage(
            "Твой ход продолжается"
        );

    }else{

        defender =
            "player";

        phase =
            "cpu_attack";

        roundLimit =
            playerHand.length;

        await sleep(450);

        await cpuStartAttack();
    }

    renderAll();
}

    ){

        return;
    }


    showMessage(
        "Бито"
    );

    await sleep(700);

        Карты уходят в отбой.

/* =========================================================
   CPU START ATTACK
========================================================= */

async function cpuStartAttack(){

    if(
        phase !== "cpu_attack"
    ){

        return;
    }

    if(
        cpuHand.length === 0
    ){

        checkGameOver();

        return;
    }


    await sleep(550);


    /*
        Для первого хода
        выбираем младшую
        некозырную карту.
    */

    const candidates =
        cpuHand.slice();


    candidates.sort(
        (a,b)=>{

            const aTrump =
                isTrump(a);

            const bTrump =
                isTrump(b);

            if(
                aTrump !== bTrump
            ){

                return aTrump
                    ? 1
                    : -1;
            }

            return (
                a.value -
                b.value
            );
        }
    );


    const card =
        candidates[0];


    const moved =
        removeCardById(
            cpuHand,
            card.id
        );

    if(!moved){
        return;
    }


    tableAttacks.push({

        attack:moved,

        defense:null
    });


    renderAll();

    showMessage(
        "Компьютер атакует"
    );


    await sleep(450);


    phase =
        "player_defense";

    renderAll();
}


/* =========================================================
   ALLOWED CARDS
========================================================= */

function updateAllowedCards(){

    const elements =
        playerHandEl.querySelectorAll(
            ".card"
        );


    elements.forEach(
        el=>{

            const card =
                playerHand.find(
                    c =>
                        c.id ===
                        el.dataset.id
                );

            if(!card){
                return;
            }


            let allowed = false;


            if(
                phase === "player_attack"
            ){

                allowed =
                    canAddCard(card);

            }else if(
                phase === "player_defense"
            ){

                const index =
                    getFirstUnbeatenIndex();

                if(index !== -1){

                    allowed =
                        canBeat(
                            tableAttacks[index].attack,
                            card
                        );
                }
            }


            if(allowed){

                el.classList.add(
                    "allowed"
                );

                el.classList.remove(
                    "not-allowed"
                );

            }else{

                el.classList.remove(
                    "allowed"
                );

                if(
                    phase === "player_attack" ||
                    phase === "player_defense"
                ){

                    el.classList.add(
                        "not-allowed"
                    );
                }
            }
        }
    );
}

/* =========================================================
   GAME OVER
========================================================= */

function checkGameOver(){

    /*
        Пока колода существует,
        победителя нет.
    */

    if(deck.length > 0){
        return false;
    }


    if(
        playerHand.length === 0 &&
        cpuHand.length === 0
    ){

        endGame(
            "Ничья"
        );

        return true;
    }


    if(
        playerHand.length === 0
    ){

        endGame(
            "Ты победил!"
        );

        return true;
    }


    if(
        cpuHand.length === 0
    ){

        endGame(
            "Компьютер победил"
        );

        return true;
    }


    return false;
}


function endGame(text){

    phase =
        "finished";

    renderAll();

    showMessage(text);

    setTimeout(
        ()=>{

            if(tg){

                tg.showAlert(text);

            }else{

                alert(text);
            }

        },
        500
    );
}


/* =========================================================
   DETERMINE FIRST ATTACKER
========================================================= */

function determineFirstAttacker(){

    const playerTrumps =
        playerHand
            .filter(
                card =>
                    isTrump(card)
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    const cpuTrumps =
        cpuHand
            .filter(
                card =>
                    isTrump(card)
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    /*
        Если козырь есть только у одного —
        начинает он.
    */

    if(
        playerTrumps.length > 0 &&
        cpuTrumps.length === 0
    ){

        return "player";
    }


    if(
        cpuTrumps.length > 0 &&
        playerTrumps.length === 0
    ){

        return "cpu";
    }


    /*
        Если козыри есть у обоих —
        меньший козырь начинает.
    */

    if(
        playerTrumps.length > 0 &&
        cpuTrumps.length > 0
    ){

        return (
            playerTrumps[0].value <=
            cpuTrumps[0].value
        )
            ? "player"
            : "cpu";
    }


    /*
        Если козырей нет —
        сравниваем младшие карты.
    */

    const playerMin =
        Math.min(
            ...playerHand.map(
                card => card.value
            )
        );


    const cpuMin =
        Math.min(
            ...cpuHand.map(
                card => card.value
            )
        );


    return (
        playerMin <= cpuMin
    )
        ? "player"
        : "cpu";
}


/* =========================================================
   START
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    async()=>{

        if(gameStarted){
            return;
        }

        gameStarted = true;


        document.getElementById(
            "startScreen"
        ).style.display =
            "none";


        if(
            tg &&
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ){

            const user =
                tg.initDataUnsafe.user;

            playerName =
                user.first_name ||
                user.username ||
                "Игрок";
        }


        document.getElementById(
            "playerName"
        ).innerText =
            playerName;


        /*
            Новая уникальная колода.
        */

        deck =
            createDeck();


        /*
            Последняя карта —
            открытый козырь.
        */

        setupTrump();


        /*
            Раздача.
        */

        await dealInitial();


        /*
            Первый атакующий.
        */

        attacker =
            determineFirstAttacker();


        if(
            attacker === "player"
        ){

            defender =
                "cpu";

            phase =
                "player_attack";

            roundLimit =
                cpuHand.length;

            showMessage(
                "Твой ход"
            );

        }else{

            defender =
                "player";

            phase =
                "cpu_attack";

            roundLimit =
                playerHand.length;

            showMessage(
                "Компьютер начинает"
            );

            renderAll();

            await sleep(700);

            await cpuStartAttack();
        }


        renderAll();
    }
);


/* =========================================================
   INITIAL
========================================================= */

renderAll();

updateInfo();

</script>

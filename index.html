<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

body {
    min-height: 100vh;
}

#app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center,
            #171717 0%,
            #0c0c0c 48%,
            #050505 100%
        );
}

/* =====================================================
   TOP
===================================================== */

.topbar {
    position: absolute;
    top: env(safe-area-inset-top, 8px);
    left: 0;
    right: 0;
    height: 48px;
    padding: 8px 14px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    z-index: 500;
}

.logo-small {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ddd;
}

.game-info {
    display: flex;
    gap: 6px;
}

.info-pill {
    padding: 6px 9px;
    border-radius: 8px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);

    color: #777;
    font-size: 9px;
}

.info-pill b {
    color: #eee;
}

/* =====================================================
   TABLE
===================================================== */

.table {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(96vw, 680px);
    height: min(82vh, 650px);

    transform: translate(-50%, -50%);

    overflow: visible;

    z-index: 1;
}

/*
    Никакой рамки у стола.
*/

.table::before {
    display: none;
}

/* =====================================================
   OPPONENT
===================================================== */

.opponent {
    position: absolute;

    top: 5.5vh;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    text-align: center;
}

.opponent-avatar {
    width: 48px;
    height: 48px;

    margin: auto;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;
    border: 1px solid #444;

    font-size: 20px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.55);
}

.opponent-name {
    margin-top: 5px;

    font-size: 11px;
    font-weight: 800;

    color: #ddd;
}

.opponent-count {
    margin-top: 3px;

    font-size: 10px;
    color: #777;
}

/* =====================================================
   PLAYER
===================================================== */

.player-info {
    position: absolute;

    bottom: 8vh;
    left: 50%;

    transform: translateX(-50%);

    z-index: 400;

    text-align: center;
}

.player-name {
    font-size: 12px;
    font-weight: 900;
}

.player-count {
    margin-top: 3px;

    color: #777;
    font-size: 10px;
}

/* =====================================================
   DECK
===================================================== */

.deck-area {
    position: absolute;

    left: 17%;
    top: 50%;

    width: 145px;
    height: 125px;

    transform: translate(-50%, -50%);

    z-index: 20;
}

/*
    Козырь находится ПОД колодой.
*/

.trump-card {
    position: absolute;

    left: 65px;
    top: 24px;

    width: 72px;
    height: 102px;

    z-index: 1;

    transform:
        rotate(76deg)
        translateY(2px);
}

.deck {
    position: absolute;

    left: 0;
    top: 12px;

    width: 72px;
    height: 102px;

    z-index: 5;

    transform: rotate(-6deg);
}

.deck-card {
    position: absolute;

    inset: 0;

    border-radius: 9px;

    border: 1px solid #777;

    background:
        linear-gradient(
            45deg,
            transparent 43%,
            rgba(255,255,255,.18) 44%,
            rgba(255,255,255,.18) 56%,
            transparent 57%
        ),
        linear-gradient(
            -45deg,
            transparent 43%,
            rgba(255,255,255,.13) 44%,
            rgba(255,255,255,.13) 56%,
            transparent 57%
        ),
        #111;

    box-shadow:
        0 8px 20px rgba(0,0,0,.6);
}

.deck-card::after {
    content: "HL";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 34px;
    height: 34px;

    border: 1px solid #777;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;

    color: #ddd;
}

.deck-card:nth-child(1) {
    transform: translate(-5px,-5px);
}

.deck-card:nth-child(2) {
    transform: translate(-2px,-2px);
}

.deck-card:nth-child(3) {
    transform: translate(0,0);
}

.deck-empty {
    position: absolute;

    left: 10px;
    top: 44px;

    color: #666;

    font-size: 9px;
}

/* =====================================================
   CARDS
===================================================== */

.card {
    position: absolute;

    width: 72px;
    height: 102px;

    border-radius: 9px;

    background: #f4f4f4;

    color: #111;

    border: 1px solid #ccc;

    box-shadow:
        0 7px 18px rgba(0,0,0,.48),
        inset 0 0 0 1px rgba(0,0,0,.06);

    overflow: hidden;

    font-weight: 900;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        opacity .2s ease;
}

.card.red {
    color: #222;
}

.card-value {
    position: absolute;

    left: 7px;
    top: 5px;

    font-size: 16px;
}

.card-suit {
    position: absolute;

    left: 8px;
    top: 25px;

    font-size: 16px;
}

.card-center {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    font-size: 30px;
}

.card-corner {
    position: absolute;

    right: 6px;
    bottom: 4px;

    transform: rotate(180deg);

    font-size: 11px;
}

/* =====================================================
   BACK
===================================================== */

.card.back {
    background:
        linear-gradient(
            45deg,
            transparent 42%,
            rgba(255,255,255,.18) 43%,
            rgba(255,255,255,.18) 57%,
            transparent 58%
        ),
        linear-gradient(
            -45deg,
            transparent 42%,
            rgba(255,255,255,.12) 43%,
            rgba(255,255,255,.12) 57%,
            transparent 58%
        ),
        #111;

    border: 1px solid #777;
}

.card.back::after {
    content: "HL";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: 36px;
    height: 36px;

    border: 1px solid #777;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;

    color: #ddd;
}

/* =====================================================
   HAND
===================================================== */

.hand {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 96%;
    height: 145px;

    transform: translateX(-50%);

    z-index: 300;

    pointer-events: none;
}

.hand .card {
    pointer-events: auto;

    transform-origin: center bottom;

    cursor: pointer;
}

/*
    Разрешённая карта.
*/

.card.allowed {
    box-shadow:
        0 0 0 2px #fff,
        0 10px 28px rgba(255,255,255,.14);

    transform:
        translateY(-9px)
        scale(1.04);
}

/*
    Неразрешённые карты слегка затемняются.
*/

.card.disabled {
    opacity: .48;
}

/*
    Выбранная карта остаётся
    в руке.
*/

.card.selected {
    box-shadow:
        0 0 0 3px #fff,
        0 15px 35px rgba(0,0,0,.75);

    transform:
        translateY(-18px)
        scale(1.06);
}

/* =====================================================
   OPPONENT HAND
===================================================== */

.opponent-hand {
    position: absolute;

    top: 0;
    left: 50%;

    width: 250px;
    height: 105px;

    transform: translateX(-50%);

    z-index: 70;
}

/* =====================================================
   PLAYED ZONES
===================================================== */

.attack-zone,
.defense-zone {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 340px;
    height: 250px;

    transform: translate(-50%,-50%);

    z-index: 150;

    pointer-events: none;
}

/*
    Игровая карта на столе.
*/

.played-card {
    position: absolute;

    width: 72px;
    height: 102px;

    transition:
        left .38s cubic-bezier(.2,.8,.2,1),
        top .38s cubic-bezier(.2,.8,.2,1),
        transform .38s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls {
    position: absolute;

    left: 50%;
    bottom: 18vh;

    transform: translateX(-50%);

    z-index: 600;

    display: flex;
    gap: 7px;

    width: 100%;

    justify-content: center;

    pointer-events: none;
}

.control-btn {
    pointer-events: auto;

    padding: 11px 18px;

    border-radius: 10px;

    border: 1px solid #333;

    background: #111;

    color: #eee;

    font-size: 10px;
    font-weight: 900;

    box-shadow:
        0 7px 20px rgba(0,0,0,.4);
}

.control-btn.primary {
    background: #eee;
    color: #080808;

    border-color: #eee;
}

.control-btn.danger {
    background: #222;
    color: #fff;
}

.control-btn:active {
    transform: scale(.95);
}

/* =====================================================
   MESSAGE
===================================================== */

.message {
    position: absolute;

    top: 13vh;
    left: 50%;

    transform: translateX(-50%);

    z-index: 700;

    padding: 8px 13px;

    border-radius: 9px;

    background: rgba(10,10,10,.88);

    border: 1px solid #292929;

    color: #ddd;

    font-size: 10px;

    white-space: nowrap;

    opacity: 0;

    transition: opacity .25s ease;
}

.message.show {
    opacity: 1;
}

/* =====================================================
   START
===================================================== */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 1000;

    background:
        radial-gradient(
            circle at center,
            #171717,
            #050505 70%
        );

    display: flex;

    align-items: center;
    justify-content: center;
}

.start-box {
    width: 84%;
    max-width: 340px;

    text-align: center;
}

.start-logo {
    font-size: 28px;

    font-weight: 900;

    letter-spacing: 5px;
}

.start-sub {
    margin-top: 8px;

    font-size: 9px;

    letter-spacing: 4px;

    color: #666;
}

.start-button {
    width: 100%;

    margin-top: 30px;

    padding: 16px;

    border: 0;

    border-radius: 12px;

    background: #eee;

    color: #080808;

    font-size: 13px;

    font-weight: 900;
}

/* =====================================================
   DRAG
===================================================== */

.card.dragging {
    position: fixed !important;

    z-index: 2000 !important;

    transition: none !important;

    pointer-events: none;

    transform:
        scale(1.08)
        rotate(0deg) !important;

    box-shadow:
        0 25px 50px rgba(0,0,0,.8);
}

/* =====================================================
   DEAL ANIMATION
===================================================== */

.deal-animation {
    animation:
        dealCard .24s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes dealCard {

    0% {
        opacity: 0;

        transform:
            translate(
                0,
                100px
            )
            scale(.65)
            rotate(8deg);
    }

    100% {
        opacity: 1;
    }
}

/* =====================================================
   PLAY ANIMATION
===================================================== */

@keyframes playCard {

    0% {
        opacity: 0;

        transform:
            scale(.65)
            rotate(-12deg);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:380px) {

    .card,
    .played-card {
        width: 64px;
        height: 91px;
    }

    .deck,
    .trump-card {
        width: 64px;
        height: 91px;
    }

    .deck-area {
        left: 15%;
    }

    .attack-zone,
    .defense-zone {
        width: 300px;
    }

    .hand {
        height: 130px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =================================================
         TOP
    ================================================== -->

    <div class="topbar">

        <div class="logo-small">
            HEAVY LUX CARD
        </div>

        <div class="game-info">

            <div class="info-pill">
                КОЗЫРЬ:
                <b id="trumpInfo">—</b>
            </div>

            <div class="info-pill">
                КОЛОДА:
                <b id="deckCount">0</b>
            </div>

        </div>

    </div>


    <!-- =================================================
         MESSAGE
    ================================================== -->

    <div id="message" class="message">
        Ваш ход
    </div>


    <!-- =================================================
         OPPONENT
    ================================================== -->

    <div class="opponent">

        <div class="opponent-avatar">
            AI
        </div>

        <div class="opponent-name">
            Heavy AI
        </div>

        <div class="opponent-count">
            Карт:
            <b id="opponentCount">0</b>
        </div>

    </div>


    <div
        id="opponentHand"
        class="opponent-hand"
    ></div>


    <!-- =================================================
         TABLE
    ================================================== -->

    <div class="table">

        <!-- DECK -->

        <div class="deck-area">

            <div
                id="trumpCard"
                class="card trump-card"
            ></div>

            <div
                id="deck"
                class="deck"
            >

                <div class="deck-card"></div>
                <div class="deck-card"></div>
                <div class="deck-card"></div>

            </div>

        </div>


        <!-- ATTACK -->

        <div
            id="attackZone"
            class="attack-zone"
        ></div>


        <!-- DEFENSE -->

        <div
            id="defenseZone"
            class="defense-zone"
        ></div>

    </div>


    <!-- =================================================
         PLAYER
    ================================================== -->

    <div class="player-info">

        <div
            id="playerName"
            class="player-name"
        >
            Игрок
        </div>

        <div class="player-count">
            Карт:
            <b id="playerCount">0</b>
        </div>

    </div>


    <!-- =================================================
         PLAYER HAND
    ================================================== -->

    <div
        id="playerHand"
        class="hand"
    ></div>


    <!-- =================================================
         CONTROLS
    ================================================== -->

    <div class="controls">

        <button
            id="takeButton"
            class="control-btn danger"
            style="display:none"
        >
            ВЗЯТЬ
        </button>

        <button
            id="beatButton"
            class="control-btn primary"
            style="display:none"
        >
            БИТО
        </button>

        <button
            id="endAttackButton"
            class="control-btn"
            style="display:none"
        >
            ЗАКОНЧИТЬ
        </button>

    </div>


    <!-- =================================================
         START
    ================================================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-box">

            <div class="start-logo">
                HEAVY LUX
            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

            <button
                id="startButton"
                class="start-button"
            >
                НАЧАТЬ ИГРУ
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================================
   CARD DATA
===================================================== */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [
    ["6", 6],
    ["7", 7],
    ["8", 8],
    ["9", 9],
    ["10", 10],
    ["В", 11],
    ["Д", 12],
    ["К", 13],
    ["Т", 14]
];


/* =====================================================
   GAME STATE
===================================================== */

/*
    Единая модель состояния:

    phase:

    WAITING
    PLAYER_ATTACK
    CPU_ATTACK
    PLAYER_DEFENSE
    CPU_DEFENSE
    FINISHED
*/

const PHASE = {

    WAITING: "waiting",

    PLAYER_ATTACK: "player_attack",

    CPU_ATTACK: "cpu_attack",

    PLAYER_DEFENSE: "player_defense",

    CPU_DEFENSE: "cpu_defense",

    FINISHED: "finished"

};

let phase = PHASE.WAITING;


/*
    attacker и defender меняются
    ТОЛЬКО между розыгрышами.
*/

let attacker = null;
let defender = null;


/*
    Карты.
*/

let deck = [];

let playerHand = [];

let cpuHand = [];


/*
    Козырь.
*/

let trumpSuit = null;


/*
    Карты текущего розыгрыша.

    attackCards[i]
    соответствует
    defenseCards[i].
*/

let attackCards = [];

let defenseCards = [];


/*
    Сколько карт максимум можно
    положить в текущем розыгрыше.

    Фиксируется в момент первого
    хода атакующего.
*/

let attackLimit = 0;


/*
    Выбранная карта игрока.
*/

let selectedCardId = null;


/*
    Drag.
*/

let dragState = null;


/*
    Имя игрока.
*/

let playerName = "Игрок";


/* =====================================================
   DOM
===================================================== */

const playerHandEl =
    document.getElementById("playerHand");

const opponentHandEl =
    document.getElementById("opponentHand");

const attackZone =
    document.getElementById("attackZone");

const defenseZone =
    document.getElementById("defenseZone");

const trumpCardEl =
    document.getElementById("trumpCard");

const deckEl =
    document.getElementById("deck");

const messageEl =
    document.getElementById("message");

const takeButton =
    document.getElementById("takeButton");

const beatButton =
    document.getElementById("beatButton");

const endAttackButton =
    document.getElementById("endAttackButton");

const startButton =
    document.getElementById("startButton");

const startScreen =
    document.getElementById("startScreen");


/* =====================================================
   UTILS
===================================================== */

function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


function isRed(card) {

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


function cardId(card) {

    return card.id;
}


function sleepAnimation() {

    return sleep(280);
}


/* =====================================================
   CREATE DECK
===================================================== */

function createDeck() {

    const result = [];

    for (const suit of SUITS) {

        for (const [rank, value] of RANKS) {

            result.push({

                id:
                    `${rank}-${suit}-${Math.random()
                        .toString(36)
                        .slice(2)}`,

                rank,

                value,

                suit

            });
        }
    }

    return shuffle(result);
}


/* =====================================================
   CARD STRENGTH
===================================================== */

function cardStrength(card) {

    if (card.suit === trumpSuit) {

        return 100 + card.value;
    }

    return card.value;
}


/* =====================================================
   CAN BEAT
===================================================== */

function canBeat(
    attackCard,
    defenseCard
) {

    if (
        !attackCard ||
        !defenseCard
    ) {
        return false;
    }


    /*
        Козырь бьёт обычную карту.
    */

    if (
        defenseCard.suit === trumpSuit &&
        attackCard.suit !== trumpSuit
    ) {

        return true;
    }


    /*
        Обычная карта не бьёт козырь.
    */

    if (
        attackCard.suit === trumpSuit &&
        defenseCard.suit !== trumpSuit
    ) {

        return false;
    }


    /*
        Одинаковая масть —
        только старшая карта.
    */

    return (
        attackCard.suit === defenseCard.suit &&
        defenseCard.value > attackCard.value
    );
}


/* =====================================================
   CAN ADD
===================================================== */

function getTableRanks() {

    return [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ]
        .map(card => card.rank);
}


function canAddCard(card) {

    if (!card) {
        return false;
    }

    if (
        attackCards.length >= attackLimit
    ) {
        return false;
    }


    /*
        Первая карта атаки.
    */

    if (
        attackCards.length === 0
    ) {

        return true;
    }


    return getTableRanks()
        .includes(card.rank);
}


/* =====================================================
   GET NEXT UNBEATEN
===================================================== */

function getNextUnbeatenIndex() {

    for (
        let i = 0;
        i < attackCards.length;
        i++
    ) {

        if (!defenseCards[i]) {
            return i;
        }
    }

    return -1;
}


/* =====================================================
   ALL BEATEN
===================================================== */

function allCardsBeaten() {

    return (
        attackCards.length > 0 &&
        getNextUnbeatenIndex() === -1
    );
}


/* =====================================================
   CURRENT ATTACK COUNT
===================================================== */

function currentAttackCount() {

    return attackCards.length;
}


/* =====================================================
   REMOVE CARD
===================================================== */

function removeCardFromHand(
    hand,
    cardIdValue
) {

    const index =
        hand.findIndex(
            card =>
                card.id === cardIdValue
        );

    if (index === -1) {
        return null;
    }

    return hand.splice(index, 1)[0];
}


/* =====================================================
   CREATE CARD
===================================================== */

function createCardElement(card) {

    const el =
        document.createElement("div");

    el.className =
        "card" +
        (isRed(card) ? " red" : "");

    el.dataset.id =
        card.id;

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;
}


/* =====================================================
   BACK CARD
===================================================== */

function createBackCard() {

    const el =
        document.createElement("div");

    el.className =
        "card back";

    return el;
}


/* =====================================================
   RENDER TRUMP
===================================================== */

function renderTrump(card) {

    trumpCardEl.className =
        "card trump-card" +
        (isRed(card) ? " red" : "");

    trumpCardEl.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;
}


/* =====================================================
   SORT HAND
===================================================== */

function sortHand(hand) {

    return hand.sort(
        (a,b) => {

            const aTrump =
                a.suit === trumpSuit;

            const bTrump =
                b.suit === trumpSuit;

            if (
                aTrump &&
                !bTrump
            ) {
                return 1;
            }

            if (
                !aTrump &&
                bTrump
            ) {
                return -1;
            }

            return a.value - b.value;
        }
    );
}


/* =====================================================
   IS PLAYER CARD ALLOWED
===================================================== */

function isPlayerCardAllowed(card) {

    if (
        phase === PHASE.PLAYER_ATTACK
    ) {

        return canAddCard(card);
    }


    if (
        phase === PHASE.PLAYER_DEFENSE
    ) {

        const index =
            getNextUnbeatenIndex();

        if (index === -1) {
            return false;
        }

        return canBeat(
            attackCards[index],
            card
        );
    }


    return false;
}


/* =====================================================
   RENDER HANDS
===================================================== */

function renderHands() {

    sortHand(playerHand);

    playerHandEl.innerHTML = "";


    const count =
        playerHand.length;

    const spacing =
        count <= 7
            ? 52
            : 42;

    playerHand.style.width =
        `${Math.max(
            100,
            count * spacing
        )}px`;


    playerHand.forEach(
        (card,index) => {

            const el =
                createCardElement(card);

            const offset =
                (
                    index -
                    (count - 1) / 2
                ) * spacing;

            el.style.left =
                `calc(50% + ${offset}px - 36px)`;

            el.style.bottom =
                "3px";


            /*
                Разрешённая карта.
            */

            if (
                isPlayerCardAllowed(card)
            ) {

                el.classList.add(
                    "allowed"
                );

            } else {

                el.classList.add(
                    "disabled"
                );
            }


            /*
                Выбранная карта.
            */

            if (
                selectedCardId === card.id
            ) {

                el.classList.add(
                    "selected"
                );
            }


            /*
                Угол веера.
            */

            const angle =
                (
                    index -
                    (count - 1) / 2
                ) * 2.3;

            el.style.transform =
                `rotate(${angle}deg)`;


            addPlayerCardEvents(
                el,
                card
            );

            playerHandEl.appendChild(el);

        }
    );


    /*
        CPU.
    */

    opponentHandEl.innerHTML = "";

    const cpuCount =
        cpuHand.length;

    const cpuSpacing =
        cpuCount <= 8
            ? 28
            : 23;

    opponentHandEl.style.width =
        `${Math.max(
            100,
            cpuCount * cpuSpacing
        )}px`;


    cpuHand.forEach(
        (card,index) => {

            const el =
                createBackCard();

            const offset =
                (
                    index -
                    (cpuCount - 1) / 2
                ) * cpuSpacing;

            el.style.left =
                `calc(50% + ${offset}px - 36px)`;

            el.style.top =
                `${Math.abs(
                    index -
                    (cpuCount - 1) / 2
                ) * .8}px`;

            el.style.transform =
                `rotate(${
                    (
                        index -
                        (cpuCount - 1) / 2
                    ) * 3
                }deg)`;

            opponentHandEl.appendChild(el);
        }
    );


    updateCounters();
}


/* =====================================================
   PLAYER CARD EVENTS
===================================================== */

function addPlayerCardEvents(
    el,
    card
) {

    let pointerStartX = 0;
    let pointerStartY = 0;
    let moved = false;


    el.addEventListener(
        "pointerdown",
        event => {

            if (
                !isPlayerCardAllowed(card)
            ) {

                return;
            }

            pointerStartX =
                event.clientX;

            pointerStartY =
                event.clientY;

            moved = false;


            const rect =
                el.getBoundingClientRect();


            dragState = {

                card,

                element: el,

                offsetX:
                    event.clientX -
                    rect.left,

                offsetY:
                    event.clientY -
                    rect.top,

                pointerId:
                    event.pointerId
            };


            el.setPointerCapture(
                event.pointerId
            );
        }
    );


    el.addEventListener(
        "pointermove",
        event => {

            if (
                !dragState ||
                dragState.card.id !== card.id
            ) {

                return;
            }


            const dx =
                event.clientX -
                pointerStartX;

            const dy =
                event.clientY -
                pointerStartY;


            if (
                Math.abs(dx) > 7 ||
                Math.abs(dy) > 7
            ) {

                moved = true;
            }


            if (!moved) {
                return;
            }


            el.classList.add(
                "dragging"
            );


            el.style.left =
                `${event.clientX -
                    dragState.offsetX}px`;

            el.style.top =
                `${event.clientY -
                    dragState.offsetY}px`;

            el.style.bottom =
                "auto";
        }
    );


    el.addEventListener(
        "pointerup",
        async event => {

            if (
                !dragState ||
                dragState.card.id !== card.id
            ) {

                return;
            }


            const wasDragged =
                moved;


            dragState = null;


            if (
                wasDragged
            ) {

                const tableRect =
                    document
                        .querySelector(".table")
                        .getBoundingClientRect();


                const insideTable =
                    event.clientX >=
                        tableRect.left &&
                    event.clientX <=
                        tableRect.right &&
                    event.clientY >=
                        tableRect.top &&
                    event.clientY <=
                        tableRect.bottom;


                if (
                    insideTable
                ) {

                    el.classList.remove(
                        "dragging"
                    );

                    selectedCardId = null;

                    await playerPlayCard(
                        card
                    );

                    return;
                }
            }


            /*
                Если просто нажали —
                только выбираем карту.
            */

            el.classList.remove(
                "dragging"
            );

            selectedCardId =
                selectedCardId === card.id
                    ? null
                    : card.id;

            renderHands();
        }
    );


    el.addEventListener(
        "pointercancel",
        () => {

            dragState = null;

            renderHands();
        }
    );


    /*
        Повторный клик по выбранной карте
        отправляет её на стол.
    */

    el.addEventListener(
        "click",
        async () => {

            if (
                selectedCardId !== card.id
            ) {

                return;
            }


            selectedCardId = null;

            await playerPlayCard(
                card
            );
        }
    );
}


/* =====================================================
   PLAYER PLAY
===================================================== */

async function playerPlayCard(card) {

    if (
        phase !== PHASE.PLAYER_ATTACK &&
        phase !== PHASE.PLAYER_DEFENSE
    ) {

        return;
    }


    if (
        !isPlayerCardAllowed(card)
    ) {

        showMessage(
            "Эту карту сейчас нельзя положить"
        );

        return;
    }


    /*
        АТАКА
    */

    if (
        phase === PHASE.PLAYER_ATTACK
    ) {

        /*
            Если это первая карта —
            фиксируем лимит.
        */

        if (
            attackCards.length === 0
        ) {

            attackLimit =
                cpuHand.length;
        }


        /*
            Удаляем карту из руки
            только сейчас.
        */

        const removed =
            removeCardFromHand(
                playerHand,
                card.id
            );

        if (!removed) {
            return;
        }


        attackCards.push(
            removed
        );


        selectedCardId = null;

        renderHands();


        await animateCardToTable(
            removed,
            attackZone,
            attackCards.length - 1,
            false
        );


        /*
            После каждой карты игрока
            компьютер должен защищаться.
        */

        phase =
            PHASE.CPU_DEFENSE;

        showMessage(
            "Компьютер отбивается..."
        );

        renderHands();

        await sleep(450);

        await cpuDefense();

        return;
    }


    /*
        ЗАЩИТА
    */

    if (
        phase === PHASE.PLAYER_DEFENSE
    ) {

        const index =
            getNextUnbeatenIndex();

        if (
            index === -1
        ) {

            return;
        }


        const target =
            attackCards[index];


        if (
            !canBeat(
                target,
                card
            )
        ) {

            showMessage(
                "Этой картой побить нельзя"
            );

            return;
        }


        const removed =
            removeCardFromHand(
                playerHand,
                card.id
            );

        if (!removed) {
            return;
        }


        defenseCards[index] =
            removed;

        selectedCardId = null;

        renderHands();


        await animateCardToTable(
            removed,
            defenseZone,
            index,
            true
        );


        /*
            ВАЖНО:
            игрок не заканчивает защиту
            автоматически.

            Если компьютер может
            подкинуть — он получает
            возможность подкинуть.

            Если не может —
            игрок должен нажать БИТО.
        */

        await sleep(350);

        await cpuContinueAttack();

        return;
    }
}


/* =====================================================
   CPU DEFENSE
===================================================== */

async function cpuDefense() {

    if (
        phase !== PHASE.CPU_DEFENSE
    ) {

        return;
    }


    const index =
        getNextUnbeatenIndex();


    /*
        Всё уже побито.
    */

    if (
        index === -1
    ) {

        await cpuContinueAttack();

        return;
    }


    const target =
        attackCards[index];


    /*
        Ищем минимальную карту,
        которой можно побить.
    */

    const options =
        cpuHand
            .filter(
                card =>
                    canBeat(
                        target,
                        card
                    )
            )
            .sort(
                (a,b) =>
                    cardStrength(a) -
                    cardStrength(b)
            );


    /*
        Не может отбиться.
    */

    if (
        options.length === 0
    ) {

        await sleep(600);

        await cpuTakeCards();

        return;
    }


    /*
        Берём минимальную
        подходящую карту.
    */

    const card =
        options[0];


    cpuHand =
        cpuHand.filter(
            c =>
                c.id !== card.id
        );


    defenseCards[index] =
        card;


    renderHands();


    await animateCardToTable(
        card,
        defenseZone,
        index,
        true
    );


    await sleep(350);


    /*
        Теперь проверяем:
        остались ли непобитые карты.
    */

    await cpuDefense();
}


/* =====================================================
   CPU CONTINUE ATTACK
===================================================== */

async function cpuContinueAttack() {

    /*
        Это вызывается после того,
        как все текущие карты побиты.
    */

    if (
        phase !== PHASE.CPU_DEFENSE
    ) {

        return;
    }


    if (
        !allCardsBeaten()
    ) {

        await cpuDefense();

        return;
    }


    /*
        Теперь компьютер является
        защитником.

        Но атаковать дополнительными
        картами должен игрок.

        Поэтому компьютер НЕ подкидывает
        здесь свои карты.
    */

    /*
        Эта функция нужна только для
        проверки окончания защиты
        компьютера.
    */

    /*
        После полной защиты компьютер
        может считать раунд завершённым,
        но сам не должен менять
        состояние до подтверждения
        игрока? Нет.

        Здесь компьютер уже знает,
        что все карты побиты,
        поэтому раунд можно завершить.
    */

    await finishSuccessfulDefense();
}


/* =====================================================
   CPU TAKE
===================================================== */

async function cpuTakeCards() {

    showMessage(
        "Компьютер не отбился — берёт"
    );


    await sleep(600);


    /*
        Все карты со стола.
    */

    const cardsToTake = [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ];


    cpuHand.push(
        ...cardsToTake
    );


    /*
        Очищаем стол.
    */

    attackCards = [];

    defenseCards = [];


    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";


    renderHands();


    /*
        Атакующий добирает первым.
    */

    await refillHands();


    renderHands();


    /*
        Критическая проверка.

        Компьютер был защитником.
        Поэтому атакующий остаётся игроком.
    */

    if (
        playerHand.length === 0 ||
        cpuHand.length === 0
    ) {

        checkGameOver();

        if (
            phase === PHASE.FINISHED
        ) {

            return;
        }
    }


    attacker =
        "player";

    defender =
        "cpu";

    phase =
        PHASE.PLAYER_ATTACK;


    /*
        Лимит нового розыгрыша
        определяется картами CPU.
    */

    attackLimit =
        cpuHand.length;


    updateButtons();

    renderHands();


    showMessage(
        "Компьютер взял. Твой ход"
    );
}


/* =====================================================
   PLAYER TAKE
===================================================== */

async function playerTakeCards() {

    if (
        phase !== PHASE.PLAYER_DEFENSE
    ) {

        return;
    }


    const cardsToTake = [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ];


    playerHand.push(
        ...cardsToTake
    );


    attackCards = [];

    defenseCards = [];


    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";


    selectedCardId = null;


    renderHands();


    showMessage(
        "Ты взял карты"
    );


    await sleep(400);


    /*
        Атакующий — компьютер.

        Он добирает первым.
    */

    await refillHands();


    renderHands();


    if (
        checkGameOver()
    ) {

        return;
    }


    /*
        Компьютер продолжает атаку.
    */

    attacker =
        "cpu";

    defender =
        "player";

    phase =
        PHASE.CPU_ATTACK;


    attackLimit =
        playerHand.length;


    updateButtons();


    showMessage(
        "Компьютер продолжает атаку"
    );


    await sleep(500);


    await cpuStartAttack();
}


/* =====================================================
   CPU START ATTACK
===================================================== */

async function cpuStartAttack() {

    if (
        phase !== PHASE.CPU_ATTACK
    ) {

        return;
    }


    if (
        cpuHand.length === 0
    ) {

        checkGameOver();

        return;
    }


    /*
        Если это первый ход
        нового розыгрыша — лимит
        равен картам защитника.
    */

    if (
        attackCards.length === 0
    ) {

        attackLimit =
            playerHand.length;
    }


    const candidates =
        getCpuAddCandidates();


    /*
        Первый удар — любая карта.
    */

    let card;


    if (
        attackCards.length === 0
    ) {

        card =
            chooseCpuAttackCard(
                cpuHand
            );

    } else {

        if (
            candidates.length === 0
        ) {

            /*
                Больше подкинуть нельзя.
                Но это относится только
                к ситуации, когда CPU
                уже атакует.
            */

            await finishSuccessfulDefense();

            return;
        }


        card =
            chooseCpuAttackCard(
                candidates
            );
    }


    await cpuPlayAttackCard(
        card
    );
}


/* =====================================================
   CPU CONTINUE ATTACK AFTER PLAYER DEFENSE
===================================================== */

async function cpuTryAddCard() {

    if (
        phase !== PHASE.PLAYER_DEFENSE
    ) {

        return false;
    }


    /*
        Если игрок ещё не отбил
        все карты — CPU должен ждать.
    */

    if (
        getNextUnbeatenIndex() !== -1
    ) {

        return false;
    }


    const candidates =
        getCpuAddCandidates();


    /*
        Лимит достигнут.
    */

    if (
        attackCards.length >=
        attackLimit
    ) {

        return false;
    }


    if (
        candidates.length === 0
    ) {

        return false;
    }


    const card =
        chooseCpuAttackCard(
            candidates
        );


    await sleep(450);


    await cpuPlayAttackCard(
        card
    );


    return true;
}


/* =====================================================
   CPU PLAY ATTACK CARD
===================================================== */

async function cpuPlayAttackCard(card) {

    const removed =
        removeCardFromHand(
            cpuHand,
            card.id
        );


    if (!removed) {
        return;
    }


    attackCards.push(
        removed
    );


    renderHands();


    await animateCardToTable(
        removed,
        attackZone,
        attackCards.length - 1,
        false
    );


    /*
        После атаки CPU игрок
        должен защищаться.
    */

    phase =
        PHASE.PLAYER_DEFENSE;


    showMessage(
        "Твоя защита"
    );


    updateButtons();

    renderHands();
}


/* =====================================================
   CPU ADD CANDIDATES
===================================================== */

function getCpuAddCandidates() {

    if (
        attackCards.length === 0
    ) {

        return cpuHand.slice();
    }


    const ranks =
        getTableRanks();


    return cpuHand.filter(
        card =>
            ranks.includes(card.rank)
    );
}


/* =====================================================
   CPU ATTACK CHOICE
===================================================== */

function chooseCpuAttackCard(
    candidates
) {

    if (
        candidates.length === 0
    ) {

        return null;
    }


    /*
        Предпочитаем:
        1. некозырную карту;
        2. младшую;
        3. карту с рангом,
           который уже есть на столе.
    */

    return candidates
        .slice()
        .sort(
            (a,b) => {

                const aTrump =
                    a.suit === trumpSuit;

                const bTrump =
                    b.suit === trumpSuit;


                if (
                    aTrump !== bTrump
                ) {

                    return aTrump
                        ? 1
                        : -1;
                }


                return (
                    a.value -
                    b.value
                );
            }
        )[0];
}


/* =====================================================
   PLAYER BEAT BUTTON
===================================================== */

beatButton.addEventListener(
    "click",
    async () => {

        if (
            phase !== PHASE.PLAYER_DEFENSE
        ) {

            return;
        }


        /*
            Нельзя нажать БИТО,
            если есть непобитая карта.
        */

        if (
            getNextUnbeatenIndex() !== -1
        ) {

            showMessage(
                "Сначала отбей все карты"
            );

            return;
        }


        /*
            ВАЖНО:
            компьютер ещё может иметь
            допустимую карту для подкидывания.

            Поэтому при нажатии БИТО
            сначала проверяем это.

            В классическом варианте игрок
            не может завершить раунд,
            если соперник имеет допустимую
            карту для подкидывания.
        */

        const cpuCandidates =
            getCpuAddCandidates();


        if (
            cpuCandidates.length > 0 &&
            attackCards.length < attackLimit
        ) {

            showMessage(
                "Компьютер ещё может подкинуть"
            );

            await cpuTryAddCard();

            return;
        }


        await finishSuccessfulDefense();
    }
);


/* =====================================================
   TAKE BUTTON
===================================================== */

takeButton.addEventListener(
    "click",
    async () => {

        await playerTakeCards();
    }
);


/* =====================================================
   END ATTACK
===================================================== */

endAttackButton.addEventListener(
    "click",
    async () => {

        if (
            phase !== PHASE.PLAYER_ATTACK
        ) {

            return;
        }


        if (
            attackCards.length === 0
        ) {

            return;
        }


        /*
            Игрок решил закончить
            подкидывание.

            Компьютер отбивается.
        */

        phase =
            PHASE.CPU_DEFENSE;


        updateButtons();


        showMessage(
            "Компьютер отбивается..."
        );


        await sleep(400);


        await cpuDefense();
    }
);


/* =====================================================
   CPU RESPONSE AFTER PLAYER BEAT
===================================================== */

async function cpuContinueAfterPlayerDefense() {

    /*
        Если все карты побиты,
        компьютер имеет возможность
        подкинуть.
    */

    if (
        getNextUnbeatenIndex() !== -1
    ) {

        return;
    }


    const added =
        await cpuTryAddCard();


    if (
        added
    ) {

        return;
    }


    /*
        CPU больше ничего добавить
        не может.

        Игрок должен нажать БИТО.
    */

    updateButtons();

    renderHands();
}


/* =====================================================
   FINISH SUCCESSFUL DEFENSE
===================================================== */

async function finishSuccessfulDefense() {

    if (
        attackCards.length === 0
    ) {

        return;
    }


    /*
        Проверяем, действительно ли
        всё побито.
    */

    if (
        !allCardsBeaten()
    ) {

        return;
    }


    showMessage(
        "Бито"
    );


    await sleep(550);


    /*
        Карты уходят в отбой.
    */

    attackCards = [];

    defenseCards = [];


    attackZone.innerHTML = "";

    defenseZone.innerHTML = "";


    /*
        Сохраняем старого атакующего,
        потому что порядок добора
        должен определяться им.
        Но после добора меняем роли.
    */

    const previousAttacker =
        attacker;


    /*
        Добор:
        сначала старый атакующий.
    */

    await refillHands();


    renderHands();


    if (
        checkGameOver()
    ) {

        return;
    }


    /*
        Теперь атакующий меняется.
    */

    if (
        previousAttacker === "player"
    ) {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            PHASE.CPU_ATTACK;

    } else {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            PHASE.PLAYER_ATTACK;
    }


    /*
        Новый лимит зависит от
        нового защитника.
    */

    attackLimit =
        defender === "player"
            ? playerHand.length
            : cpuHand.length;


    selectedCardId = null;


    updateButtons();

    renderHands();


    if (
        phase === PHASE.CPU_ATTACK
    ) {

        showMessage(
            "Твой отбился. Ход компьютера"
        );

        await sleep(550);

        await cpuStartAttack();

    } else {

        showMessage(
            "Компьютер отбился. Твой ход"
        );
    }
}


/* =====================================================
   REFILL
===================================================== */

async function refillHands() {

    /*
        Порядок строго определяется
        текущим атакующим.
    */

    const first =
        attacker === "player"
            ? playerHand
            : cpuHand;

    const second =
        attacker === "player"
            ? cpuHand
            : playerHand;


    /*
        Атакующий добирает первым.
    */

    await refillHand(
        first
    );


    /*
        Затем защитник.
    */

    await refillHand(
        second
    );


    updateCounters();
}


/* =====================================================
   REFILL ONE HAND
===================================================== */

async function refillHand(hand) {

    while (
        hand.length < 6 &&
        deck.length > 0
    ) {

        const card =
            deck.shift();


        hand.push(card);


        renderHands();


        /*
            Визуальная раздача.
        */

        const cards =
            playerHandEl.querySelectorAll(
                ".card"
            );


        if (
            cards.length
        ) {

            const last =
                cards[cards.length - 1];

            last.classList.add(
                "deal-animation"
            );
        }


        await sleep(120);
    }
}


/* =====================================================
   ANIMATE TO TABLE
===================================================== */

async function animateCardToTable(
    card,
    zone,
    index,
    defense
) {

    const el =
        createCardElement(card);


    el.classList.add(
        "played-card"
    );


    const position =
        getTablePosition(
            index,
            defense
        );


    el.style.left =
        `${position.x}px`;

    el.style.top =
        `${position.y}px`;


    el.style.opacity =
        "0";


    el.style.transform =
        "scale(.6) rotate(-14deg)";


    zone.appendChild(el);


    await sleep(20);


    el.style.opacity =
        "1";


    el.style.transform =
        `scale(1) rotate(${
            defense
                ? 6
                : -5
        }deg)`;


    await sleep(340);
}


/* =====================================================
   TABLE POSITION
===================================================== */

function getTablePosition(
    index,
    defense
) {

    /*
        Разносим карты по столу,
        чтобы не было одной кучи.
    */

    const col =
        index % 4;

    const row =
        Math.floor(index / 4);


    if (!defense) {

        return {

            x:
                10 +
                col * 78,

            y:
                70 +
                row * 35

        };
    }


    return {

        x:
            38 +
            col * 78,

        y:
            35 +
            row * 35

    };
}


/* =====================================================
   UPDATE BUTTONS
===================================================== */

function updateButtons() {

    takeButton.style.display =
        "none";

    beatButton.style.display =
        "none";

    endAttackButton.style.display =
        "none";


    /*
        Игрок защищается.
    */

    if (
        phase === PHASE.PLAYER_DEFENSE
    ) {

        takeButton.style.display =
            "block";


        /*
            БИТО доступно только
            если все карты побиты.
        */

        if (
            allCardsBeaten()
        ) {

            beatButton.style.display =
                "block";
        }
    }


    /*
        Игрок атакует.
    */

    if (
        phase === PHASE.PLAYER_ATTACK
    ) {

        if (
            attackCards.length > 0
        ) {

            endAttackButton.style.display =
                "block";
        }
    }
}


/* =====================================================
   UPDATE COUNTERS
===================================================== */

function updateCounters() {

    document.getElementById(
        "playerCount"
    ).innerText =
        playerHand.length;


    document.getElementById(
        "opponentCount"
    ).innerText =
        cpuHand.length;


    document.getElementById(
        "deckCount"
    ).innerText =
        deck.length;


    document.getElementById(
        "trumpInfo"
    ).innerText =
        trumpSuit || "—";
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;

function showMessage(text) {

    messageEl.innerText =
        text;


    messageEl.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                messageEl.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =====================================================
   GAME OVER
===================================================== */

function checkGameOver() {

    if (
        phase === PHASE.FINISHED
    ) {

        return true;
    }


    const playerEmpty =
        playerHand.length === 0;


    const cpuEmpty =
        cpuHand.length === 0;


    if (
        playerEmpty &&
        cpuEmpty
    ) {

        endGame(
            "Ничья! Оба избавились от карт."
        );

        return true;
    }


    if (
        playerEmpty &&
        deck.length === 0
    ) {

        endGame(
            "Ты победил!"
        );

        return true;
    }


    if (
        cpuEmpty &&
        deck.length === 0
    ) {

        endGame(
            "Ты проиграл. 🤡"
        );

        return true;
    }


    return false;
}


/* =====================================================
   END GAME
===================================================== */

function endGame(text) {

    phase =
        PHASE.FINISHED;


    updateButtons();

    showMessage(text);


    setTimeout(
        () => {

            if (
                tg &&
                tg.showAlert
            ) {

                tg.showAlert(text);

            } else {

                alert(text);
            }

        },
        450
    );
}


/* =====================================================
   FIND STARTER
===================================================== */

function determineFirstAttacker() {

    const playerTrumps =
        playerHand
            .filter(
                card =>
                    card.suit === trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value -
                    b.value
            );


    const cpuTrumps =
        cpuHand
            .filter(
                card =>
                    card.suit === trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value -
                    b.value
            );


    if (
        playerTrumps.length &&
        cpuTrumps.length
    ) {

        return (
            playerTrumps[0].value <
            cpuTrumps[0].value
        )
            ? "player"
            : "cpu";
    }


    if (
        playerTrumps.length
    ) {

        return "player";
    }


    if (
        cpuTrumps.length
    ) {

        return "cpu";
    }


    const playerMin =
        Math.min(
            ...playerHand.map(
                c => c.value
            )
        );


    const cpuMin =
        Math.min(
            ...cpuHand.map(
                c => c.value
            )
        );


    return (
        playerMin <= cpuMin
            ? "player"
            : "cpu"
    );
}


/* =====================================================
   SETUP GAME
===================================================== */

async function startGame() {

    /*
        Telegram name.
    */

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        const user =
            tg.initDataUnsafe.user;


        playerName =
            user.first_name ||
            user.username ||
            "Игрок";
    }


    document.getElementById(
        "playerName"
    ).innerText =
        playerName;


    /*
        Создаём колоду.
    */

    deck =
        createDeck();


    /*
        Козырь — последняя карта.
    */

    const trumpCard =
        deck[deck.length - 1];


    trumpSuit =
        trumpCard.suit;


    renderTrump(
        trumpCard
    );


    /*
        Раздача.
    */

    playerHand = [];

    cpuHand = [];


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        /*
            Игрок.
        */

        playerHand.push(
            deck.shift()
        );

        renderHands();

        await sleep(80);


        /*
            CPU.
        */

        cpuHand.push(
            deck.shift()
        );

        renderHands();

        await sleep(80);
    }


    /*
        Определяем первого.
    */

    attacker =
        determineFirstAttacker();


    defender =
        attacker === "player"
            ? "cpu"
            : "player";


    attackLimit =
        defender === "player"
            ? playerHand.length
            : cpuHand.length;


    /*
        Начальное состояние.
    */

    if (
        attacker === "player"
    ) {

        phase =
            PHASE.PLAYER_ATTACK;

        showMessage(
            "У тебя младший козырь — твой ход"
        );

    } else {

        phase =
            PHASE.CPU_ATTACK;

        showMessage(
            "Компьютер начинает"
        );

        await sleep(700);

        await cpuStartAttack();
    }


    updateButtons();

    renderHands();

    updateCounters();
}


/* =====================================================
   START BUTTON
===================================================== */

let started = false;

startButton.addEventListener(
    "click",
    async () => {

        if (started) {
            return;
        }


        started = true;


        startScreen.style.display =
            "none";


        await startGame();
    }
);


/* =====================================================
   INITIAL
===================================================== */

updateCounters();

</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    background:
        radial-gradient(
            circle at 50% 40%,
            #28472d 0%,
            #17291a 42%,
            #091009 100%
        );
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}


/* =====================================================
   TOP
===================================================== */

.topbar{
    position:absolute;
    top:env(safe-area-inset-top,8px);
    left:0;
    right:0;
    height:54px;
    padding:8px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:500;
}

.logo-small{
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
}

.game-info{
    display:flex;
    gap:6px;
}

.info-pill{
    padding:6px 8px;
    border-radius:10px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1);
    font-size:9px;
    color:#aaa;
}

.info-pill b{
    color:#fff;
}


/* =====================================================
   TABLE
===================================================== */

.table{
    position:absolute;
    left:50%;
    top:51%;
    transform:translate(-50%,-50%);

    width:min(96vw,700px);
    height:min(76vh,620px);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            #28512e 0%,
            #1b3820 45%,
            #102214 73%,
            #091009 100%
        );

    border:9px solid #111;

    box-shadow:
        inset 0 0 80px rgba(0,0,0,.75),
        0 20px 60px rgba(0,0,0,.65);

    overflow:hidden;
}

.table::before{
    content:"";
    position:absolute;
    inset:20px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.06);
}


/* =====================================================
   OPPONENT
===================================================== */

.opponent{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:400;
}

.opponent-avatar{
    width:48px;
    height:48px;
    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(145deg,#303030,#101010);

    border:2px solid #555;

    font-size:22px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.5);
}

.opponent-name{
    margin-top:4px;
    font-size:11px;
    font-weight:800;
}

.opponent-count{
    margin-top:2px;
    font-size:10px;
    color:#aaa;
}


/* =====================================================
   PLAYER
===================================================== */

.player-info{
    position:absolute;
    bottom:96px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:400;
}

.player-name{
    font-size:12px;
    font-weight:800;
}

.player-count{
    margin-top:3px;
    font-size:10px;
    color:#aaa;
}


/* =====================================================
   DECK
===================================================== */

.deck-area{
    position:absolute;

    left:26%;
    top:50%;

    width:135px;
    height:125px;

    transform:translate(-50%,-50%);

    z-index:20;
}

.deck{
    position:absolute;

    left:5px;
    top:15px;

    width:64px;
    height:90px;

    transform:rotate(-8deg);

    z-index:10;
}

.deck-card{
    position:absolute;
    inset:0;

    border-radius:8px;

    border:2px solid #aaa;

    background:
        repeating-linear-gradient(
            45deg,
            #161616 0px,
            #161616 4px,
            #303030 4px,
            #303030 8px
        );

    box-shadow:
        0 6px 14px rgba(0,0,0,.55);
}

.deck-card:nth-child(1){
    transform:translate(-5px,-5px);
}

.deck-card:nth-child(2){
    transform:translate(-2px,-2px);
}

.deck-card:nth-child(3){
    transform:translate(0,0);
}

.trump-card{
    position:absolute;

    left:62px;
    top:30px;

    width:64px;
    height:90px;

    transform:rotate(76deg);

    z-index:5;
}


/* =====================================================
   CARDS
===================================================== */

.card{
    position:absolute;

    width:62px;
    height:88px;

    border-radius:8px;

    background:#f7f7f7;
    color:#111;

    border:1px solid #ddd;

    box-shadow:
        0 5px 14px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(0,0,0,.08);

    overflow:hidden;

    font-weight:800;

    transition:
        transform .22s ease,
        box-shadow .22s ease;
}

.card.red{
    color:#d71919;
}

.card.back{
    background:
        repeating-linear-gradient(
            45deg,
            #181818 0px,
            #181818 4px,
            #303030 4px,
            #303030 8px
        );

    border:2px solid #aaa;
}

.card.back::after{
    content:"HLC";

    position:absolute;
    inset:8px;

    border:1px solid rgba(255,255,255,.3);
    border-radius:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(255,255,255,.6);
    font-size:10px;
    letter-spacing:1px;
}

.card-value{
    position:absolute;
    left:6px;
    top:4px;
    font-size:15px;
}

.card-suit{
    position:absolute;
    left:7px;
    top:22px;
    font-size:15px;
}

.card-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:27px;
}

.card-corner{
    position:absolute;
    right:5px;
    bottom:3px;
    font-size:11px;
    transform:rotate(180deg);
}


/* =====================================================
   PLAYER HAND
===================================================== */

.hand{
    position:absolute;

    left:50%;
    bottom:-5px;

    width:96%;
    height:120px;

    transform:translateX(-50%);

    z-index:800;
}

.hand .card{
    transform-origin:center bottom;
    transition:
        left .25s ease,
        transform .25s ease,
        box-shadow .2s ease;
}

.hand .card:hover{
    z-index:1000;
}

.hand .card.selected{
    box-shadow:
        0 0 0 3px rgba(255,255,255,.85),
        0 12px 28px rgba(0,0,0,.7);
}


/* =====================================================
   OPPONENT HAND
===================================================== */

.opponent-hand{
    position:absolute;

    left:50%;
    top:5px;

    width:230px;
    height:95px;

    transform:translateX(-50%);

    z-index:15;
}


/* =====================================================
   TABLE PLAY AREA
===================================================== */

.play-area{
    position:absolute;

    left:50%;
    top:50%;

    width:330px;
    height:250px;

    transform:translate(-50%,-50%);

    z-index:100;
}

.attack-zone,
.defense-zone{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;
}


/* =====================================================
   PLAYED CARD
===================================================== */

.played-card{
    position:absolute;

    width:62px;
    height:88px;

    transition:
        left .35s cubic-bezier(.2,.8,.2,1),
        top .35s cubic-bezier(.2,.8,.2,1),
        transform .35s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;

    animation:cardEnter .32s ease both;
}

@keyframes cardEnter{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.55)
            rotate(-20deg);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1)
            rotate(0deg);
    }
}


/* =====================================================
   DRAGGING
===================================================== */

.card.dragging{
    position:fixed !important;

    z-index:2000 !important;

    transition:none !important;

    pointer-events:none;

    transform:
        scale(1.08)
        rotate(0deg) !important;

    box-shadow:
        0 20px 40px rgba(0,0,0,.75);
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{
    position:absolute;

    left:50%;
    bottom:145px;

    transform:translateX(-50%);

    z-index:1000;

    display:flex;
    justify-content:center;

    gap:8px;

    width:100%;
}

.control-btn{
    border:1px solid rgba(255,255,255,.15);

    background:rgba(10,10,10,.9);

    color:#fff;

    border-radius:12px;

    padding:11px 18px;

    font-size:11px;
    font-weight:900;

    box-shadow:
        0 7px 18px rgba(0,0,0,.35);
}

.control-btn:active{
    transform:scale(.95);
}

.control-btn.primary{
    background:#fff;
    color:#000;
}

.control-btn.danger{
    background:#3b1515;
    border-color:#632424;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{
    position:absolute;

    top:126px;
    left:50%;

    transform:translateX(-50%);

    z-index:1500;

    padding:8px 14px;

    border-radius:12px;

    background:rgba(0,0,0,.75);

    border:1px solid rgba(255,255,255,.12);

    color:#ddd;

    font-size:11px;

    white-space:nowrap;

    opacity:0;

    transition:opacity .25s ease;
}

.message.show{
    opacity:1;
}


/* =====================================================
   START
===================================================== */

.start-screen{
    position:absolute;
    inset:0;

    z-index:5000;

    background:rgba(4,6,4,.96);

    display:flex;
    align-items:center;
    justify-content:center;
}

.start-box{
    width:85%;
    max-width:350px;
    text-align:center;
}

.start-logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:5px;
}

.start-sub{
    margin-top:7px;
    color:#888;
    font-size:10px;
    letter-spacing:3px;
}

.start-button{
    width:100%;

    margin-top:30px;

    border:0;
    border-radius:15px;

    background:#fff;
    color:#000;

    padding:17px;

    font-size:15px;
    font-weight:900;
}


/* =====================================================
   DEAL ANIMATION
===================================================== */

.dealing{
    animation:dealFlash .22s ease;
}

@keyframes dealFlash{

    0%{
        transform:scale(.8) rotate(-8deg);
        opacity:.2;
    }

    100%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}


/* =====================================================
   WINNER
===================================================== */

.winner{
    animation:winnerPulse .7s ease infinite alternate;
}

@keyframes winnerPulse{

    from{
        box-shadow:0 0 0 rgba(255,255,255,0);
    }

    to{
        box-shadow:0 0 35px rgba(255,255,255,.25);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:380px){

    .card,
    .played-card{
        width:56px;
        height:80px;
    }

    .play-area{
        width:300px;
    }

    .controls{
        bottom:138px;
    }

    .player-info{
        bottom:85px;
    }

}

</style>
</head>


<body>

    <div
        id="startScreen"

        <div class="start-box">

            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

                id="startButton"

            </button>

</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();
    tg.expand();

}


/* =====================================================
   GAME CONSTANTS
===================================================== */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [

    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"В",value:11},
    {name:"Д",value:12},
    {name:"К",value:13},
    {name:"Т",value:14}

];


/* =====================================================
   STATE
===================================================== */

let deck = [];

let playerHand = [];

let cpuHand = [];

let trumpSuit = null;

let trumpCard = null;

let attackCards = [];

let defenseCards = [];

let attacker = null;

let defender = null;

let phase = "waiting";

let initialDefenderCards = 6;

let gameStarted = false;

let playerName = "Игрок";

let dragState = null;

let busy = false;


/*
    waiting

    player_attack
    cpu_defense

    cpu_attack
    player_defense

    finished
*/


/* =====================================================
   DOM
===================================================== */

const playerHandEl =
    document.getElementById(
        "playerHand"
    );

const opponentHandEl =
    document.getElementById(
        "opponentHand"
    );

const attackZone =
    document.getElementById(
        "attackZone"
    );

const defenseZone =
    document.getElementById(
        "defenseZone"
    );

const trumpCardEl =
    document.getElementById(
        "trumpCard"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const takeButton =
    document.getElementById(
        "takeButton"
    );

const endAttackButton =
    document.getElementById(
        "endAttackButton"
    );

const messageEl =
    document.getElementById(
        "message"
    );


/* =====================================================
   UTILITY
===================================================== */

function sleep(ms){

    return new Promise(
        resolve => setTimeout(
            resolve,
            ms
        )
    );

}


function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


function isRed(card){

    return (
        card.suit==="♥" ||
        card.suit==="♦"
    );

}


function cardText(card){

    return `${card.rank}${card.suit}`;

}


/* =====================================================
   CREATE DECK
===================================================== */

function createDeck(){

    const result = [];

    for(
        const suit of SUITS
    ){

        for(
            const rank of RANKS
        ){

            result.push({

                id:
                    Math.random()
                    .toString(36)
                    .substring(2)+
                    Date.now()
                    .toString(36),

                rank:rank.name,

                value:rank.value,

                suit:suit

            });

        }

    }

    return shuffle(result);

}


/* =====================================================
   CARD HTML
===================================================== */

function createCardElement(card){

    const el =
        document.createElement("div");

    el.className =
        "card " +
        (isRed(card) ? "red" : "");

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;

}


function createBackCard(){

    const el =
        document.createElement("div");

    el.className =
        "card back";

    return el;

}


/* =====================================================
   TRUMP
===================================================== */

function setupTrump(){

    /*
        Последняя карта колоды
        является козырем.

        Она НЕ удаляется.
        Она остаётся под колодой.
    */

    trumpCard =
        deck[deck.length-1];

    trumpSuit =
        trumpCard.suit;

    renderTrump();

}


function renderTrump(){

    trumpCardEl.className =
        "card trump-card " +
        (
            isRed(trumpCard)
                ? "red"
                : ""
        );

    trumpCardEl.innerHTML = `

        <div class="card-value">
            ${trumpCard.rank}
        </div>

        <div class="card-suit">
            ${trumpCard.suit}
        </div>

        <div class="card-center">
            ${trumpCard.suit}
        </div>

        <div class="card-corner">
            ${trumpCard.rank}${trumpCard.suit}
        </div>

    `;

}


/* =====================================================
   SORT
===================================================== */

function sortHand(hand){

    hand.sort(
        (a,b)=>{

            const aTrump =
                a.suit===trumpSuit;

            const bTrump =
                b.suit===trumpSuit;

            if(
                aTrump &&
                !bTrump
            ){
                return 1;
            }

            if(
                !aTrump &&
                bTrump
            ){
                return -1;
            }

            if(
                a.suit!==b.suit
            ){

                return (
                    SUITS.indexOf(a.suit) -
                    SUITS.indexOf(b.suit)
                );

            }

            return a.value-b.value;

        }
    );

}


/* =====================================================
   RENDER HANDS
===================================================== */

function renderHands(){

    sortHand(playerHand);

    playerHandEl.innerHTML="";


    /*
        PLAYER
    */

    const count =
        playerHand.length;

    const spacing =
        count <= 6
            ? 52
            : 45;

    playerHandEl.style.width =
        `${Math.max(
            100,
            count*spacing
        )}px`;


    playerHand.forEach(
        (card,index)=>{

            const el =
                createCardElement(card);

            const center =
                (count-1)/2;

            const offset =
                (index-center)*
                spacing;

            el.style.left =
                `calc(50% + ${offset}px - 31px)`;

            el.style.bottom =
                "4px";

            el.style.transform =
                `rotate(${(index-center)*2.3}deg)`;

            el.dataset.cardId =
                card.id;

            addDragEvents(
                el,
                card
            );

            playerHandEl.appendChild(el);

        }
    );


    /*
        CPU
    */

    opponentHandEl.innerHTML="";

    const cpuCount =
        cpuHand.length;

    const cpuSpacing =
        cpuCount <= 6
            ? 30
            : 25;

    opponentHandEl.style.width =
        `${Math.max(
            80,
            cpuCount*cpuSpacing
        )}px`;


    cpuHand.forEach(
        (card,index)=>{

            const el =
                createBackCard();

            const center =
                (cpuCount-1)/2;

            const offset =
                (index-center)*
                cpuSpacing;

            el.style.left =
                `calc(50% + ${offset}px - 31px)`;

            el.style.top =
                `${Math.abs(
                    index-center
                )*.7}px`;

            el.style.transform =
                `rotate(${(index-center)*3}deg)`;

            opponentHandEl.appendChild(el);

        }
    );


    updateInfo();

}


/* =====================================================
   DRAG
===================================================== */

function addDragEvents(el,card){

    let startX=0;
    let startY=0;

    let moved=false;


    el.addEventListener(
        "pointerdown",
        event=>{

            if(
                phase!=="player_attack" &&
                phase!=="player_defense"
            ){
                return;
            }

            if(busy){
                return;
            }

            el.setPointerCapture(
                event.pointerId
            );

            const rect =
                el.getBoundingClientRect();

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved=false;

            dragState = {

                card:card,

                element:el,

                offsetX:
                    event.clientX-
                    rect.left,

                offsetY:
                    event.clientY-
                    rect.top

            };

            el.classList.add(
                "dragging"
            );

            el.style.left =
                `${event.clientX-
                    dragState.offsetX}px`;

            el.style.top =
                `${event.clientY-
                    dragState.offsetY}px`;

            el.style.bottom="auto";

        }
    );


    el.addEventListener(
        "pointermove",
        event=>{

            if(
                !dragState ||
                dragState.element!==el
            ){
                return;
            }

            const dx =
                event.clientX-startX;

            const dy =
                event.clientY-startY;

            if(
                Math.abs(dx)>6 ||
                Math.abs(dy)>6
            ){

                moved=true;

            }

            el.style.left =
                `${event.clientX-
                    dragState.offsetX}px`;

            el.style.top =
                `${event.clientY-
                    dragState.offsetY}px`;

        }
    );


    el.addEventListener(
        "pointerup",
        async event=>{

            if(
                !dragState ||
                dragState.element!==el
            ){
                return;
            }

            const state =
                dragState;

            dragState=null;

            el.classList.remove(
                "dragging"
            );


            /*
                Если просто нажали,
                карта возвращается
                обратно в руку.

                Она НЕ удаляется.
            */

            if(!moved){

                renderHands();

                return;

            }


            /*
                Проверяем,
                находится ли карта
                над игровым столом.
            */

            const table =
                document
                    .querySelector(".table")
                    .getBoundingClientRect();

            const inside =
                event.clientX>=table.left &&
                event.clientX<=table.right &&
                event.clientY>=table.top &&
                event.clientY<=table.bottom;


            if(!inside){

                renderHands();

                return;

            }


            /*
                Только теперь карта
                реально разыгрывается.
            */

            await playPlayerCard(
                state.card
            );

        }
    );


    el.addEventListener(
        "pointercancel",
        ()=>{

            dragState=null;

            renderHands();

        }
    );

}


/* =====================================================
   GAME RULES
===================================================== */

function canBeat(
    attack,
    defense
){

    if(!attack || !defense){
        return false;
    }


    const attackTrump =
        attack.suit===trumpSuit;

    const defenseTrump =
        defense.suit===trumpSuit;


    /*
        Козырь против обычной карты
    */

    if(
        defenseTrump &&
        !attackTrump
    ){

        return true;

    }


    /*
        Обычная карта
        не бьёт козырь
    */

    if(
        attackTrump &&
        !defenseTrump
    ){

        return false;

    }


    /*
        Одинаковая масть
    */

    return (
        attack.suit===defense.suit &&
        defense.value>attack.value
    );

}


/* =====================================================
   TABLE RANKS
===================================================== */

function getTableRanks(){

    return [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ]
    .map(
        card=>card.rank
    );

}


/* =====================================================
   CAN ATTACK
===================================================== */

function canAttackWith(card){

    if(!card){
        return false;
    }


    /*
        Первый удар.
    */

    if(
        attackCards.length===0
    ){

        return true;

    }


    /*
        Подкидывать можно
        только существующие
        ранги на столе.
    */

    return getTableRanks()
        .includes(card.rank);

}


/* =====================================================
   PLAYER PLAY
===================================================== */

async function playPlayerCard(card){

    if(busy){
        return;
    }

    if(
        phase!=="player_attack" &&
        phase!=="player_defense"
    ){
        return;
    }


    /* ================================================
       PLAYER ATTACK
    ================================================= */

    if(
        phase==="player_attack"
    ){

        if(
            !canAttackWith(card)
        ){

            showMessage(
                "Эту карту нельзя подкинуть"
            );

            renderHands();

            return;

        }


        if(
            attackCards.length >=
            initialDefenderCards
        ){

            showMessage(
                "Лимит подкидывания достигнут"
            );

            renderHands();

            return;

        }


        /*
            Карта удаляется из руки
            ТОЛЬКО после того,
            как игрок отпустил её
            над столом.
        */

        removePlayerCard(card);

        attackCards.push(card);

        await animateCardToTable(
            card,
            false,
            attackCards.length-1
        );

        renderHands();


        /*
            Если это первая карта,
            компьютер начинает
            отбиваться.
        */

        if(
            attackCards.length===1
        ){

            phase="cpu_defense";

            defender="cpu";

            showMessage(
                "Компьютер отбивается..."
            );

            await sleep(450);

            await cpuDefense();

            return;

        }


        /*
            Если игрок подкинул
            дополнительную карту,
            компьютер продолжает
            защищаться.
        */

        phase="cpu_defense";

        showMessage(
            "Компьютер отбивается..."
        );

        await sleep(350);

        await cpuDefense();

        return;

    }


    /* ================================================
       PLAYER DEFENSE
    ================================================= */

    if(
        phase==="player_defense"
    ){

        const index =
            getNextUnbeatenIndex();

        if(index===-1){

            return;

        }

        const target =
            attackCards[index];


        if(
            !canBeat(target,card)
        ){

            showMessage(
                "Этой картой побить нельзя"
            );

            renderHands();

            return;

        }


        removePlayerCard(card);

        defenseCards[index]=card;


        await animateCardToTable(
            card,
            true,
            index
        );

        renderHands();


        /*
            Проверяем:
            есть ли ещё карта,
            которую игрок должен побить.
        */

        if(
            getNextUnbeatenIndex()!==-1
        ){

            showMessage(
                "Нужно отбить следующую карту"
            );

            updateButtons();

            return;

        }


        /*
            Все карты побиты.

            Теперь компьютер
            САМ решает,
            подкидывать ему или нет.
        */

        await sleep(350);

        await cpuDecideAfterPlayerDefense();

    }

}


/* =====================================================
   REMOVE PLAYER CARD
===================================================== */

function removePlayerCard(card){

    playerHand =
        playerHand.filter(
            c=>c.id!==card.id
        );

}


/* =====================================================
   NEXT UNBEATEN
===================================================== */

function getNextUnbeatenIndex(){

    for(
        let i=0;
        i<attackCards.length;
        i++
    ){

        if(
            !defenseCards[i]
        ){

            return i;

        }

    }

    return -1;

}


/* =====================================================
   ANIMATE TO TABLE
===================================================== */

async function animateCardToTable(
    card,
    defense,
    index
){

    const el =
        createCardElement(card);

    el.classList.add(
        "played-card"
    );


    /*
        Каждая пара карт
        располагается отдельно.
    */

    const pair =
        index%3;

    const row =
        Math.floor(index/3);


    if(!defense){

        el.style.left =
            `${42+pair*92}px`;

        el.style.top =
            `${35+row*68}px`;

        el.style.transform =
            `rotate(${-5+pair*3}deg)`;

    }else{

        el.style.left =
            `${58+pair*92}px`;

        el.style.top =
            `${20+row*68}px`;

        el.style.transform =
            `rotate(${4+pair*3}deg)`;

    }


    el.style.opacity="0";

    if(defense){

        defenseZone.appendChild(el);

    }else{

        attackZone.appendChild(el);

    }


    await sleep(25);

    el.style.opacity="1";

    await sleep(330);

}


/* =====================================================
   CPU DEFENSE
===================================================== */

async function cpuDefense(){

    if(
        phase!=="cpu_defense"
    ){
        return;
    }


    const index =
        getNextUnbeatenIndex();


    /*
        Всё побито.
    */

    if(index===-1){

        await cpuDecideAfterDefense();

        return;

    }


    const target =
        attackCards[index];


    /*
        Алгоритм:
        выбираем минимальную
        подходящую карту.

        Сначала обычные карты.
        Козырь — только если
        другого варианта нет.
    */

    const normalOptions =
        cpuHand
            .filter(
                card=>
                    card.suit!==trumpSuit &&
                    canBeat(target,card)
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    const trumpOptions =
        cpuHand
            .filter(
                card=>
                    card.suit===trumpSuit &&
                    canBeat(target,card)
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    const options =
        normalOptions.length>0
            ? normalOptions
            : trumpOptions;


    /*
        Не может отбиться.
    */

    if(
        options.length===0
    ){

        await sleep(600);

        await cpuTakeCards();

        return;

    }


    const card =
        options[0];


    cpuHand =
        cpuHand.filter(
            c=>c.id!==card.id
        );


    defenseCards[index]=card;


    await sleep(500);


    await animateCardToTable(
        card,
        true,
        index
    );


    renderHands();


    await sleep(300);


    /*
        Проверяем,
        остались ли карты,
        которые нужно отбить.
    */

    if(
        getNextUnbeatenIndex()!==-1
    ){

        await cpuDefense();

        return;

    }


    /*
        Всё отбито.
    */

    await cpuDecideAfterDefense();

}


/* =====================================================
   CPU DECISION AFTER DEFENSE
===================================================== */

async function cpuDecideAfterDefense(){

    /*
        Здесь компьютер был
        защищающимся.

        Теперь после успешной защиты
        он НЕ должен автоматически
        подкидывать.

        Ход завершён.

        Добор -> смена атакующего.
    */

    await sleep(500);

    await finishSuccessfulRound();

}


/* =====================================================
   CPU DECISION AFTER PLAYER DEFENSE
===================================================== */

async function cpuDecideAfterPlayerDefense(){

    /*
        ВАЖНЫЙ МОМЕНТ.

        Игрок отбил все карты.

        Компьютер знает:
        - карты, лежащие на столе;
        - свои карты;
        - сколько карт можно
          подкинуть.

        Но компьютер НЕ знает
        скрытые карты игрока.

        Поэтому он ищет только
        совпадающий ранг в своей руке.
    */

    const candidates =
        getCpuAddCandidates();


    /*
        Если есть карта,
        которую законно можно
        подкинуть — подкидываем.
    */

    if(
        candidates.length>0 &&
        attackCards.length<
            initialDefenderCards
    ){

        await sleep(450);

        const card =
            chooseCpuAddCard(
                candidates
            );

        cpuHand =
            cpuHand.filter(
                c=>c.id!==card.id
            );

        attackCards.push(card);


        await animateCardToTable(
            card,
            false,
            attackCards.length-1
        );


        renderHands();


        /*
            Теперь снова защищается
            игрок.
        */

        phase="player_defense";

        showMessage(
            "Компьютер подкинул — твоя защита"
        );

        updateButtons();

        return;

    }


    /*
        Компьютеру больше нечего
        подкинуть.

        Только теперь раунд
        действительно заканчивается.
    */

    await finishSuccessfulRound();

}


/* =====================================================
   CPU ADD CANDIDATES
===================================================== */

function getCpuAddCandidates(){

    if(
        attackCards.length===0
    ){

        return cpuHand.slice();

    }


    const ranks =
        getTableRanks();


    return cpuHand.filter(
        card=>
            ranks.includes(
                card.rank
            )
    );

}


/* =====================================================
   CPU ADD CHOICE
===================================================== */

function chooseCpuAddCard(
    candidates
){

    /*
        Приоритет:

        1. некозырь;
        2. меньший ранг;
        3. меньшая карта.

        Это позволяет компьютеру
        избавляться от карт,
        сохраняя козыри.
    */

    return candidates
        .slice()
        .sort(
            (a,b)=>{

                const aTrump =
                    a.suit===trumpSuit;

                const bTrump =
                    b.suit===trumpSuit;


                if(
                    aTrump!==bTrump
                ){

                    return aTrump
                        ? 1
                        : -1;

                }


                return a.value-b.value;

            }
        )[0];

}


/* =====================================================
   CPU TAKE
===================================================== */

async function cpuTakeCards(){

    showMessage(
        "Компьютер не отбился — берёт карты"
    );

    await sleep(700);


    const cards = [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ];


    cpuHand.push(
        ...cards
    );


    attackCards=[];
    defenseCards=[];


    attackZone.innerHTML="";
    defenseZone.innerHTML="";


    renderHands();


    /*
        После взятия
        атакующий НЕ меняется.

        Компьютер атаковал,
        значит компьютер
        продолжает атаку.
    */

    await refillHands();


    if(
        playerHand.length===0 ||
        cpuHand.length===0
    ){

        checkWinner();

        return;

    }


    phase="cpu_attack";

    attacker="cpu";
    defender="player";

    initialDefenderCards =
        playerHand.length;


    updateButtons();

    await sleep(500);

    await cpuStartAttack();

}


/* =====================================================
   PLAYER TAKE
===================================================== */

async function playerTakeCards(){

    if(
        phase!=="player_defense"
    ){
        return;
    }

    busy=true;

    takeButton.style.display="none";


    showMessage(
        "Ты забираешь карты"
    );


    await sleep(400);


    const cards = [
        ...attackCards,
        ...defenseCards.filter(Boolean)
    ];


    playerHand.push(
        ...cards
    );


    attackCards=[];
    defenseCards=[];


    attackZone.innerHTML="";
    defenseZone.innerHTML="";


    renderHands();


    /*
        Важное правило:
        атакующий добирает первым.
    */

    await refillHands();


    busy=false;


    if(
        playerHand.length===0 ||
        cpuHand.length===0
    ){

        checkWinner();

        return;

    }


    /*
        Атакующий остаётся тем же.

        Если атаковал компьютер,
        он продолжает.
    */

    if(
        attacker==="cpu"
    ){

        phase="cpu_attack";

        defender="player";

        initialDefenderCards =
            playerHand.length;

        updateButtons();

        await sleep(450);

        await cpuStartAttack();

    }else{

        phase="player_attack";

        defender="cpu";

        initialDefenderCards =
            cpuHand.length;

        updateButtons();

        showMessage(
            "Твой ход"
        );

    }

}


/* =====================================================
   SUCCESSFUL ROUND
===================================================== */

async function finishSuccessfulRound(){

    busy=true;


    showMessage(
        "Все карты отбиты"
    );


    await sleep(650);


    /*
        Карты уходят в отбой.
    */

    attackCards=[];
    defenseCards=[];


    attackZone.innerHTML="";
    defenseZone.innerHTML="";


    /*
        Проверяем победу
        ДО добора.
    */

    if(
        playerHand.length===0 ||
        cpuHand.length===0
    ){

        busy=false;

        checkWinner();

        return;

    }


    /*
        Добор.

        Сначала атакующий,
        потом защищающийся.
    */

    await refillHands();


    if(
        playerHand.length===0 ||
        cpuHand.length===0
    ){

        busy=false;

        checkWinner();

        return;

    }


    /*
        После успешной защиты
        атакующий меняется.
    */

    if(
        attacker==="player"
    ){

        attacker="cpu";
        defender="player";

        phase="cpu_attack";

        initialDefenderCards =
            playerHand.length;


        updateButtons();

        busy=false;


        showMessage(
            "Компьютер атакует"
        );


        await sleep(500);

        await cpuStartAttack();


    }else{

        attacker="player";
        defender="cpu";

        phase="player_attack";

        initialDefenderCards =
            cpuHand.length;


        updateButtons();

        busy=false;


        showMessage(
            "Твой ход"
        );

    }

}


/* =====================================================
   REFILL
===================================================== */

async function refillHands(){

    /*
        Атакующий добирает первым.
    */

    const first =
        attacker==="player"
            ? playerHand
            : cpuHand;

    const second =
        attacker==="player"
            ? cpuHand
            : playerHand;


    /*
        Первый игрок.
    */

    while(
        first.length<6 &&
        deck.length>0
    ){

        const card =
            deck.shift();

        first.push(card);

        renderHands();

        await dealAnimation(
            first===playerHand
        );

        await sleep(75);

    }


    /*
        Второй игрок.
    */

    while(
        second.length<6 &&
        deck.length>0
    ){

        const card =
            deck.shift();

        second.push(card);

        renderHands();

        await dealAnimation(
            second===playerHand
        );

        await sleep(75);

    }


    updateInfo();

}


/* =====================================================
   DEAL ANIMATION
===================================================== */

async function dealAnimation(
    toPlayer
){

    /*
        Визуальная вспышка
        на колоде.

        Сама карта уже добавлена
        в руку, но движение создаёт
        ощущение раздачи.
    */

    const card =
        document.createElement("div");

    card.className=
        "card back dealing";


    const deckRect =
        document
            .querySelector(".deck")
            .getBoundingClientRect();


    card.style.position="fixed";

    card.style.left=
        `${deckRect.left}px`;

    card.style.top=
        `${deckRect.top}px`;

    card.style.zIndex="1800";

    document
        .getElementById("app")
        .appendChild(card);


    const target =
        toPlayer
            ? playerHandEl
                .getBoundingClientRect()
            : opponentHandEl
                .getBoundingClientRect();


    const tx =
        target.left+
        target.width/2-
        31;

    const ty =
        toPlayer
            ? target.top
            : target.top+10;


    await sleep(15);


    card.style.transition=
        "left .25s cubic-bezier(.2,.8,.2,1),top .25s cubic-bezier(.2,.8,.2,1),transform .25s ease,opacity .25s ease";

    card.style.left=
        `${tx}px`;

    card.style.top=
        `${ty}px`;

    card.style.transform=
        `rotate(${toPlayer ? 0 : 180}deg) scale(.8)`;

    await sleep(260);


    card.remove();

}


/* =====================================================
   CPU START ATTACK
===================================================== */

async function cpuStartAttack(){

    if(
        phase!=="cpu_attack"
    ){
        return;
    }


    if(
        cpuHand.length===0
    ){

        checkWinner();

        return;

    }


    await sleep(450);


    /*
        Первый удар.

        Компьютер НЕ может выбирать
        случайную любую карту
        бесконечно.

        Он выбирает стратегически:
        младшую некозырную.
    */

    const card =
        chooseCpuOpeningCard();


    cpuHand =
        cpuHand.filter(
            c=>c.id!==card.id
        );


    attackCards.push(card);


    await animateCardToTable(
        card,
        false,
        0
    );


    renderHands();


    phase="player_defense";

    defender="player";

    showMessage(
        "Твоя защита"
    );


    updateButtons();

}


/* =====================================================
   CPU OPENING CARD
===================================================== */

function chooseCpuOpeningCard(){

    const nonTrump =
        cpuHand
            .filter(
                c=>c.suit!==trumpSuit
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    if(
        nonTrump.length>0
    ){

        return nonTrump[0];

    }


    return cpuHand
        .slice()
        .sort(
            (a,b)=>
                a.value-b.value
        )[0];

}


/* =====================================================
   BUTTONS
===================================================== */

function updateButtons(){

    takeButton.style.display="none";

    endAttackButton.style.display="none";


    if(
        phase==="player_defense"
    ){

        takeButton.style.display="block";

    }


    /*
        Игрок может завершить
        атаку только если
        уже положил хотя бы
        одну карту.

        Это не заставляет
        компьютер завершать
        свою атаку.
    */

    if(
        phase==="player_attack" &&
        attackCards.length>0
    ){

        endAttackButton.style.display="block";

    }

}

    async ()=>{

            return;
        }

        gameStarted=true;

        startButton.disabled=true;

        startScreen.style.display="none";

        await startGame();

    }
);


/* =====================================================
   START GAME
===================================================== */

async function startGame(){

    /*
        Имя Telegram.
    */

    if(
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ){

        const user =
            tg.initDataUnsafe.user;

        playerName =
            user.first_name ||
            user.username ||
            "Игрок";

    }


    document.getElementById(
        "playerName"
    ).innerText=
        playerName;


    /*
        Новая колода.
    */

    deck=createDeck();


    /*
        Козырь.
    */

    setupTrump();


    /*
        Раздача.
    */

    await initialDeal();


    /*
        Определяем первого.
    */

    determineFirstPlayer();


    updateInfo();

    updateButtons();


    /*
        Если начинает компьютер —
        запускаем его.
    */

    if(
        attacker==="cpu"
    ){

        showMessage(
            "Компьютер начинает"
        );

        await sleep(900);

        await cpuStartAttack();

    }else{

        showMessage(
            "Твой ход"
        );

    }

}


/* =====================================================
   INITIAL DEAL
===================================================== */

async function initialDeal(){

    playerHand=[];
    cpuHand=[];

    attackCards=[];
    defenseCards=[];

    attackZone.innerHTML="";
    defenseZone.innerHTML="";


    /*
        Раздаём по очереди.

        Игрок -> компьютер.
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        const playerCard =
            deck.shift();

        playerHand.push(
            playerCard
        );

        renderHands();

        await dealAnimation(true);

        await sleep(55);


        const cpuCard =
            deck.shift();

        cpuHand.push(
            cpuCard
        );

        renderHands();

        await dealAnimation(false);

        await sleep(55);

    }


    renderHands();

}


/* =====================================================
   FIRST PLAYER
===================================================== */

function determineFirstPlayer(){

    const playerTrumps =
        playerHand
            .filter(
                c=>c.suit===trumpSuit
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    const cpuTrumps =
        cpuHand
            .filter(
                c=>c.suit===trumpSuit
            )
            .sort(
                (a,b)=>
                    a.value-b.value
            );


    let playerStarts=false;


    if(
        playerTrumps.length &&
        cpuTrumps.length
    ){

        playerStarts =
            playerTrumps[0].value <
            cpuTrumps[0].value;

    }
    else if(
        playerTrumps.length
    ){

        playerStarts=true;

    }
    else if(
        cpuTrumps.length
    ){

        playerStarts=false;

    }
    else{

        /*
            Если козырей нет,
            сравниваем младшую
            карту.
        */

        const playerMin =
            Math.min(
                ...playerHand.map(
                    c=>c.value
                )
            );

        const cpuMin =
            Math.min(
                ...cpuHand.map(
                    c=>c.value
                )
            );

        playerStarts =
            playerMin<=cpuMin;

    }


    if(playerStarts){

        attacker="player";
        defender="cpu";

        phase="player_attack";

        initialDefenderCards=
            cpuHand.length;

    }else{

        attacker="cpu";
        defender="player";

        phase="cpu_attack";

        initialDefenderCards=
            playerHand.length;

    }

}


/* =====================================================
   WINNER
===================================================== */

function checkWinner(){

    if(
        phase==="finished"
    ){
        return;
    }


    const playerEmpty =
        playerHand.length===0;

    const cpuEmpty =
        cpuHand.length===0;


    if(
        !playerEmpty &&
        !cpuEmpty
    ){
        return;
    }


    phase="finished";

    updateButtons();


    let text;


    if(
        playerEmpty &&
        cpuEmpty
    ){

        text=
            "Ничья! Оба избавились от карт.";

    }
    else if(
        playerEmpty
    ){

        text=
            "Ты победил! 🏆";

    }
    else{

        text=
            "Ты проиграл. 🤡";

    }


    showMessage(text);


    setTimeout(
        ()=>{

            if(tg){

                tg.showAlert(text);

            }else{

                alert(text);

            }

        },
        500
    );

}


/* =====================================================
   INITIAL
===================================================== */

updateInfo();

</script>

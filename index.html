<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no,
             viewport-fit=cover"
>
<title>Heavy Lux Card</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            #202020 0%,
            #101010 45%,
            #050505 100%
        );
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    touch-action: none;
}
button {
    font-family: inherit;
}
/* =====================================================
   APP
===================================================== */
#app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
}
/* =====================================================
   TOP
===================================================== */
.topbar {
    position: absolute;
    top:
        calc(
            env(safe-area-inset-top, 0px)
            + 8px
        );
    left: 0;
    right: 0;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 100;
}
.logo {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #eee;
}
.info {
    display: flex;
    gap: 6px;
}
.info-item {
    padding: 6px 9px;
    border:
        1px solid
        rgba(255,255,255,.12);
    border-radius: 9px;
    background:
        rgba(0,0,0,.35);
    color: #888;
    font-size: 10px;
}
.info-item b {
    color: #fff;
}
/* =====================================================
   TABLE
===================================================== */
.table {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 94vw;
    height: 65vh;
    transform:
        translate(-50%, -50%);
    /*
        Без границ.
        Только мягкая подсветка.
    */
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012) 50%,
            transparent 75%
        );
    z-index: 5;
}
/* =====================================================
   OPPONENT
===================================================== */
.opponent {
    position: absolute;
    top:
        calc(
            env(safe-area-inset-top, 0px)
            + 60px
        );
    left: 50%;
    transform:
        translateX(-50%);
    z-index: 80;
    text-align: center;
}
.avatar {
    width: 48px;
    height: 48px;
    margin: auto;
    border-radius: 50%;
    background:
        #111;
    border:
        1px solid
        rgba(255,255,255,.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}
.opponent-name {
    margin-top: 5px;
    font-size: 11px;
    font-weight: 800;
}
.opponent-count {
    margin-top: 3px;
    color: #777;
    font-size: 10px;
}
/* =====================================================
   OPPONENT HAND
===================================================== */
.opponent-hand {
    position: absolute;
    top: 116px;
    left: 50%;
    transform:
        translateX(-50%);
    height: 85px;
    z-index: 20;
    pointer-events: none;
}
/* =====================================================
   DECK
===================================================== */
.deck-area {
    position: absolute;
    left: 11%;
    top: 50%;
    width: 105px;
    height: 115px;
    transform:
        translateY(-50%);
    z-index: 40;
}
/* настоящая рубашка */
.card-back {
    position: absolute;
    width: 58px;
    height: 84px;
    border-radius: 7px;
    background:
        #111;
    border:
        1px solid
        #888;
    box-shadow:
        0 8px 18px
        rgba(0,0,0,.6);
    overflow: hidden;
}
/* геометрия */
.card-back::before {
    content: "";
    position: absolute;
    inset: 5px;
    border:
        1px solid
        rgba(255,255,255,.45);
    background:
        repeating-linear-gradient(
            45deg,
            transparent 0,
            transparent 7px,
            rgba(255,255,255,.12) 7px,
            rgba(255,255,255,.12) 9px
        );
}
.card-back::after {
    content: "HL";
    position: absolute;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%, -50%);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
}
/* слои колоды */
.deck-card-1 {
    left: 12px;
    top: 12px;
    transform: rotate(-4deg);
}
.deck-card-2 {
    left: 8px;
    top: 8px;
    transform: rotate(-2deg);
}
.deck-card-3 {
    left: 4px;
    top: 4px;
    transform: rotate(1deg);
}
.deck-card-main {
    left: 0;
    top: 0;
    transform: rotate(4deg);
    z-index: 5;
}
/* =====================================================
   TRUMP
===================================================== */
.trump {
    position: absolute;
    left: 43px;
    top: 26px;
    width: 58px;
    height: 84px;
    border-radius: 7px;
    background:
        #fafafa;
    color: #111;
    border:
        1px solid #aaa;
    box-shadow:
        0 8px 18px
        rgba(0,0,0,.6);
    transform:
        rotate(74deg);
    z-index: 2;
    overflow: hidden;
}
.trump.red {
    color: #000;
}
.trump .rank {
    position: absolute;
    left: 6px;
    top: 4px;
    font-size: 14px;
    font-weight: 900;
}
.trump .suit {
    position: absolute;
    left: 7px;
    top: 21px;
    font-size: 15px;
}
.trump .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%, -50%);
    font-size: 27px;
}
/* =====================================================
   PLAY AREA
===================================================== */
.play-area {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 330px;
    height: 230px;
    transform:
        translate(-50%, -50%);
    z-index: 60;
}
/*
    Каждая пара имеет своё место.
*/
.card-pair {
    position: absolute;
    width: 72px;
    height: 105px;
}
/* =====================================================
   PLAYED CARD
===================================================== */
.played-card {
    position: absolute;
    width: 62px;
    height: 88px;
    border-radius: 8px;
    background: #fafafa;
    color: #111;
    border:
        1px solid #aaa;
    box-shadow:
        0 8px 20px
        rgba(0,0,0,.55);
    overflow: hidden;
    transition:
        transform .22s ease,
        left .22s ease,
        top .22s ease;
    font-weight: 900;
}
.played-card.red {
    color: #000;
}
.played-card .rank {
    position: absolute;
    left: 6px;
    top: 4px;
    font-size: 15px;
}
.played-card .suit {
    position: absolute;
    left: 7px;
    top: 23px;
    font-size: 15px;
}
.played-card .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%, -50%);
    font-size: 28px;
}
/* =====================================================
   PLAYER
===================================================== */
.player-info {
    position: absolute;
    bottom:
        calc(
            env(safe-area-inset-bottom, 0px)
            + 110px
        );
    left: 50%;
    transform:
        translateX(-50%);
    text-align: center;
    z-index: 100;
}
.player-name {
    font-size: 12px;
    font-weight: 900;
}
.player-count {
    margin-top: 3px;
    color: #777;
    font-size: 10px;
}
/* =====================================================
   PLAYER HAND
===================================================== */
.hand {
    position: absolute;
    left: 50%;
    bottom:
        calc(
            env(safe-area-inset-bottom, 0px)
            + 5px
        );
    transform:
        translateX(-50%);
    width: 96%;
    height: 125px;
    z-index: 120;
}
/* =====================================================
   PLAYER CARD
===================================================== */
.hand-card {
    position: absolute;
    width: 66px;
    height: 94px;
    border-radius: 9px;
    background: #fafafa;
    color: #111;
    border:
        1px solid #aaa;
    box-shadow:
        0 8px 18px
        rgba(0,0,0,.55);
    overflow: hidden;
    transition:
        transform .2s ease,
        left .25s ease,
        top .25s ease,
        box-shadow .2s ease;
    cursor: grab;
    touch-action: none;
}
.hand-card.red {
    color: #000;
}
.hand-card .rank {
    position: absolute;
    left: 7px;
    top: 5px;
    font-size: 16px;
    font-weight: 900;
}
.hand-card .suit {
    position: absolute;
    left: 8px;
    top: 25px;
    font-size: 16px;
}
.hand-card .center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%, -50%);
    font-size: 30px;
}
/* =====================================================
   ALLOWED CARD
===================================================== */
.hand-card.allowed {
    box-shadow:
        0 0 0 2px #fff,
        0 0 20px
        rgba(255,255,255,.55),
        0 10px 20px
        rgba(0,0,0,.6);
    transform:
        translateY(-7px);
}
/* =====================================================
   SELECTED
===================================================== */
.hand-card.selected {
    transform:
        translateY(-16px)
        scale(1.04);
    box-shadow:
        0 0 0 3px #fff,
        0 15px 30px
        rgba(0,0,0,.8);
}
/* =====================================================
   DRAGGING
===================================================== */
.hand-card.dragging {
    position: fixed !important;
    z-index: 1000 !important;
    transition: none !important;
    transform:
        scale(1.08)
        rotate(0deg) !important;
    pointer-events: none;
    box-shadow:
        0 20px 45px
        rgba(0,0,0,.8);
}
/* =====================================================
   CONTROLS
===================================================== */
.controls {
    position: absolute;
    left: 50%;
    bottom:
        calc(
            env(safe-area-inset-bottom, 0px)
            + 92px
        );
    transform:
        translateX(-50%);
    z-index: 200;
    display: flex;
    gap: 7px;
}
.btn {
    min-width: 105px;
    padding: 11px 15px;
    border-radius: 10px;
    border:
        1px solid
        rgba(255,255,255,.2);
    background:
        #111;
    color: #fff;
    font-size: 10px;
    font-weight: 900;
}
.btn:active {
    transform:
        scale(.95);
}
.btn.primary {
    background: #fff;
    color: #000;
}
.btn.danger {
    background: #181818;
    border-color:
        #555;
}
/* =====================================================
   MESSAGE
===================================================== */
.message {
    position: absolute;
    left: 50%;
    top: 30%;
    transform:
        translateX(-50%);
    z-index: 300;
    padding: 8px 13px;
    border-radius: 9px;
    background:
        rgba(0,0,0,.8);
    border:
        1px solid
        rgba(255,255,255,.12);
    font-size: 10px;
    opacity: 0;
    pointer-events: none;
    transition:
        opacity .2s ease;
}
.message.show {
    opacity: 1;
}
/* =====================================================
   START
===================================================== */
.start-screen {
    position: absolute;
    inset: 0;
    z-index: 1000;
    background:
        #050505;
    display: flex;
    align-items: center;
    justify-content: center;
}
.start-box {
    width: 82%;
    max-width: 340px;
    text-align: center;
}
.start-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 5px;
}
.start-sub {
    margin-top: 8px;
    color: #777;
    font-size: 10px;
    letter-spacing: 3px;
}
.start-btn {
    width: 100%;
    margin-top: 30px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #000;
    font-size: 13px;
    font-weight: 900;
}
/* =====================================================
   ANIMATION
===================================================== */
@keyframes flyToTable {
    from {
        opacity: 0;
        transform:
            translateY(40px)
            scale(.55)
            rotate(-15deg);
    }
    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1)
            rotate(0deg);
    }
}
.fly {
    animation:
        flyToTable .28s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}
/* =====================================================
   MOBILE
===================================================== */
@media (max-width: 390px) {
    .hand-card {
        width: 59px;
        height: 86px;
    }
    .played-card {
        width: 58px;
        height: 82px;
    }
    .play-area {
        width: 300px;
    }
    .deck-area {
        left: 7%;
    }
}
</style>
</head>
<body>
<div id="app">
    <!-- TOP -->
    <div class="topbar">
        <div class="logo">
            HEAVY LUX CARD
        </div>
        <div class="info">
            <div class="info-item">
                ♠
                <b id="trumpInfo">—</b>
            </div>
            <div class="info-item">
                Колода:
                <b id="deckCount">24</b>
            </div>
        </div>
    </div>
    <!-- OPPONENT -->
    <div class="opponent">
        <div class="avatar">
            HL
        </div>
        <div class="opponent-name">
            Heavy AI
        </div>
        <div class="opponent-count">
            Карт:
            <b id="opponentCount">6</b>
        </div>
    </div>
    <div
        id="opponentHand"
        class="opponent-hand"
    ></div>
    <!-- TABLE -->
    <div class="table">
        <!-- DECK -->
        <div class="deck-area">
            <div
                class="card-back deck-card-1"
            ></div>
            <div
                class="card-back deck-card-2"
            ></div>
            <div
                class="card-back deck-card-3"
            ></div>
            <div
                id="deckMain"
                class="card-back deck-card-main"
            ></div>
            <div
                id="trumpCard"
                class="trump"
            ></div>
        </div>
        <!-- PLAY AREA -->
        <div
            id="playArea"
            class="play-area"
        ></div>
    </div>
    <!-- PLAYER INFO -->
    <div class="player-info">
        <div
            id="playerName"
            class="player-name"
        >
            Игрок
        </div>
        <div class="player-count">
            Карт:
            <b id="playerCount">6</b>
        </div>
    </div>
    <!-- PLAYER HAND -->
    <div
        id="playerHand"
        class="hand"
    ></div>
    <!-- CONTROLS -->
    <div class="controls">
        <button
            id="takeButton"
            class="btn danger"
            style="display:none"
        >
            ВЗЯТЬ
        </button>
        <button
            id="finishButton"
            class="btn primary"
            style="display:none"
        >
            БИТО
        </button>
    </div>
    <!-- MESSAGE -->
    <div
        id="message"
        class="message"
    ></div>
    <!-- START -->
    <div
        id="startScreen"
        class="start-screen"
    >
        <div class="start-box">
            <div class="start-title">
                HEAVY LUX
            </div>
            <div class="start-sub">
                CLASSIC DURAK
            </div>
            <button
                id="startButton"
                class="start-btn"
            >
                НАЧАТЬ ИГРУ
            </button>
        </div>
    </div>
</div>
<script>
/* =====================================================
   TELEGRAM
===================================================== */
const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;
if (tg) {
    tg.ready();
    tg.expand();
}
/* =====================================================
   GAME CONSTANTS
===================================================== */
const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];
const RANKS = [
    { name: "6",  value: 6 },
    { name: "7",  value: 7 },
    { name: "8",  value: 8 },
    { name: "9",  value: 9 },
    { name: "10", value: 10 },
    { name: "В", value: 11 },
    { name: "Д", value: 12 },
    { name: "К", value: 13 },
    { name: "Т", value: 14 }
];
/* =====================================================
   STATE
===================================================== */
const state = {
    deck: [],
    player: [],
    cpu: [],
    trumpSuit: null,
    trumpCard: null,
    /*
        Каждый элемент:
        {
            attack: Card,
            defense: Card|null
        }
    */
    tablePairs: [],
    attacker: null,
    defender: null,
    phase: "waiting",
    gameStarted: false,
    /*
        Сколько карт было у защитника
        в начале текущего раунда.
    */
    defenderStartCount: 6,
    /*
        Карта, которую сейчас пытаются
        положить/перетащить.
    */
    selectedCardId: null
};
/* =====================================================
   DOM
===================================================== */
const $ = id =>
    document.getElementById(id);
const playerHandEl =
    $("playerHand");
const opponentHandEl =
    $("opponentHand");
const playAreaEl =
    $("playArea");
const trumpEl =
    $("trumpCard");
const takeButton =
    $("takeButton");
const finishButton =
    $("finishButton");
const messageEl =
    $("message");
/* =====================================================
   HELPERS
===================================================== */
function sleep(ms) {
    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}
function uid() {
    if (
        window.crypto &&
        crypto.randomUUID
    ) {
        return crypto.randomUUID();
    }
    return (
        Date.now().toString(36)
        +
        Math.random()
            .toString(36)
            .slice(2)
    );
}
function shuffle(arr) {
    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {
        const j =
            Math.floor(
                Math.random() * (i + 1)
            );
        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }
    return arr;
}
function isRed(card) {
    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}
function rankValuesOnTable() {
    const values = new Set();
    for (
        const pair of state.tablePairs
    ) {
        values.add(
            pair.attack.rank
        );
        if (pair.defense) {
            values.add(
                pair.defense.rank
            );
        }
    }
    return values;
}
function totalAttackCards() {
    return state.tablePairs.length;
}
function allCardsOnTable() {
    const result = [];
    for (
        const pair of state.tablePairs
    ) {
        result.push(
            pair.attack
        );
        if (pair.defense) {
            result.push(
                pair.defense
            );
        }
    }
    return result;
}
/* =====================================================
   CREATE DECK
===================================================== */
function createDeck() {
    const result = [];
    for (
        const suit of SUITS
    ) {
        for (
            const rank of RANKS
        ) {
            result.push({
                id: uid(),
                suit,
                rank: rank.name,
                value: rank.value
            });
        }
    }
    return shuffle(result);
}
/* =====================================================
   TRUMP
===================================================== */
function setupTrump() {
    /*
        ВАЖНО:
        Последняя карта массива
        является козырной картой.
        Мы НЕ создаём её копию.
    */
    state.trumpCard =
        state.deck[
            state.deck.length - 1
        ];
    state.trumpSuit =
        state.trumpCard.suit;
    renderTrump();
}
function renderTrump() {
    const card =
        state.trumpCard;
    trumpEl.className =
        "trump " +
        (
            isRed(card)
                ? "red"
                : ""
        );
    trumpEl.innerHTML = `
        <div class="rank">
            ${card.rank}
        </div>
        <div class="suit">
            ${card.suit}
        </div>
        <div class="center">
            ${card.suit}
        </div>
    `;
    $("trumpInfo").innerText =
        state.trumpSuit;
}
/* =====================================================
   DEAL
===================================================== */
async function dealGame() {
    /*
        Полностью очищаем руки.
    */
    state.player = [];
    state.cpu = [];
    renderHands();
    /*
        Раздаём по одной карте
        игроку и компьютеру.
        Карта физически удаляется
        из deck через shift().
    */
    for (
        let i = 0;
        i < 6;
        i++
    ) {
        const playerCard =
            state.deck.shift();
        state.player.push(
            playerCard
        );
        renderHands();
        await sleep(75);
        const cpuCard =
            state.deck.shift();
        state.cpu.push(
            cpuCard
        );
        renderHands();
        await sleep(75);
    }
}
/* =====================================================
   CARD STRENGTH
===================================================== */
function cardStrength(card) {
    if (
        card.suit ===
        state.trumpSuit
    ) {
        return 100 + card.value;
    }
    return card.value;
}
/* =====================================================
   CAN BEAT
===================================================== */
function canBeat(
    attack,
    defense
) {
    if (
        !attack ||
        !defense
    ) {
        return false;
    }
    /*
        Одинаковая масть.
        Если козырная масть —
        старший козырь бьёт
        младший козырь.
    */
    if (
        attack.suit ===
        defense.suit
    ) {
        return (
            defense.value >
            attack.value
        );
    }
    /*
        Атака некозырная,
        защита козырная.
        Козырь БЬЁТ любую
        некозырную карту.
    */
    if (
        attack.suit !==
            state.trumpSuit
        &&
        defense.suit ===
            state.trumpSuit
    ) {
        return true;
    }
    /*
        Атака козырная,
        защита некозырная.
        Невозможно.
    */
    return false;
}
/* =====================================================
   VALID ATTACK
===================================================== */
function canAttack(
    card,
    player
) {
    if (!card) {
        return false;
    }
    /*
        Первый удар.
        Любая карта.
    */
    if (
        state.tablePairs.length === 0
    ) {
        return true;
    }
    /*
        Подкидывать можно только
        ранг, уже присутствующий
        на столе.
    */
    const ranks =
        rankValuesOnTable();
    if (
        !ranks.has(card.rank)
    ) {
        return false;
    }
    /*
        Нельзя атаковать большим
        количеством карт, чем
        позволяет размер руки
        защитника на начало раунда.
        Максимум 6.
    */
    if (
        state.tablePairs.length >= 6
    ) {
        return false;
    }
    if (
        state.tablePairs.length >=
        state.defenderStartCount
    ) {
        return false;
    }
    return true;
}
/* =====================================================
   GET UNBEATEN INDEX
===================================================== */
function getUnbeatenIndex() {
    for (
        let i = 0;
        i < state.tablePairs.length;
        i++
    ) {
        if (
            !state.tablePairs[i].defense
        ) {
            return i;
        }
    }
    return -1;
}
/* =====================================================
   ALL BEATEN
===================================================== */
function allBeaten() {
    return (
        state.tablePairs.length > 0 &&
        getUnbeatenIndex() === -1
    );
}
/* =====================================================
   FIND DEFENSE
===================================================== */
function findBestDefense(
    hand,
    attack
) {
    const options =
        hand
            .filter(
                card =>
                    canBeat(
                        attack,
                        card
                    )
            )
            .sort(
                (a,b) =>
                    cardStrength(a)
                    -
                    cardStrength(b)
            );
    return (
        options[0] || null
    );
}
/* =====================================================
   CPU CAN ATTACK?
===================================================== */
function getCpuAttackOptions() {
    return state.cpu.filter(
        card =>
            canAttack(
                card,
                "cpu"
            )
    );
}
/* =====================================================
   CPU ATTACK CHOICE
===================================================== */
function chooseCpuAttack(
    options
) {
    if (
        options.length === 0
    ) {
        return null;
    }
    /*
        В приоритете:
        1. некозырные;
        2. младшие;
        3. карты, которые
           уже можно подкинуть.
    */
    return options
        .slice()
        .sort(
            (a,b) => {
                const at =
                    a.suit ===
                    state.trumpSuit;
                const bt =
                    b.suit ===
                    state.trumpSuit;
                if (
                    at !== bt
                ) {
                    return at
                        ? 1
                        : -1;
                }
                return (
                    a.value -
                    b.value
                );
            }
        )[0];
}

/* =====================================================
   HIGHLIGHT
===================================================== */
function highlightAllowedCards() {
    const cards =
        playerHandEl.querySelectorAll(
            ".hand-card"
        );
    cards.forEach(
        el => {
            const card =
                state.player.find(
                    c =>
                        c.id ===
                        el.dataset.id
                );
            if (!card) {
                return;
            }
            let allowed =
                false;
            if (
                state.phase ===
                "player_attack"
            ) {
                allowed =
                    canAttack(
                        card,
                        "player"
                    );
            }
            if (
                state.phase ===
                "player_defense"
            ) {
                const index =
                    getUnbeatenIndex();
                if (
                    index !== -1
                ) {
                    allowed =
                        canBeat(
                            state.tablePairs[
                                index
                            ].attack,
                            card
                        );
                }
            }
            if (allowed) {
                el.classList.add(
                    "allowed"
                );
            } else {
                el.classList.remove(
                    "allowed"
                );
            }
        }
    );
}
/* =====================================================
   POINTER EVENTS
===================================================== */
function addPointerEvents(
    el,
    card
) {
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;
    let dragging = false;
    el.addEventListener(
        "pointerdown",
        event => {
            if (
                state.phase !==
                    "player_attack"
                &&
                state.phase !==
                    "player_defense"
            ) {
                return;
            }
            startX =
                event.clientX;
            startY =
                event.clientY;
            const rect =
                el.getBoundingClientRect();
            offsetX =
                event.clientX -
                rect.left;
            offsetY =
                event.clientY -
                rect.top;
            /*
                Сразу не удаляем карту.
            */
            state.selectedCardId =
                card.id;
            el.classList.add(
                "selected"
            );
            el.setPointerCapture(
                event.pointerId
            );
        }
    );
    el.addEventListener(
        "pointermove",
        event => {
            const dx =
                event.clientX -
                startX;
            const dy =
                event.clientY -
                startY;
            if (
                Math.abs(dx) < 6 &&
                Math.abs(dy) < 6
            ) {
                return;
            }
            if (!dragging) {
                dragging = true;
                el.classList.add(
                    "dragging"
                );
                el.style.left =
                    `${
                        event.clientX -
                        offsetX
                    }px`;
                el.style.top =
                    `${
                        event.clientY -
                        offsetY
                    }px`;
                el.style.bottom =
                    "auto";
            }
            if (dragging) {
                el.style.left =
                    `${
                        event.clientX -
                        offsetX
                    }px`;
                el.style.top =
                    `${
                        event.clientY -
                        offsetY
                    }px`;
            }
        }
    );
    el.addEventListener(
        "pointerup",
        async event => {
            if (
                dragging
            ) {
                const tableRect =
                    document
                        .querySelector(
                            ".table"
                        )
                        .getBoundingClientRect();
                const inside =
                    event.clientX >=
                        tableRect.left
                    &&
                    event.clientX <=
                        tableRect.right
                    &&
                    event.clientY >=
                        tableRect.top
                    &&
                    event.clientY <=
                        tableRect.bottom;
                el.classList.remove(
                    "dragging"
                );
                if (inside) {
                    await playPlayerCard(
                        card
                    );
                } else {
                    state.selectedCardId =
                        null;
                    renderHands();
                }
            } else {
                /*
                    Обычный тап.
                    Карта НЕ исчезает.
                    Она просто выбирается.
                */
                state.selectedCardId =
                    card.id;
                renderHands();
            }
            dragging = false;
        }
    );
    el.addEventListener(
        "pointercancel",
        () => {
            dragging = false;
            state.selectedCardId =
                null;
            renderHands();
        }
    );
}
/* =====================================================
   PLAY SELECTED CARD
===================================================== */
playerHandEl.addEventListener(

        const cardEl =

                ".hand-card"

        */

/* =====================================================
   PLAYER PLAY
===================================================== */
async function playPlayerCard(
    card
) {
    /*
        Проверяем, что карта
        реально существует в руке.
    */
    const index =
        state.player.findIndex(
            c =>
                c.id === card.id
        );
    if (
        index === -1
    ) {
        return;
    }
    /* =========================================
       АТАКА
    ========================================= */
    if (
        state.phase ===
        "player_attack"
    ) {
        if (
            !canAttack(
                card,
                "player"
            )
        ) {
            showMessage(
                "Эту карту нельзя подкинуть"
            );
            state.selectedCardId =
                null;
            renderHands();
            return;
        }
        /*
            Удаляем карту из руки
            ровно ОДИН раз.
        */
        state.player.splice(
            index,
            1
        );
        /*
            Создаём новую пару.
        */
        state.tablePairs.push({
            attack: card,
            defense: null
        });
        state.selectedCardId =
            null;
        renderHands();
        await renderTable();
        /*
            Первый/следующий удар
            теперь должен отбиваться.
        */
        state.phase =
            "cpu_defense";
        showMessage(
            "Компьютер отбивается"
        );
        await sleep(450);
        await cpuDefense();
        return;
    }
    /* =========================================
       ЗАЩИТА
    ========================================= */
    if (
        state.phase ===
        "player_defense"
    ) {
        const targetIndex =
            getUnbeatenIndex();
        if (
            targetIndex === -1
        ) {
            return;
        }
        const attack =
            state.tablePairs[
                targetIndex
            ].attack;
        if (
            !canBeat(
                attack,
                card
            )
        ) {
            showMessage(
                "Этой картой побить нельзя"
            );
            return;
        }
        /*
            Удаляем только выбранную
            карту из руки.
        */
        state.player.splice(
            index,
            1
        );
        state.tablePairs[
            targetIndex
        ].defense =
            card;
        state.selectedCardId =
            null;
        renderHands();
        await renderTable();
        /*
            Если игрок полностью
            отбился, компьютер как
            атакующий должен решить,
            можно ли подкинуть.
            Если может — подкидывает.
            Если не может — раунд
            автоматически заканчивается.
        */
        await sleep(300);
        await cpuAfterPlayerDefense();
        return;
    }
}
/* =====================================================
   CPU DEFENSE
===================================================== */
async function cpuDefense() {
    if (
        state.phase !==
        "cpu_defense"
    ) {
        return;
    }
    const targetIndex =
        getUnbeatenIndex();
    /*
        Все текущие атаки побиты.
        Теперь компьютер должен
        решить, подкидывать ли ещё.
    */
    if (
        targetIndex === -1
    ) {
        await cpuAfterSuccessfulDefense();
        return;
    }
    const attack =
        state.tablePairs[
            targetIndex
        ].attack;
    const card =
        findBestDefense(
            state.cpu,
            attack
        );
    /*
        Не может отбиться.
    */
    if (!card) {
        await sleep(450);
        await cpuTakeCards();
        return;
    }
    /*
        Удаляем карту из руки.
    */
    const index =
        state.cpu.findIndex(
            c =>
                c.id === card.id
        );
    if (
        index === -1
    ) {
        console.error(
            "CPU CARD NOT FOUND",
            card
        );
        return;
    }
    state.cpu.splice(
        index,
        1
    );
    state.tablePairs[
        targetIndex
    ].defense =
        card;
    renderHands();
    await renderTable();
    await sleep(350);
    /*
        После защиты компьютер
        НЕ подкидывает мгновенно,
        если осталась ещё
        непобитая атака.
        Сначала он обязан
        защитить её.
    */
    if (
        getUnbeatenIndex() !== -1
    ) {
        await cpuDefense();
        return;
    }
    /*
        Все карты побиты.
        Теперь компьютер,
        как атакующий, может
        подкинуть.
    */
    await cpuAfterSuccessfulDefense();
}
/* =====================================================
   CPU AFTER SUCCESSFUL DEFENSE
===================================================== */
async function cpuAfterSuccessfulDefense() {
    if (
        state.phase !==
        "cpu_defense"
    ) {
        return;
    }
    const options =
        getCpuAttackOptions();
    /*
        Компьютер НЕ может
        подкинуть карту просто
        потому, что у него есть
        карта.
        Она должна соответствовать
        рангу карты на столе.
    */
    if (
        options.length > 0
        &&
        state.tablePairs.length < 6
        &&
        state.tablePairs.length <
            state.defenderStartCount
    ) {
        const card =
            chooseCpuAttack(
                options
            );
        const index =
            state.cpu.findIndex(
                c =>
                    c.id ===
                    card.id
            );
        if (
            index === -1
        ) {
            return;
        }
        state.cpu.splice(
            index,
            1
        );
        state.tablePairs.push({
            attack: card,
            defense: null
        });
        renderHands();
        await renderTable();
        await sleep(350);
        /*
            Теперь снова должен
            отбиваться игрок.
        */
        state.phase =
            "player_defense";
        showMessage(
            "Компьютер подкинул — отбивай"
        );
        updateButtons();
        return;
    }
    /*
        Нет допустимой карты —
        компьютер обязан закончить
        атаку.
    */
    await finishRound(
        "player"
    );
}
/* =====================================================
   CPU AFTER PLAYER DEFENSE
===================================================== */
async function cpuAfterPlayerDefense() {
    /*
        Здесь игрок успешно побил
        последнюю атаку компьютера.
        Компьютер может подкинуть
        только если у него реально
        есть подходящая карта.
    */
    if (
        !allBeaten()
    ) {
        return;
    }
    const options =
        getCpuAttackOptions();
    if (
        options.length > 0
        &&
        state.tablePairs.length < 6
        &&
        state.tablePairs.length <
            state.defenderStartCount
    ) {
        const card =
            chooseCpuAttack(
                options
            );
        const index =
            state.cpu.findIndex(
                c =>
                    c.id === card.id
            );
        if (
            index === -1
        ) {
            return;
        }
        state.cpu.splice(
            index,
            1
        );
        state.tablePairs.push({
            attack: card,
            defense: null
        });
        renderHands();
        await renderTable();
        await sleep(350);
        state.phase =
            "player_defense";
        showMessage(
            "Ещё одна карта — отбивай"
        );
        updateButtons();
        return;
    }
    /*
        Компьютеру нечем/нельзя
        продолжать.
    */
    await finishRound(
        "player"
    );
}
/* =====================================================
   CPU TAKE
===================================================== */
async function cpuTakeCards() {
    showMessage(
        "Компьютер берёт карты"
    );
    await sleep(450);
    /*
        Забираем ВСЕ карты со стола.
        Никаких копий.
    */
    const cards =
        allCardsOnTable();
    state.cpu.push(
        ...cards
    );
    state.tablePairs = [];
    renderHands();
    await sleep(300);
    /*
        После взятия атакующий
        продолжает атаку.
        В нашем случае CPU
        был атакующим.
    */
    await refillHands();
    if (
        checkGameOver()
    ) {
        return;
    }
    state.phase =
        "cpu_attack";
    state.attacker =
        "cpu";
    state.defender =
        "player";
    state.defenderStartCount =
        state.player.length;
    await sleep(350);
    await cpuStartAttack();
}
/* =====================================================
   PLAYER TAKE
===================================================== */
async function playerTakeCards() {
    if (
        state.phase !==
        "player_defense"
    ) {
        return;
    }
    /*
        Забираем все карты,
        включая уже побитые.
    */
    const cards =
        allCardsOnTable();
    state.player.push(
        ...cards
    );
    state.tablePairs = [];
    renderHands();
    showMessage(
        "Ты взял карты"
    );
    await sleep(350);
    /*
        ВАЖНО:
        Если игрок взял карты,
        он НЕ становится атакующим.
        Атакующий продолжает.
        Если CPU атаковал,
        CPU снова атакует.
    */
    await refillHands();
    if (
        checkGameOver()
    ) {
        return;
    }
    if (
        state.attacker ===
        "cpu"
    ) {
        state.phase =
            "cpu_attack";
        state.defender =
            "player";
        state.defenderStartCount =
            state.player.length;
        await cpuStartAttack();
    } else {
        state.phase =
            "player_attack";
        state.defender =
            "cpu";
        state.defenderStartCount =
            state.cpu.length;
        showMessage(
            "Твой ход"
        );
    }
    updateButtons();
}
/* =====================================================
   FINISH ROUND
===================================================== */
async function finishRound(
    nextAttacker
) {
    /*
        Все карты отбиты.
        Они уходят в отбой.
    */
    showMessage(
        "Бито"
    );
    await sleep(500);
    state.tablePairs = [];
    await refillHands();
    if (
        checkGameOver()
    ) {
        return;
    }
    /*
        После успешной защиты
        защитник становится
        следующим атакующим.
    */
    if (
        nextAttacker ===
        "player"
    ) {
        state.attacker =
            "player";
        state.defender =
            "cpu";
        state.phase =
            "player_attack";
        state.defenderStartCount =
            state.cpu.length;
        showMessage(
            "Твой ход"
        );
    } else {
        state.attacker =
            "cpu";
        state.defender =
            "player";
        state.phase =
            "cpu_attack";
        state.defenderStartCount =
            state.player.length;
        showMessage(
            "Ход компьютера"
        );
        await sleep(450);
        await cpuStartAttack();
    }
    renderHands();
    updateButtons();
}
/* =====================================================
   CPU START ATTACK
===================================================== */
async function cpuStartAttack() {
    if (
        state.phase !==
        "cpu_attack"
    ) {
        return;
    }
    if (
        state.cpu.length === 0
    ) {
        checkGameOver();
        return;
    }
    /*
        Первый удар может быть
        любой картой.
    */
    const card =
        chooseCpuAttack(
            state.cpu
        );
    if (!card) {
        return;
    }
    const index =
        state.cpu.findIndex(
            c =>
                c.id ===
                card.id
        );
    if (
        index === -1
    ) {
        console.error(
            "CPU ATTACK CARD NOT FOUND"
        );
        return;
    }
    state.cpu.splice(
        index,
        1
    );
    state.tablePairs.push({
        attack: card,
        defense: null
    });
    renderHands();
    await renderTable();
    await sleep(400);
    state.phase =
        "player_defense";
    showMessage(
        "Твой ход — отбивай"
    );
    updateButtons();
}
/* =====================================================
   REFILL
===================================================== */
async function refillHands() {
    /*
        Сначала атакующий,
        потом защитник.
        Именно так работает
        стандартная схема добора.
    */
    const order =
        state.attacker ===
        "player"
            ? [
                state.player,
                state.cpu
            ]
            : [
                state.cpu,
                state.player
            ];
    for (
        const hand of order
    ) {
        while (
            hand.length < 6
            &&
            state.deck.length > 0
        ) {
            /*
                Последняя карта колоды
                является козырем.
                Она тоже является частью
                deck и будет взята
                последней.
            */
            const card =
                state.deck.shift();
            hand.push(card);
            renderHands();
            await sleep(70);
        }
    }
    updateInfo();
}
/* =====================================================
   RENDER TABLE
===================================================== */
async function renderTable() {
    playAreaEl.innerHTML = "";
    state.tablePairs.forEach(
        (pair, index) => {
            const pairEl =
                document.createElement(
                    "div"
                );
            pairEl.className =
                "card-pair";
            /*
                Не кучкуем карты.
            */
            const col =
                index % 4;
            const row =
                Math.floor(index / 4);
            pairEl.style.left =
                `${col * 78 + 4}px`;
            pairEl.style.top =
                `${row * 108 + 10}px`;
            /*
                Атакующая карта.
            */
            const attackEl =
                createPlayedCard(
                    pair.attack
                );
            attackEl.style.left =
                "0px";
            attackEl.style.top =
                "0px";
            attackEl.style.transform =
                `rotate(${
                    (index % 2
                        ? 2
                        : -2)
                }deg)`;
            pairEl.appendChild(
                attackEl
            );
            /*
                Защищающая карта
                лежит поверх атакующей.
            */
            if (
                pair.defense
            ) {
                const defenseEl =
                    createPlayedCard(
                        pair.defense
                    );
                defenseEl.style.left =
                    "18px";
                defenseEl.style.top =
                    "10px";
                defenseEl.style.transform =
                    `rotate(${
                        index % 2
                            ? -3
                            : 3
                    }deg)`;
                pairEl.appendChild(
                    defenseEl
                );
            }
            playAreaEl.appendChild(
                pairEl
            );
            /*
                Анимация появления.
            */
            pairEl.style.opacity =
                "0";
            pairEl.style.transform +=
                " scale(.65)";
            requestAnimationFrame(
                () => {
                    pairEl.style.transition =
                        "all .28s cubic-bezier(.2,.8,.2,1)";
                    pairEl.style.opacity =
                        "1";
                    pairEl.style.transform =
                        `scale(1)`;
                }
            );
        }
    );
}
/* =====================================================
   CREATE PLAYED CARD
===================================================== */
function createPlayedCard(
    card
) {
    const el =
        document.createElement(
            "div"
        );
    el.className =
        "played-card " +
        (
            isRed(card)
                ? "red"
                : ""
        );
    el.innerHTML =
        cardHTML(card);
    return el;
}
/* =====================================================
   BUTTONS
===================================================== */
function updateButtons() {
    takeButton.style.display =
        "none";
    finishButton.style.display =
        "none";
    if (
        state.phase ===
        "player_defense"
    ) {
        takeButton.style.display =
            "block";
    }
    /*
        Кнопка БИТО появляется
        только если все карты
        отбиты.
        Но она НЕ обязательна:
        если игрок хочет закончить,
        может нажать её.
    */
    if (
        state.phase ===
        "player_defense"
        &&
        allBeaten()
    ) {
        finishButton.style.display =
            "block";
    }
}
/* =====================================================
   TAKE BUTTON
===================================================== */
takeButton.addEventListener(
    "click",
    async () => {
        await playerTakeCards();
    }
);
/* =====================================================
   BEAT BUTTON
===================================================== */
finishButton.addEventListener(
    "click",
    async () => {
        if (
            state.phase !==
            "player_defense"
        ) {
            return;
        }
        if (
            !allBeaten()
        ) {
            showMessage(
                "Сначала отбей все карты"
            );
            return;
        }
        /*
            Игрок говорит:
            "Бито".
            Компьютер проверяет,
            может ли продолжить.
        */
        await cpuAfterPlayerDefense();
    }
);
/* =====================================================
   INFO
===================================================== */
function updateInfo() {
    $("deckCount").innerText =
        state.deck.length;
    $("playerCount").innerText =
        state.player.length;
    $("opponentCount").innerText =
        state.cpu.length;
    $("trumpInfo").innerText =
        state.trumpSuit || "—";
}
/* =====================================================
   MESSAGE
===================================================== */
let messageTimer = null;
function showMessage(text) {
    messageEl.innerText =
        text;
    messageEl.classList.add(
        "show"
    );
    clearTimeout(
        messageTimer
    );
    messageTimer =
        setTimeout(
            () => {
                messageEl.classList.remove(
                    "show"
                );
            },
            1500
        );
}
/* =====================================================
   CHECK DUPLICATES
===================================================== */
function checkDuplicates() {
    const all = [
        ...state.deck,
        ...state.player,
        ...state.cpu,
        ...allCardsOnTable()
    ];
    const ids =
        new Set();
    for (
        const card of all
    ) {
        if (
            ids.has(card.id)
        ) {
            console.error(
                "DUPLICATE CARD:",
                card
            );
            return false;
        }
        ids.add(
            card.id
        );
    }
    return true;
}
/* =====================================================
   GAME OVER
===================================================== */
function checkGameOver() {
    if (
        state.deck.length > 0
    ) {
        return false;
    }
    if (
        state.player.length === 0
        &&
        state.cpu.length === 0
    ) {
        endGame(
            "Ничья"
        );
        return true;
    }
    if (
        state.player.length === 0
    ) {
        endGame(
            "Ты победил"
        );
        return true;
    }
    if (
        state.cpu.length === 0
    ) {
        endGame(
            "Компьютер победил"
        );
        return true;
    }
    return false;
}
function endGame(text) {
    state.phase =
        "finished";
    updateButtons();
    showMessage(
        text
    );
    setTimeout(
        () => {
            if (tg) {
                tg.showAlert(
                    text
                );
            } else {
                alert(text);
            }
        },
        500
    );
}
/* =====================================================
   START
===================================================== */
$("startButton")
    .addEventListener(
        "click",
        async () => {
            if (
                state.gameStarted
            ) {
                return;
            }
            state.gameStarted =
                true;
            $("startScreen")
                .style.display =
                "none";
            if (
                tg &&
                tg.initDataUnsafe &&
                tg.initDataUnsafe.user
            ) {
                $("playerName")
                    .innerText =
                    tg.initDataUnsafe
                        .user
                        .first_name
                    ||
                    "Игрок";
            }
            /*
                Создаём ровно 36
                уникальных карт.
            */
            state.deck =
                createDeck();
            /*
                Определяем козырь.
            */
            setupTrump();
            /*
                Раздаём 12 карт.
            */
            await dealGame();
            /*
                Проверка:
                36 - 12 = 24 карты.
            */
            if (
                state.deck.length !== 24
            ) {
                console.error(
                    "DECK ERROR:",
                    state.deck.length
                );
            }
            /*
                Проверка отсутствия
                дублей.
            */
            if (
                !checkDuplicates()
            ) {
                console.error(
                    "DUPLICATES FOUND"
                );
            }
            /*
                Первый ход:
                младший козырь.
            */
            const playerTrumps =
                state.player
                    .filter(
                        c =>
                            c.suit ===
                            state.trumpSuit
                    )
                    .sort(
                        (a,b) =>
                            a.value -
                            b.value
                    );
            const cpuTrumps =
                state.cpu
                    .filter(
                        c =>
                            c.suit ===
                            state.trumpSuit
                    )
                    .sort(
                        (a,b) =>
                            a.value -
                            b.value
                    );
            let playerStarts =
                false;
            if (
                playerTrumps.length
                &&
                cpuTrumps.length
            ) {
                playerStarts =
                    playerTrumps[0].value
                    <
                    cpuTrumps[0].value;
            } else if (
                playerTrumps.length
            ) {
                playerStarts =
                    true;
            } else if (
                cpuTrumps.length
            ) {
                playerStarts =
                    false;
            } else {
                /*
                    Если козырей ни у кого
                    нет — младшая карта.
                */
                const playerMin =
                    Math.min(
                        ...state.player
                            .map(
                                c =>
                                    c.value
                            )
                    );
                const cpuMin =
                    Math.min(
                        ...state.cpu
                            .map(
                                c =>
                                    c.value
                            )
                    );
                playerStarts =
                    playerMin <=
                    cpuMin;
            }
            if (
                playerStarts
            ) {
                state.attacker =
                    "player";
                state.defender =
                    "cpu";
                state.phase =
                    "player_attack";
                state.defenderStartCount =
                    state.cpu.length;
                showMessage(
                    "Твой ход"
                );
            } else {
                state.attacker =
                    "cpu";
                state.defender =
                    "player";
                state.phase =
                    "cpu_attack";
                state.defenderStartCount =
                    state.player.length;
                showMessage(
                    "Компьютер начинает"
                );
                await sleep(600);
                await cpuStartAttack();
            }
            renderHands();
            updateButtons();
        }
    );
/* =====================================================
   INITIAL
===================================================== */
updateInfo();
</script>

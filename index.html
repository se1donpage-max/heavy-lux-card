<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, user-scalable=no"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    background:
        radial-gradient(circle at center, #22251f 0%, #11130f 45%, #080908 100%);
    color: white;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#app {
    width: 100%;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

/* ==============================
   LOADING
============================== */

.loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090909;
    z-index: 1000;
    color: #aaa;
    font-size: 16px;
}

.error {
    position: fixed;
    inset: 20px;
    z-index: 1001;
    background: #241414;
    border: 1px solid #662525;
    border-radius: 15px;
    padding: 20px;
    color: #ffb0b0;
    white-space: pre-wrap;
    overflow: auto;
}

/* ==============================
   GAME
============================== */

.game {
    min-height: 100vh;
    position: relative;
    display: none;
}

/* ==============================
   TOP BAR
============================== */

.topbar {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    z-index: 50;
}

.logo {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    display: block;
    color: #777;
    font-size: 7px;
    letter-spacing: 4px;
    margin-top: 2px;
}

.deck-info {
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    padding: 7px 10px;
    font-size: 11px;
    color: #bbb;
}

/* ==============================
   TABLE
============================== */

.table {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #34412f 0%,
            #263024 42%,
            #171d16 78%,
            #0d100c 100%
        );
}

.table::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    pointer-events: none;
}

/* ==============================
   OPPONENT
============================== */

.opponent {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    flex-direction: column;
    align-items: center;

    z-index: 20;
}

.avatar {
    width: 44px;
    height: 44px;

    border-radius: 50%;
    background: linear-gradient(145deg,#303030,#111);

    border: 2px solid #555;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;
}

.opponent-name {
    margin-top: 5px;
    font-size: 12px;
    color: #ccc;
}

.opponent-count {
    margin-top: 3px;
    font-size: 11px;
    color: #888;
}

/* ==============================
   OPPONENT CARDS
============================== */

.opponent-hand {
    position: absolute;
    top: 92px;
    left: 50%;
    transform: translateX(-50%);

    height: 70px;
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    pointer-events: none;
    z-index: 15;
}

.opponent-card {
    position: relative;

    width: 42px;
    height: 62px;

    margin-left: -17px;

    border-radius: 7px;

    background:
        linear-gradient(135deg, #151515, #343434);

    border: 2px solid #777;

    box-shadow:
        0 4px 8px rgba(0,0,0,.45);

    transform-origin: bottom center;
}

.opponent-card:first-child {
    margin-left: 0;
}

.opponent-card::after {
    content: "HLC";

    position: absolute;
    inset: 4px;

    border: 1px solid #777;
    border-radius: 4px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1px;
}

/* ==============================
   CENTER
============================== */

.center {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 230px;
    height: 230px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;
}

/* ==============================
   DECK
============================== */

.deck-area {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 100px;
    height: 130px;

    z-index: 5;
}

.deck {
    position: absolute;

    width: 68px;
    height: 98px;

    left: 5px;
    top: 15px;

    border-radius: 8px;

    background:
        repeating-linear-gradient(
            45deg,
            #252525 0px,
            #252525 3px,
            #333 3px,
            #333 6px
        );

    border: 2px solid #aaa;

    box-shadow:
        -2px 2px 0 #555,
        -4px 4px 0 #444,
        0 8px 15px rgba(0,0,0,.45);

    z-index: 5;
}

.deck::after {
    content: "HEAVY LUX";

    position: absolute;

    inset: 7px;

    border: 1px solid #777;
    border-radius: 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #888;

    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1px;
}

/* ==============================
   TRUMP
============================== */

.trump-card {
    position: absolute;

    width: 68px;
    height: 98px;

    right: 2px;
    top: 18px;

    border-radius: 8px;

    background: #f3f3f3;
    color: #111;

    border: 2px solid #fff;

    box-shadow:
        0 6px 15px rgba(0,0,0,.4);

    transform: rotate(12deg);

    z-index: 2;
}

.trump-card .rank {
    position: absolute;
    top: 6px;
    left: 7px;

    font-size: 17px;
    font-weight: 900;
}

.trump-card .suit {
    position: absolute;

    left: 0;
    right: 0;
    top: 31px;

    text-align: center;

    font-size: 28px;
}

/* ==============================
   DECK COUNT
============================== */

.deck-count {
    position: absolute;

    bottom: -18px;
    left: 0;

    width: 100%;

    text-align: center;

    color: #aaa;
    font-size: 10px;
}

/* ==============================
   BATTLE AREA
============================== */

.battle {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 250px;
    height: 170px;

    transform: translate(-50%, -50%);

    z-index: 30;

    pointer-events: none;
}

.played-card {
    position: absolute;

    width: 64px;
    height: 92px;

    border-radius: 8px;

    background: #f5f5f5;
    color: #111;

    border: 2px solid white;

    box-shadow:
        0 8px 15px rgba(0,0,0,.5);

    pointer-events: none;
}

.played-card .rank {
    position: absolute;
    top: 5px;
    left: 6px;

    font-size: 16px;
    font-weight: 900;
}

.played-card .suit {
    position: absolute;

    top: 31px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 26px;
}

.played-card.defended {
    margin-top: 18px;
    margin-left: 18px;
    transform: rotate(5deg);
}

/* ==============================
   PLAYER
============================== */

.player {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 5px;

    height: 195px;

    z-index: 40;
}

.player-info {
    position: absolute;

    bottom: 174px;

    left: 14px;

    font-size: 11px;
    color: #bbb;
}

.player-name {
    color: white;
    font-weight: 800;
}

.player-count {
    color: #888;
    margin-left: 5px;
}

/* ==============================
   PLAYER HAND
============================== */

.player-hand {
    position: absolute;

    bottom: 26px;

    left: 50%;

    width: 100%;
    height: 125px;

    transform: translateX(-50%);

    display: flex;
    justify-content: center;
    align-items: flex-end;

    z-index: 50;
}

/* ==============================
   PLAYER CARD
============================== */

.player-card {
    position: relative;

    width: 61px;
    height: 91px;

    margin-left: -18px;

    border-radius: 8px;

    background: #f4f4f4;

    color: #111;

    border: 2px solid #fff;

    box-shadow:
        0 7px 13px rgba(0,0,0,.5);

    transition:
        transform .15s ease,
        margin .15s ease;

    transform-origin: bottom center;

    cursor: grab;

    touch-action: none;
}

.player-card:first-child {
    margin-left: 0;
}

.player-card.selected {
    transform: translateY(-25px);
    z-index: 100;
}

.player-card.dragging {
    position: fixed;
    z-index: 999;

    margin: 0;

    transform:
        translate(-50%, -50%)
        rotate(0deg)
        scale(1.08);

    pointer-events: none;
}

.player-card .rank {
    position: absolute;

    top: 5px;
    left: 6px;

    font-size: 17px;
    font-weight: 900;
}

.player-card .suit {
    position: absolute;

    left: 0;
    right: 0;
    top: 31px;

    text-align: center;

    font-size: 27px;
}

/* ==============================
   ACTION BUTTON
============================== */

.actions {
    position: absolute;

    bottom: 2px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 200;
}

.action-button {
    display: none;

    min-width: 110px;

    border: none;
    border-radius: 14px;

    padding: 12px 20px;

    background: white;
    color: black;

    font-size: 14px;
    font-weight: 900;

    box-shadow: 0 6px 15px rgba(0,0,0,.4);
}

.action-button:active {
    transform: scale(.95);
}

.action-button.visible {
    display: block;
}

/* ==============================
   MESSAGE
============================== */

.message {
    position: absolute;

    left: 50%;
    top: 42%;

    transform: translate(-50%, -50%);

    z-index: 300;

    background: rgba(0,0,0,.7);

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 14px;

    padding: 10px 16px;

    font-size: 13px;

    color: #ddd;

    opacity: 0;

    pointer-events: none;

    transition: opacity .25s;
}

.message.show {
    opacity: 1;
}

/* ==============================
   ANIMATION
============================== */

.dealing-card {
    position: fixed;

    width: 61px;
    height: 91px;

    background:
        repeating-linear-gradient(
            45deg,
            #181818 0px,
            #181818 3px,
            #303030 3px,
            #303030 6px
        );

    border: 2px solid #777;

    border-radius: 8px;

    z-index: 1000;

    pointer-events: none;

    transition:
        left .45s cubic-bezier(.2,.8,.2,1),
        top .45s cubic-bezier(.2,.8,.2,1),
        transform .45s ease;
}

.dealing-card::after {
    content: "HLC";

    position: absolute;
    inset: 5px;

    border: 1px solid #777;
    border-radius: 5px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 8px;
    color: #777;
    font-weight: 900;
}

/* ==============================
   MOBILE
============================== */

@media (max-width: 380px) {

    .player-card {
        width: 55px;
        height: 84px;
    }

    .opponent-card {
        width: 38px;
        height: 57px;
    }

    .battle {
        transform: translate(-50%, -50%) scale(.9);
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="loading" class="loading">
        Загрузка Heavy Lux Card...
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="game" class="game">

        <div class="topbar">

            <div class="logo">
                HEAVY LUX
                <span>CARD</span>
            </div>

            <div class="deck-info">
                Колода:
                <b id="deckCountTop">24</b>
            </div>

        </div>

        <div class="table">

            <!-- ОППОНЕНТ -->

            <div class="opponent">

                <div class="avatar">
                    🤖
                </div>

                <div class="opponent-name">
                    Компьютер
                </div>

                <div class="opponent-count">
                    Карт: <span id="opponentCount">6</span>
                </div>

            </div>

            <div id="opponentHand" class="opponent-hand"></div>

            <!-- ЦЕНТР -->

            <div class="center">

                <div class="deck-area">

                    <div id="deck" class="deck"></div>

                    <div id="trumpCard" class="trump-card">
                        <div class="rank"></div>
                        <div class="suit"></div>
                    </div>

                    <div id="deckCount" class="deck-count">
                        24 карты
                    </div>

                </div>

            </div>

            <!-- СТОЛ -->

            <div id="battle" class="battle"></div>

            <div id="message" class="message"></div>

            <!-- ИГРОК -->

            <div class="player">

                <div class="player-info">

                    <span id="playerName" class="player-name">
                        Игрок
                    </span>

                    <span class="player-count">
                        Карт:
                        <span id="playerCount">6</span>
                    </span>

                </div>

                <div id="playerHand" class="player-hand"></div>

                <div class="actions">

                    <button
                        id="beatButton"
                        class="action-button"
                        onclick="finishDefense()"
                    >
                        БИТО
                    </button>

                    <button
                        id="takeButton"
                        class="action-button"
                        onclick="takeCards()"
                    >
                        ВЗЯТЬ
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API_URL =
    "https://heavy-lux-card-api.onrender.com";

/* =========================================================
   CARD DATA
========================================================= */

const SUITS = [
    {
        id: "hearts",
        symbol: "♥",
        color: "red"
    },
    {
        id: "diamonds",
        symbol: "♦",
        color: "red"
    },
    {
        id: "clubs",
        symbol: "♣",
        color: "black"
    },
    {
        id: "spades",
        symbol: "♠",
        color: "black"
    }
];

const RANKS = [
    {
        id: "6",
        value: 6,
        label: "6"
    },
    {
        id: "7",
        value: 7,
        label: "7"
    },
    {
        id: "8",
        value: 8,
        label: "8"
    },
    {
        id: "9",
        value: 9,
        label: "9"
    },
    {
        id: "10",
        value: 10,
        label: "10"
    },
    {
        id: "J",
        value: 11,
        label: "В"
    },
    {
        id: "Q",
        value: 12,
        label: "Д"
    },
    {
        id: "K",
        value: 13,
        label: "К"
    },
    {
        id: "A",
        value: 14,
        label: "Т"
    }
];

/* =========================================================
   GAME STATE
========================================================= */

let deck = [];
let playerHand = [];
let computerHand = [];

let trumpSuit = null;

let attacker = null;

let battleCards = [];

let phase = "loading";

/*
    possible phases:

    player_attack
    computer_attack
    player_defense
    computer_defense
    player_wait_beat
    computer_wait
    finished
*/

let draggingCard = null;

let dragOffsetX = 0;
let dragOffsetY = 0;

/* =========================================================
   HELPERS
========================================================= */

function createDeck() {

    const result = [];

    for (const suit of SUITS) {

        for (const rank of RANKS) {

            result.push({
                id:
                    suit.id +
                    "_" +
                    rank.id,

                suit: suit.id,

                symbol: suit.symbol,

                color: suit.color,

                rank: rank.id,

                value: rank.value
            });

        }

    }

    return result;
}

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }

    return array;
}

function getSuit(card) {

    return SUITS.find(
        s => s.id === card.suit
    );
}

function getRank(card) {

    return RANKS.find(
        r => r.id === card.rank
    );
}

function isTrump(card) {

    return card.suit === trumpSuit;
}

/* =========================================================
   CARD COMPARISON
========================================================= */

function canBeat(defender, attackerCard) {

    if (!defender || !attackerCard) {
        return false;
    }

    /*
        Одна масть:
        старшая карта бьёт младшую.
    */

    if (
        defender.suit === attackerCard.suit
    ) {

        return (
            defender.value >
            attackerCard.value
        );
    }

    /*
        Козырь бьёт некозырную.
    */

    if (
        isTrump(defender) &&
        !isTrump(attackerCard)
    ) {

        return true;
    }

    /*
        Некозырная карта
        не может бить козырь.
    */

    return false;
}

/* =========================================================
   DEALING
========================================================= */

async function dealGame() {

    deck = shuffle(createDeck());

    /*
        Вынимаем козырь.
        Он остаётся под колодой.
    */

    const trumpCard =
        deck.pop();

    trumpSuit =
        trumpCard.suit;

    /*
        Козырь кладём обратно
        под колоду.
    */

    deck.unshift(trumpCard);

    playerHand = [];
    computerHand = [];

    renderTrump(trumpCard);

    /*
        Анимация раздачи:
        сначала по одной карте каждому.
    */

    for (let i = 0; i < 6; i++) {

        const playerCard =
            deck.pop();

        playerHand.push(playerCard);

        await animateDeal("player");

        const computerCard =
            deck.pop();

        computerHand.push(computerCard);

        await animateDeal("computer");
    }

    sortHand(playerHand);
    sortHand(computerHand);

    renderAll();

    /*
        Определяем первого атакующего.
    */

    attacker =
        findFirstAttacker();

    if (attacker === "player") {

        phase = "player_attack";

        showMessage("Ваш ход");

    } else {

        phase = "computer_attack";

        showMessage("Компьютер ходит");

        setTimeout(
            computerAttack,
            900
        );
    }

    renderAll();
}

function animateDeal(target) {

    return new Promise(resolve => {

        const card =
            document.createElement("div");

        card.className =
            "dealing-card";

        document.body.appendChild(card);

        const deckElement =
            document.querySelector(".deck");

        const deckRect =
            deckElement.getBoundingClientRect();

        const startX =
            deckRect.left +
            deckRect.width / 2;

        const startY =
            deckRect.top +
            deckRect.height / 2;

        card.style.left =
            startX + "px";

        card.style.top =
            startY + "px";

        card.style.transform =
            "translate(-50%, -50%) rotate(0deg)";

        requestAnimationFrame(() => {

            let targetX;
            let targetY;

            if (target === "player") {

                targetX =
                    window.innerWidth / 2;

                targetY =
                    window.innerHeight - 90;

            } else {

                targetX =
                    window.innerWidth / 2;

                targetY = 115;
            }

            card.style.left =
                targetX + "px";

            card.style.top =
                targetY + "px";

            card.style.transform =
                target === "player"
                    ? "translate(-50%, -50%) rotate(-5deg)"
                    : "translate(-50%, -50%) rotate(5deg)";
        });

        setTimeout(() => {

            card.remove();

            renderAll();

            resolve();

        }, 470);
    });
}

/* =========================================================
   FIRST ATTACKER
========================================================= */

function findFirstAttacker() {

    const playerTrump =
        playerHand
            .filter(isTrump)
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0];

    const computerTrump =
        computerHand
            .filter(isTrump)
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0];

    if (
        playerTrump &&
        computerTrump
    ) {

        return (
            playerTrump.value <=
            computerTrump.value
        )
            ? "player"
            : "computer";
    }

    if (playerTrump) {
        return "player";
    }

    if (computerTrump) {
        return "computer";
    }

    const playerLowest =
        [...playerHand]
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0];

    const computerLowest =
        [...computerHand]
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0];

    return (
        playerLowest.value <=
        computerLowest.value
    )
        ? "player"
        : "computer";
}

/* =========================================================
   SORT
========================================================= */

function sortHand(hand) {

    hand.sort((a,b) => {

        if (
            isTrump(a) &&
            !isTrump(b)
        ) {
            return 1;
        }

        if (
            !isTrump(a) &&
            isTrump(b)
        ) {
            return -1;
        }

        return a.value - b.value;
    });
}

/* =========================================================
   RENDER
========================================================= */

function renderAll() {

    renderPlayerHand();

    renderOpponentHand();

    renderBattle();

    renderCounts();

    renderButtons();
}

function renderCounts() {

    document.getElementById(
        "playerCount"
    ).textContent =
        playerHand.length;

    document.getElementById(
        "opponentCount"
    ).textContent =
        computerHand.length;

    document.getElementById(
        "deckCount"
    ).textContent =
        deck.length +
        " карт";

    document.getElementById(
        "deckCountTop"
    ).textContent =
        deck.length;
}

function renderTrump(card) {

    const element =
        document.getElementById(
            "trumpCard"
        );

    const rank =
        getRank(card);

    const suit =
        getSuit(card);

    element.querySelector(
        ".rank"
    ).textContent =
        rank.label;

    element.querySelector(
        ".suit"
    ).textContent =
        suit.symbol;

    element.style.color =
        suit.color === "red"
            ? "#c62828"
            : "#111";
}

/* =========================================================
   PLAYER HAND
========================================================= */

function renderPlayerHand() {

    const hand =
        document.getElementById(
            "playerHand"
        );

    hand.innerHTML = "";

    playerHand.forEach(
        (card, index) => {

            const element =
                createCardElement(
                    card,
                    "player-card"
                );

            element.dataset.index =
                index;

            /*
                Раскладываем веером.
            */

            const middle =
                (playerHand.length - 1) / 2;

            const rotation =
                (index - middle) * 3;

            element.style.transform =
                `rotate(${rotation}deg)`;

            /*
                Перетаскивание пальцем.
            */

            element.addEventListener(
                "pointerdown",
                startDrag
            );

            hand.appendChild(element);
        }
    );
}

/* =========================================================
   OPPONENT HAND
========================================================= */

function renderOpponentHand() {

    const hand =
        document.getElementById(
            "opponentHand"
        );

    hand.innerHTML = "";

    computerHand.forEach(
        (_, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "opponent-card";

            const middle =
                (computerHand.length - 1) / 2;

            const rotation =
                (index - middle) * 4;

            card.style.transform =
                `rotate(${rotation}deg)`;

            hand.appendChild(card);
        }
    );
}

/* =========================================================
   CARD ELEMENT
========================================================= */

function createCardElement(
    card,
    className
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        className;

    const rank =
        getRank(card);

    const suit =
        getSuit(card);

    const rankElement =
        document.createElement("div");

    rankElement.className =
        "rank";

    rankElement.textContent =
        rank.label;

    const suitElement =
        document.createElement("div");

    suitElement.className =
        "suit";

    suitElement.textContent =
        suit.symbol;

    element.appendChild(
        rankElement
    );

    element.appendChild(
        suitElement
    );

    element.style.color =
        suit.color === "red"
            ? "#c62828"
            : "#111";

    return element;
}

/* =========================================================
   BATTLE
========================================================= */

function renderBattle() {

    const battle =
        document.getElementById(
            "battle"
        );

    battle.innerHTML = "";

    battleCards.forEach(
        (pair, index) => {

            const attack =
                createCardElement(
                    pair.attack,
                    "played-card"
                );

            attack.style.left =
                `${20 + index * 58}px`;

            attack.style.top =
                `${20 + (index % 2) * 10}px`;

            attack.style.transform =
                `rotate(${index % 2 ? 5 : -5}deg)`;

            battle.appendChild(
                attack
            );

            if (pair.defense) {

                const defense =
                    createCardElement(
                        pair.defense,
                        "played-card defended"
                    );

                defense.style.left =
                    `${20 + index * 58}px`;

                defense.style.top =
                    `${35 + (index % 2) * 10}px`;

                battle.appendChild(
                    defense
                );
            }
        }
    );
}

/* =========================================================
   DRAG
========================================================= */

function startDrag(event) {

    if (
        phase !== "player_attack" &&
        phase !== "player_defense"
    ) {
        return;
    }

    const element =
        event.currentTarget;

    const index =
        Number(
            element.dataset.index
        );

    const card =
        playerHand[index];

    if (!card) {
        return;
    }

    draggingCard = {
        card,
        index,
        element
    };

    const rect =
        element.getBoundingClientRect();

    dragOffsetX =
        event.clientX -
        (rect.left + rect.width / 2);

    dragOffsetY =
        event.clientY -
        (rect.top + rect.height / 2);

    element.classList.add(
        "dragging"
    );

    element.setPointerCapture(
        event.pointerId
    );

    element.addEventListener(
        "pointermove",
        dragMove
    );

    element.addEventListener(
        "pointerup",
        dragEnd
    );

    element.addEventListener(
        "pointercancel",
        dragEnd
    );
}

function dragMove(event) {

    if (!draggingCard) {
        return;
    }

    const element =
        draggingCard.element;

    element.style.left =
        (
            event.clientX -
            dragOffsetX
        ) + "px";

    element.style.top =
        (
            event.clientY -
            dragOffsetY
        ) + "px";
}

function dragEnd(event) {

    if (!draggingCard) {
        return;
    }

    const element =
        draggingCard.element;

    element.classList.remove(
        "dragging"
    );

    const x =
        event.clientX;

    const y =
        event.clientY;

    const battleElement =
        document.getElementById(
            "battle"
        );

    const rect =
        battleElement.getBoundingClientRect();

    const inside =
        x >= rect.left - 40 &&
        x <= rect.right + 40 &&
        y >= rect.top - 40 &&
        y <= rect.bottom + 40;

    const card =
        draggingCard.card;

    const index =
        draggingCard.index;

    draggingCard = null;

    if (inside) {

        playPlayerCard(
            card,
            index
        );

    } else {

        renderPlayerHand();
    }
}

/* =========================================================
   PLAYER CARD PLAY
========================================================= */

function playPlayerCard(
    card,
    index
) {

    /*
        АТАКА
    */

    if (
        phase === "player_attack"
    ) {

        /*
            Первый атакующий
            может положить любую карту.
        */

        if (
            battleCards.length === 0
        ) {

            playerHand.splice(
                index,
                1
            );

            battleCards.push({
                attack: card,
                defense: null
            });

            phase =
                "player_wait_computer";

            renderAll();

            showMessage(
                "Компьютер отбивается..."
            );

            setTimeout(
                computerDefend,
                900
            );

            return;
        }

        /*
            При подкидывании
            ранг должен уже быть
            на столе.
        */

        if (
            !canThrowCard(card)
        ) {

            showMessage(
                "Такую карту подкинуть нельзя"
            );

            renderAll();

            return;
        }

        /*
            Ограничение:
            не больше карт,
            чем было у защищающегося.
        */

        if (
            battleCards.length >= 6
        ) {

            showMessage(
                "Больше подкинуть нельзя"
            );

            renderAll();

            return;
        }

        playerHand.splice(
            index,
            1
        );

        battleCards.push({
            attack: card,
            defense: null
        });

        phase =
            "player_wait_computer";

        renderAll();

        showMessage(
            "Компьютер отбивается..."
        );

        setTimeout(
            computerDefend,
            900
        );

        return;
    }

    /*
        ЗАЩИТА
    */

    if (
        phase === "player_defense"
    ) {

        const target =
            battleCards.find(
                pair =>
                    !pair.defense
            );

        if (!target) {
            return;
        }

        if (
            !canBeat(
                card,
                target.attack
            )
        ) {

            showMessage(
                "Этой картой побить нельзя"
            );

            renderAll();

            return;
        }

        playerHand.splice(
            index,
            1
        );

        target.defense =
            card;

        /*
            После каждого отбивания
            игрок НЕ завершает ход автоматически.

            Появляется кнопка БИТО.
        */

        phase =
            "player_wait_beat";

        renderAll();

        showMessage(
            "Карта побита. Нажмите «БИТО» или ждите подкидывания."
        );
    }
}

/* =========================================================
   CAN THROW
========================================================= */

function canThrowCard(card) {

    if (
        battleCards.length === 0
    ) {
        return true;
    }

    const ranks =
        [];

    battleCards.forEach(
        pair => {

            ranks.push(
                pair.attack.rank
            );

            if (pair.defense) {

                ranks.push(
                    pair.defense.rank
                );
            }
        }
    );

    return ranks.includes(
        card.rank
    );
}

/* =========================================================
   FINISH DEFENSE
========================================================= */

function finishDefense() {

    /*
        БИТО можно нажать,
        только если все карты
        побиты.
    */

    const allDefended =
        battleCards.length > 0 &&
        battleCards.every(
            pair =>
                pair.defense !== null
        );

    if (!allDefended) {

        showMessage(
            "Сначала нужно побить все карты"
        );

        return;
    }

    /*
        Отбой.
    */

    battleCards = [];

    /*
        Добор:
        сначала атакующий,
        потом защищающийся.
    */

    drawCards();

    /*
        После успешной защиты
        игрок, который отбивался,
        становится атакующим.
    */

    attacker = "player";

    /*
        Если у игрока нет карт,
        игра заканчивается.
    */

    if (
        playerHand.length === 0
    ) {

        if (
            computerHand.length === 0
        ) {

            endGame("Ничья");

        } else {

            endGame(
                "Вы победили!"
            );
        }

        return;
    }

    phase =
        "player_attack";

    renderAll();

    showMessage(
        "Отбились. Теперь ваш ход."
    );
}

/* =========================================================
   TAKE CARDS
========================================================= */

function takeCards() {

    /*
        Игрок забирает карты.
    */

    if (
        phase !== "player_defense"
    ) {
        return;
    }

    const taken = [];

    battleCards.forEach(
        pair => {

            taken.push(
                pair.attack
            );

            if (pair.defense) {

                taken.push(
                    pair.defense
                );
            }
        }
    );

    playerHand.push(
        ...taken
    );

    battleCards = [];

    /*
        Сначала атакующий добирает.
    */

    drawCards();

    /*
        Если игрок взял карты,
        компьютер продолжает атаку.
    */

    if (
        playerHand.length === 0
    ) {

        endGame(
            "Компьютер победил!"
        );

        return;
    }

    attacker = "computer";

    phase =
        "computer_attack";

    renderAll();

    showMessage(
        "Вы взяли карты. Компьютер продолжает."
    );

    setTimeout(
        computerAttack,
        1000
    );
}

/* =========================================================
   DRAW
========================================================= */

function drawCards() {

    /*
        Важный порядок:

        сначала атакующий,
        потом защищающийся.
    */

    const first =
        attacker === "player"
            ? playerHand
            : computerHand;

    const second =
        attacker === "player"
            ? computerHand
            : playerHand;

    while (
        first.length < 6 &&
        deck.length > 0
    ) {

        first.push(
            deck.pop()
        );
    }

    while (
        second.length < 6 &&
        deck.length > 0
    ) {

        second.push(
            deck.pop()
        );
    }

    sortHand(
        playerHand
    );

    sortHand(
        computerHand
    );
}

/* =========================================================
   COMPUTER ATTACK
========================================================= */

function computerAttack() {

    if (
        phase !== "computer_attack"
    ) {
        return;
    }

    if (
        computerHand.length === 0
    ) {

        endGame(
            "Вы победили!"
        );

        return;
    }

    /*
        Если стол пуст —
        компьютер делает первую атаку.
    */

    if (
        battleCards.length === 0
    ) {

        const card =
            chooseComputerAttackCard();

        const index =
            computerHand.indexOf(
                card
            );

        computerHand.splice(
            index,
            1
        );

        battleCards.push({
            attack: card,
            defense: null
        });

        phase =
            "player_defense";

        renderAll();

        showMessage(
            "Компьютер атакует"
        );

        return;
    }

    /*
        Компьютер может подкинуть
        только допустимый ранг.
    */

    const card =
        chooseComputerThrowCard();

    if (!card) {

        /*
            Компьютер закончил атаку.
        */

        drawCards();

        attacker = "player";

        phase =
            "player_attack";

        renderAll();

        showMessage(
            "Компьютер закончил атаку. Ваш ход."
        );

        return;
    }

    const index =
        computerHand.indexOf(
            card
        );

    computerHand.splice(
        index,
        1
    );

    battleCards.push({
        attack: card,
        defense: null
    });

    phase =
        "player_defense";

    renderAll();

    showMessage(
        "Компьютер подкинул карту"
    );
}

/* =========================================================
   COMPUTER ATTACK CARD
========================================================= */

function chooseComputerAttackCard() {

    /*
        Сначала стараемся ходить
        самой дешёвой некозырной картой.
    */

    const nonTrump =
        computerHand
            .filter(
                card =>
                    !isTrump(card)
            )
            .sort(
                (a,b) =>
                    a.value - b.value
            );

    if (
        nonTrump.length > 0
    ) {

        return nonTrump[0];
    }

    return (
        [...computerHand]
            .sort(
                (a,b) =>
                    a.value - b.value
            )[0]
    );
}

/* =========================================================
   COMPUTER THROW
========================================================= */

function chooseComputerThrowCard() {

    const allowed =
        computerHand
            .filter(
                canThrowCard
            );

    if (
        allowed.length === 0
    ) {
        return null;
    }

    /*
        Не подкидываем слишком дорогой козырь,
        если можно избавиться от обычной карты.
    */

    const nonTrump =
        allowed
            .filter(
                card =>
                    !isTrump(card)
            )
            .sort(
                (a,b) =>
                    a.value - b.value
            );

    if (
        nonTrump.length > 0
    ) {

        return nonTrump[0];
    }

    return allowed
        .sort(
            (a,b) =>
                a.value - b.value
        )[0];
}

/* =========================================================
   COMPUTER DEFENSE
========================================================= */

function computerDefend() {

    if (
        phase !== "player_wait_computer"
    ) {
        return;
    }

    /*
        Ищем первую непобитую карту.
    */

    const target =
        battleCards.find(
            pair =>
                !pair.defense
        );

    if (!target) {

        phase =
            "player_attack";

        renderAll();

        return;
    }

    const defense =
        chooseComputerDefense(
            target.attack
        );

    /*
        Компьютер не может отбиться.
    */

    if (!defense) {

        computerTakeCards();

        return;
    }

    const index =
        computerHand.indexOf(
            defense
        );

    computerHand.splice(
        index,
        1
    );

    target.defense =
        defense;

    renderAll();

    /*
        Если все карты побиты —
        компьютер НЕ завершает ход автоматически.

        Он принимает решение:
        либо подкидывает,
        либо заканчивает атаку.

        Для игрока логика аналогична:
        после своей защиты игрок нажимает БИТО.
    */

    setTimeout(
        computerContinueDefense,
        800
    );
}

/* =========================================================
   COMPUTER CONTINUE
========================================================= */

function computerContinueDefense() {

    /*
        Компьютер после того,
        как побил карту,
        сначала проверяет,
        может ли он подкинуть.

        Если может — подкидывает.
        Если не может — завершает атаку.
    */

    const card =
        chooseComputerThrowCard();

    if (
        card &&
        battleCards.length < 6
    ) {

        const index =
            computerHand.indexOf(
                card
            );

        computerHand.splice(
            index,
            1
        );

        battleCards.push({
            attack: card,
            defense: null
        });

        renderAll();

        showMessage(
            "Компьютер подкинул"
        );

        setTimeout(
            computerDefend,
            800
        );

        return;
    }

    /*
        Все карты побиты —
        отбой.
    */

    const allDefended =
        battleCards.every(
            pair =>
                pair.defense
        );

    if (
        allDefended
    ) {

        battleCards = [];

        attacker =
            "computer";

        drawCards();

        /*
            Теперь атакует компьютер.
        */

        phase =
            "computer_attack";

        renderAll();

        setTimeout(
            computerAttack,
            900
        );

        return;
    }

    /*
        Если осталась карта,
        продолжаем защиту.
    */

    phase =
        "player_wait_computer";

    setTimeout(
        computerDefend,
        600
    );
}

/* =========================================================
   COMPUTER DEFENSE CHOICE
========================================================= */

function chooseComputerDefense(
    attackCard
) {

    const possible =
        computerHand
            .filter(
                card =>
                    canBeat(
                        card,
                        attackCard
                    )
            )
            .sort(
                (a,b) => {

                    /*
                        Сначала некозырная
                        минимально подходящая карта.
                    */

                    if (
                        !isTrump(a) &&
                        isTrump(b)
                    ) {
                        return -1;
                    }

                    if (
                        isTrump(a) &&
                        !isTrump(b)
                    ) {
                        return 1;
                    }

                    return (
                        a.value -
                        b.value
                    );
                }
            );

    return possible[0] || null;
}

/* =========================================================
   COMPUTER TAKES
========================================================= */

function computerTakeCards() {

    const taken = [];

    battleCards.forEach(
        pair => {

            taken.push(
                pair.attack
            );

            if (pair.defense) {

                taken.push(
                    pair.defense
                );
            }
        }
    );

    computerHand.push(
        ...taken
    );

    battleCards = [];

    /*
        Игрок становится атакующим.
    */

    attacker =
        "player";

    drawCards();

    phase =
        "player_attack";

    renderAll();

    showMessage(
        "Компьютер взял карты. Ваш ход."
    );
}

/* =========================================================
   BUTTONS
========================================================= */

function renderButtons() {

    const beat =
        document.getElementById(
            "beatButton"
        );

    const take =
        document.getElementById(
            "takeButton"
        );

    beat.classList.remove(
        "visible"
    );

    take.classList.remove(
        "visible"
    );

    /*
        Кнопка ВЗЯТЬ
        появляется только во время защиты.
    */

    if (
        phase === "player_defense"
    ) {

        take.classList.add(
            "visible"
        );
    }

    /*
        БИТО появляется после успешного
        отбивания всех карт.
    */

    if (
        phase === "player_wait_beat"
    ) {

        const allDefended =
            battleCards.every(
                pair =>
                    pair.defense
            );

        if (
            allDefended
        ) {

            beat.classList.add(
                "visible"
            );
        }
    }
}

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;

function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        text;

    element.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            1800
        );
}

/* =========================================================
   END GAME
========================================================= */

function endGame(text) {

    phase =
        "finished";

    renderAll();

    setTimeout(() => {

        if (
            tg.showAlert
        ) {

            tg.showAlert(
                text
            );

        } else {

            alert(text);

        }

    }, 300);
}

/* =========================================================
   AUTHENTICATION
========================================================= */

async function authenticate() {

    try {

        const initData =
            tg.initData;

        /*
            Если приложение открыто
            напрямую браузером,
            можно запустить локальную игру.

            В Telegram будет использоваться
            настоящая авторизация.
        */

        if (
            initData
        ) {

            const response =
                await fetch(
                    `${API_URL}/api/auth`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                initData
                            })
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Ошибка авторизации"
                );
            }

            const player =
                data.player;

            document.getElementById(
                "playerName"
            ).textContent =
                player.first_name ||
                player.username ||
                "Игрок";

        } else {

            /*
                Локальный режим.
                Нужен для тестирования.
            */

            document.getElementById(
                "playerName"
            ).textContent =
                "Игрок";

        }

        document.getElementById(
            "loading"
        ).style.display =
            "none";

        document.getElementById(
            "game"
        ).style.display =
            "block";

        phase =
            "dealing";

        await dealGame();

    } catch (error) {

        console.error(
            "AUTH ERROR:",
            error
        );

        document.getElementById(
            "loading"
        ).style.display =
            "none";

        const errorBox =
            document.getElementById(
                "error"
            );

        errorBox.textContent =
            "Ошибка:\n\n" +
            error.message;

        errorBox.style.display =
            "block";
    }
}

/* =========================================================
   START
========================================================= */

authenticate();

</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #09090b;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

.header h1 {
    font-size: 25px;
    letter-spacing: 4px;
}

.header p {
    color: #777;
    font-size: 10px;
    letter-spacing: 5px;
    margin-top: 4px;
}

.balance {
    background: #151519;
    border: 1px solid #29292f;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    margin-bottom: 12px;
}

.balance span {
    color: #aaa;
    font-size: 13px;
}

.balance strong {
    font-size: 20px;
    margin-left: 5px;
}

.game {
    display: none;
}

.table {
    background: #111116;
    border: 1px solid #29292f;
    border-radius: 20px;
    padding: 15px;
    min-height: 570px;
    position: relative;
    overflow: hidden;
}

.trump {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 10px;
}

.trump strong {
    color: white;
}

.player-area {
    margin-top: 15px;
}

.player-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 8px;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 95px;
}

.card {
    width: 48px;
    height: 70px;
    background: white;
    color: black;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 17px;
    border: 2px solid #ddd;
    box-shadow: 0 3px 7px rgba(0,0,0,.4);
}

.card.red {
    color: #d71920;
}

.card.back {
    background: #25252b;
    border: 2px solid #444;
    color: #777;
}

.player-card {
    cursor: pointer;
    transition: transform .15s;
}

.player-card:hover {
    transform: translateY(-7px);
}

.player-card.selected {
    transform: translateY(-12px);
    border: 3px solid #888;
}

.middle {
    min-height: 210px;
    margin: 10px 0;
    background: #0c0c10;
    border-radius: 15px;
    border: 1px dashed #29292f;
    padding: 15px;
}

.message {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 18px;
}

.attack-cards,
.defense-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 75px;
}

.played-card {
    width: 48px;
    height: 70px;
    background: white;
    color: black;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.played-card.red {
    color: #d71920;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 14px 8px;
    font-weight: bold;
    font-size: 14px;
}

.btn-main {
    background: white;
    color: black;
}

.btn-dark {
    background: #29292f;
    color: white;
}

.btn-danger {
    background: #401919;
    color: #ffaaaa;
}

.start {
    width: 100%;
    background: white;
    color: black;
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}

.back-button {
    width: 100%;
    background: #151519;
    color: white;
    border: 1px solid #29292f;
    border-radius: 14px;
    padding: 14px;
    margin-top: 10px;
}

.result {
    text-align: center;
    padding: 40px 15px;
}

.result h2 {
    font-size: 27px;
    margin-bottom: 15px;
}

.result p {
    color: #aaa;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>HEAVY LUX</h1>
        <p>CARD</p>
    </div>

    <div class="balance">
        <span>Баланс</span>
        <strong id="balance">5 000 HC</strong>
    </div>

    <button class="start" id="startButton" onclick="startGame()">
        ИГРАТЬ
    </button>

    <div class="game" id="game">

        <div class="table">

            <div class="trump">
                Козырь:
                <strong id="trump"></strong>
            </div>

            <div class="player-area">

                <div class="player-title">
                    КОМПЬЮТЕР
                </div>

                <div class="cards" id="computerCards"></div>

            </div>

            <div class="middle">

                <div class="message" id="message">
                    Подготовка игры...
                </div>

                <div class="attack-cards" id="attackCards"></div>

                <div class="defense-cards" id="defenseCards"></div>

            </div>

            <div class="player-area">

                <div class="player-title">
                    ВЫ
                </div>

                <div class="cards" id="playerCards"></div>

            </div>

            <div class="controls">

                <button class="btn-main" onclick="finishTurn()">
                    ЗАКОНЧИТЬ
                </button>

                <button class="btn-dark" onclick="takeCards()">
                    ВЗЯТЬ
                </button>

            </div>

        </div>

        <button class="back-button" onclick="backToMenu()">
            ← В меню
        </button>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let deck = [];
let playerCards = [];
let computerCards = [];

let trumpSuit = "";
let trumpCard = null;

let attackCards = [];
let defenseCards = [];

let selectedCard = null;

const suits = ["♠", "♥", "♦", "♣"];
const ranks = ["6", "7", "8", "9", "10", "J", "Q", "K", "A"];

const suitNames = {
    "♠": "пики",
    "♥": "червы",
    "♦": "бубны",
    "♣": "трефы"
};

function createDeck() {

    deck = [];

    for (const suit of suits) {

        for (const rank of ranks) {

            deck.push({
                suit: suit,
                rank: rank
            });

        }

    }

    deck.sort(() => Math.random() - 0.5);
}

function cardValue(card) {

    return ranks.indexOf(card.rank);

}

function isRed(card) {

    return card.suit === "♥" || card.suit === "♦";

}

function cardText(card) {

    return card.rank + card.suit;

}

function canBeat(defender, attacker) {

    if (defender.suit === attacker.suit) {

        return cardValue(defender) > cardValue(attacker);

    }

    if (
        defender.suit === trumpSuit &&
        attacker.suit !== trumpSuit
    ) {
        return true;
    }

    return false;
}

function dealCards() {

    while (
        playerCards.length < 6 &&
        deck.length > 0
    ) {

        playerCards.push(deck.pop());

    }

    while (
        computerCards.length < 6 &&
        deck.length > 0
    ) {

        computerCards.push(deck.pop());

    }

}

function findTrump() {

    if (deck.length === 0) return;

    trumpCard = deck[deck.length - 1];
    trumpSuit = trumpCard.suit;

    document.getElementById("trump").innerText =
        trumpCard.rank + " " + trumpSuit;

}

function renderCards() {

    const playerElement =
        document.getElementById("playerCards");

    const computerElement =
        document.getElementById("computerCards");

    playerElement.innerHTML = "";
    computerElement.innerHTML = "";

    computerCards.forEach(() => {

        const card = document.createElement("div");

        card.className = "card back";

        card.innerText = "★";

        computerElement.appendChild(card);

    });

    playerCards.forEach((card, index) => {

        const element =
            document.createElement("div");

        element.className =
            "card player-card" +
            (isRed(card) ? " red" : "");

        element.innerText =
            cardText(card);

        element.onclick = () => selectCard(index);

        if (
            selectedCard === index
        ) {

            element.classList.add("selected");

        }

        playerElement.appendChild(element);

    });

}

function renderPlayedCards() {

    const attackElement =
        document.getElementById("attackCards");

    const defenseElement =
        document.getElementById("defenseCards");

    attackElement.innerHTML = "";
    defenseElement.innerHTML = "";

    attackCards.forEach(card => {

        const element =
            document.createElement("div");

        element.className =
            "played-card" +
            (isRed(card) ? " red" : "");

        element.innerText =
            cardText(card);

        attackElement.appendChild(element);

    });

    defenseCards.forEach(card => {

        const element =
            document.createElement("div");

        element.className =
            "played-card" +
            (isRed(card) ? " red" : "");

        element.innerText =
            cardText(card);

        defenseElement.appendChild(element);

    });

}

function selectCard(index) {

    if (attackCards.length > 0 && defenseCards.length === 0) {

        const card = playerCards[index];

        if (
            attackCards.length === 0 ||
            attackCards.some(c => c.rank === card.rank)
        ) {

            selectedCard = index;

            playAttack();

        }

        return;

    }

    selectedCard = index;

    renderCards();

}

function playAttack() {

    if (selectedCard === null) return;

    const card =
        playerCards[selectedCard];

    playerCards.splice(
        selectedCard,
        1
    );

    attackCards.push(card);

    selectedCard = null;

    renderCards();
    renderPlayedCards();

    document.getElementById("message").innerText =
        "Компьютер отбивается...";

    setTimeout(
        computerDefend,
        800
    );

}

function computerDefend() {

    if (attackCards.length === 0) return;

    const attacker =
        attackCards[attackCards.length - 1];

    let possible =
        computerCards.filter(
            card => canBeat(card, attacker)
        );

    if (possible.length === 0) {

        computerTakeCards();

        return;

    }

    possible.sort(
        (a, b) =>
            cardValue(a) - cardValue(b)
    );

    const defense =
        possible[0];

    computerCards.splice(
        computerCards.indexOf(defense),
        1
    );

    defenseCards.push(defense);

    renderCards();
    renderPlayedCards();

    document.getElementById("message").innerText =
        "Компьютер отбился. Ваш ход.";

    setTimeout(() => {

        attackCards = [];
        defenseCards = [];

        renderPlayedCards();

        playerTurn();

    }, 1000);

}

function computerTakeCards() {

    attackCards.forEach(card => {

        computerCards.push(card);

    });

    attackCards = [];
    defenseCards = [];

    renderCards();
    renderPlayedCards();

    document.getElementById("message").innerText =
        "Компьютер забрал карты. Ваш ход.";

    playerTurn();

}

function playerTurn() {

    drawCards();

    renderCards();

    document.getElementById("message").innerText =
        "Ваш ход. Выберите карту.";

}

function drawCards() {

    while (
        playerCards.length < 6 &&
        deck.length > 0
    ) {

        playerCards.push(
            deck.pop()
        );

    }

    while (
        computerCards.length < 6 &&
        deck.length > 0
    ) {

        computerCards.push(
            deck.pop()
        );

    }

    checkWinner();

}

function finishTurn() {

    if (
        attackCards.length === 0
    ) {

        document.getElementById("message").innerText =
            "Сначала положите карту.";

        return;

    }

    if (
        defenseCards.length !== attackCards.length
    ) {

        document.getElementById("message").innerText =
            "Сначала нужно отбиться.";

        return;

    }

    attackCards = [];
    defenseCards = [];

    renderPlayedCards();

    drawCards();

    document.getElementById("message").innerText =
        "Ваш ход.";

}

function takeCards() {

    if (
        attackCards.length === 0
    ) return;

    attackCards.forEach(card => {

        playerCards.push(card);

    });

    attackCards = [];
    defenseCards = [];

    renderCards();
    renderPlayedCards();

    document.getElementById("message").innerText =
        "Вы взяли карты. Ход компьютера.";

    setTimeout(
        computerAttack,
        800
    );

}

function computerAttack() {

    if (computerCards.length === 0) {

        checkWinner();

        return;

    }

    const card =
        computerCards.shift();

    attackCards.push(card);

    renderCards();
    renderPlayedCards();

    document.getElementById("message").innerText =
        "Компьютер ходит. Выберите карту для отбоя.";

}

function checkWinner() {

    if (
        playerCards.length === 0 &&
        deck.length === 0
    ) {

        showResult(
            "ПОБЕДА",
            "Вы закончили игру первым."
        );

        return;

    }

    if (
        computerCards.length === 0 &&
        deck.length === 0
    ) {

        showResult(
            "ПОРАЖЕНИЕ",
            "Компьютер закончил игру первым."
        );

    }

}

function showResult(title, text) {

    const table =
        document.querySelector(".table");

    table.innerHTML = `

        <div class="result">

            <h2>${title}</h2>

            <p>${text}</p>

            <button
                class="start"
                onclick="startGame()"
            >
                ИГРАТЬ ЕЩЁ
            </button>

        </div>

    `;

}

function startGame() {

    document.getElementById(
        "startButton"
    ).style.display = "none";

    document.getElementById(
        "game"
    ).style.display = "block";

    deck = [];
    playerCards = [];
    computerCards = [];

    attackCards = [];
    defenseCards = [];

    selectedCard = null;

    createDeck();

    dealCards();

    findTrump();

    renderCards();

    renderPlayedCards();

    document.getElementById("message").innerText =
        "Ваш ход. Выберите карту.";

}

function backToMenu() {

    location.reload();

}

</script>

</body>
</html>

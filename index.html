<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(
            circle at 50% 35%,
            #263126 0%,
            #101610 35%,
            #070907 75%
        );
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    touch-action: none;
}

body {
    min-height: 100vh;
}

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   TOP
========================= */

.topbar {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: 0;
    right: 0;
    height: 55px;
    z-index: 50;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 8px 14px;
}

.logo-small {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
}

.game-info {
    display: flex;
    gap: 6px;
}

.info-pill {
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 6px 8px;
    font-size: 10px;
    color: #aaa;
}

.info-pill b {
    color: white;
}

/* =========================
   TABLE
========================= */

.table {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(96vw, 650px);
    height: min(78vh, 650px);

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            #244329 0%,
            #18301c 48%,
            #0e1d11 75%,
            #091009 100%
        );

    border: 9px solid #141414;

    box-shadow:
        inset 0 0 70px rgba(0,0,0,.75),
        0 15px 60px rgba(0,0,0,.65);
}

.table::before {
    content: "";

    position: absolute;
    inset: 18px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.05);
}

/* =========================
   OPPONENT
========================= */

.opponent {
    position: absolute;

    top: 4vh;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    text-align: center;
}

.opponent-avatar {
    width: 52px;
    height: 52px;

    margin: auto;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #272727,
            #111
        );

    border: 2px solid #555;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.45);
}

.opponent-name {
    margin-top: 5px;
    font-size: 12px;
    font-weight: 700;
}

.opponent-count {
    margin-top: 3px;
    color: #aaa;
    font-size: 11px;
}

/* =========================
   PLAYER
========================= */

.player-info {
    position: absolute;

    bottom: 9vh;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    text-align: center;
}

.player-name {
    font-weight: 800;
    font-size: 13px;
}

.player-count {
    color: #aaa;
    font-size: 11px;
    margin-top: 3px;
}

/* =========================
   DECK
========================= */

.deck-area {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 140px;
    height: 130px;

    transform: translate(-50%, -50%);

    z-index: 10;
}

.deck {
    position: absolute;

    width: 62px;
    height: 88px;

    left: 22px;
    top: 18px;

    transform: rotate(-6deg);

    z-index: 4;
}

.deck-card {
    position: absolute;

    inset: 0;

    border-radius: 8px;

    border: 2px solid #b8b8b8;

    background:
        repeating-linear-gradient(
            45deg,
            #202020,
            #202020 4px,
            #343434 4px,
            #343434 8px
        );

    box-shadow:
        0 6px 12px rgba(0,0,0,.45);
}

.deck-card:nth-child(1) {
    transform: translate(-5px,-4px);
}

.deck-card:nth-child(2) {
    transform: translate(-2px,-2px);
}

.deck-card:nth-child(3) {
    transform: translate(0,0);
}

/* =========================
   TRUMP
========================= */

.trump-card {
    position: absolute;

    left: 69px;
    top: 30px;

    width: 62px;
    height: 88px;

    z-index: 2;

    transform: rotate(76deg);
}

/* =========================
   CARD
========================= */

.card {
    position: absolute;

    width: 62px;
    height: 88px;

    border-radius: 8px;

    background: #f8f8f8;
    color: #111;

    border: 1px solid #ddd;

    box-shadow:
        0 5px 13px rgba(0,0,0,.4),
        inset 0 0 0 1px rgba(0,0,0,.08);

    overflow: hidden;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        left .25s ease,
        top .25s ease;
}

.card.red {
    color: #d71919;
}

.card.back {
    background:
        repeating-linear-gradient(
            45deg,
            #181818,
            #181818 4px,
            #303030 4px,
            #303030 8px
        );

    border: 2px solid #aaa;
}

.card.back::after {
    content: "HLC";

    position: absolute;

    inset: 8px;

    border: 1px solid rgba(255,255,255,.3);

    border-radius: 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.65);

    font-size: 11px;
    letter-spacing: 1px;
}

.card-value {
    position: absolute;

    left: 6px;
    top: 4px;

    font-size: 15px;
}

.card-suit {
    position: absolute;

    left: 7px;
    top: 22px;

    font-size: 15px;
}

.card-center {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    font-size: 28px;
}

.card-corner {
    position: absolute;

    right: 5px;
    bottom: 3px;

    font-size: 11px;

    transform: rotate(180deg);
}

/* =========================
   HAND
========================= */

.hand {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 96%;
    height: 130px;

    transform: translateX(-50%);

    z-index: 100;

    pointer-events: none;
}

.hand .card {
    pointer-events: auto;

    transform-origin: center bottom;
}

.hand .card.selected {
    box-shadow:
        0 0 0 3px #fff,
        0 10px 25px rgba(0,0,0,.7);
}

/* =========================
   OPPONENT HAND
========================= */

.opponent-hand {
    position: absolute;

    top: 0;
    left: 50%;

    width: 230px;
    height: 95px;

    transform: translateX(-50%);

    z-index: 12;
}

/* =========================
   PLAYED
========================= */

.attack-zone,
.defense-zone {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 230px;
    height: 180px;

    transform: translate(-50%, -50%);

    z-index: 25;

    pointer-events: none;
}

.played-card {
    position: absolute;

    width: 62px;
    height: 88px;

    transition:
        left .35s ease,
        top .35s ease,
        transform .35s ease;
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: absolute;

    left: 50%;
    bottom: 17vh;

    transform: translateX(-50%);

    z-index: 150;

    display: flex;
    gap: 8px;

    justify-content: center;

    width: 100%;

    pointer-events: none;
}

.control-btn {
    pointer-events: auto;

    border: 1px solid rgba(255,255,255,.16);

    background: rgba(10,10,10,.88);

    color: white;

    border-radius: 12px;

    padding: 11px 18px;

    font-size: 12px;
    font-weight: 800;

    box-shadow:
        0 6px 15px rgba(0,0,0,.35);
}

.control-btn:active {
    transform: scale(.95);
}

.control-btn.primary {
    background: white;
    color: black;
}

.control-btn.danger {
    background: #3b1515;
    border-color: #612525;
}

/* =========================
   MESSAGE
========================= */

.message {
    position: absolute;

    top: 13vh;
    left: 50%;

    transform: translateX(-50%);

    z-index: 200;

    background: rgba(0,0,0,.72);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 12px;

    padding: 9px 14px;

    font-size: 11px;

    color: #ddd;

    white-space: nowrap;

    opacity: 0;

    transition:
        opacity .25s ease;
}

.message.show {
    opacity: 1;
}

/* =========================
   START
========================= */

.start-screen {
    position: absolute;

    inset: 0;

    z-index: 500;

    background:
        rgba(5,5,5,.94);

    display: flex;

    justify-content: center;
    align-items: center;
}

.start-box {
    width: 85%;
    max-width: 350px;

    text-align: center;
}

.start-logo {
    font-size: 30px;

    font-weight: 900;

    letter-spacing: 5px;
}

.start-sub {
    margin-top: 8px;

    color: #888;

    letter-spacing: 3px;

    font-size: 11px;
}

.start-button {
    width: 100%;

    margin-top: 30px;

    border: 0;

    border-radius: 15px;

    background: white;

    color: black;

    padding: 17px;

    font-size: 16px;

    font-weight: 900;
}

/* =========================
   DRAG
========================= */

.card.dragging {
    position: fixed !important;

    z-index: 1000 !important;

    transition: none !important;

    pointer-events: none;

    transform:
        scale(1.08)
        rotate(0deg) !important;

    box-shadow:
        0 20px 40px rgba(0,0,0,.7);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes cardDeal {

    from {
        opacity: 0;
        transform:
            translateY(80px)
            scale(.55)
            rotate(0deg);
    }

    to {
        opacity: 1;
    }
}

@keyframes cardPlay {

    from {
        opacity: 0;
        transform:
            scale(.55)
            rotate(-15deg);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            rotate(0deg);
    }
}

@keyframes cardTake {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
        transform:
            translateY(250px)
            scale(.5)
            rotate(15deg);
    }
}

@keyframes shake {

    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-4px);
    }

    75% {
        transform: translateX(4px);
    }
}

.shake {
    animation:
        shake .25s ease;
}

@media (max-width: 380px) {

    .card,
    .played-card {
        width: 56px;
        height: 80px;
    }

    .hand {
        height: 115px;
    }
}

</style>
</head>

<body>

<div id="app">

    <div class="topbar">

        <div class="logo-small">
            HEAVY LUX CARD
        </div>

        <div class="game-info">

            <div class="info-pill">
                Козырь:
                <b id="trumpInfo">—</b>
            </div>

            <div class="info-pill">
                Колода:
                <b id="deckCount">24</b>
            </div>

        </div>

    </div>

    <div id="message" class="message">
        Ваш ход
    </div>

    <!-- =====================
         OPPONENT
    ====================== -->

    <div class="opponent">

        <div class="opponent-avatar">
            🤖
        </div>

        <div class="opponent-name">
            Heavy AI
        </div>

        <div class="opponent-count">
            Карт:
            <b id="opponentCount">6</b>
        </div>

    </div>

    <div
        class="opponent-hand"
        id="opponentHand"
    ></div>

    <!-- =====================
         TABLE
    ====================== -->

    <div class="table">

        <div class="deck-area">

            <div
                class="deck"
                id="deck"
            >

                <div class="deck-card"></div>
                <div class="deck-card"></div>
                <div class="deck-card"></div>

            </div>

            <div
                id="trumpCard"
                class="card trump-card"
            ></div>

        </div>

        <div
            id="attackZone"
            class="attack-zone"
        ></div>

        <div
            id="defenseZone"
            class="defense-zone"
        ></div>

    </div>

    <!-- =====================
         PLAYER
    ====================== -->

    <div class="player-info">

        <div
            class="player-name"
            id="playerName"
        >
            Игрок
        </div>

        <div class="player-count">

            Карт:
            <b id="playerCount">6</b>

        </div>

    </div>

    <div
        id="playerHand"
        class="hand"
    ></div>

    <!-- =====================
         CONTROLS
    ====================== -->

    <div class="controls">

        <button
            id="takeButton"
            class="control-btn danger"
            style="display:none"
        >
            ВЗЯТЬ
        </button>

    </div>

    <!-- =====================
         START
    ====================== -->

    <div
        id="startScreen"
        class="start-screen"
    >

        <div class="start-box">

            <div class="start-logo">
                HEAVY LUX
            </div>

            <div class="start-sub">
                CLASSIC DURAK
            </div>

            <button
                id="startButton"
                class="start-button"
            >
                НАЧАТЬ ИГРУ
            </button>

        </div>

    </div>

</div>

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "https://heavy-lux-card-api.onrender.com";


/* =====================================================
   CARDS
===================================================== */

const SUITS = [
    "♠",
    "♥",
    "♦",
    "♣"
];

const RANKS = [
    { name:"6", value:6 },
    { name:"7", value:7 },
    { name:"8", value:8 },
    { name:"9", value:9 },
    { name:"10", value:10 },
    { name:"В", value:11 },
    { name:"Д", value:12 },
    { name:"К", value:13 },
    { name:"Т", value:14 }
];


/* =====================================================
   STATE
===================================================== */

let deck = [];

let playerHand = [];

let cpuHand = [];

let trumpSuit = null;

let attackCards = [];

let defenseCards = [];

let phase = "waiting";

let attacker = null;

let defender = null;

/*
    Количество карт у защищающегося
    на момент начала атаки.

    Это же максимальное количество
    карт, которое можно подкинуть.
*/

let attackLimit = 6;

let gameStarted = false;

let playerName = "Игрок";

let dragCard = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =====================================================
   DOM
===================================================== */

const playerHandEl =
    document.getElementById(
        "playerHand"
    );

const opponentHandEl =
    document.getElementById(
        "opponentHand"
    );

const attackZone =
    document.getElementById(
        "attackZone"
    );

const defenseZone =
    document.getElementById(
        "defenseZone"
    );

const trumpCardEl =
    document.getElementById(
        "trumpCard"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const takeButton =
    document.getElementById(
        "takeButton"
    );

const messageEl =
    document.getElementById(
        "message"
    );


/* =====================================================
   UTILS
===================================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


function isRed(card) {

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


/* =====================================================
   CREATE DECK
===================================================== */

function createDeck() {

    const result = [];

    for (const suit of SUITS) {

        for (const rank of RANKS) {

            result.push({

                id:
                    crypto.randomUUID
                    ? crypto.randomUUID()
                    : Math.random()
                        .toString(36)
                        .slice(2),

                rank:
                    rank.name,

                value:
                    rank.value,

                suit:
                    suit
            });
        }
    }

    return shuffle(result);
}


/* =====================================================
   TRUMP
===================================================== */

function setupTrump() {

    const trump =
        deck[deck.length - 1];

    trumpSuit =
        trump.suit;

    renderTrumpCard(trump);

    updateInfo();
}


function renderTrumpCard(card) {

    trumpCardEl.className =
        "card trump-card " +
        (
            isRed(card)
                ? "red"
                : ""
        );

    trumpCardEl.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;
}


/* =====================================================
   DEAL
===================================================== */

async function dealCards() {

    playerHand = [];
    cpuHand = [];

    attackCards = [];
    defenseCards = [];

    renderHands();

    /*
        Быстрая последовательная
        раздача:

        игрок
        компьютер
        игрок
        компьютер
    */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        if (deck.length > 1) {

            playerHand.push(
                deck.shift()
            );

            renderHands();

            await sleep(55);
        }

        if (deck.length > 1) {

            cpuHand.push(
                deck.shift()
            );

            renderHands();

            await sleep(55);
        }
    }

    renderHands();

    updateInfo();
}


/* =====================================================
   SORT
===================================================== */

function sortHand(hand) {

    hand.sort(
        (a,b) => {

            const at =
                a.suit === trumpSuit;

            const bt =
                b.suit === trumpSuit;

            if (at && !bt)
                return 1;

            if (!at && bt)
                return -1;

            return a.value - b.value;
        }
    );

    return hand;
}


/* =====================================================
   CARD ELEMENT
===================================================== */

function createCardElement(card) {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "card " +
        (
            isRed(card)
                ? "red"
                : ""
        );

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;
}


function createBackCard() {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "card back";

    return el;
}


/* =====================================================
   RENDER HANDS
===================================================== */

function renderHands() {

    sortHand(playerHand);

    playerHandEl.innerHTML = "";

    const playerCount =
        playerHand.length;

    const spacing =
        playerCount > 8
            ? 40
            : 48;

    const width =
        Math.max(
            100,
            playerCount * spacing
        );

    playerHandEl.style.width =
        `${width}px`;

    playerHand.forEach(
        (card,index) => {

            const el =
                createCardElement(
                    card
                );

            el.dataset.id =
                card.id;

            const offset =
                (
                    index -
                    (playerCount - 1) / 2
                ) * spacing;

            el.style.left =
                `calc(50% + ${offset}px - 31px)`;

            el.style.bottom =
                "4px";

            el.style.transform =
                `rotate(${
                    (
                        index -
                        (playerCount - 1) / 2
                    ) * 2.5
                }deg)`;

            addDragEvents(
                el,
                card
            );

            playerHandEl.appendChild(
                el
            );
        }
    );


    /* CPU */

    opponentHandEl.innerHTML = "";

    const cpuCount =
        cpuHand.length;

    const cpuSpacing =
        cpuCount > 8
            ? 22
            : 28;

    opponentHandEl.style.width =
        `${Math.max(
            80,
            cpuCount * cpuSpacing
        )}px`;

    cpuHand.forEach(
        (card,index) => {

            const el =
                createBackCard();

            const offset =
                (
                    index -
                    (cpuCount - 1) / 2
                ) * cpuSpacing;

            el.style.left =
                `calc(50% + ${offset}px - 27px)`;

            el.style.top =
                `${
                    Math.abs(
                        index -
                        (cpuCount - 1) / 2
                    ) * .7
                }px`;

            el.style.transform =
                `rotate(${
                    (
                        index -
                        (cpuCount - 1) / 2
                    ) * 3
                }deg)`;

            opponentHandEl.appendChild(
                el
            );
        }
    );

    updateInfo();
}


/* =====================================================
   DRAG
===================================================== */

function addDragEvents(el, card) {

    let startX = 0;
    let startY = 0;
    let moved = false;

    el.addEventListener(
        "pointerdown",
        event => {

            if (
                phase !==
                    "player_attack" &&
                phase !==
                    "player_defense"
            ) {
                return;
            }

            el.setPointerCapture(
                event.pointerId
            );

            dragCard = {
                card: card,
                element: el
            };

            startX =
                event.clientX;

            startY =
                event.clientY;

            moved = false;

            const rect =
                el.getBoundingClientRect();

            dragOffsetX =
                event.clientX -
                rect.left;

            dragOffsetY =
                event.clientY -
                rect.top;

            el.classList.add(
                "dragging"
            );

            el.style.left =
                `${
                    event.clientX -
                    dragOffsetX
                }px`;

            el.style.top =
                `${
                    event.clientY -
                    dragOffsetY
                }px`;

            el.style.bottom =
                "auto";
        }
    );


    el.addEventListener(
        "pointermove",
        event => {

            if (
                !dragCard ||
                dragCard.element !== el
            ) {
                return;
            }

            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;

            if (
                Math.abs(dx) > 5 ||
                Math.abs(dy) > 5
            ) {
                moved = true;
            }

            el.style.left =
                `${
                    event.clientX -
                    dragOffsetX
                }px`;

            el.style.top =
                `${
                    event.clientY -
                    dragOffsetY
                }px`;
        }
    );


    el.addEventListener(
        "pointerup",
        async event => {

            if (
                !dragCard ||
                dragCard.element !== el
            ) {
                return;
            }

            el.classList.remove(
                "dragging"
            );

            const table =
                document.querySelector(
                    ".table"
                );

            const rect =
                table.getBoundingClientRect();

            const centerX =
                rect.left +
                rect.width / 2;

            const centerY =
                rect.top +
                rect.height / 2;

            const distance =
                Math.hypot(
                    event.clientX -
                        centerX,
                    event.clientY -
                        centerY
                );

            const validDrop =
                moved &&
                distance <
                    rect.width * .45;

            const selectedCard =
                dragCard.card;

            dragCard = null;

            if (validDrop) {

                await playPlayerCard(
                    selectedCard
                );

            } else {

                renderHands();
            }
        }
    );


    el.addEventListener(
        "pointercancel",
        () => {

            dragCard = null;

            renderHands();
        }
    );
}


/* =====================================================
   CAN BEAT
===================================================== */

function canBeat(
    attackCard,
    defenseCard
) {

    if (
        !attackCard ||
        !defenseCard
    ) {
        return false;
    }

    /*
        Козырь бьёт
        любой некозырь.
    */

    if (
        defenseCard.suit ===
            trumpSuit &&
        attackCard.suit !==
            trumpSuit
    ) {

        return true;
    }

    /*
        Некозырь не может
        бить козырь.
    */

    if (
        attackCard.suit ===
            trumpSuit &&
        defenseCard.suit !==
            trumpSuit
    ) {

        return false;
    }

    /*
        Обычная карта.
    */

    return (
        attackCard.suit ===
            defenseCard.suit &&
        defenseCard.value >
            attackCard.value
    );
}


/* =====================================================
   TABLE RANKS
===================================================== */

function getTableRanks() {

    return [
        ...attackCards,
        ...defenseCards.filter(
            Boolean
        )
    ].map(
        card => card.rank
    );
}


/* =====================================================
   PLAYER ATTACK VALIDATION
===================================================== */

function canPlayerAttackWith(card) {

    if (!card) {
        return false;
    }

    /*
        Первая карта атаки —
        абсолютно любая.
    */

    if (
        attackCards.length === 0
    ) {
        return true;
    }

    /*
        Далее только совпадающий
        ранг.
    */

    return getTableRanks()
        .includes(
            card.rank
        );
}


/* =====================================================
   CPU ATTACK CANDIDATES
===================================================== */

function getCpuAddCandidates() {

    if (
        attackCards.length === 0
    ) {
        return cpuHand.slice();
    }

    const ranks =
        getTableRanks();

    return cpuHand.filter(
        card =>
            ranks.includes(
                card.rank
            )
    );
}


/* =====================================================
   CPU ATTACK STRATEGY
===================================================== */

function chooseBestAttackCard(
    candidates
) {

    /*
        Аналог get_add_strategy():

        сначала пытаемся избавиться
        от слабых некозырных карт.

        Козыри оставляем.
    */

    return candidates
        .slice()
        .sort(
            (a,b) => {

                const aTrump =
                    a.suit ===
                    trumpSuit;

                const bTrump =
                    b.suit ===
                    trumpSuit;

                if (
                    aTrump !== bTrump
                ) {
                    return aTrump
                        ? 1
                        : -1;
                }

                return (
                    a.value -
                    b.value
                );
            }
        )[0];
}


/* =====================================================
   CPU DEFENSE STRATEGY
===================================================== */

function findBestCardToBeat(
    attackCard,
    hand
) {

    const available =
        hand.filter(
            card =>
                canBeat(
                    attackCard,
                    card
                )
        );

    if (
        available.length === 0
    ) {
        return null;
    }

    /*
        Аналог
        card_with_lowest_strength()

        Сначала стараемся использовать
        минимальную подходящую карту.
    */

    return available.sort(
        (a,b) => {

            const aTrump =
                a.suit ===
                trumpSuit;

            const bTrump =
                b.suit ===
                trumpSuit;

            if (
                aTrump !== bTrump
            ) {
                return aTrump
                    ? 1
                    : -1;
            }

            return (
                a.value -
                b.value
            );
        }
    )[0];
}


/* =====================================================
   CPU DEFENSE STRATEGY
===================================================== */

function getDefenseStrategy() {

    const result = [];

    const available =
        cpuHand.slice();

    for (
        let i = 0;
        i < attackCards.length;
        i++
    ) {

        if (
            defenseCards[i]
        ) {
            continue;
        }

        const target =
            attackCards[i];

        const beat =
            findBestCardToBeat(
                target,
                available
            );

        if (!beat) {

            return null;
        }

        result.push({
            index: i,
            attack: target,
            defense: beat
        });

        const pos =
            available.findIndex(
                c =>
                    c.id === beat.id
            );

        if (pos !== -1) {
            available.splice(
                pos,
                1
            );
        }
    }

    return result;
}


/* =====================================================
   PLAYER PLAY
===================================================== */

async function playPlayerCard(card) {

    if (
        phase !==
            "player_attack" &&
        phase !==
            "player_defense"
    ) {
        return;
    }


    /* ==========================
       PLAYER ATTACK
    ========================== */

    if (
        phase ===
            "player_attack"
    ) {

        if (
            !canPlayerAttackWith(
                card
            )
        ) {

            showMessage(
                "Эту карту нельзя подкинуть"
            );

            renderHands();

            return;
        }

        if (
            attackCards.length >=
                attackLimit
        ) {

            showMessage(
                "Лимит подкидывания достигнут"
            );

            renderHands();

            return;
        }

        removePlayerCard(
            card
        );

        attackCards.push(
            card
        );

        await animateCardToTable(
            card,
            attackZone,
            false,
            attackCards.length - 1
        );

        renderHands();

        /*
            После карты игрока
            компьютер становится
            защищающимся.

            Если это первое нападение,
            это нормально.

            Если это подкидывание —
            компьютер продолжает
            отбиваться.
        */

        phase =
            "cpu_defense";

        defender =
            "cpu";

        updateButtons();

        showMessage(
            "Компьютер отбивается..."
        );

        await sleep(450);

        await cpuDefense();

        return;
    }


    /* ==========================
       PLAYER DEFENSE
    ========================== */

    if (
        phase ===
            "player_defense"
    ) {

        const index =
            getNextUnbeatenIndex();

        if (
            index === -1
        ) {
            return;
        }

        const target =
            attackCards[index];

        if (
            !canBeat(
                target,
                card
            )
        ) {

            showMessage(
                "Этой картой побить нельзя"
            );

            renderHands();

            return;
        }

        removePlayerCard(
            card
        );

        defenseCards[index] =
            card;

        await animateCardToTable(
            card,
            defenseZone,
            true,
            index
        );

        renderHands();

        /*
            КЛЮЧЕВОЕ ИЗМЕНЕНИЕ.

            Мы НЕ ждём кнопку "БИТО".

            После каждой защиты
            автоматически передаём
            управление компьютеру.

            Компьютер проверяет:
            может ли подкинуть карту.
        */

        await sleep(400);

        await afterPlayerDefense();

        return;
    }
}


/* =====================================================
   REMOVE PLAYER
===================================================== */

function removePlayerCard(card) {

    playerHand =
        playerHand.filter(
            c =>
                c.id !== card.id
        );
}


/* =====================================================
   NEXT UNBEATEN
===================================================== */

function getNextUnbeatenIndex() {

    for (
        let i = 0;
        i < attackCards.length;
        i++
    ) {

        if (
            !defenseCards[i]
        ) {
            return i;
        }
    }

    return -1;
}


/* =====================================================
   ANIMATE TO TABLE
===================================================== */

async function animateCardToTable(
    card,
    zone,
    isDefense,
    index
) {

    const el =
        createCardElement(
            card
        );

    el.classList.add(
        "played-card"
    );

    let pos;

    if (isDefense) {

        pos =
            getDefensePosition(
                index
            );

    } else {

        pos =
            getAttackPosition(
                index
            );
    }

    el.style.left =
        `${pos.x}px`;

    el.style.top =
        `${pos.y}px`;

    el.style.opacity =
        "0";

    el.style.transform =
        "scale(.55) rotate(-15deg)";

    zone.appendChild(
        el
    );

    await sleep(25);

    el.style.opacity =
        "1";

    el.style.transform =
        `scale(1) rotate(${
            isDefense
                ? 6
                : -5
        }deg)`;

    await sleep(300);
}


function getAttackPosition(
    index
) {

    const row =
        Math.floor(index / 3);

    const col =
        index % 3;

    return {
        x: 20 + col * 70,
        y: 15 + row * 32
    };
}


function getDefensePosition(
    index
) {

    const col =
        index % 3;

    const row =
        Math.floor(index / 3);

    return {
        x: 40 + col * 70,
        y: 4 + row * 32
    };
}


/* =====================================================
   CPU DEFENSE
===================================================== */

async function cpuDefense() {

    if (
        phase !==
            "cpu_defense"
    ) {
        return;
    }

    /*
        Сначала определяем,
        какие карты компьютер
        вообще может побить.
    */

    const strategy =
        getDefenseStrategy();

    /*
        Не может отбиться.
    */

    if (
        strategy === null
    ) {

        await sleep(600);

        await cpuTakeCards();

        return;
    }

    /*
        Если стратегия пустая,
        значит всё уже побито.
    */

    if (
        strategy.length === 0
    ) {

        await cpuAfterSuccessfulDefense();

        return;
    }

    /*
        Берём только одну карту
        за раз, чтобы игрок видел
        настоящий ход.
    */

    const move =
        strategy[0];

    await sleep(500);

    cpuHand =
        cpuHand.filter(
            card =>
                card.id !==
                move.defense.id
        );

    defenseCards[
        move.index
    ] =
        move.defense;

    await animateCardToTable(
        move.defense,
        defenseZone,
        true,
        move.index
    );

    renderHands();

    /*
        После каждой защиты
        компьютер должен проверить,
        осталось ли что-то непобитое.

        Если нет —
        решаем, можно ли подкинуть.
    */

    await sleep(350);

    await cpuDefense();

}


/* =====================================================
   AFTER PLAYER DEFENSE
===================================================== */

async function afterPlayerDefense() {

    /*
        Проверяем:
        остались ли карты,
        которые компьютер должен
        побить.

        На этом этапе компьютер
        может быть атакующим.
    */

    const unbeaten =
        getNextUnbeatenIndex();

    if (
        unbeaten !== -1
    ) {

        /*
            Компьютер должен отбить
            следующую карту.
        */

        phase =
            "cpu_defense";

        showMessage(
            "Компьютер отбивается..."
        );

        await sleep(400);

        await cpuDefense();

        return;
    }

    /*
        Все текущие карты побиты.

        Теперь компьютер решает:
        подкинуть ещё или закончить.
    */

    await cpuTryAddCard();

}


/* =====================================================
   CPU AFTER SUCCESSFUL DEFENSE
===================================================== */

async function cpuAfterSuccessfulDefense() {

    /*
        Все карты текущей атаки
        побиты.

        Компьютер является атакующим
        только если attacker === cpu.

        Если attacker === player,
        сейчас должен быть шанс
        подкинуть компьютеру.
    */

    await sleep(300);

    if (
        attacker === "player"
    ) {

        await cpuTryAddCard();

        return;
    }

    /*
        Если компьютер сам атаковал,
        он тоже имеет возможность
        продолжить атаку.
    */

    await cpuTryAddCard();
}


/* =====================================================
   CPU ADD CARD
===================================================== */

async function cpuTryAddCard() {

    /*
        Защищающийся имеет лимит
        по количеству карт.

        Если лимит достигнут —
        атака заканчивается.
    */

    if (
        attackCards.length >=
            attackLimit
    ) {

        await finishSuccessfulRound();

        return;
    }

    /*
        Ищем карты, которые имеют
        ранг уже находящийся
        на столе.
    */

    const candidates =
        getCpuAddCandidates();

    /*
        Нечего подкинуть.

        Никакой кнопки "БИТО"
        не требуется.

        Компьютер сам понимает,
        что атака окончена.
    */

    if (
        candidates.length === 0
    ) {

        await finishSuccessfulRound();

        return;
    }

    /*
        Выбираем лучшую карту.
    */

    const card =
        chooseBestAttackCard(
            candidates
        );

    await sleep(450);

    cpuHand =
        cpuHand.filter(
            c =>
                c.id !== card.id
        );

    attackCards.push(
        card
    );

    await animateCardToTable(
        card,
        attackZone,
        false,
        attackCards.length - 1
    );

    renderHands();

    /*
        Теперь защищающийся
        снова должен отбиться.

        Это и создаёт цепочку:

        CPU подкинул
              ↓
        PLAYER отбивается
              ↓
        CPU проверяет подкидывание
              ↓
        CPU подкинул
              ↓
        PLAYER отбивается
              ↓
        ...
    */

    if (
        defender === "player"
    ) {

        phase =
            "player_defense";

        showMessage(
            "Твоя защита"
        );

        updateButtons();

    } else {

        phase =
            "cpu_defense";

        showMessage(
            "Компьютер отбивается..."
        );

        await sleep(400);

        await cpuDefense();
    }
}


/* =====================================================
   PLAYER TAKE
===================================================== */

takeButton.addEventListener(
    "click",
    async () => {

        await playerTakeCards();

    }
);


/* =====================================================
   PLAYER TAKE CARDS
===================================================== */

async function playerTakeCards() {

    if (
        phase !==
            "player_defense"
    ) {
        return;
    }

    takeButton.style.display =
        "none";

    showMessage(
        "Ты забираешь карты"
    );

    await sleep(400);

    const tableCards = [
        ...attackCards,
        ...defenseCards.filter(
            Boolean
        )
    ];

    playerHand.push(
        ...tableCards
    );

    attackCards = [];
    defenseCards = [];

    attackZone.innerHTML = "";
    defenseZone.innerHTML = "";

    renderHands();

    /*
        После взятия атакующий
        добирает первым.
    */

    await refillHands();

    renderHands();

    /*
        Атакующий не меняется.

        Если атаковал компьютер,
        компьютер продолжает.
    */

    if (
        cpuHand.length === 0 ||
        playerHand.length === 0
    ) {

        checkGameOver();

        if (
            phase === "finished"
        ) {
            return;
        }
    }

    phase =
        attacker === "cpu"
            ? "cpu_attack"
            : "player_attack";

    defender =
        attacker === "cpu"
            ? "player"
            : "cpu";

    attackLimit =
        defender === "player"
            ? playerHand.length
            : cpuHand.length;

    updateButtons();

    if (
        phase === "cpu_attack"
    ) {

        showMessage(
            "Компьютер атакует"
        );

        await sleep(600);

        await cpuStartAttack();

    } else {

        showMessage(
            "Твой ход"
        );
    }
}


/* =====================================================
   CPU TAKE
===================================================== */

async function cpuTakeCards() {

    showMessage(
        "Компьютер не отбился — берёт"
    );

    await sleep(650);

    const tableCards = [
        ...attackCards,
        ...defenseCards.filter(
            Boolean
        )
    ];

    cpuHand.push(
        ...tableCards
    );

    attackCards = [];
    defenseCards = [];

    attackZone.innerHTML = "";
    defenseZone.innerHTML = "";

    renderHands();

    /*
        Атакующий добирает первым.
    */

    await refillHands();

    renderHands();

    if (
        cpuHand.length === 0 ||
        playerHand.length === 0
    ) {

        checkGameOver();

        if (
            phase === "finished"
        ) {
            return;
        }
    }

    /*
        Атакующий остаётся тем же.

        Если игрок атаковал —
        игрок продолжает.

        Если компьютер атаковал —
        компьютер продолжает.
    */

    if (
        attacker === "player"
    ) {

        phase =
            "player_attack";

        defender =
            "cpu";

        attackLimit =
            cpuHand.length;

        showMessage(
            "Твой ход"
        );

    } else {

        phase =
            "cpu_attack";

        defender =
            "player";

        attackLimit =
            playerHand.length;

        showMessage(
            "Компьютер снова атакует"
        );

        await sleep(600);

        await cpuStartAttack();
    }

    updateButtons();
}


/* =====================================================
   FINISH SUCCESSFUL ROUND
===================================================== */

async function finishSuccessfulRound() {

    showMessage(
        "Бито — карты уходят в отбой"
    );

    await sleep(700);

    attackCards = [];
    defenseCards = [];

    attackZone.innerHTML = "";
    defenseZone.innerHTML = "";

    await refillHands();

    renderHands();

    checkGameOver();

    if (
        phase === "finished"
    ) {
        return;
    }

    /*
        После успешной защиты
        атакующий меняется.
    */

    if (
        attacker === "player"
    ) {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "cpu_attack";

        attackLimit =
            playerHand.length;

        updateButtons();

        showMessage(
            "Компьютер атакует"
        );

        await sleep(550);

        await cpuStartAttack();

    } else {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "player_attack";

        attackLimit =
            cpuHand.length;

        updateButtons();

        showMessage(
            "Твой ход"
        );
    }
}


/* =====================================================
   CPU START ATTACK
===================================================== */

async function cpuStartAttack() {

    if (
        phase !==
            "cpu_attack"
    ) {
        return;
    }

    if (
        cpuHand.length === 0
    ) {

        checkGameOver();

        return;
    }

    await sleep(500);

    /*
        Первый удар —
        любая карта.

        Если это продолжение,
        ищем карту по рангу.
    */

    let candidates;

    if (
        attackCards.length === 0
    ) {

        candidates =
            cpuHand.slice();

    } else {

        candidates =
            getCpuAddCandidates();
    }

    if (
        candidates.length === 0
    ) {

        await finishSuccessfulRound();

        return;
    }

    const card =
        chooseBestAttackCard(
            candidates
        );

    cpuHand =
        cpuHand.filter(
            c =>
                c.id !== card.id
        );

    attackCards.push(
        card
    );

    await animateCardToTable(
        card,
        attackZone,
        false,
        attackCards.length - 1
    );

    renderHands();

    /*
        После первого удара
        игрок становится
        защищающимся.
    */

    phase =
        "player_defense";

    defender =
        "player";

    updateButtons();

    showMessage(
        "Твоя защита"
    );
}


/* =====================================================
   REFILL
===================================================== */

async function refillHands() {

    /*
        В классическом варианте:

        первым добирает атакующий,
        затем защищающийся.
    */

    const order =
        attacker === "player"
            ? [
                playerHand,
                cpuHand
            ]
            : [
                cpuHand,
                playerHand
            ];

    for (
        const hand of order
    ) {

        while (
            hand.length < 6 &&
            deck.length > 0
        ) {

            const card =
                deck.shift();

            hand.push(card);

            renderHands();

            await sleep(65);
        }
    }

    updateInfo();
}


/* =====================================================
   BUTTONS
===================================================== */

function updateButtons() {

    takeButton.style.display =
        "none";

    if (
        phase ===
            "player_defense"
    ) {

        takeButton.style.display =
            "block";
    }
}


/* =====================================================
   INFO
===================================================== */

function updateInfo() {

    document.getElementById(
        "deckCount"
    ).innerText =
        deck.length;

    document.getElementById(
        "trumpInfo"
    ).innerText =
        trumpSuit || "—";

    document.getElementById(
        "playerCount"
    ).innerText =
        playerHand.length;

    document.getElementById(
        "opponentCount"
    ).innerText =
        cpuHand.length;
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;

function showMessage(text) {

    messageEl.innerText =
        text;

    messageEl.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                messageEl.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =====================================================
   CHECK GAME OVER
===================================================== */

function checkGameOver() {

    /*
        Игра заканчивается,
        когда один из игроков
        избавился от карт.

        Но если колода ещё есть,
        сначала учитываем добор.
    */

    if (
        deck.length > 0
    ) {
        return false;
    }

    if (
        playerHand.length === 0 &&
        cpuHand.length === 0
    ) {

        endGame(
            "Ничья! Оба избавились от карт."
        );

        return true;
    }

    if (
        playerHand.length === 0
    ) {

        endGame(
            "Ты победил! 🏆"
        );

        return true;
    }

    if (
        cpuHand.length === 0
    ) {

        endGame(
            "Компьютер победил. 🤡"
        );

        return true;
    }

    return false;
}


/* =====================================================
   END GAME
===================================================== */

function endGame(text) {

    if (
        phase === "finished"
    ) {
        return;
    }

    phase =
        "finished";

    updateButtons();

    showMessage(
        text
    );

    setTimeout(
        () => {

            if (tg) {

                tg.showAlert(
                    text
                );

            } else {

                alert(text);

            }

        },
        500
    );
}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    async () => {

        if (
            gameStarted
        ) {
            return;
        }

        gameStarted =
            true;

        startButton.disabled =
            true;

        startScreen.style.display =
            "none";

        await startGame();
    }
);


/* =====================================================
   START GAME
===================================================== */

async function startGame() {

    /*
        Имя Telegram.
    */

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        const user =
            tg.initDataUnsafe.user;

        playerName =
            user.first_name ||
            user.username ||
            "Игрок";
    }

    document.getElementById(
        "playerName"
    ).innerText =
        playerName;


    /*
        Новая колода.
    */

    deck =
        createDeck();


    /*
        Определяем козырь.
    */

    setupTrump();


    /*
        Раздаём 12 карт.
    */

    await dealCards();


    /*
        Определяем первого
        по младшему козырю.
    */

    const playerTrumps =
        playerHand
            .filter(
                c =>
                    c.suit ===
                    trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value -
                    b.value
            );

    const cpuTrumps =
        cpuHand
            .filter(
                c =>
                    c.suit ===
                    trumpSuit
            )
            .sort(
                (a,b) =>
                    a.value -
                    b.value
            );

    let playerStarts;


    if (
        playerTrumps.length &&
        cpuTrumps.length
    ) {

        playerStarts =
            playerTrumps[0].value <
            cpuTrumps[0].value;

    } else if (
        playerTrumps.length
    ) {

        playerStarts =
            true;

    } else if (
        cpuTrumps.length
    ) {

        playerStarts =
            false;

    } else {

        const playerMin =
            Math.min(
                ...playerHand.map(
                    c =>
                        c.value
                )
            );

        const cpuMin =
            Math.min(
                ...cpuHand.map(
                    c =>
                        c.value
                )
            );

        playerStarts =
            playerMin <=
            cpuMin;
    }


    if (
        playerStarts
    ) {

        attacker =
            "player";

        defender =
            "cpu";

        phase =
            "player_attack";

        attackLimit =
            cpuHand.length;

        showMessage(
            "У тебя младший козырь — твой ход"
        );

    } else {

        attacker =
            "cpu";

        defender =
            "player";

        phase =
            "cpu_attack";

        attackLimit =
            playerHand.length;

        showMessage(
            "Компьютер начинает"
        );

        await sleep(900);

        await cpuStartAttack();
    }

    updateButtons();

    updateInfo();
}


/* =====================================================
   INITIAL
===================================================== */

updateInfo();

</script>

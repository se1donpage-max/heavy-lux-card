<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

button{
    border:0;
    border-radius:12px;
    background:#171717;
    color:#fff;
    padding:13px 18px;
    font-weight:900;
    font-size:12px;
}

button:active{
    transform:scale(.96);
}

button.primary{
    background:#fff;
    color:#000;
}

#app{
    width:100%;
    height:100%;
    position:relative;
}

/* =========================
   TOP
========================= */

.top{
    position:absolute;
    top:env(safe-area-inset-top);
    left:0;
    right:0;
    height:60px;

    padding:10px 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:50;
}

.logo{
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
}

.balance{
    border:1px solid #292929;
    background:#0b0b0b;
    border-radius:10px;
    padding:8px 12px;
    font-size:11px;
}

.balance b{
    color:#fff;
}

/* =========================
   LOBBY
========================= */

#lobby{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.lobby-box{
    width:100%;
    max-width:390px;
    text-align:center;
}

.title{
    font-size:29px;
    font-weight:900;
    letter-spacing:4px;
}

.subtitle{
    margin-top:8px;
    color:#666;
    font-size:10px;
    letter-spacing:3px;
}

.tables{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.table-button{
    padding:18px 8px;
    border:1px solid #292929;
    background:#0c0c0c;
}

.table-button b{
    display:block;
    font-size:16px;
}

.table-button span{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:9px;
}

.waiting{
    margin-top:20px;
    color:#aaa;
    font-size:11px;
    display:none;
}

/* =========================
   GAME
========================= */

#game{
    position:absolute;
    inset:0;
    display:none;
}

.table{
    position:absolute;
    left:50%;
    top:50%;
    width:min(94vw,700px);
    height:min(75vh,600px);
    transform:translate(-50%,-50%);
}

/* =========================
   OPPONENT
========================= */

.opponent{
    position:absolute;
    top:9vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #444;
    background:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
}

.name{
    margin-top:6px;
    font-size:12px;
    font-weight:900;
}

.cards-count{
    margin-top:4px;
    color:#777;
    font-size:10px;
}

/* =========================
   DECK
========================= */

.deck-area{
    position:absolute;
    left:12%;
    top:50%;
    transform:translate(-50%,-50%);
}

.deck{
    width:66px;
    height:94px;

    border:2px solid #999;
    border-radius:8px;

    background:
        repeating-linear-gradient(
            45deg,
            #0b0b0b 0,
            #0b0b0b 5px,
            #242424 5px,
            #242424 10px
        );
}

.deck:after{
    content:"HL";

    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:38px;
    height:38px;

    border:1px solid #777;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:900;
}

/* =========================
   TRUMP
========================= */

.trump{
    margin-top:-70px;
    margin-left:55px;

    width:66px;
    height:94px;

    border:1px solid #ccc;
    border-radius:8px;

    background:#fff;
    color:#000;

    transform:rotate(75deg);

    position:absolute;
}

/* =========================
   CARDS
========================= */

.card{
    position:absolute;

    width:66px;
    height:94px;

    background:#fff;
    color:#050505;

    border:1px solid #ccc;
    border-radius:8px;

    box-shadow:0 7px 18px rgba(0,0,0,.6);

    overflow:hidden;

    font-weight:900;
}

.card.red{
    color:#111;
}

.card-value{
    position:absolute;
    top:5px;
    left:6px;
    font-size:15px;
}

.card-suit{
    position:absolute;
    top:24px;
    left:7px;
    font-size:14px;
}

.card-center{
    position:absolute;
    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    font-size:30px;
}

.card-corner{
    position:absolute;
    right:5px;
    bottom:4px;

    transform:rotate(180deg);

    font-size:11px;
}

/* =========================
   HAND
========================= */

.hand{
    position:absolute;
    left:50%;
    bottom:2vh;

    width:100%;
    height:140px;

    transform:translateX(-50%);

    z-index:100;
}

.hand .card{
    cursor:pointer;
    transition:.2s;
}

.hand .card:hover{
    box-shadow:
        0 0 0 2px #fff,
        0 10px 25px rgba(255,255,255,.15);
}

.hand .allowed{
    box-shadow:
        0 0 0 2px #fff;
}

.hand .disabled{
    opacity:.35;
}

/* =========================
   TABLE CARDS
========================= */

.played{
    position:absolute;
    width:66px;
    height:94px;
}

.attack-zone{
    position:absolute;
    left:50%;
    top:50%;

    width:350px;
    height:230px;

    transform:translate(-50%,-50%);
}

.defense{
    position:absolute;
    margin-left:25px;
    margin-top:-20px;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    left:50%;
    bottom:19vh;

    transform:translateX(-50%);

    display:flex;
    gap:8px;

    z-index:200;
}

#takeButton,
#bitoButton{
    display:none;
}

/* =========================
   MESSAGE
========================= */

.message{
    position:absolute;

    left:50%;
    top:17vh;

    transform:translateX(-50%);

    background:#0b0b0b;
    border:1px solid #292929;

    border-radius:10px;

    padding:9px 14px;

    color:#bbb;
    font-size:10px;

    opacity:0;

    transition:.2s;

    z-index:300;
}

.message.show{
    opacity:1;
}

/* =========================
   RESULT
========================= */

.result{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,.94);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:1000;
}

.result-box{
    text-align:center;
}

.result-title{
    font-size:28px;
    font-weight:900;
}

.result-prize{
    margin-top:10px;
    color:#aaa;
    font-size:12px;
}

.result button{
    margin-top:25px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:390px){

    .card,
    .played{
        width:59px;
        height:84px;
    }

    .tables{
        gap:7px;
    }

    .table-button{
        padding:15px 5px;
    }

}

</style>

</head>

<body>

<div id="app">

<!-- =========================
     TOP
========================= -->

<div class="top">

    <div class="logo">
        HEAVY LUX
    </div>

    <div class="balance">
        HC:
        <b id="balance">
            10000
        </b>
    </div>

</div>


<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <div class="lobby-box">

        <div class="title">
            HEAVY LUX
        </div>

        <div class="subtitle">
            ONLINE CARD CLUB
        </div>

        <div class="tables">

            <button
                class="table-button"
                data-bet="100">

                <b>100 HC</b>
                <span>НОВИЧОК</span>

            </button>

            <button
                class="table-button"
                data-bet="500">

                <b>500 HC</b>
                <span>СТАНДАРТ</span>

            </button>

            <button
                class="table-button"
                data-bet="2000">

                <b>2 000 HC</b>
                <span>ВЫСОКИЙ</span>

            </button>

            <button
                class="table-button"
                data-bet="10000">

                <b>10 000 HC</b>
                <span>VIP</span>

            </button>

        </div>

        <div
            id="waiting"
            class="waiting">

            ПОИСК СОПЕРНИКА...

            <br><br>

            <button
                id="cancelButton">

                ОТМЕНА

            </button>

        </div>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <div class="opponent">

        <div
            id="opponentAvatar"
            class="avatar">

            ?

        </div>

        <div
            id="opponentName"
            class="name">

            Соперник

        </div>

        <div class="cards-count">

            Карт:
            <b id="opponentCount">
                0
            </b>

        </div>

    </div>


    <div class="table">

        <div class="deck-area">

            <div
                id="deck"
                class="deck">
            </div>

            <div
                id="trump"
                class="trump">
            </div>

        </div>


        <div
            id="attackZone"
            class="attack-zone">
        </div>

    </div>


    <div
        id="playerHand"
        class="hand">
    </div>


    <div class="controls">

        <button
            id="takeButton">

            ВЗЯТЬ

        </button>

        <button
            id="bitoButton"
            class="primary">

            БИТО

        </button>

    </div>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div
    id="message"
    class="message">
</div>


<!-- =========================
     RESULT
========================= -->

<div
    id="result"
    class="result">

    <div class="result-box">

        <div
            id="resultTitle"
            class="result-title">

        </div>

        <div
            id="resultPrize"
            class="result-prize">

        </div>

        <button
            id="resultButton"
            class="primary">

            В ЛОББИ

        </button>

    </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();
    tg.expand();

}


/* =========================================================
   SOCKET
========================================================= */

const socket =
    io(
        "https://heavy-lux-card.onrender.com",
        {
            transports:[
                "websocket",
                "polling"
            ]
        }
    );


/* =========================================================
   STATE
========================================================= */

let mySocketId =
    null;

let roomState =
    null;

let profile =
    null;


/* =========================================================
   DOM
========================================================= */

const lobby =
    document.getElementById(
        "lobby"
    );

const game =
    document.getElementById(
        "game"
    );

const waiting =
    document.getElementById(
        "waiting"
    );

const balance =
    document.getElementById(
        "balance"
    );

const playerHand =
    document.getElementById(
        "playerHand"
    );

const attackZone =
    document.getElementById(
        "attackZone"
    );

const takeButton =
    document.getElementById(
        "takeButton"
    );

const bitoButton =
    document.getElementById(
        "bitoButton"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================================================
   SOCKET CONNECT
========================================================= */

socket.on(
    "connect",
    () => {

        mySocketId =
            socket.id;

        console.log(
            "CONNECTED",
            socket.id
        );

        sendTelegramProfile();

    }
);


/* =========================================================
   TELEGRAM PROFILE
========================================================= */

function sendTelegramProfile(){

    let name =
        "Игрок";

    let avatar =
        "";

    if(
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ){

        const user =
            tg.initDataUnsafe.user;

        name =
            user.first_name ||
            user.username ||
            "Игрок";

        avatar =
            user.photo_url ||
            "";
    }

    socket.emit(
        "set_profile",
        {
            name,
            avatar
        }
    );

}


/* =========================================================
   PROFILE
========================================================= */

socket.on(
    "profile",
    data => {

        profile =
            data;

        updateBalance();

    }
);


function updateBalance(){

    if(!profile){
        return;
    }

    balance.innerText =
        profile.money.toLocaleString(
            "ru-RU"
        );

}


/* =========================================================
   FIND GAME
========================================================= */

document
    .querySelectorAll(
        ".table-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const bet =
                        Number(
                            button.dataset.bet
                        );

                    findGame(
                        bet
                    );

                }
            );

        }
    );


function findGame(bet){

    if(
        profile &&
        profile.money < bet
    ){

        showMessage(
            "Недостаточно HC"
        );

        return;
    }

    waiting.style.display =
        "block";

    document
        .querySelector(".tables")
        .style.display =
            "none";

    socket.emit(
        "find_game",
        bet
    );

}


/* =========================================================
   CANCEL
========================================================= */

document
    .getElementById(
        "cancelButton"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );


/* =========================================================
   WAITING
========================================================= */

socket.on(
    "waiting",
    data => {

        showMessage(
            "Ищем соперника..."
        );

    }
);


/* =========================================================
   MATCH FOUND
========================================================= */

socket.on(
    "match_found",
    data => {

        showMessage(
            "Соперник найден!"
        );

    }
);


/* =========================================================
   ROOM STATE
========================================================= */

socket.on(
    "room_state",
    state => {

        roomState =
            state;

        /*
            Как только появился второй игрок,
            показываем игру.
        */

        if(
            state.players.length === 2
        ){

            lobby.style.display =
                "none";

            game.style.display =
                "block";

        }

        renderGame();

    }
);


/* =========================================================
   ERROR
========================================================= */

socket.on(
    "error_message",
    data => {

        showMessage(
            data.message
        );

    }
);


/* =========================================================
   GAME FINISHED
========================================================= */

socket.on(
    "game_finished",
    data => {

        const won =
            data.winner ===
            mySocketId;

        document.getElementById(
            "resultTitle"
        ).innerText =
            won
                ? "ПОБЕДА"
                : "ПОРАЖЕНИЕ";

        document.getElementById(
            "resultPrize"
        ).innerText =
            won
                ? `+${data.prize.toLocaleString("ru-RU")} HC`
                : "Удачи в следующей игре";

        document.getElementById(
            "result"
        ).style.display =
            "flex";

    }
);


/* =========================================================
   RESULT BUTTON
========================================================= */

document
    .getElementById(
        "resultButton"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );


/* =========================================================
   RENDER GAME
========================================================= */

function renderGame(){

    if(!roomState){
        return;
    }

    updateBalance();

    const me =
        roomState.players.find(
            player =>
                player.socketId ===
                mySocketId
        );

    const opponent =
        roomState.players.find(
            player =>
                player.socketId !==
                mySocketId
        );

    if(!me){
        return;
    }

    if(opponent){

        document.getElementById(
            "opponentName"
        ).innerText =
            opponent.name;

        document.getElementById(
            "opponentCount"
        ).innerText =
            opponent.handCount;

        const avatar =
            document.getElementById(
                "opponentAvatar"
            );

        avatar.innerText =
            opponent.name
                .charAt(0)
                .toUpperCase();

    }

    document.getElementById(
        "deck"
    ).innerText =
        roomState.deckCount;

    renderTrump();

    renderHand(
        me
    );

    renderTable();

    updateControls();

}


/* =========================================================
   TRUMP
========================================================= */

function renderTrump(){

    const el =
        document.getElementById(
            "trump"
        );

    if(
        !roomState.trumpSuit
    ){
        return;
    }

    el.innerHTML = `
        <div class="card-value">
            КОЗ
        </div>

        <div class="card-center">
            ${roomState.trumpSuit}
        </div>
    `;

}


/* =========================================================
   CARD ELEMENT
========================================================= */

function cardElement(card){

    const el =
        document.createElement(
            "div"
        );

    const red =
        card.suit === "♥" ||
        card.suit === "♦";

    el.className =
        "card" +
        (
            red
                ? " red"
                : ""
        );

    el.dataset.id =
        card.id;

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;

}


/* =========================================================
   RENDER HAND
========================================================= */

function renderHand(me){

    playerHand.innerHTML =
        "";

    const cards =
        me.hand;

    const spread =
        Math.min(
            52,
            300 /
            Math.max(
                cards.length,
                1
            )
        );

    cards.forEach(
        (card,index) => {

            const el =
                cardElement(
                    card
                );

            const offset =
                (
                    index -
                    (cards.length - 1) / 2
                ) *
                spread;

            el.style.left =
                `calc(50% + ${offset}px - 33px)`;

            el.style.bottom =
                "0";

            const rotation =
                (
                    index -
                    (cards.length - 1) / 2
                ) *
                3;

            el.style.transform =
                `rotate(${rotation}deg)`;

            if(
                isAllowed(card)
            ){

                el.classList.add(
                    "allowed"
                );

            }else{

                el.classList.add(
                    "disabled"
                );

            }

            el.addEventListener(
                "click",
                () => {

                    playCard(
                        card
                    );

                }
            );

            playerHand.appendChild(
                el
            );

        }
    );

}


/* =========================================================
   IS ALLOWED
========================================================= */

function isAllowed(card){

    if(
        !roomState
    ){
        return false;
    }

    if(
        roomState.phase ===
        "attack"
    ){

        if(
            roomState.attacker !==
            mySocketId
        ){

            return false;
        }

        if(
            roomState.table.length ===
            0
        ){

            return true;
        }

        const ranks = [];

        roomState.table.forEach(
            pair => {

                ranks.push(
                    pair.attack.rank
                );

                if(pair.defense){

                    ranks.push(
                        pair.defense.rank
                    );

                }

            }
        );

        return ranks.includes(
            card.rank
        );

    }


    if(
        roomState.phase ===
        "defense"
    ){

        if(
            roomState.defender !==
            mySocketId
        ){

            return false;
        }

        const pair =
            roomState.table.find(
                p =>
                    !p.defense
            );

        if(!pair){
            return false;
        }

        return canBeat(
            pair.attack,
            card
        );

    }

    return false;

}


/* =========================================================
   CLIENT CAN BEAT
========================================================= */

function canBeat(
    attack,
    defense
){

    const attackTrump =
        attack.suit ===
        roomState.trumpSuit;

    const defenseTrump =
        defense.suit ===
        roomState.trumpSuit;

    if(
        defenseTrump &&
        !attackTrump
    ){
        return true;
    }

    if(
        attackTrump &&
        !defenseTrump
    ){
        return false;
    }

    return (
        attack.suit ===
        defense.suit &&
        defense.value >
        attack.value
    );

}


/* =========================================================
   PLAY CARD
========================================================= */

function playCard(card){

    if(!roomState){
        return;
    }

    if(
        !isAllowed(card)
    ){

        showMessage(
            "Сейчас эту карту использовать нельзя"
        );

        return;
    }

    if(
        roomState.phase ===
        "attack"
    ){

        socket.emit(
            "attack",
            card.id
        );

        return;
    }

    if(
        roomState.phase ===
        "defense"
    ){

        socket.emit(
            "defend",
            card.id
        );

    }

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(){

    attackZone.innerHTML =
        "";

    roomState.table.forEach(
        (pair,index) => {

            const attack =
                cardElement(
                    pair.attack
                );

            attack.classList.add(
                "played"
            );

            attack.style.left =
                `${index * 78}px`;

            attack.style.top =
                `${Math.floor(index / 4) * 100}px`;

            attackZone.appendChild(
                attack
            );

            if(
                pair.defense
            ){

                const defense =
                    cardElement(
                        pair.defense
                    );

                defense.classList.add(
                    "played",
                    "defense"
                );

                defense.style.left =
                    `${index * 78}px`;

                defense.style.top =
                    `${Math.floor(index / 4) * 100}px`;

                attackZone.appendChild(
                    defense
                );

            }

        }
    );

}


/* =========================================================
   CONTROLS
========================================================= */

function updateControls(){

    /*
        ВЗЯТЬ
    */

    takeButton.style.display =
        (
            roomState.phase ===
            "defense" &&
            roomState.defender ===
            mySocketId
        )
            ? "block"
            : "none";


    /*
        БИТО
    */

    const all =
        roomState.table.length > 0 &&
        roomState.table.every(
            pair =>
                pair.defense
        );

    bitoButton.style.display =
        (
            roomState.phase ===
            "attack" &&
            roomState.attacker ===
            mySocketId &&
            all
        )
            ? "block"
            : "none";

}


/* =========================================================
   TAKE
========================================================= */

takeButton.addEventListener(
    "click",
    () => {

        socket.emit(
            "take"
        );

    }
);


/* =========================================================
   BITO
========================================================= */

bitoButton.addEventListener(
    "click",
    () => {

        socket.emit(
            "bito"
        );

    }
);


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

    message.innerText =
        text;

    message.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   SOCKET DISCONNECT
========================================================= */

socket.on(
    "disconnect",
    () => {

        showMessage(
            "Соединение с сервером потеряно"
        );

    }
);

</script>

</body>
</html>

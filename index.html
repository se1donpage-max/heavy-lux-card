<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #202026 0%, #0b0b0d 45%);
    color: #fff;
    font-family: Arial, sans-serif;
    user-select: none;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: auto;
    padding: 18px 14px 30px;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 14px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    display: block;
    color: #777;
    font-size: 9px;
    letter-spacing: 5px;
    margin-top: 3px;
}

/* STATUS */

.status {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px;
    margin-bottom: 12px;
}

.status-box {
    background: #151519;
    border: 1px solid #29292f;
    border-radius: 12px;
    padding: 9px 5px;
    text-align: center;
}

.status-label {
    color: #777;
    font-size: 9px;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.status-value {
    font-size: 15px;
    font-weight: 800;
}

/* PLAYER */

.player-info {
    background: #151519;
    border: 1px solid #29292f;
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.player-side {
    font-size: 13px;
}

.player-side strong {
    font-size: 16px;
}

/* TABLE */

.table {
    background:
        radial-gradient(circle, #17542f 0%, #0b3821 70%);
    border: 2px solid #31583f;
    border-radius: 22px;
    min-height: 350px;
    padding: 16px 10px;
    position: relative;
    overflow: hidden;
}

.table-title {
    text-align: center;
    font-size: 12px;
    color: #b8d4c0;
    margin-bottom: 10px;
}

.computer-cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 70px;
    gap: 5px;
}

/* DECK */

.deck-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 12px 0;
}

.deck {
    width: 48px;
    height: 68px;
    border-radius: 7px;
    background:
        repeating-linear-gradient(
            45deg,
            #222,
            #222 4px,
            #444 4px,
            #444 8px
        );
    border: 2px solid #aaa;
    box-shadow: 0 4px 10px #0008;
    position: relative;
}

.deck::after {
    content: "♠";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    color: #aaa;
}

.trump-card {
    width: 48px;
    height: 68px;
    transform: rotate(4deg);
}

/* CARDS */

.card {
    width: 54px;
    height: 76px;
    border-radius: 8px;
    background: #fff;
    color: #111;
    border: 2px solid #ddd;
    box-shadow: 0 4px 8px #0008;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 21px;
    font-weight: 900;
    position: relative;
    transition: .15s;
}

.card.red {
    color: #c92828;
}

.card.small {
    width: 43px;
    height: 60px;
    font-size: 16px;
}

.card.back {
    background:
        repeating-linear-gradient(
            45deg,
            #24242b,
            #24242b 4px,
            #444 4px,
            #444 8px
        );
    border-color: #777;
    color: #aaa;
}

.card.selectable {
    cursor: pointer;
}

.card.selectable:hover,
.card.selected {
    transform: translateY(-10px);
    border-color: #fff;
}

.card.disabled {
    opacity: .4;
}

/* BATTLE */

.battle {
    min-height: 125px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

.pair {
    position: relative;
    width: 66px;
    height: 105px;
}

.pair .attack {
    position: absolute;
    left: 0;
    top: 0;
}

.pair .defense {
    position: absolute;
    right: 0;
    bottom: 0;
    transform: rotate(4deg);
}

.pair .taken {
    opacity: .7;
}

/* MESSAGE */

.message {
    text-align: center;
    min-height: 38px;
    padding: 8px;
    font-size: 13px;
    color: #ddd;
}

/* HAND */

.hand-title {
    color: #777;
    font-size: 11px;
    margin: 12px 0 6px;
    text-align: center;
}

.hand {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 82px;
}

/* BUTTONS */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 12px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 14px 10px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.btn-primary {
    background: #fff;
    color: #000;
}

.btn-dark {
    background: #202025;
    color: #fff;
    border: 1px solid #39393f;
}

button:disabled {
    opacity: .35;
}

/* START */

.start-screen {
    text-align: center;
    padding-top: 45px;
}

.start-screen h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.start-screen p {
    color: #888;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 25px;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: #000b;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 360px;
    background: #151519;
    border: 1px solid #3a3a40;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
}

.modal-box h2 {
    font-size: 25px;
    margin-bottom: 10px;
}

.modal-box p {
    color: #999;
    margin-bottom: 20px;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">
            HEAVY LUX
            <span>CARD</span>
        </div>
    </div>

    <div id="startScreen" class="start-screen">

        <h2>Классический Дурак</h2>

        <p>
            Подкидной вариант без перевода.<br>
            36 карт · 2 игрока · честная игра против компьютера.
        </p>

        <button
            class="btn-primary"
            onclick="startNewGame()"
            style="width:100%;"
        >
            НАЧАТЬ ИГРУ
        </button>

    </div>

    <div id="gameScreen" class="hidden">

        <div class="status">

            <div class="status-box">
                <div class="status-label">Козырь</div>
                <div id="trumpStatus" class="status-value">—</div>
            </div>

            <div class="status-box">
                <div class="status-label">Колода</div>
                <div id="deckStatus" class="status-value">0</div>
            </div>

            <div class="status-box">
                <div class="status-label">Ход</div>
                <div id="turnStatus" class="status-value">—</div>
            </div>

        </div>

        <div class="player-info">

            <div class="player-side">
                🤖 Компьютер:
                <strong id="computerCount">6</strong>
            </div>

            <div class="player-side">
                👤 Ты:
                <strong id="playerCount">6</strong>
            </div>

        </div>

        <div class="table">

            <div class="table-title">
                ИГРОВОЙ СТОЛ
            </div>

            <div
                id="computerCards"
                class="computer-cards"
            ></div>

            <div class="deck-area">

                <div
                    id="deck"
                    class="deck"
                ></div>

                <div id="trumpCard"></div>

            </div>

            <div
                id="battle"
                class="battle"
            ></div>

            <div
                id="message"
                class="message"
            >
                Подготовка игры...
            </div>

        </div>

        <div class="hand-title">
            ТВОИ КАРТЫ
        </div>

        <div
            id="playerHand"
            class="hand"
        ></div>

        <div class="controls">

            <button
                id="attackButton"
                class="btn-primary"
                onclick="playerAttack()"
            >
                АТАКОВАТЬ
            </button>

            <button
                id="defendButton"
                class="btn-primary"
                onclick="playerDefend()"
            >
                ОТБИТЬСЯ
            </button>

            <button
                id="takeButton"
                class="btn-dark"
                onclick="playerTake()"
            >
                ВЗЯТЬ
            </button>

            <button
                id="doneButton"
                class="btn-dark"
                onclick="playerDone()"
            >
                БИТО
            </button>

        </div>

    </div>

</div>


<div
    id="resultModal"
    class="modal"
>

    <div class="modal-box">

        <h2 id="resultTitle">
            Игра окончена
        </h2>

        <p id="resultText"></p>

        <button
            class="btn-primary"
            onclick="startNewGame()"
            style="width:100%;"
        >
            ИГРАТЬ ЕЩЁ
        </button>

    </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================================================
   BACKEND
========================================================= */

const API_URL =
    "https://heavy-lux-card-api.onrender.com";


/* =========================================================
   CARD DATA
========================================================= */

const SUITS = [
    {
        symbol: "♠",
        name: "spades",
        red: false
    },
    {
        symbol: "♥",
        name: "hearts",
        red: true
    },
    {
        symbol: "♦",
        name: "diamonds",
        red: true
    },
    {
        symbol: "♣",
        name: "clubs",
        red: false
    }
];

const RANKS = [
    {
        name: "6",
        value: 6
    },
    {
        name: "7",
        value: 7
    },
    {
        name: "8",
        value: 8
    },
    {
        name: "9",
        value: 9
    },
    {
        name: "10",
        value: 10
    },
    {
        name: "В",
        value: 11
    },
    {
        name: "Д",
        value: 12
    },
    {
        name: "К",
        value: 13
    },
    {
        name: "Т",
        value: 14
    }
];


/* =========================================================
   GAME STATE
========================================================= */

let deck = [];

let playerHand = [];
let computerHand = [];

let trumpSuit = null;

let table = [];

let attacker = null;

let phase = "idle";

let selectedCard = null;

let gameOver = false;

let gameStarted = false;


/* =========================================================
   CREATE DECK
========================================================= */

function createDeck() {

    const cards = [];

    for (const suit of SUITS) {

        for (const rank of RANKS) {

            cards.push({

                id:
                    suit.name +
                    "_" +
                    rank.name,

                suit: suit.name,

                symbol: suit.symbol,

                red: suit.red,

                rank: rank.name,

                value: rank.value

            });

        }

    }

    return cards;
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }

    return array;
}


/* =========================================================
   START GAME
========================================================= */

function startNewGame() {

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameScreen")
        .classList.remove("hidden");

    document
        .getElementById("resultModal")
        .classList.remove("active");

    deck = shuffle(createDeck());

    playerHand = [];
    computerHand = [];

    table = [];

    selectedCard = null;

    gameOver = false;

    gameStarted = true;

    phase = "dealing";

    /*
       Первые 6 карт игроку
       и 6 компьютеру.
    */

    for (let i = 0; i < 6; i++) {

        playerHand.push(deck.pop());

        computerHand.push(deck.pop());

    }

    /*
       Последняя карта становится козырем.
       Она остаётся под колодой.
    */

    const trumpCard = deck.pop();

    trumpSuit = trumpCard.suit;

    /*
       Козырная карта кладётся
       в самый низ колоды.
    */

    deck.unshift(trumpCard);

    determineFirstAttacker();

    render();

    continueGame();
}


/* =========================================================
   DETERMINE FIRST ATTACKER
========================================================= */

function determineFirstAttacker() {

    const playerTrump =
        playerHand
            .filter(c => c.suit === trumpSuit)
            .sort((a, b) => a.value - b.value);

    const computerTrump =
        computerHand
            .filter(c => c.suit === trumpSuit)
            .sort((a, b) => a.value - b.value);

    if (
        playerTrump.length > 0 &&
        computerTrump.length > 0
    ) {

        attacker =
            playerTrump[0].value <= computerTrump[0].value
                ? "player"
                : "computer";

        return;
    }

    if (playerTrump.length > 0) {

        attacker = "player";
        return;
    }

    if (computerTrump.length > 0) {

        attacker = "computer";
        return;
    }

    /*
       Теоретически почти невозможно,
       но если козырей нет — младшая карта.
    */

    const playerMin =
        Math.min(
            ...playerHand.map(c => c.value)
        );

    const computerMin =
        Math.min(
            ...computerHand.map(c => c.value)
        );

    attacker =
        playerMin <= computerMin
            ? "player"
            : "computer";
}


/* =========================================================
   GAME CONTROLLER
========================================================= */

function continueGame() {

    if (gameOver) {
        return;
    }

    checkGameEnd();

    if (gameOver) {
        return;
    }

    /*
       Если стол пустой —
       начинается новая атака.
    */

    if (table.length === 0) {

        if (attacker === "computer") {

            phase = "computer_attack";

            render();

            setTimeout(
                computerAttack,
                500
            );

            return;
        }

        phase = "player_attack";

        render();

        return;
    }

    /*
       Если стол не пустой,
       определяем текущий этап.
    */

    if (attacker === "player") {

        /*
           Если есть незащищённая карта,
           компьютер должен защищаться.
        */

        const undefended =
            table.some(
                pair => !pair.defense
            );

        if (undefended) {

            phase = "computer_defend";

            render();

            setTimeout(
                computerDefend,
                500
            );

            return;
        }

    }

    if (attacker === "computer") {

        const undefended =
            table.some(
                pair => !pair.defense
            );

        if (undefended) {

            phase = "player_defend";

            render();

            return;
        }

    }

    /*
       Если все карты побиты,
       ждём кнопку БИТО атакующего.
    */

    phase =
        attacker === "player"
            ? "player_done"
            : "computer_done";

    render();

    /*
       Компьютер автоматически
       завершает успешную защиту.
    */

    if (phase === "computer_done") {

        setTimeout(
            computerFinishDefense,
            700
        );
    }
}


/* =========================================================
   PLAYER ATTACK
========================================================= */

function playerAttack() {

    if (
        phase !== "player_attack" &&
        phase !== "player_attack_more"
    ) {
        return;
    }

    if (selectedCard === null) {

        setMessage(
            "Выбери карту для атаки."
        );

        return;
    }

    const card =
        playerHand.find(
            c => c.id === selectedCard
        );

    if (!card) {
        return;
    }

    /*
       При первой атаке можно положить
       любую карту.
    */

    if (table.length === 0) {

        addAttackCard(card);

        attacker = "player";

        phase = "player_attack_more";

        render();

        return;
    }

    /*
       При подкидывании карта должна
       совпадать с достоинством карты
       уже находящейся на столе.
    */

    if (!canThrowCard(card)) {

        setMessage(
            "Эту карту нельзя подкинуть."
        );

        return;
    }

    /*
       Максимум карт:
       количество карт у защищающегося
       в начале отбивания.
    */

    if (table.length >= defenseLimit()) {

        setMessage(
            "Больше подкидывать нельзя."
        );

        return;
    }

    addAttackCard(card);

    phase = "player_attack_more";

    render();

}


/* =========================================================
   ADD ATTACK
========================================================= */

function addAttackCard(card) {

    removeFromHand(
        playerHand,
        card.id
    );

    table.push({

        attack: card,

        defense: null

    });

    selectedCard = null;

    setMessage(
        `Ты ходишь: ${card.rank}${card.symbol}`
    );
}


/* =========================================================
   CAN THROW
========================================================= */

function canThrowCard(card) {

    if (table.length === 0) {
        return true;
    }

    return table.some(
        pair =>
            pair.attack.rank === card.rank ||
            (
                pair.defense &&
                pair.defense.rank === card.rank
            )
    );
}


/* =========================================================
   DEFENSE LIMIT
========================================================= */

function defenseLimit() {

    /*
       В нашем режиме 2 игрока
       защищающийся всегда имел максимум 6
       карт в начале розыгрыша.

       Запоминаем через переменную,
       если она установлена.
    */

    return Math.max(
        1,
        Math.min(
            6,
            defenseStartCards
        )
    );
}

let defenseStartCards = 6;


/* =========================================================
   PLAYER DEFEND
========================================================= */

function playerDefend() {

    if (
        phase !== "player_defend"
    ) {
        return;
    }

    if (selectedCard === null) {

        setMessage(
            "Выбери карту для защиты."
        );

        return;
    }

    const card =
        playerHand.find(
            c => c.id === selectedCard
        );

    if (!card) {
        return;
    }

    /*
       Находим первую
       незакрытую карту.
    */

    const target =
        table.find(
            pair => !pair.defense
        );

    if (!target) {

        setMessage(
            "Все карты уже побиты."
        );

        return;
    }

    if (
        !canBeat(
            card,
            target.attack
        )
    ) {

        setMessage(
            "Этой картой нельзя побить атакующую."
        );

        return;
    }

    removeFromHand(
        playerHand,
        card.id
    );

    target.defense = card;

    selectedCard = null;

    setMessage(
        `Ты бьёшь ${target.attack.rank}${target.attack.symbol} картой ${card.rank}${card.symbol}`
    );

    render();

    /*
       Если остались карты —
       игрок может продолжить отбиваться.
    */

    if (
        table.some(
            pair => !pair.defense
        )
    ) {

        phase = "player_defend";

        render();

        return;
    }

    /*
       Все карты побиты.
       Теперь можно подождать
       возможного подкидывания компьютера.
    */

    phase = "player_done";

    render();
}


/* =========================================================
   CAN BEAT
========================================================= */

function canBeat(defender, attackerCard) {

    /*
       Козырь против некозыря
    */

    if (
        defender.suit === trumpSuit &&
        attackerCard.suit !== trumpSuit
    ) {

        return true;
    }

    /*
       Нельзя обычной картой
       бить козырь.
    */

    if (
        attackerCard.suit === trumpSuit &&
        defender.suit !== trumpSuit
    ) {

        return false;
    }

    /*
       Одна масть + старше
    */

    if (
        defender.suit === attackerCard.suit &&
        defender.value > attackerCard.value
    ) {

        return true;
    }

    /*
       Старший козырь против козыря
    */

    if (
        defender.suit === trumpSuit &&
        attackerCard.suit === trumpSuit &&
        defender.value > attackerCard.value
    ) {

        return true;
    }

    return false;
}


/* =========================================================
   PLAYER TAKE
========================================================= */

function playerTake() {

    if (
        phase !== "player_defend"
    ) {
        return;
    }

    /*
       Игрок забирает ВСЕ карты
       со стола.
    */

    const cardsToTake = [];

    for (const pair of table) {

        cardsToTake.push(pair.attack);

        if (pair.defense) {
            cardsToTake.push(pair.defense);
        }

    }

    playerHand.push(
        ...cardsToTake
    );

    table = [];

    selectedCard = null;

    setMessage(
        "Ты забираешь карты со стола."
    );

    /*
       После взятия атакующий
       остаётся атакующим.
    */

    phase = "after_take";

    render();

    /*
       Сначала добор.
    */

    refillHands(
        attacker
    );

    /*
       После взятия игрок НЕ начинает
       новую атаку мгновенно.
       Сначала состояние полностью
       обновляется.
    */

    setTimeout(
        () => {

            if (gameOver) {
                return;
            }

            continueGame();

        },
        400
    );
}


/* =========================================================
   PLAYER DONE
========================================================= */

function playerDone() {

    if (
        phase !== "player_done"
    ) {
        return;
    }

    /*
       Проверяем, все ли карты побиты.
    */

    const unfinished =
        table.some(
            pair => !pair.defense
        );

    if (unfinished) {

        setMessage(
            "Не все карты побиты."
        );

        return;
    }

    /*
       Если игрок атаковал,
       компьютер мог бы подкинуть.
       Здесь компьютер оценивает,
       может ли он подкинуть.
    */

    const computerThrow =
        computerFindThrowCard();

    if (
        computerThrow &&
        table.length < defenseLimit()
    ) {

        /*
           Компьютер подкидывает.
        */

        computerAddAttack(
            computerThrow
        );

        phase = "player_defend";

        render();

        return;
    }

    /*
       Ничего больше не подкидывается.
       Отбой.
    */

    finishRound();
}


/* =========================================================
   COMPUTER ATTACK
========================================================= */

function computerAttack() {

    if (
        gameOver ||
        phase !== "computer_attack"
    ) {
        return;
    }

    /*
       Компьютер выбирает карту.
    */

    const card =
        computerChooseAttack();

    if (!card) {

        finishRound();

        return;
    }

    removeFromHand(
        computerHand,
        card.id
    );

    table.push({

        attack: card,

        defense: null

    });

    setMessage(
        `Компьютер ходит: ${card.rank}${card.symbol}`
    );

    phase = "player_defend";

    render();
}


/* =========================================================
   COMPUTER CHOOSE ATTACK
========================================================= */

function computerChooseAttack() {

    if (
        computerHand.length === 0
    ) {
        return null;
    }

    /*
       В первую очередь стараемся
       избавиться от высоких некозырных карт.
    */

    const candidates =
        [...computerHand]
            .sort(
                (a, b) => {

                    const aTrump =
                        a.suit === trumpSuit;

                    const bTrump =
                        b.suit === trumpSuit;

                    if (
                        aTrump !== bTrump
                    ) {

                        return aTrump
                            ? 1
                            : -1;
                    }

                    return b.value - a.value;
                }
            );

    return candidates[0];
}


/* =========================================================
   COMPUTER DEFEND
========================================================= */

function computerDefend() {

    if (
        gameOver ||
        phase !== "computer_defend"
    ) {
        return;
    }

    const target =
        table.find(
            pair => !pair.defense
        );

    if (!target) {

        phase = "computer_done";

        continueGame();

        return;
    }

    const card =
        computerChooseDefense(
            target.attack
        );

    /*
       Если компьютер не может
       отбиться — он берёт.
    */

    if (!card) {

        computerTake();

        return;
    }

    removeFromHand(
        computerHand,
        card.id
    );

    target.defense = card;

    setMessage(
        `Компьютер отбивается: ${target.attack.rank}${target.attack.symbol} → ${card.rank}${card.symbol}`
    );

    render();

    /*
       Может ли компьютер продолжить
       подкидывать?
    */

    const undefended =
        table.some(
            pair => !pair.defense
        );

    if (undefended) {

        phase = "computer_defend";

        setTimeout(
            computerDefend,
            600
        );

        return;
    }

    /*
       Все карты побиты.
    */

    phase = "computer_done";

    setTimeout(
        computerFinishDefense,
        700
    );
}


/* =========================================================
   COMPUTER CHOOSE DEFENSE
========================================================= */

function computerChooseDefense(
    attackCard
) {

    const possible =
        computerHand
            .filter(
                card =>
                    canBeat(
                        card,
                        attackCard
                    )
            )
            .sort(
                (a, b) => {

                    const aTrump =
                        a.suit === trumpSuit;

                    const bTrump =
                        b.suit === trumpSuit;

                    /*
                       Сначала обычные карты.
                    */

                    if (
                        aTrump !== bTrump
                    ) {

                        return aTrump
                            ? 1
                            : -1;
                    }

                    /*
                       Используем минимально
                       достаточную карту.
                    */

                    return a.value - b.value;
                }
            );

    return possible[0] || null;
}


/* =========================================================
   COMPUTER TAKE
========================================================= */

function computerTake() {

    const cardsToTake = [];

    for (const pair of table) {

        cardsToTake.push(
            pair.attack
        );

        if (pair.defense) {

            cardsToTake.push(
                pair.defense
            );
        }
    }

    computerHand.push(
        ...cardsToTake
    );

    table = [];

    selectedCard = null;

    setMessage(
        "Компьютер берёт карты."
    );

    /*
       Компьютер берёт —
       атакующий остаётся тем же.
    */

    refillHands(
        attacker
    );

    phase = "after_take";

    render();

    setTimeout(
        () => {

            if (gameOver) {
                return;
            }

            continueGame();

        },
        500
    );
}


/* =========================================================
   COMPUTER FINISH DEFENSE
========================================================= */

function computerFinishDefense() {

    if (
        gameOver ||
        phase !== "computer_done"
    ) {
        return;
    }

    /*
       Компьютер может подкинуть
       ещё одну карту.
    */

    const card =
        computerFindThrowCard();

    if (
        card &&
        table.length < defenseLimit()
    ) {

        computerAddAttack(card);

        phase = "player_defend";

        render();

        return;
    }

    finishRound();
}


/* =========================================================
   COMPUTER FIND THROW
========================================================= */

function computerFindThrowCard() {

    if (
        table.length >= defenseLimit()
    ) {
        return null;
    }

    const ranks =
        new Set();

    for (const pair of table) {

        ranks.add(
            pair.attack.rank
        );

        if (pair.defense) {

            ranks.add(
                pair.defense.rank
            );
        }
    }

    const possible =
        computerHand
            .filter(
                card =>
                    ranks.has(card.rank)
            );

    if (
        possible.length === 0
    ) {
        return null;
    }

    /*
       Не тратим козыри без необходимости.
    */

    possible.sort(
        (a, b) => {

            const aTrump =
                a.suit === trumpSuit;

            const bTrump =
                b.suit === trumpSuit;

            if (
                aTrump !== bTrump
            ) {

                return aTrump
                    ? 1
                    : -1;
            }

            return b.value - a.value;
        }
    );

    return possible[0];
}


/* =========================================================
   COMPUTER ADD ATTACK
========================================================= */

function computerAddAttack(card) {

    removeFromHand(
        computerHand,
        card.id
    );

    table.push({

        attack: card,

        defense: null

    });

    setMessage(
        `Компьютер подкидывает: ${card.rank}${card.symbol}`
    );
}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound() {

    if (gameOver) {
        return;
    }

    /*
       Карты уходят в отбой.
    */

    table = [];

    /*
       Меняется атакующий.
    */

    attacker =
        attacker === "player"
            ? "computer"
            : "player";

    selectedCard = null;

    setMessage(
        "Бито. Карты уходят в отбой."
    );

    /*
       Добор:
       сначала атакующий,
       потом защищавшийся.
    */

    refillHands(
        attacker
    );

    render();

    setTimeout(
        () => {

            if (!gameOver) {

                continueGame();

            }

        },
        500
    );
}


/* =========================================================
   REFILL HANDS
========================================================= */

function refillHands(
    firstPlayer
) {

    if (deck.length === 0) {
        return;
    }

    /*
       Сначала атакующий.
    */

    if (
        firstPlayer === "player"
    ) {

        drawToSix(playerHand);

        drawToSix(computerHand);

    } else {

        drawToSix(computerHand);

        drawToSix(playerHand);

    }

    render();

    checkGameEnd();
}


/* =========================================================
   DRAW TO SIX
========================================================= */

function drawToSix(hand) {

    while (
        hand.length < 6 &&
        deck.length > 0
    ) {

        hand.push(
            deck.pop()
        );
    }
}


/* =========================================================
   REMOVE CARD
========================================================= */

function removeFromHand(
    hand,
    cardId
) {

    const index =
        hand.findIndex(
            c => c.id === cardId
        );

    if (index !== -1) {

        hand.splice(
            index,
            1
        );
    }
}


/* =========================================================
   PLAYER CARD SELECTION
========================================================= */

function selectPlayerCard(
    cardId
) {

    if (
        phase !== "player_attack" &&
        phase !== "player_attack_more" &&
        phase !== "player_defend"
    ) {
        return;
    }

    selectedCard =
        selectedCard === cardId
            ? null
            : cardId;

    render();
}


/* =========================================================
   CHECK GAME END
========================================================= */

function checkGameEnd() {

    if (gameOver) {
        return true;
    }

    const playerEmpty =
        playerHand.length === 0;

    const computerEmpty =
        computerHand.length === 0;

    /*
       Если колода ещё не закончилась,
       игрок с нулём карт ещё может
       получить карты при доборе.
    */

    if (
        deck.length > 0
    ) {

        return false;
    }

    /*
       Колода закончилась.
       Теперь ноль карт означает победу.
    */

    if (
        playerEmpty &&
        computerEmpty
    ) {

        endGame(
            "Ничья",
            "Вы оба одновременно избавились от всех карт."
        );

        return true;
    }

    if (playerEmpty) {

        endGame(
            "Ты победил!",
            "Компьютер остаётся в дураках 🤡"
        );

        return true;
    }

    if (computerEmpty) {

        endGame(
            "Компьютер победил",
            "На этот раз дураком остаёшься ты 🤡"
        );

        return true;
    }

    return false;
}


/* =========================================================
   END GAME
========================================================= */

function endGame(
    title,
    text
) {

    gameOver = true;

    phase = "game_over";

    document
        .getElementById("resultTitle")
        .innerText = title;

    document
        .getElementById("resultText")
        .innerText = text;

    document
        .getElementById("resultModal")
        .classList.add("active");

    render();
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    renderStatus();

    renderComputerCards();

    renderBattle();

    renderPlayerHand();

    updateButtons();
}


/* =========================================================
   STATUS
========================================================= */

function renderStatus() {

    document
        .getElementById("trumpStatus")
        .innerText =
            trumpSuit
                ? suitSymbol(trumpSuit)
                : "—";

    document
        .getElementById("deckStatus")
        .innerText =
            deck.length;

    document
        .getElementById("computerCount")
        .innerText =
            computerHand.length;

    document
        .getElementById("playerCount")
        .innerText =
            playerHand.length;

    let turn = "—";

    if (
        phase === "player_attack" ||
        phase === "player_attack_more"
    ) {

        turn = "ТЫ";

    } else if (
        phase === "player_defend"
    ) {

        turn = "ТЫ";

    } else if (
        phase === "computer_attack" ||
        phase === "computer_defend"
    ) {

        turn = "🤖";

    } else if (
        attacker === "player"
    ) {

        turn = "ТЫ";

    } else if (
        attacker === "computer"
    ) {

        turn = "🤖";
    }

    document
        .getElementById("turnStatus")
        .innerText = turn;
}


/* =========================================================
   COMPUTER CARDS
========================================================= */

function renderComputerCards() {

    const container =
        document.getElementById(
            "computerCards"
        );

    container.innerHTML = "";

    for (
        let i = 0;
        i < computerHand.length;
        i++
    ) {

        const card =
            document.createElement("div");

        card.className =
            "card back small";

        card.innerText = "🂠";

        container.appendChild(card);
    }
}


/* =========================================================
   PLAYER HAND
========================================================= */

function renderPlayerHand() {

    const container =
        document.getElementById(
            "playerHand"
        );

    container.innerHTML = "";

    const sorted =
        [...playerHand]
            .sort(
                sortCards
            );

    for (const card of sorted) {

        const element =
            createCardElement(
                card
            );

        const selectable =
            phase === "player_attack" ||
            phase === "player_attack_more" ||
            phase === "player_defend";

        if (selectable) {

            element.classList.add(
                "selectable"
            );

            element.onclick =
                () =>
                    selectPlayerCard(
                        card.id
                    );
        } else {

            element.classList.add(
                "disabled"
            );
        }

        if (
            selectedCard === card.id
        ) {

            element.classList.add(
                "selected"
            );
        }

        container.appendChild(
            element
        );
    }
}


/* =========================================================
   BATTLE
========================================================= */

function renderBattle() {

    const container =
        document.getElementById(
            "battle"
        );

    container.innerHTML = "";

    for (const pair of table) {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "pair";

        const attack =
            createCardElement(
                pair.attack,
                true
            );

        attack.classList.add(
            "attack"
        );

        wrapper.appendChild(
            attack
        );

        if (pair.defense) {

            const defense =
                createCardElement(
                    pair.defense,
                    true
                );

            defense.classList.add(
                "defense"
            );

            wrapper.appendChild(
                defense
            );
        }

        container.appendChild(
            wrapper
        );
    }
}


/* =========================================================
   CARD ELEMENT
========================================================= */

function createCardElement(
    card,
    small = false
) {

    const element =
        document.createElement("div");

    element.className =
        "card";

    if (small) {

        element.classList.add(
            "small"
        );
    }

    if (card.red) {

        element.classList.add(
            "red"
        );
    }

    element.innerHTML = `
        <div>${card.rank}</div>
        <div>${card.symbol}</div>
    `;

    return element;
}


/* =========================================================
   SORT
========================================================= */

function sortCards(a, b) {

    const aTrump =
        a.suit === trumpSuit;

    const bTrump =
        b.suit === trumpSuit;

    if (
        aTrump !== bTrump
    ) {

        return aTrump
            ? 1
            : -1;
    }

    if (
        a.suit !== b.suit
    ) {

        return a.suit.localeCompare(
            b.suit
        );
    }

    return a.value - b.value;
}


/* =========================================================
   SUIT SYMBOL
========================================================= */

function suitSymbol(
    suit
) {

    const found =
        SUITS.find(
            s => s.name === suit
        );

    return found
        ? found.symbol
        : "";
}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons() {

    const attack =
        document.getElementById(
            "attackButton"
        );

    const defend =
        document.getElementById(
            "defendButton"
        );

    const take =
        document.getElementById(
            "takeButton"
        );

    const done =
        document.getElementById(
            "doneButton"
        );

    attack.disabled =
        !(
            phase === "player_attack" ||
            phase === "player_attack_more"
        );

    defend.disabled =
        phase !== "player_defend";

    take.disabled =
        phase !== "player_defend";

    done.disabled =
        phase !== "player_done";
}


/* =========================================================
   MESSAGE
========================================================= */

function setMessage(
    text
) {

    document
        .getElementById(
            "message"
        )
        .innerText = text;
}

   INIT
========================================================= */

    /*
       Авторизацию не блокируем.

    */

    console.log(
        "Telegram initData:",
        tg.initData
            ? "получен"
            : "не получен"
    );

authenticate();

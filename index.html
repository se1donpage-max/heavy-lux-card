<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Heavy Lux Card</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

#app{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            #151515 0%,
            #080808 48%,
            #030303 100%
        );
}

/* =========================================
   TOP BAR
========================================= */

.topbar{
    position:absolute;
    top:env(safe-area-inset-top);
    left:0;
    right:0;

    height:58px;

    padding:
        9px
        13px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:100;
}

.logo{
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
}

.status{
    display:flex;
    align-items:center;
    gap:6px;
}

.status-item{
    padding:6px 9px;

    border:1px solid #282828;
    border-radius:9px;

    background:#0b0b0b;

    color:#888;

    font-size:9px;
}

.status-item b{
    color:#fff;
}

/* =========================================
   MESSAGE
========================================= */

.message{
    position:absolute;

    left:50%;
    top:76px;

    transform:translateX(-50%);

    padding:9px 15px;

    border:1px solid #292929;
    border-radius:10px;

    background:#090909;

    color:#ccc;

    font-size:10px;
    font-weight:700;

    z-index:500;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease;
}

.message.show{
    opacity:1;
}

/* =========================================
   LOBBY
========================================= */

.lobby{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050505;

    z-index:1000;
}

.lobby-box{
    width:86%;
    max-width:360px;

    text-align:center;
}

.title{
    font-size:30px;
    font-weight:900;
    letter-spacing:5px;
}

.subtitle{
    margin-top:8px;

    color:#666;

    font-size:10px;
    letter-spacing:3px;
}

.name-input{
    width:100%;

    margin-top:30px;

    padding:14px;

    border:1px solid #292929;
    border-radius:10px;

    outline:none;

    background:#0c0c0c;

    color:#fff;

    text-align:center;

    font-size:13px;
}

.start-button{
    width:100%;

    margin-top:10px;

    padding:15px;

    border-radius:10px;

    background:#fff;
    color:#000;

    font-size:12px;
    font-weight:900;
}

.start-button:active{
    transform:scale(.97);
}

.waiting{
    display:none;

    margin-top:20px;

    color:#888;

    font-size:11px;
}

/* =========================================
   GAME
========================================= */

.game{
    position:absolute;
    inset:0;

    display:none;
}

/* =========================================
   OPPONENT
========================================= */

.opponent{
    position:absolute;

    top:72px;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    z-index:80;
}

.avatar{
    width:45px;
    height:45px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #444;
    border-radius:50%;

    background:#111;

    color:#aaa;

    font-size:13px;
    font-weight:900;
}

.opponent-name{
    margin-top:5px;

    font-size:11px;
    font-weight:900;
}

.opponent-count{
    margin-top:3px;

    color:#666;

    font-size:9px;
}

/* =========================================
   TABLE
========================================= */

.table{
    position:absolute;

    left:50%;
    top:50%;

    width:min(94vw,700px);
    height:min(70vh,600px);

    transform:translate(-50%,-50%);
}

/* =========================================
   DECK
========================================= */

.deck-area{
    position:absolute;

    left:11%;
    top:50%;

    width:130px;
    height:130px;

    transform:translate(-50%,-50%);

    z-index:20;
}

.deck{
    position:absolute;

    left:0;
    top:15px;

    width:66px;
    height:94px;

    transform:rotate(-5deg);
}

.deck-card{
    position:absolute;
    inset:0;

    border:2px solid #888;
    border-radius:8px;

    background:
        repeating-linear-gradient(
            45deg,
            #090909 0,
            #090909 5px,
            #242424 5px,
            #242424 10px
        );

    box-shadow:
        0 5px 14px rgba(0,0,0,.7);
}

.deck-card:nth-child(1){
    transform:translate(-6px,-5px);
}

.deck-card:nth-child(2){
    transform:translate(-3px,-2px);
}

.deck-card:nth-child(3){
    transform:translate(0,0);
}

.deck-card::after{
    content:"HL";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:37px;
    height:37px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #777;

    font-size:10px;
    font-weight:900;
    letter-spacing:2px;

    color:#ddd;
}

/* =========================================
   TRUMP
========================================= */

.trump{
    position:absolute;

    left:58px;
    top:31px;

    width:66px;
    height:94px;

    transform:rotate(76deg);
}

/* =========================================
   CARD
========================================= */

.card{
    position:relative;

    width:66px;
    height:94px;

    border:1px solid #ccc;
    border-radius:8px;

    background:#fff;

    color:#080808;

    box-shadow:
        0 7px 16px rgba(0,0,0,.6);

    overflow:hidden;

    font-weight:900;
}

.card.red{
    color:#111;
}

.card-value{
    position:absolute;

    top:5px;
    left:6px;

    font-size:15px;
}

.card-suit{
    position:absolute;

    top:23px;
    left:7px;

    font-size:13px;
}

.card-center{
    position:absolute;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    font-size:30px;
}

.card-corner{
    position:absolute;

    right:5px;
    bottom:4px;

    transform:rotate(180deg);

    font-size:10px;
}

/* =========================================
   CARD BACK
========================================= */

.card.back{
    border:2px solid #999;

    background:
        repeating-linear-gradient(
            45deg,
            #090909 0,
            #090909 5px,
            #242424 5px,
            #242424 10px
        );
}

.card.back::after{
    content:"HL";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #777;

    color:#ddd;

    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
}

/* =========================================
   OPPONENT HAND
========================================= */

.opponent-hand{
    position:absolute;

    left:50%;
    top:48px;

    width:280px;
    height:100px;

    transform:translateX(-50%);

    z-index:50;
}

.opponent-hand .card{
    position:absolute;

    width:58px;
    height:84px;
}

/* =========================================
   TABLE CARDS
========================================= */

.attack-zone,
.defense-zone{
    position:absolute;

    left:50%;
    top:50%;

    width:350px;
    height:260px;

    transform:translate(-50%,-50%);

    z-index:60;
}

.played-card{
    position:absolute;

    width:66px;
    height:94px;

    transition:
        left .25s ease,
        top .25s ease;
}

/* =========================================
   PLAYER HAND
========================================= */

.hand{
    position:absolute;

    left:50%;
    bottom:0;

    width:100%;
    height:150px;

    transform:translateX(-50%);

    z-index:200;
}

.hand .card{
    position:absolute;

    transform-origin:center bottom;

    transition:
        left .2s ease,
        bottom .2s ease,
        transform .2s ease;
}

.hand .card.allowed{
    box-shadow:
        0 0 0 2px #fff,
        0 8px 20px rgba(255,255,255,.18);
}

.hand .card.not-allowed{
    opacity:.35;
}

.hand .card.selected{
    bottom:20px!important;

    box-shadow:
        0 0 0 2px #fff,
        0 12px 25px rgba(255,255,255,.3);
}

/* =========================================
   PLAYER INFO
========================================= */

.player-info{
    position:absolute;

    left:50%;
    bottom:65px;

    transform:translateX(-50%);

    text-align:center;

    z-index:220;
}

.player-name{
    font-size:11px;
    font-weight:900;
}

.player-count{
    margin-top:3px;

    color:#666;

    font-size:9px;
}

/* =========================================
   CONTROLS
========================================= */

.controls{
    position:absolute;

    left:50%;
    bottom:17%;

    transform:translateX(-50%);

    display:flex;
    gap:7px;

    z-index:400;
}

.control-button{
    display:none;

    padding:11px 18px;

    border:1px solid #333;
    border-radius:10px;

    background:#0d0d0d;
    color:#fff;

    font-size:10px;
    font-weight:900;
}

.control-button.primary{
    background:#fff;
    color:#000;
}

/* =========================================
   CONNECTION
========================================= */

.connection{
    position:absolute;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    color:#555;

    font-size:8px;

    z-index:300;
}

/* =========================================
   GAME OVER
========================================= */

.game-over{
    position:absolute;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.88);

    z-index:2000;
}

.game-over-box{
    width:80%;
    max-width:320px;

    padding:30px 20px;

    border:1px solid #292929;
    border-radius:15px;

    background:#090909;

    text-align:center;
}

.game-over-title{
    font-size:22px;
    font-weight:900;
}

.restart-button{
    width:100%;

    margin-top:20px;

    padding:13px;

    border-radius:10px;

    background:#fff;
    color:#000;

    font-size:11px;
    font-weight:900;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:390px){

    .card{
        width:59px;
        height:84px;
    }

    .played-card{
        width:59px;
        height:84px;
    }

    .attack-zone,
    .defense-zone{
        width:310px;
    }

    .hand{
        height:135px;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================
         LOBBY
    ====================================== -->

    <div
        id="lobby"
        class="lobby"
    >

        <div class="lobby-box">

            <div class="title">
                HEAVY LUX
            </div>

            <div class="subtitle">
                CLASSIC DURAK ONLINE
            </div>

            <input
                id="nameInput"
                class="name-input"
                maxlength="20"
                placeholder="Твоё имя"
            >

            <button
                id="findButton"
                class="start-button"
            >
                НАЙТИ СОПЕРНИКА
            </button>

            <div
                id="waiting"
                class="waiting"
            >
                Ищем соперника...
            </div>

        </div>

    </div>


    <!-- =====================================
         GAME
    ====================================== -->

    <div
        id="game"
        class="game"
    >

        <!-- TOP -->

        <div class="topbar">

            <div class="logo">
                HEAVY LUX CARD
            </div>

            <div class="status">

                <div class="status-item">
                    КОЗЫРЬ
                    <b id="trump">—</b>
                </div>

                <div class="status-item">
                    КОЛОДА
                    <b id="deckCount">0</b>
                </div>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- OPPONENT -->

        <div class="opponent">

            <div
                id="opponentAvatar"
                class="avatar"
            >
                ?
            </div>

            <div
                id="opponentName"
                class="opponent-name"
            >
                Игрок
            </div>

            <div class="opponent-count">

                Карт:
                <b id="opponentCount">
                    0
                </b>

            </div>

        </div>


        <!-- OPPONENT HAND -->

        <div
            id="opponentHand"
            class="opponent-hand"
        ></div>


        <!-- TABLE -->

        <div class="table">

            <div class="deck-area">

                <div
                    id="deck"
                    class="deck"
                >

                    <div class="deck-card"></div>
                    <div class="deck-card"></div>
                    <div class="deck-card"></div>

                </div>

                <div
                    id="trumpCard"
                    class="card trump"
                ></div>

            </div>


            <div
                id="attackZone"
                class="attack-zone"
            ></div>

            <div
                id="defenseZone"
                class="defense-zone"
            ></div>

        </div>


        <!-- PLAYER HAND -->

        <div
            id="playerHand"
            class="hand"
        ></div>


        <!-- PLAYER -->

        <div class="player-info">

            <div
                id="playerName"
                class="player-name"
            >
                Игрок
            </div>

            <div class="player-count">

                Карт:
                <b id="playerCount">
                    0
                </b>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button
                id="takeButton"
                class="control-button"
            >
                ВЗЯТЬ
            </button>

            <button
                id="beatButton"
                class="control-button primary"
            >
                БИТО
            </button>

        </div>


        <!-- CONNECTION -->

        <div
            id="connection"
            class="connection"
        >
            Подключение...
        </div>

    </div>


    <!-- =====================================
         GAME OVER
    ====================================== -->

    <div
        id="gameOver"
        class="game-over"
    >

        <div class="game-over-box">

            <div
                id="gameOverTitle"
                class="game-over-title"
            >
                Игра окончена
            </div>

            <button
                id="restartButton"
                class="restart-button"
            >
                НОВАЯ ИГРА
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if(tg){
    tg.ready();
    tg.expand();
}


/* =========================================
   SOCKET
========================================= */

const socket = io(
    "https://heavy-lux-card.onrender.com",
    {
        transports:[
            "websocket",
            "polling"
        ]
    }
);


/* =========================================
   STATE
========================================= */

let myId = null;
let gameState = null;
let selectedCardId = null;

let playerName = "Игрок";


/* =========================================
   DOM
========================================= */

const lobby =
    document.getElementById("lobby");

const game =
    document.getElementById("game");

const nameInput =
    document.getElementById("nameInput");

const findButton =
    document.getElementById("findButton");

const waiting =
    document.getElementById("waiting");

const playerHandEl =
    document.getElementById("playerHand");

const opponentHandEl =
    document.getElementById("opponentHand");

const attackZone =
    document.getElementById("attackZone");

const defenseZone =
    document.getElementById("defenseZone");

const takeButton =
    document.getElementById("takeButton");

const beatButton =
    document.getElementById("beatButton");

const message =
    document.getElementById("message");

const connection =
    document.getElementById("connection");


/* =========================================
   SOCKET CONNECTION
========================================= */

socket.on(
    "connect",
    () => {

        myId =
            socket.id;

        connection.innerText =
            "● ONLINE";

        connection.style.color =
            "#aaa";
    }
);


socket.on(
    "disconnect",
    () => {

        connection.innerText =
            "● OFFLINE";

        connection.style.color =
            "#555";

        showMessage(
            "Соединение потеряно"
        );
    }
);


socket.on(
    "connect_error",
    () => {

        connection.innerText =
            "Ошибка соединения";

    }
);


/* =========================================
   FIND GAME
========================================= */

findButton.addEventListener(
    "click",
    () => {

        playerName =
            nameInput.value.trim();

        if(!playerName){

            playerName =
                "Игрок";
        }

        findButton.disabled =
            true;

        waiting.style.display =
            "block";

        socket.emit(
            "find_game",
            {
                name:playerName
            }
        );
    }
);


/* =========================================
   WAITING
========================================= */

socket.on(
    "waiting",
    data => {

        waiting.innerText =
            data.message ||
            "Ищем соперника...";

    }
);


/* =========================================
   GAME FOUND
========================================= */

socket.on(
    "game_found",
    () => {

        lobby.style.display =
            "none";

        game.style.display =
            "block";

        showMessage(
            "Соперник найден!"
        );
    }
);


/* =========================================
   GAME STATE
========================================= */

socket.on(
    "game_state",
    state => {

        gameState =
            state;

        render();
    }
);


/* =========================================
   ERROR
========================================= */

socket.on(
    "error_message",
    text => {

        showMessage(
            text
        );
    }
);


/* =========================================
   OPPONENT LEFT
========================================= */

socket.on(
    "opponent_left",
    () => {

        showMessage(
            "Соперник вышел из игры"
        );

        setTimeout(
            () => {

                location.reload();

            },
            1500
        );
    }
);


/* =========================================
   GAME OVER
========================================= */

socket.on(
    "game_over",
    data => {

        const gameOver =
            document.getElementById(
                "gameOver"
            );

        const title =
            document.getElementById(
                "gameOverTitle"
            );

        title.innerText =
            data.message;

        gameOver.style.display =
            "flex";
    }
);


/* =========================================
   RENDER
========================================= */

function render(){

    if(!gameState){
        return;
    }

    document.getElementById(
        "trump"
    ).innerText =
        gameState.trumpSuit;

    document.getElementById(
        "deckCount"
    ).innerText =
        gameState.deckCount;

    document.getElementById(
        "playerName"
    ).innerText =
        playerName;

    document.getElementById(
        "playerCount"
    ).innerText =
        gameState.hand.length;

    document.getElementById(
        "opponentName"
    ).innerText =
        gameState.opponent.name;

    document.getElementById(
        "opponentCount"
    ).innerText =
        gameState.opponent.cards;

    renderPlayerHand();

    renderOpponentHand();

    renderTable();

    updateButtons();
}


/* =========================================
   RED CARD
========================================= */

function isRed(card){

    return (
        card.suit === "♥" ||
        card.suit === "♦"
    );
}


/* =========================================
   CREATE CARD
========================================= */

function createCard(card){

    const el =
        document.createElement("div");

    el.className =
        "card";

    if(isRed(card)){
        el.classList.add("red");
    }

    el.dataset.id =
        card.id;

    el.innerHTML = `

        <div class="card-value">
            ${card.rank}
        </div>

        <div class="card-suit">
            ${card.suit}
        </div>

        <div class="card-center">
            ${card.suit}
        </div>

        <div class="card-corner">
            ${card.rank}${card.suit}
        </div>

    `;

    return el;
}


/* =========================================
   BACK
========================================= */

function createBack(){

    const el =
        document.createElement("div");

    el.className =
        "card back";

    return el;
}


/* =========================================
   PLAYER HAND
========================================= */

function renderPlayerHand(){

    playerHandEl.innerHTML = "";

    const hand =
        gameState.hand;

    const count =
        hand.length;

    hand.forEach(
        (card,index) => {

            const el =
                createCard(card);

            const spread =
                Math.min(
                    52,
                    310 /
                    Math.max(
                        count,
                        1
                    )
                );

            const offset =
                (
                    index -
                    (count-1)/2
                ) * spread;

            el.style.left =
                `calc(50% + ${offset}px - 33px)`;

            el.style.bottom =
                "2px";

            const rotation =
                (
                    index -
                    (count-1)/2
                ) * 3;

            el.style.transform =
                `rotate(${rotation}deg)`;

            if(
                selectedCardId ===
                card.id
            ){

                el.classList.add(
                    "selected"
                );
            }

            if(
                isAllowed(card)
            ){

                el.classList.add(
                    "allowed"
                );

            }else{

                el.classList.add(
                    "not-allowed"
                );
            }

            el.addEventListener(
                "click",
                () => {

                    handleCardClick(
                        card
                    );

                }
            );

            playerHandEl.appendChild(
                el
            );
        }
    );
}


/* =========================================
   ALLOWED
========================================= */

function isAllowed(card){

    if(!gameState){
        return false;
    }

    if(
        gameState.attacker ===
        myId
    ){

        if(
            gameState.table.length === 0
        ){
            return true;
        }

        if(
            gameState.table.length >=
            gameState.opponent.cards
        ){
            return false;
        }

        const ranks = [];

        for(
            const pair of
            gameState.table
        ){

            ranks.push(
                pair.attack.rank
            );

            if(pair.defense){

                ranks.push(
                    pair.defense.rank
                );
            }
        }

        return ranks.includes(
            card.rank
        );
    }


    if(
        gameState.defender ===
        myId
    ){

        const pair =
            gameState.table.find(
                p => !p.defense
            );

        if(!pair){
            return false;
        }

        const attack =
            pair.attack;

        const attackTrump =
            attack.suit ===
            gameState.trumpSuit;

        const defenseTrump =
            card.suit ===
            gameState.trumpSuit;

        if(
            defenseTrump &&
            !attackTrump
        ){
            return true;
        }

        if(
            !defenseTrump &&
            attackTrump
        ){
            return false;
        }

        return (
            card.suit ===
            attack.suit &&
            card.value >
            attack.value
        );
    }

    return false;
}


/* =========================================
   CARD CLICK
========================================= */

function handleCardClick(card){

    if(!gameState){
        return;
    }

    if(
        !isAllowed(card)
    ){

        showMessage(
            "Эту карту сейчас нельзя использовать"
        );

        return;
    }

    if(
        gameState.attacker ===
        myId
    ){

        socket.emit(
            "play_card",
            {
                cardId:card.id
            }
        );

        selectedCardId =
            null;

        return;
    }

    if(
        gameState.defender ===
        myId
    ){

        socket.emit(
            "defend_card",
            {
                cardId:card.id
            }
        );

        selectedCardId =
            null;
    }
}


/* =========================================
   OPPONENT HAND
========================================= */

function renderOpponentHand(){

    opponentHandEl.innerHTML = "";

    const count =
        gameState.opponent.cards;

    for(
        let i=0;
        i<count;
        i++
    ){

        const card =
            createBack();

        const offset =
            (
                i -
                (count-1)/2
            ) * 30;

        card.style.left =
            `calc(50% + ${offset}px - 29px)`;

        card.style.top =
            `${Math.abs(
                i -
                (count-1)/2
            ) * .7}px`;

        card.style.transform =
            `rotate(${
                (
                    i -
                    (count-1)/2
                ) * 3
            }deg)`;

        opponentHandEl.appendChild(
            card
        );
    }
}


/* =========================================
   TABLE
========================================= */

function renderTable(){

    attackZone.innerHTML =
        "";

    defenseZone.innerHTML =
        "";

    gameState.table.forEach(
        (pair,index) => {

            const attack =
                createCard(
                    pair.attack
                );

            attack.classList.add(
                "played-card"
            );

            const x =
                15 +
                (index % 4) *
                80;

            const y =
                25 +
                Math.floor(
                    index / 4
                ) * 105;

            attack.style.left =
                `${x}px`;

            attack.style.top =
                `${y}px`;

            attackZone.appendChild(
                attack
            );


            if(pair.defense){

                const defense =
                    createCard(
                        pair.defense
                    );

                defense.classList.add(
                    "played-card"
                );

                defense.style.left =
                    `${x + 20}px`;

                defense.style.top =
                    `${y - 20}px`;

                defense.style.transform =
                    "rotate(4deg)";

                defenseZone.appendChild(
                    defense
                );
            }

        }
    );
}


/* =========================================
   BUTTONS
========================================= */

function updateButtons(){

    /*
     * ВЗЯТЬ
     */

    if(
        gameState.defender ===
        myId
    ){

        takeButton.style.display =
            "block";

    }else{

        takeButton.style.display =
            "none";
    }


    /*
     * БИТО
     */

    const allBeaten =
        gameState.table.length > 0 &&
        gameState.table.every(
            pair =>
                pair.defense
        );

    if(
        gameState.attacker ===
        myId &&
        allBeaten
    ){

        beatButton.style.display =
            "block";

    }else{

        beatButton.style.display =
            "none";
    }
}


/* =========================================
   TAKE
========================================= */

takeButton.addEventListener(
    "click",
    () => {

        socket.emit(
            "take_cards"
        );

    }
);


/* =========================================
   BEAT
========================================= */

beatButton.addEventListener(
    "click",
    () => {

        socket.emit(
            "finish_round"
        );

    }
);


/* =========================================
   MESSAGE
========================================= */

let messageTimer;

function showMessage(text){

    message.innerText =
        text;

    message.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =========================================
   TELEGRAM NAME
========================================= */

if(
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
){

    const user =
        tg.initDataUnsafe.user;

    playerName =
        user.first_name ||
        user.username ||
        "Игрок";

    nameInput.value =
        playerName;
}


/* =========================================
   RESTART
========================================= */

document
    .getElementById(
        "restartButton"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );

</script>
